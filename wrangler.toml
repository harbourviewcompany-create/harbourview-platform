# Cloudflare Worker — Harbourview intelligence/health utility
#
# This is NOT the Harbourview Next.js web application. Vercel remains the
# production web target. A future Cloudflare/OpenNext web preview must use a
# different Worker name and a separate Wrangler configuration.
#
# Canonical dashboard Worker name: harbourview
# Canonical entrypoint: scripts/engine/cloudflare-worker.ts
# Canonical live HTTP surface: /healthz
# Canonical ingestion authority: Supabase Edge Functions + pg_cron, NOT this Worker.
name = "harbourview"
main = "scripts/engine/cloudflare-worker.ts"
compatibility_date = "2025-06-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Workers Builds uses the build/deploy commands configured in the Cloudflare
# dashboard. This [build] command applies to Wrangler-driven local/deploy flows;
# keep the dashboard build command aligned with `npm run typecheck`.
[build]
command = "npm run typecheck"

# No [triggers] block is allowed here. scripts/engine/cloudflare-worker.ts keeps
# a dormant scheduled() implementation only as a recoverable code path. Adding a
# Cron Trigger would create a second ingestion writer against the same Supabase
# tables already written by the production pg_cron pipeline.

[vars]
NODE_ENV = "production"
INTELLIGENCE_WORKER_ID = "cf-worker-01"

# Runtime dashboard configuration required by /healthz:
#
# Settings -> Variables and Secrets -> Variable
#   NEXT_PUBLIC_SUPABASE_URL
#
# Settings -> Variables and Secrets -> Secret
#   SUPABASE_SERVICE_ROLE_KEY
#
# Optional and currently inert while no Cron Trigger exists:
#   WORKER_BATCH_SIZE
#
# Do not add ANTHROPIC_API_KEY, GOOGLE_GENAI_API_KEY, KV, D1, R2, Queues,
# Durable Objects, or service bindings to this Worker unless a future approved
# architecture actually consumes them. The full environment contract lives in
# config/environment-manifest.json.

[observability]
enabled = true
head_sampling_rate = 1
