# Cloudflare Worker — Harbourview Intelligence Pipeline
# Deploy: wrangler deploy
# Local dev: wrangler dev

name = "harbourview-platform"
# scripts/engine/start-worker.ts is the Node.js daemon entrypoint (infinite
# poll loop) for a persistent host (Docker/ECS/Cloud Run/Fly/Railway) --
# incompatible with this platform, which has no persistent process.
# cloudflare-worker.ts exports the scheduled()/fetch() handlers this
# platform actually invokes; only the "Ingestion run" cron below has a
# real implementation behind it today (see that file's header comment).
main = "scripts/engine/cloudflare-worker.ts"
compatibility_date = "2025-06-28"
compatibility_flags = ["nodejs_compat"]

# Wrangler bundles the Worker entrypoint. This build gate performs the same
# strict project-aware TypeScript verification used by CI; it must fail rather
# than suppress compiler defects with a false-success `|| true` path.
[build]
command = "npm run typecheck"

# ── Cron triggers ──────────────────────────────────────────────────────────────
[triggers]
crons = [
  "*/15 * * * *",   # Discovery sweep — every 15 min
  "*/30 * * * *",   # Ingestion run — every 30 min
  "0 * * * *",      # Deep discovery — hourly
  "0 */6 * * *",    # Source health sweep — every 6 hours
]

# ── Environment variables (set secrets via: wrangler secret put VAR_NAME) ──────
[vars]
NODE_ENV                    = "production"
INTELLIGENCE_WORKER_ID      = "cf-worker-01"

# Secrets (do NOT commit values — set via CLI):
# wrangler secret put NEXT_PUBLIC_SUPABASE_URL
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# wrangler secret put ANTHROPIC_API_KEY
# wrangler secret put GOOGLE_GENAI_API_KEY

# NOTE: a [[kv_namespaces]] binding for RATE_LIMIT_KV previously lived here,
# pointing at a placeholder id ("__replace_with_your_kv_namespace_id__") that
# was never swapped for a real namespace. Nothing in cloudflare-worker.ts
# reads env.RATE_LIMIT_KV — it was declared but never used — and the
# placeholder id is what was failing "Workers Builds: harbourview-platform"
# on every PR. Removed rather than faked, since fabricating an id here would
# just move the failure from build-time to first-request-time. If KV-backed
# rate limiting is needed for this worker later, create a real namespace via
# `wrangler kv namespace create RATE_LIMIT_KV` and re-add the binding with
# its actual id — don't restore the placeholder.

# ── Observability ─────────────────────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1