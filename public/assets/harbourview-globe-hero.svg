    <circle cx="800" cy="800" r="690" fill="none" stroke="#C6A55A" stroke-opacity="0.26" stroke-width="5"/>
    <circle cx="650" cy="540" r="520" fill="white" opacity="0.055"/>
    <ellipse cx="555" cy="760" rx="210" ry="610" fill="white" opacity="0.035"/>
