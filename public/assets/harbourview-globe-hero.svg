<svg width="1600" height="1600" viewBox="0 0 1600 1600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Harbourview globe</title>
  <desc id="desc">Premium dark navy globe with raised metallic gold market plates.</desc>
  <defs>
    <radialGradient id="ocean" cx="36%" cy="26%" r="72%">
      <stop offset="0" stop-color="#1B314B"/>
      <stop offset="0.42" stop-color="#071526"/>
      <stop offset="0.78" stop-color="#020813"/>
      <stop offset="1" stop-color="#000309"/>
    </radialGradient>
    <linearGradient id="gold" x1="290" y1="220" x2="1160" y2="1280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3D98A"/>
      <stop offset="0.26" stop-color="#C6A55A"/>
      <stop offset="0.56" stop-color="#8E641F"/>
      <stop offset="0.76" stop-color="#D9B866"/>
      <stop offset="1" stop-color="#6E4717"/>
    </linearGradient>
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
