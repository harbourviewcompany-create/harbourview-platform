    <path d="M1048 682l154 18 108 94-8 166-112 104-156-38-70-112 36-124 48-108z" fill="url(#gold)" stroke="#1A0F04" stroke-width="7"/>
    <path d="M690 884l152 36 94 116-42 178-124 116-132-90-32-150 84-206z" fill="url(#gold)" stroke="#1A0F04" stroke-width="7"/>
    <path d="M432 870l168 48 56 178-72 168-138 70-94-118 18-192 62-154z" fill="url(#gold)" stroke="#1A0F04" stroke-width="7"/>
