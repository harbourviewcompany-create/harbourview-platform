asyncapi: 3.0.0
info:
  title: Global Cannabis Regulatory Intelligence OS Events
  version: 1.0.0
  description: At-least-once domain event contract. Consumers must be idempotent by event id.
defaultContentType: application/cloudevents+json
servers:
  production:
    host: events.example.invalid:9092
    protocol: kafka-secure
    description: Managed Kafka-compatible production event fabric
channels:
  sourceOperations:
    address: source.operations.v1
    messages:
      sourceRegistered: {$ref: '#/components/messages/SourceRegistered'}
      acquisitionCompleted: {$ref: '#/components/messages/AcquisitionCompleted'}
      acquisitionFailed: {$ref: '#/components/messages/AcquisitionFailed'}
      snapshotCaptured: {$ref: '#/components/messages/SnapshotCaptured'}
  regulatoryIntelligence:
    address: regulatory.intelligence.v1
    messages:
      materialChangeDetected: {$ref: '#/components/messages/MaterialChangeDetected'}
      regulatoryChangeApproved: {$ref: '#/components/messages/RegulatoryChangeApproved'}
      obligationApproved: {$ref: '#/components/messages/ObligationApproved'}
  applicability:
    address: compliance.applicability.v1
    messages:
      applicabilityRequested: {$ref: '#/components/messages/ApplicabilityRequested'}
      applicabilityEvaluated: {$ref: '#/components/messages/ApplicabilityEvaluated'}
  registry:
    address: registry.entity-licence.v1
    messages:
      licenceStatusChanged: {$ref: '#/components/messages/LicenceStatusChanged'}
      counterpartyRiskChanged: {$ref: '#/components/messages/CounterpartyRiskChanged'}
  trade:
    address: trade.corridor.v1
    messages:
      corridorEvaluationRequested: {$ref: '#/components/messages/CorridorEvaluationRequested'}
      corridorDeterminationChanged: {$ref: '#/components/messages/CorridorDeterminationChanged'}
  market:
    address: market.metrics.v1
    messages:
      observationRevised: {$ref: '#/components/messages/ObservationRevised'}
      reconciliationFailed: {$ref: '#/components/messages/ReconciliationFailed'}
  governance:
    address: governance.control.v1
    messages:
      publicationCorrected: {$ref: '#/components/messages/PublicationCorrected'}
      dataQualityFailed: {$ref: '#/components/messages/DataQualityFailed'}
operations:
  publishSourceEvents:
    action: send
    channel: {$ref: '#/channels/sourceOperations'}
  consumeRegulatoryEvents:
    action: receive
    channel: {$ref: '#/channels/regulatoryIntelligence'}
  consumeApplicabilityEvents:
    action: receive
    channel: {$ref: '#/channels/applicability'}
  consumeRegistryEvents:
    action: receive
    channel: {$ref: '#/channels/registry'}
  consumeTradeEvents:
    action: receive
    channel: {$ref: '#/channels/trade'}
  consumeMarketEvents:
    action: receive
    channel: {$ref: '#/channels/market'}
  consumeGovernanceEvents:
    action: receive
    channel: {$ref: '#/channels/governance'}
components:
  schemas:
    UUID: {type: string, format: uuid}
    RiskTier: {type: string, enum: [low, moderate, high, critical]}
    Envelope:
      type: object
      required: [specversion, id, type, source, time, datacontenttype, classification, data]
      properties:
        specversion: {const: '1.0'}
        id: {$ref: '#/components/schemas/UUID'}
        type: {type: string}
        source: {type: string}
        subject: {type: [string, 'null']}
        time: {type: string, format: date-time}
        datacontenttype: {const: application/json}
        dataschema: {type: [string, 'null']}
        tenant_id: {type: [string, 'null'], format: uuid}
        jurisdiction_id: {type: [string, 'null'], format: uuid}
        actor_id: {type: [string, 'null'], format: uuid}
        correlation_id: {type: [string, 'null'], format: uuid}
        causation_id: {type: [string, 'null'], format: uuid}
        trace_id: {type: [string, 'null']}
        classification: {type: string}
        evidence_ids: {type: array, items: {$ref: '#/components/schemas/UUID'}}
        data: {type: object}
  messages:
    SourceRegistered:
      name: source.registered.v1
      payload: {$ref: '#/components/schemas/Envelope'}
      examples: [{payload: {specversion: '1.0', id: '11111111-1111-4111-8111-111111111111', type: source.registered.v1, source: urn:service:source-registry, time: '2026-07-31T18:00:00Z', datacontenttype: application/json, classification: public, evidence_ids: [], data: {source_id: '22222222-2222-4222-8222-222222222222'}}}]
    AcquisitionCompleted: {name: acquisition.completed.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    AcquisitionFailed: {name: acquisition.failed.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    SnapshotCaptured: {name: snapshot.captured.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    MaterialChangeDetected: {name: document.material_change_detected.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    RegulatoryChangeApproved: {name: regulatory_change.approved.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    ObligationApproved: {name: obligation.approved.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    ApplicabilityRequested: {name: applicability.evaluation_requested.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    ApplicabilityEvaluated: {name: applicability.evaluated.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    LicenceStatusChanged: {name: licence.status_changed.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    CounterpartyRiskChanged: {name: counterparty.risk_changed.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    CorridorEvaluationRequested: {name: corridor.evaluation_requested.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    CorridorDeterminationChanged: {name: corridor.determination_changed.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    ObservationRevised: {name: observation.revised.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    ReconciliationFailed: {name: metric.reconciliation_failed.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    PublicationCorrected: {name: publication.corrected.v1, payload: {$ref: '#/components/schemas/Envelope'}}
    DataQualityFailed: {name: data_quality.rule_failed.v1, payload: {$ref: '#/components/schemas/Envelope'}}
