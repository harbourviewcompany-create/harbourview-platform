name: PR1309 Final Static Fixes

on:
  push:
    branches: [build/decision-intel-stage0-first-slice]
    paths:
      - .github/workflows/pr1309-final-static-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-self-remove:
    runs-on: ubuntu-24.04
    if: github.repository == 'harbourviewcompany-create/harbourview-platform'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/decision-intel-stage0-first-slice
          fetch-depth: 0
      - name: Apply the two verified static fixes
        shell: python
        run: |
          from pathlib import Path

          db = Path('docs/control/DATABASE_CONTROL.md')
          text = db.read_text()
          old = "Authenticated Intel/operator dossier access is exposed through tier-gated `SECURITY DEFINER` RPCs after an explicit event-level customer publication classification; verification alone never authorizes exposure. `api.resolve_intel_dashboard_routes(text[])` is service-role-only and returns route identity plus current customer displayability for server-side dashboard hydration."
          new = "Authenticated Intel/operator dossier access is exposed through the tier-gated `SECURITY DEFINER` RPC `api.get_intel_event_dossier(text)` after an explicit event-level customer publication classification; verification alone never authorizes exposure. `api.resolve_intel_dashboard_routes(text[])` is service-role-only and returns route identity, current customer displayability, and the canonical recommendation posture for server-side dashboard hydration."
          if old not in text:
              raise SystemExit('DATABASE_CONTROL target text not found')
          db.write_text(text.replace(old, new, 1))

          test = Path('tests/intel/decisionIntelFirstSlice.test.ts')
          text = test.read_text()
          old = "expect(responsiveShell).toContain('[...props.signals, ...props.digestSignals]')"
          new = "expect(responsiveShell).toContain('[...props.signals, ...(props.digestSignals ?? [])]')"
          if old not in text:
              raise SystemExit('Decision Intel test target text not found')
          test.write_text(text.replace(old, new, 1))
      - name: Commit verified fixes and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "harbourview-release-operator"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr1309-final-static-fixes.yml
          git add docs/control/DATABASE_CONTROL.md tests/intel/decisionIntelFirstSlice.test.ts
          git commit -m "fix(intel): close final Stage 0 static gates"
          git push origin HEAD:build/decision-intel-stage0-first-slice
