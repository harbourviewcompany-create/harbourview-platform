name: Market Entry OS dependency lockfile

on:
  push:
    branches:
      - feat/production-market-entry-os-20260912-final2
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-bot]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/production-market-entry-os-20260912-final2
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package-lock from registry
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify resolved security floor
        run: |
          npm ls wrangler miniflare sharp --all
          node -e "const p=require('./package-lock.json'); const w=p.packages?.['node_modules/wrangler']?.version; const m=p.packages?.['node_modules/miniflare']?.version; const s=p.packages?.['node_modules/sharp']?.version; if(!w || !m || !s) throw new Error('Expected Wrangler/Miniflare/sharp lock entries missing'); if(w !== '4.131.1') throw new Error('Unexpected Wrangler version: '+w); if(m !== '5.20260911.0-alpha') throw new Error('Unexpected Miniflare version: '+m); if(s !== '0.35.4') throw new Error('Unexpected sharp version: '+s); console.log({wrangler:w,miniflare:m,sharp:s})"
          npm audit --audit-level=high

      - name: Commit registry-generated lockfile
        run: |
          git config user.name 'harbourview-lockfile-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches registry resolution.'
            exit 0
          fi
          git add package-lock.json
          git commit -m 'ci: regenerate package lockfile [lockfile-bot]'
          git push origin HEAD:feat/production-market-entry-os-20260912-final2
