name: Production Database Governance Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: production-database-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-governance-audit:
    name: production-governance-audit
    # This workflow is intentionally absent from pull_request/push triggers.
    # Manual execution is pinned to protected main so production credentials can
    # never be supplied to arbitrary branch code.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Resolve production database credential without exposing secrets
        # Protected main only. Reuse the same database password secret as the
        # existing migration reconciliation workflow if the URL secret is unset.
        # Never place the password in GITHUB_ENV, logs, workflow outputs or PRs.
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            echo "Using configured production database URL credential."
          elif [ -n "${PGPASSWORD:-}" ]; then
            # Session-pooler host and role match auto-reconcile-migration-drift.yml.
            # libpq reads PGPASSWORD directly; the DSN contains no password.
            echo 'SUPABASE_DB_URL=postgresql://postgres.zvxdgdkukjrrwamdpqrg@aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require' >> "${GITHUB_ENV}"
            echo "Using existing protected database password with session pooler."
          else
            echo "::error::Set SUPABASE_DB_URL or SUPABASE_DB_PASSWORD for production governance."
            exit 1
          fi
      - name: Verify production governance and migration attribution
        run: bash scripts/verify-production-governance.sh
