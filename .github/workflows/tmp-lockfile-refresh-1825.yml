name: Temporary lockfile refresh for PR 1825

on:
  push:
    branches:
      - feat/production-market-entry-os-20260912

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore(deps): refresh lockfile for PR 1825'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/tmp-lockfile-refresh-1825.yml
          git rm --cached .github/workflows/tmp-lockfile-refresh-1825.yml
          git add -u .github/workflows/tmp-lockfile-refresh-1825.yml
          if git diff --cached --quiet; then
            echo 'No lockfile changes required.'
            exit 0
          fi
          git commit -m 'chore(deps): refresh lockfile for PR 1825'
          git push origin HEAD:feat/production-market-entry-os-20260912
