name: One-shot Governance Autofix

on:
  push:
    branches:
      - remediation/platform-governance-hardening-20260912

permissions:
  contents: write

jobs:
  autofix:
    if: github.ref == 'refs/heads/remediation/platform-governance-hardening-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Resolve every external action and reusable workflow ref to a commit SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          root = Path('.github/workflows')
          token = os.environ['GH_TOKEN']
          pattern = re.compile(r'(?P<prefix>uses:\s*)(?P<target>[^\s#]+)@(?P<ref>[^\s#]+)')
          sha_re = re.compile(r'^[0-9a-fA-F]{40}$')
          cache = {}
          changed = []

          def resolve(repo, ref):
              key = (repo, ref)
              if key in cache:
                  return cache[key]
              req = Request(
                  f'https://api.github.com/repos/{repo}/commits/{ref}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'harbourview-governance-autofix',
                  },
              )
              with urlopen(req, timeout=20) as response:
                  data = json.load(response)
              sha = data.get('sha')
              if not isinstance(sha, str) or not sha_re.fullmatch(sha):
                  raise RuntimeError(f'Could not resolve {repo}@{ref} to a full commit SHA')
              cache[key] = sha
              return sha

          for path in sorted(root.rglob('*.yml')) + sorted(root.rglob('*.yaml')):
              original = path.read_text(encoding='utf-8')
              def replace(match):
                  target = match.group('target')
                  ref = match.group('ref')
                  if target.startswith('./') or sha_re.fullmatch(ref):
                      return match.group(0)
                  if target.startswith('docker://'):
                      return match.group(0)
                  if '/' not in target:
                      return match.group(0)
                  # Actions: owner/repo@ref. Reusable workflows: owner/repo/.github/workflows/file.yml@ref.
                  repo = '/'.join(target.split('/')[:2])
                  sha = resolve(repo, ref)
                  return f"{match.group('prefix')}{target}@{sha}"
              updated = pattern.sub(replace, original)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Resolved {len(cache)} unique mutable action/reusable-workflow refs.')
          for path in changed:
              print(f'UPDATED {path}')
          PY

      - name: Remove temporary autofix workflow and commit remediation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/governance-autofix.yml
          git config user.name 'Harbourview Governance Bot'
          git config user.email 'harbourviewcompany@gmail.com'
          git add .github/workflows
          if git diff --cached --quiet; then
            echo 'No workflow changes required.'
            exit 0
          fi
          git commit -m 'chore(governance): pin all workflow action references'
          git push origin HEAD:remediation/platform-governance-hardening-20260912
