name: Temporary Corridor Provenance Fix

on:
  push:
    branches:
      - fix/corridor-replay-seed-fidelity-20260816
    paths:
      - .github/workflows/_tmp-corridor-provenance-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/corridor-replay-seed-fidelity-20260816
          fetch-depth: 1
          persist-credentials: true
      - name: Restore exact replay provenance contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260701230000_corridor_intelligence_tables_stub.sql')
          text = path.read_text()
          old = '-- Production already records version 20260701230000, so this remains a\n-- repository-only replay-fidelity repair and is never reapplied remotely.\n'
          new = '-- Production already records version 20260701230000, so this is a\n-- repository-only replay-fidelity repair and is not a production migration.\n-- It is never reapplied remotely.\n'
          if old not in text:
              raise SystemExit('expected replay-fidelity provenance wording not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check -- supabase/migrations/20260701230000_corridor_intelligence_tables_stub.sql
      - name: Commit migration only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260701230000_corridor_intelligence_tables_stub.sql
          git commit -m "docs(migrations): preserve replay provenance contract"
          git push origin HEAD:fix/corridor-replay-seed-fidelity-20260816
