name: Cloudflare Workers Preview Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - next.config.mjs
      - open-next.config.ts
      - wrangler.jsonc
      - .dev.vars.example
      - docs/control/CLOUDFLARE_WORKERS_PREVIEW.md
      - .github/workflows/cloudflare-workers-preview-verify.yml
      - app/countries/**
      - app/dashboard/country/**
      - app/network/clinical-education/**
      - lib/dashboard/navigationRoutes.ts
      - middleware.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:8787
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:8787
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      HARBOURVIEW_ADMIN_REVIEW_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Vercel build contract is unchanged
        run: |
          node -e "const p=require('./package.json'); if(p.scripts.build!=='next build') throw new Error('Vercel build script changed')"

      - name: Build OpenNext Worker bundle
        run: npm run build:cloudflare

      - name: Inspect generated Worker and asset manifests
        run: |
          test -s .open-next/worker.js
          test -d .open-next/assets
          find .open-next -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort > open-next-manifest.txt
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = '.open-next'
          const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
            const file = path.join(dir, entry.name)
            return entry.isDirectory() ? walk(file) : [{ path: file, bytes: fs.statSync(file).size }]
          })
          const files = walk(root)
          const report = {
            generatedAt: new Date().toISOString(),
            worker: files.find((item) => item.path === '.open-next/worker.js') || null,
            assets: files.filter((item) => item.path.startsWith('.open-next/assets/')),
            files,
          }
          fs.writeFileSync('open-next-manifest.json', JSON.stringify(report, null, 2))
          if (!report.worker || report.assets.length === 0) process.exit(1)
          NODE
          cat open-next-manifest.txt

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Workers runtime
        run: |
          npx wrangler dev --local --port 8787 > /tmp/harbourview-wrangler.log 2>&1 &
          echo $! > /tmp/harbourview-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/harbourview-wrangler.log
          exit 1

      - name: Verify eight routes at 390x844
        run: |
          mkdir -p artifacts/cloudflare-workers-preview/screenshots
          node <<'NODE'
          const { chromium } = require('playwright')
          const fs = require('node:fs/promises')
          const path = require('node:path')

          async function main() {
            const baseUrl = 'http://127.0.0.1:8787'
            const routes = [
              '/countries/mexico',
              '/dashboard/country/mexico',
              '/dashboard/country/mexico/market',
              '/dashboard/country/mexico/education',
              '/dashboard/country/mexico/compliance',
              '/dashboard/country/mexico/signals',
              '/network/clinical-education',
              '/network/clinical-education/request',
            ]
            const intendedDestinations = [
              '/dashboard?country=MX',
              '/dashboard?country=MX',
              '/dashboard?country=MX&page=marketplace',
              '/dashboard?country=MX&page=education',
              '/dashboard?country=MX&page=compliance',
              '/dashboard?country=MX&page=signals',
              '/dashboard?page=clinical',
              '/contact?topic=clinical-education',
            ]
            const slug = (value) => value.replace(/^\//, '').replace(/[^a-z0-9]+/gi, '-') || 'root'
            const browser = await chromium.launch({ headless: true })
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true })
            const report = { baseUrl, viewport: { width: 390, height: 844 }, routes: [] }
            for (let index = 0; index < routes.length; index += 1) {
              const page = await context.newPage()
              const redirects = []
              const consoleErrors = []
              const pageErrors = []
              page.on('response', (response) => {
                if (response.request().isNavigationRequest() && response.request().frame() === page.mainFrame()) {
                  redirects.push({ url: response.url(), status: response.status() })
                }
              })
              page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()) })
              page.on('pageerror', (error) => pageErrors.push(error.message))
              const response = await page.goto(new URL(routes[index], baseUrl).toString(), { waitUntil: 'domcontentloaded', timeout: 60000 })
              await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {})
              const screenshot = `screenshots/${slug(routes[index])}.png`
              await page.screenshot({ path: path.join('artifacts/cloudflare-workers-preview', screenshot), fullPage: true })
              const final = new URL(page.url())
              const finalPath = `${final.pathname}${final.search}`
              const intendedDestination = intendedDestinations[index]
              const authExpected = [
                `/login?next=${encodeURIComponent(routes[index])}`,
                `/login?next=${encodeURIComponent(intendedDestination)}`,
              ]
              const reachedIntendedDestination = finalPath === intendedDestination
              const correctlyAuthGated = authExpected.includes(finalPath)
              const navigationStatusesValid = redirects.length > 0 && redirects.every(({ status }) => status >= 200 && status < 400)
              const item = {
                route: routes[index],
                intendedDestination,
                authExpected,
                redirects,
                finalUrl: page.url(),
                finalStatus: response?.status() ?? null,
                title: await page.title(),
                h1: await page.locator('h1').first().innerText().catch(() => null),
                consoleErrors,
                pageErrors,
                screenshot,
                verificationMode: reachedIntendedDestination ? 'destination' : correctlyAuthGated ? 'auth-gate' : 'unexpected',
                passed: (reachedIntendedDestination || correctlyAuthGated) && navigationStatusesValid && consoleErrors.length === 0 && pageErrors.length === 0,
              }
              report.routes.push(item)
              await page.close()
            }
            await browser.close()
            await fs.writeFile('artifacts/cloudflare-workers-preview/report.json', JSON.stringify(report, null, 2))
            if (report.routes.some((item) => !item.passed)) {
              console.error(JSON.stringify(report, null, 2))
              process.exit(1)
            }
            console.log(JSON.stringify(report, null, 2))
          }

          main().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Upload OpenNext build and preview evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloudflare-workers-preview-verification
          path: |
            open-next-manifest.txt
            open-next-manifest.json
            artifacts/cloudflare-workers-preview/
            /tmp/harbourview-wrangler.log
          if-no-files-found: warn
          retention-days: 14
