name: PR1309 Control Doc Forward Fix

on:
  push:
    branches:
      - build/decision-intel-stage0-first-slice
    paths:
      - .github/workflows/pr1309-control-doc-forward-fix.yml

permissions:
  contents: write

jobs:
  patch-controls:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/decision-intel-stage0-first-slice
          fetch-depth: 0
          persist-credentials: true

      - name: Forward-fix Stage 0 control records
        shell: python
        run: |
          from pathlib import Path

          db = Path('docs/control/DATABASE_CONTROL.md')
          text = db.read_text(encoding='utf-8')
          old = """- **Migrations:** `20260808190000_decision_intel_stage0_first_slice.sql` and corrective `20260808203000_decision_intel_stage0_review_fixes.sql`.
- **Canonical ownership:** existing `source_registry`/`source_snapshots`, `hv_evidence`, and `public.jurisdictions` remain authoritative; `public.jurisdiction_crossref` is the ISO-2 → canonical jurisdiction identity bridge; Stage 0 adds only evidence references, assertions, events, assessments/versions, recommendations and allowlisted dossier/route projections.
- **RLS/exposure:** raw Stage 0 objects remain staff-controlled. Product-tier customer reads do **not** receive direct canonical-table or view grants. Authenticated Intel/operator access is exposed only through the tier-gated `SECURITY DEFINER RPC` functions `api.get_intel_event_dossier(text)` and `api.resolve_intel_event_route(text)`, which return the allowlisted dossier/route projections after checking `user_profiles.tier`. Anonymous execution is revoked. Raw `hv_evidence`, storage paths, private notes, canonical review metadata and Marketplace-private data remain outside the product projection.
- **Review hardening:** one snapshot can support multiple signal refs; legacy signal IDs remain durable lineage keys; confidence is constrained to 0–1; new events default to `needs_review`; assessment versions are append-only; rejected/superseded assertions and recommendations are excluded; contradiction relationships are projected; clustered signals resolve to one event; `signals.country_iso2` resolves through `jurisdiction_crossref` rather than being compared directly to canonical IDs.
- **Backward compatibility:** `public.signals`, Pipeline B and `/signals` remain upstream/existing surfaces. No existing intelligence table is dropped or rewritten.
- **Rollback/forward-fix:** production remains unapplied. Apply both migrations only after disposable verification; use reviewed forward migrations for post-apply defects.
- **Required tests:** production-shaped apply/backfill/RLS, canonical jurisdiction mapping, zero auto-verified rows, lineage/cardinality, five-width dossier Playwright, leakage/security, full PR workflow matrix.
"""
          new = """- **Migrations (required order):** `20260808190000_decision_intel_stage0_first_slice.sql`, corrective `20260808203000_decision_intel_stage0_review_fixes.sql`, then completion hardening `20260810202000_decision_intel_stage0_completion_hardening.sql`. All three are required for the Stage 0 first-slice deployment contract.
- **Canonical ownership:** existing `source_registry`/`source_snapshots`, `hv_evidence`, and `public.jurisdictions` remain authoritative; `public.jurisdiction_crossref` is the ISO-2 → canonical jurisdiction identity bridge; Stage 0 adds only evidence references, assertions, events, assessments/versions, recommendations and allowlisted dossier/route projections.
- **RLS/exposure:** raw Stage 0 objects remain staff-controlled. Product-tier customer reads do **not** receive direct canonical-table or view grants. Authenticated Intel/operator dossier access is exposed through tier-gated `SECURITY DEFINER` RPCs after an explicit event-level customer publication classification; verification alone never authorizes exposure. `api.resolve_intel_dashboard_routes(text[])` is service-role-only and returns route identity plus current customer displayability for server-side dashboard hydration. Anonymous execution is revoked. Raw `hv_evidence`, storage paths, private notes, canonical review metadata and Marketplace-private data remain outside the product projection.
- **Review hardening:** one snapshot can support multiple signal refs; legacy signal IDs remain durable lineage keys; confidence is constrained to 0–1; new events default to `needs_review`; assessment versions are append-only and migration-created version 1 is repaired to the complete canonical field set; rejected/superseded assertions and recommendations are excluded; contradiction relationships are projected; clustered signals resolve to one event; `signals.country_iso2` resolves through `jurisdiction_crossref`; upstream withdrawal/rejection/unreview/reclassification suppresses the linked canonical chain and customer visibility while preserving canonical route ownership; desktop/mobile dossier-link eligibility is derived from the actual customer-display projection while retaining legitimate unowned legacy/IA compatibility.
- **Backward compatibility:** `public.signals`, Pipeline B and `/signals` remain upstream/existing surfaces. No existing intelligence table is dropped or rewritten.
- **Rollback/forward-fix:** production remains unapplied. Apply all three migrations in the required order only after disposable verification; use reviewed forward migrations for post-apply defects.
- **Required tests:** production-shaped three-migration apply/backfill/RLS, canonical jurisdiction mapping, zero auto-verified rows, lineage/cardinality, explicit customer-publication classification, upstream-withdrawal suppression, complete assessment version-1 payload, canonical dashboard displayability routing, five-width dossier Playwright, authenticated nine-width Command Centre visual evidence, leakage/security and the full exact-head PR workflow matrix.
"""
          if old not in text:
              raise SystemExit('DATABASE_CONTROL Stage 0 block did not match expected text')
          db.write_text(text.replace(old, new, 1), encoding='utf-8')

          ev = Path('docs/control/EVIDENCE_LOG.md')
          text = ev.read_text(encoding='utf-8')
          old = """- **Final proof required:** both migrations in order against disposable production-shaped PostgreSQL; zero migration-created `verified`; lineage/cardinality; anon denial; Intel/operator read; raw evidence/Marketplace leakage protection; 320×700, 375×812, 390×844, 430×932 and 1440×1000 dossier evidence; complete current-head workflow matrix green.
- **Status:** pending final current-head rerun; exact final run IDs/results must be posted on PR #1309 before GO.
"""
          new = """- **Completion hardening added:** third ordered migration `20260810202000_decision_intel_stage0_completion_hardening.sql` separates verification from customer publication, propagates upstream withdrawal/rejection/unreview/reclassification into canonical suppression, derives dashboard dossier-link eligibility from the customer-display projection while retaining legitimate pre-migration/IA compatibility, and repairs migration-created assessment version 1 to the complete canonical field set used by later versions.
- **Final proof required:** all three migrations in order against disposable production-shaped PostgreSQL; zero migration-created `verified`; lineage/cardinality; explicit customer-publication classification; verified-but-internal suppression; upstream-withdrawal chain suppression with canonical ownership retained; complete assessment version-1 payload; anon/free-tier denial; Intel/operator allowlisted reads; service-role-only dashboard route resolver; raw evidence/Marketplace leakage protection; 320×700, 375×812, 390×844, 430×932 and 1440×1000 dossier evidence; authenticated nine-width Command Centre evidence; complete exact-head workflow matrix green.
- **Status:** exact final head/run/artifact identifiers must be recorded after the post-fix exact-head matrix and fresh re-review complete. No PR #1309 migration/backfill has been applied to production.
"""
          if old not in text:
              raise SystemExit('EVIDENCE_LOG Stage 0 block did not match expected text')
          ev.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/pr1309-control-doc-forward-fix.yml').unlink()

      - name: Commit forward fix and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "harbourviewcompany-create"
          git config user.email "231706713+harbourviewcompany-create@users.noreply.github.com"
          git add docs/control/DATABASE_CONTROL.md docs/control/EVIDENCE_LOG.md .github/workflows/pr1309-control-doc-forward-fix.yml
          git commit -m "docs(intel): complete Stage 0 deployment evidence"
          git push origin HEAD:build/decision-intel-stage0-first-slice
