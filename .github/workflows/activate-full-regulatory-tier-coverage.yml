name: Full Regulatory Tier Coverage Activation

on:
  push:
    branches:
      - grok/full-regulatory-tier-coverage-20260830
    paths:
      - supabase/migrations/20260830140000_full_regulatory_tier_coverage.sql
      - supabase/migrations/20260830141000_subnational_regulatory_tier_evidence_alignment.sql
      - tests/sql/full_regulatory_tier_coverage_regression.sql
      - supabase/release-controls/full-regulatory-tier-coverage-20260830.json
      - .github/workflows/activate-full-regulatory-tier-coverage.yml

permissions:
  contents: read

concurrency:
  group: full-regulatory-tier-coverage-production
  cancel-in-progress: false

env:
  PGHOST: aws-1-us-west-2.pooler.supabase.com
  PGPORT: '5432'
  PGUSER: postgres.zvxdgdkukjrrwamdpqrg
  PGDATABASE: postgres

jobs:
  activate:
    name: Canonical migration activation + regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-database
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require authorized branch and immutable migration bodies
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/grok/full-regulatory-tier-coverage-20260830"
          test "$(git hash-object supabase/migrations/20260830140000_full_regulatory_tier_coverage.sql)" = "2d21eb9fb4039fe6c5cc55cca6c40a32ac2d127f"
          test "$(git hash-object supabase/migrations/20260830141000_subnational_regulatory_tier_evidence_alignment.sql)" = "3a37da304086161b4463418c6f9989b7101273f8"

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Read-only production preflight
        id: preflight
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/full-regulatory-tier-coverage
          psql -X -qAt <<'SQL' | tee artifacts/full-regulatory-tier-coverage/preflight.txt
          select 'LEDGER|' || version || '|' || coalesce(name,'NULL')
          from supabase_migrations.schema_migrations
          where version in ('20260822134500','20260830140000','20260830141000') order by version;
          select 'COUNTRIES|' || count(*) || '|' || count(*) filter (where regulatory_tier is null) from public.countries;
          select 'SUBNATIONAL|' || count(*) || '|' || count(*) filter (where regulatory_tier is not null)
          from public.countries where iso_alpha2 ~ '^(US|CA|DE|AU)-';
          select 'TIER_BEFORE_FORWARD|' || regulatory_tier || '|' || count(*) from public.countries group by regulatory_tier order by regulatory_tier;
          select 'ORIGIN_BEFORE_FORWARD|' || coalesce(regulatory_tier_origin,'NULL') || '|' || count(*) from public.countries group by regulatory_tier_origin order by regulatory_tier_origin;
          SQL
          grep -q '^LEDGER|20260822134500|history_placeholder_superseded_by_20260830140000$' artifacts/full-regulatory-tier-coverage/preflight.txt
          grep -q '^LEDGER|20260830140000|full_regulatory_tier_coverage$' artifacts/full-regulatory-tier-coverage/preflight.txt
          if grep -q '^LEDGER|20260830141000|' artifacts/full-regulatory-tier-coverage/preflight.txt; then
            echo 'mode=verify' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=apply_forward' >> "$GITHUB_OUTPUT"
          fi
          grep -q '^COUNTRIES|291|0$' artifacts/full-regulatory-tier-coverage/preflight.txt
          grep -q '^SUBNATIONAL|88|88$' artifacts/full-regulatory-tier-coverage/preflight.txt

      - name: Generate exact forward migration transaction
        if: steps.preflight.outputs.mode == 'apply_forward'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'supabase/migrations/20260830141000_subnational_regulatory_tier_evidence_alignment.sql';
          const sql = fs.readFileSync(path, 'utf8');
          const lit = s => "'" + s.replaceAll("'", "''") + "'";
          fs.writeFileSync('artifacts/full-regulatory-tier-coverage/activation.sql',
            `BEGIN;\n${sql}\ninsert into supabase_migrations.schema_migrations(version,name,statements) values ('20260830141000','subnational_regulatory_tier_evidence_alignment',array[${lit(sql)}]::text[]);\nCOMMIT;\n`);
          NODE
          sha256sum supabase/migrations/20260830141000_subnational_regulatory_tier_evidence_alignment.sql tests/sql/full_regulatory_tier_coverage_regression.sql artifacts/full-regulatory-tier-coverage/activation.sql | tee artifacts/full-regulatory-tier-coverage/sha256.txt

      - name: Apply exact forward migration atomically
        if: steps.preflight.outputs.mode == 'apply_forward'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f artifacts/full-regulatory-tier-coverage/activation.sql | tee artifacts/full-regulatory-tier-coverage/apply.txt

      - name: Run global parity, override-expiry and parent-propagation regression
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/full_regulatory_tier_coverage_regression.sql | tee artifacts/full-regulatory-tier-coverage/regression.txt
          grep -q 'FULL_REGULATORY_TIER_COVERAGE_REGRESSION|PASS' artifacts/full-regulatory-tier-coverage/regression.txt

      - name: Read-only production postflight
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          psql -X -qAt <<'SQL' | tee artifacts/full-regulatory-tier-coverage/postflight.txt
          select 'LEDGER|' || version || '|' || coalesce(name,'NULL') || '|' || coalesce(cardinality(statements)::text,'NULL')
          from supabase_migrations.schema_migrations
          where version in ('20260822134500','20260830140000','20260830141000') order by version;
          select 'COUNTRIES|' || count(*) || '|' || count(*) filter (where regulatory_tier is null) from public.countries;
          select 'SUBNATIONAL|' || count(*) || '|' || count(*) filter (where regulatory_tier is not null)
          from public.countries where iso_alpha2 ~ '^(US|CA|DE|AU)-';
          select 'CANONICAL_PARITY|' || count(*)
          from public.countries c
          where api.derive_regulatory_tier(api.briefing_text_for_iso(c.iso_alpha2)) is not null
            and c.regulatory_tier is distinct from api.derive_regulatory_tier(api.briefing_text_for_iso(c.iso_alpha2));
          select 'TIER_AFTER|' || regulatory_tier || '|' || count(*) from public.countries group by regulatory_tier order by regulatory_tier;
          select 'ORIGIN_AFTER|' || coalesce(regulatory_tier_origin,'NULL') || '|' || count(*) from public.countries group by regulatory_tier_origin order by regulatory_tier_origin;
          select 'EVIDENCE|' || iso_alpha2 || '|' || regulatory_tier || '|' || regulatory_tier_origin || '|' || regulatory_tier_needs_review
          from public.countries where iso_alpha2 in ('LS','MA','CO','KE') order by iso_alpha2;
          select 'FORWARD_CHANGED|' || country_iso2 || '|' || coalesce(old_tier,'NULL') || '|' || coalesce(new_tier,'NULL')
          from public.regulatory_tier_audit
          where actor='ops-full-coverage-subnational-evidence-20260830' and old_tier is distinct from new_tier order by country_iso2;
          select 'NO_CANONICAL|' || coalesce(string_agg(iso_alpha2, ',' order by iso_alpha2),'')
          from public.countries c where api.derive_regulatory_tier(api.briefing_text_for_iso(c.iso_alpha2)) is null;
          SQL
          grep -q '^LEDGER|20260822134500|history_placeholder_superseded_by_20260830140000|NULL$' artifacts/full-regulatory-tier-coverage/postflight.txt
          grep -q '^LEDGER|20260830140000|full_regulatory_tier_coverage|1$' artifacts/full-regulatory-tier-coverage/postflight.txt
          grep -q '^LEDGER|20260830141000|subnational_regulatory_tier_evidence_alignment|1$' artifacts/full-regulatory-tier-coverage/postflight.txt
          grep -q '^COUNTRIES|291|0$' artifacts/full-regulatory-tier-coverage/postflight.txt
          grep -q '^SUBNATIONAL|88|88$' artifacts/full-regulatory-tier-coverage/postflight.txt
          grep -q '^CANONICAL_PARITY|0$' artifacts/full-regulatory-tier-coverage/postflight.txt
          grep -q '^EVIDENCE|CO|legal_commercial_access|override|false$' artifacts/full-regulatory-tier-coverage/postflight.txt
          grep -q '^EVIDENCE|KE|legal_commercial_access|override|false$' artifacts/full-regulatory-tier-coverage/postflight.txt
          grep -q '^EVIDENCE|LS|legal_commercial_access|override|false$' artifacts/full-regulatory-tier-coverage/postflight.txt
          grep -q '^EVIDENCE|MA|legal_commercial_access|override|false$' artifacts/full-regulatory-tier-coverage/postflight.txt

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-regulatory-tier-coverage-${{ github.sha }}
          path: artifacts/full-regulatory-tier-coverage/
          if-no-files-found: error
          retention-days: 90
