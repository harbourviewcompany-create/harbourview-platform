name: Delete PR1307 Media Finalize Temp

on:
  push:
    branches:
      - ops/delete-pr1307-semantic-media-temp
    paths:
      - .github/workflows/delete-pr1307-media-finalize-temp.yml

permissions:
  contents: read

jobs:
  delete-function:
    runs-on: ubuntu-latest
    steps:
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Delete retired final media transfer helper
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions delete pr1307-media-finalize-temp --project-ref zvxdgdkukjrrwamdpqrg
      - name: Verify both PR1307 semantic/finalize helpers absent
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          LIST="$(supabase functions list --project-ref zvxdgdkukjrrwamdpqrg)"
          if printf '%s\n' "$LIST" | grep -q 'pr1307-semantic-media-rollout-temp'; then
            echo 'Semantic media rollout helper still present' >&2
            exit 1
          fi
          if printf '%s\n' "$LIST" | grep -q 'pr1307-media-finalize-temp'; then
            echo 'Final media transfer helper still present' >&2
            exit 1
          fi
