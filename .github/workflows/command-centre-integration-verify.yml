name: Command Centre Integration Verify

on:
  push:
    branches:
      - agent/command-centre-integration-rule
  pull_request:
    branches: [main]
    paths:
      - 'app/api/dashboard/personal-briefings/**'
      - 'app/dashboard/my-briefings/**'
      - 'app/dashboard/signals/search/**'
      - 'components/dashboard/CommandCentreIntegrationGateway.tsx'
      - 'components/dashboard/DashboardResponsiveShell.tsx'
      - 'lib/dashboard/commandCentreIntegration.ts'
      - 'lib/dashboard/personalBriefingsData.ts'
      - 'lib/countries.ts'
      - 'proxy.ts'
      - 'tests/dashboard/commandCentre*.test.ts'
      - 'tests/e2e/command-centre-integration.spec.ts'
      - '.github/workflows/command-centre-integration-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-centre-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Command Centre contract tests
        run: >-
          npx vitest run
          tests/dashboard/commandCentreIntegration.test.ts
          tests/dashboard/commandCentreRouteContracts.test.ts
      - name: Production build
        run: npm run build
