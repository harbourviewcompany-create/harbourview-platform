name: Marketplace Category Pages Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify marketplace category pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify runtime baseline
        run: npm run verify:runtime

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Public visibility leakage tests
        run: npm run test:visibility

      - name: Used surplus public leakage tests
        run: npm run test:used-surplus-public-leakage
