name: Apply clinical framework alignment migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to run on production'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: clinical-framework-alignment-migration
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: zvxdgdkukjrrwamdpqrg

jobs:
  apply:
    if: github.event.inputs.confirm == 'APPLY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Apply framework_alignment migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${PGPASSWORD:-}" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD repo secrets"
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          SQL_FILE="supabase/migrations/20260821190000_clinical_framework_alignment_optional.sql"
          test -f "$SQL_FILE"
          # Direct apply (idempotent SQL)
          psql "postgresql://postgres.${SUPABASE_PROJECT_REF}@aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -f "$SQL_FILE"
          # Record in ledger if not present
          psql "postgresql://postgres.${SUPABASE_PROJECT_REF}@aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -c "INSERT INTO supabase_migrations.schema_migrations (version) VALUES ('20260821190000') ON CONFLICT DO NOTHING;" \
            || psql "postgresql://postgres.${SUPABASE_PROJECT_REF}@aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -c "INSERT INTO supabase_migrations.schema_migrations (version, name, statements) VALUES ('20260821190000', 'clinical_framework_alignment_optional', ARRAY[]::text[]) ON CONFLICT DO NOTHING;" \
            || true
          echo "Applied 20260821190000_clinical_framework_alignment_optional"
