name: P0 Identity Organization Context Verify

on:
  push:
    branches:
      - agent/p0-identity-org-context-20260814
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-identity-org-context-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck tests build migration replay and mobile evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harbourview_p0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d harbourview_p0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: '1'
      HARBOURVIEW_LOCAL_TEST_BUILD: '1'
      HARBOURVIEW_ALLOW_LOCAL_SUPABASE: '1'
      NEXT_PUBLIC_HARBOURVIEW_LOCAL_TEST_BUILD: '1'
      NEXT_PUBLIC_HARBOURVIEW_ALLOW_LOCAL_SUPABASE: '1'
      NEXT_PUBLIC_HARBOURVIEW_CI_RUN_ID: ${{ github.run_id }}
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-test-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: local-test-service-key
      HARBOURVIEW_PUBLIC_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      PGPASSWORD: postgres
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: P0 identity and baseline contract tests
        run: >-
          npx vitest run
          tests/harbourview/p0-identity-org-context.test.ts
          tests/harbourview/baseline-contract-repairs.test.ts
          tests/globe-router.test.ts
          tests/globe-router/routeState.test.ts
          tests/auth/canonicalRedirect.test.ts

      - name: Replay P0 migration and blocker regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-identity-org-context
          PSQL=(psql -h 127.0.0.1 -U postgres -d harbourview_p0 -v ON_ERROR_STOP=1)
          "${PSQL[@]}" <<'SQL'
          create extension if not exists pgcrypto;
          do $$ begin create role anon nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role nologin bypassrls; exception when duplicate_object then null; end $$;

          create schema if not exists auth;
          create schema if not exists api;
          create table if not exists auth.users (
            id uuid primary key,
            email text
          );
          create or replace function auth.uid() returns uuid
          language sql stable
          as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;

          create table public.workspaces (
            id uuid primary key,
            name text not null,
            status text not null default 'active'
          );
          create table public.workspace_members (
            workspace_id uuid not null references public.workspaces(id) on delete cascade,
            user_id uuid not null references auth.users(id) on delete cascade,
            role text not null default 'viewer',
            status text not null default 'active',
            invited_by uuid,
            invited_at timestamptz,
            joined_at timestamptz,
            primary key (workspace_id, user_id)
          );
          create table public.user_dashboard_preferences (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null unique references auth.users(id) on delete cascade,
            country_iso2 text,
            role_id text,
            heatmap_layer text,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );
          alter table public.user_dashboard_preferences enable row level security;
          create policy "Users can insert their own dashboard preferences"
            on public.user_dashboard_preferences for insert to authenticated
            with check (auth.uid() = user_id);
          create policy "Users can update their own dashboard preferences"
            on public.user_dashboard_preferences for update to authenticated
            using (auth.uid() = user_id) with check (auth.uid() = user_id);
          grant usage on schema public, api, auth to anon, authenticated, service_role;
          grant select on public.workspaces, public.workspace_members to authenticated;
          grant select, insert, update, delete on public.user_dashboard_preferences to authenticated;
          grant all on public.workspaces, public.workspace_members, public.user_dashboard_preferences to service_role;
          create view api.user_dashboard_preferences
          with (security_invoker = true) as
          select id, user_id, country_iso2, role_id, heatmap_layer, created_at, updated_at
          from public.user_dashboard_preferences;
          grant select, insert, update, delete on api.user_dashboard_preferences to authenticated, service_role;
          SQL

          "${PSQL[@]}" -f supabase/migrations/20260814122000_p0_identity_org_context.sql \
            | tee artifacts/p0-identity-org-context/migration-replay.txt

          "${PSQL[@]}" <<'SQL' | tee -a artifacts/p0-identity-org-context/migration-replay.txt
          do $$
          declare
            preference_columns text[];
            preference_invoker boolean;
            invitation_invoker boolean;
            invitation_rls boolean;
          begin
            select array_agg(column_name::text order by ordinal_position)
              into preference_columns
              from information_schema.columns
             where table_schema = 'api' and table_name = 'user_dashboard_preferences';
            if preference_columns <> array['id','user_id','country_iso2','role_id','heatmap_layer','created_at','updated_at','active_workspace_id'] then
              raise exception 'unexpected api.user_dashboard_preferences order: %', preference_columns;
            end if;

            select coalesce('security_invoker=true' = any(reloptions), false)
              into preference_invoker
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'api' and c.relname = 'user_dashboard_preferences';
            if not preference_invoker then raise exception 'preference view is not security_invoker'; end if;

            select coalesce('security_invoker=true' = any(reloptions), false)
              into invitation_invoker
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'api' and c.relname = 'workspace_invitations';
            if not invitation_invoker then raise exception 'invitation view is not security_invoker'; end if;

            select relrowsecurity into invitation_rls
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relname = 'workspace_invitations';
            if not invitation_rls then raise exception 'workspace_invitations RLS disabled'; end if;

            if has_table_privilege('anon', 'api.workspace_invitations', 'SELECT') then
              raise exception 'anon can read invitation transport';
            end if;
            if has_table_privilege('authenticated', 'api.workspace_invitations', 'SELECT') then
              raise exception 'authenticated can read invitation transport directly';
            end if;
            if not has_table_privilege('service_role', 'api.workspace_invitations', 'SELECT,INSERT,UPDATE,DELETE') then
              raise exception 'service role invitation privileges missing';
            end if;
            if has_function_privilege('anon', 'api.accept_workspace_invitation(text,uuid,text)', 'EXECUTE') then
              raise exception 'anon can execute invitation acceptance';
            end if;
            if has_function_privilege('authenticated', 'api.accept_workspace_invitation(text,uuid,text)', 'EXECUTE') then
              raise exception 'authenticated can execute invitation acceptance directly';
            end if;
            if not has_function_privilege('service_role', 'api.accept_workspace_invitation(text,uuid,text)', 'EXECUTE') then
              raise exception 'service role invitation acceptance execute missing';
            end if;
          end $$;

          insert into auth.users(id,email) values
            ('11111111-1111-1111-1111-111111111111','active@example.test'),
            ('22222222-2222-2222-2222-222222222222','suspended@example.test'),
            ('33333333-3333-3333-3333-333333333333','inactive-workspace@example.test'),
            ('44444444-4444-4444-4444-444444444444','existing@example.test'),
            ('55555555-5555-4555-8555-555555555555','new@example.test'),
            ('66666666-6666-4666-8666-666666666666','expired@example.test'),
            ('77777777-7777-4777-8777-777777777777','concurrent@example.test'),
            ('88888888-8888-4888-8888-888888888888','inactive-invite@example.test');

          insert into auth.users(id,email)
          select gen_random_uuid(), 'bulk-' || g || '@example.test'
          from generate_series(1,1001) g;

          insert into public.workspaces(id,name,status) values
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','Active Org','active'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','Suspended Membership Org','active'),
            ('cccccccc-cccc-4ccc-8ccc-cccccccccccc','Inactive Workspace','suspended'),
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd','Invitation Org','active');

          insert into public.workspace_members(workspace_id,user_id,role,status) values
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','11111111-1111-1111-1111-111111111111','admin','active'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','22222222-2222-2222-2222-222222222222','viewer','suspended'),
            ('cccccccc-cccc-4ccc-8ccc-cccccccccccc','33333333-3333-3333-3333-333333333333','operator','active'),
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd','44444444-4444-4444-4444-444444444444','admin','active');

          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          insert into public.user_dashboard_preferences(user_id,active_workspace_id)
          values ('11111111-1111-1111-1111-111111111111','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa');
          reset role;

          set role authenticated;
          select set_config('request.jwt.claim.sub','22222222-2222-2222-2222-222222222222',false);
          do $$
          begin
            begin
              insert into public.user_dashboard_preferences(user_id,active_workspace_id)
              values ('22222222-2222-2222-2222-222222222222','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');
              raise exception 'suspended membership unexpectedly accepted';
            exception
              when insufficient_privilege then null;
            end;
          end $$;
          reset role;

          set role authenticated;
          select set_config('request.jwt.claim.sub','33333333-3333-3333-3333-333333333333',false);
          do $$
          begin
            begin
              insert into public.user_dashboard_preferences(user_id,active_workspace_id)
              values ('33333333-3333-3333-3333-333333333333','cccccccc-cccc-4ccc-8ccc-cccccccccccc');
              raise exception 'inactive workspace unexpectedly accepted';
            exception
              when insufficient_privilege then null;
            end;
          end $$;
          reset role;

          insert into public.workspace_invitations(workspace_id,email,role,token_hash,invited_by,status,expires_at) values
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd','existing@example.test','viewer',repeat('a',64),'44444444-4444-4444-4444-444444444444','pending',now()+interval '1 day'),
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd','new@example.test','analyst',repeat('b',64),'44444444-4444-4444-4444-444444444444','pending',now()+interval '1 day'),
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd','expired@example.test','viewer',repeat('c',64),'44444444-4444-4444-4444-444444444444','pending',now()-interval '1 minute'),
            ('cccccccc-cccc-4ccc-8ccc-cccccccccccc','inactive-invite@example.test','viewer',repeat('e',64),'33333333-3333-3333-3333-333333333333','pending',now()+interval '1 day');

          do $$
          declare result jsonb;
          begin
            result := api.accept_workspace_invitation(repeat('a',64),'44444444-4444-4444-4444-444444444444','existing@example.test');
            if result->>'outcome' <> 'already_member' or result->>'role' <> 'admin' then
              raise exception 'existing member role was not preserved: %', result;
            end if;
            if (select role from public.workspace_members where workspace_id='dddddddd-dddd-4ddd-8ddd-dddddddddddd' and user_id='44444444-4444-4444-4444-444444444444') <> 'admin' then
              raise exception 'existing canonical role was overwritten';
            end if;

            result := api.accept_workspace_invitation(repeat('a',64),'44444444-4444-4444-4444-444444444444','existing@example.test');
            if result->>'outcome' <> 'already_accepted' or result->>'role' <> 'admin' then
              raise exception 'repeat acceptance is not idempotent: %', result;
            end if;

            result := api.accept_workspace_invitation(repeat('b',64),'55555555-5555-4555-8555-555555555555','new@example.test');
            if result->>'outcome' <> 'accepted' or result->>'role' <> 'analyst' then
              raise exception 'new member acceptance failed: %', result;
            end if;
            if not exists (select 1 from public.workspace_members where workspace_id='dddddddd-dddd-4ddd-8ddd-dddddddddddd' and user_id='55555555-5555-4555-8555-555555555555' and role='analyst' and status='active') then
              raise exception 'new canonical membership missing';
            end if;

            result := api.accept_workspace_invitation(repeat('c',64),'66666666-6666-4666-8666-666666666666','expired@example.test');
            if result->>'outcome' <> 'expired' then raise exception 'expired invitation accepted: %', result; end if;
            if exists (select 1 from public.workspace_members where user_id='66666666-6666-4666-8666-666666666666') then
              raise exception 'expired invitation created membership';
            end if;

            result := api.accept_workspace_invitation(repeat('e',64),'88888888-8888-4888-8888-888888888888','inactive-invite@example.test');
            if result->>'outcome' <> 'workspace_unavailable' then raise exception 'inactive workspace invitation accepted: %', result; end if;
            if exists (select 1 from public.workspace_members where user_id='88888888-8888-4888-8888-888888888888') then
              raise exception 'inactive workspace invitation created membership';
            end if;
          end $$;

          select 'P0 migration replay, active-workspace eligibility, 1000+ user independence, role preservation, repeat acceptance, expiry and inactive-workspace invitation checks: PASS';
          SQL

          # Real concurrent decline-vs-accept race: decline locks the invitation
          # first, then acceptance must observe the committed declined state and
          # must not create a workspace_members row.
          "${PSQL[@]}" -c "insert into public.workspace_invitations(workspace_id,email,role,token_hash,invited_by,status,expires_at) values ('dddddddd-dddd-4ddd-8ddd-dddddddddddd','concurrent@example.test','viewer',repeat('d',64),'44444444-4444-4444-4444-444444444444','pending',now()+interval '1 day');"
          "${PSQL[@]}" -c "begin; select id from public.workspace_invitations where token_hash=repeat('d',64) for update; select pg_sleep(2); update public.workspace_invitations set status='declined',updated_at=now() where token_hash=repeat('d',64) and status='pending'; commit;" >/tmp/p0-decline-race.log 2>&1 &
          DECLINE_PID=$!
          sleep 0.4
          RACE_OUTCOME=$("${PSQL[@]}" -Atq -c "select api.accept_workspace_invitation(repeat('d',64),'77777777-7777-4777-8777-777777777777','concurrent@example.test')->>'outcome';")
          wait "$DECLINE_PID"
          cat /tmp/p0-decline-race.log | tee -a artifacts/p0-identity-org-context/migration-replay.txt
          if [[ "$RACE_OUTCOME" != "declined" ]]; then
            echo "Concurrent decline race produced unexpected acceptance outcome: $RACE_OUTCOME" >&2
            exit 1
          fi
          RACE_MEMBERS=$("${PSQL[@]}" -Atq -c "select count(*) from public.workspace_members where workspace_id='dddddddd-dddd-4ddd-8ddd-dddddddddddd' and user_id='77777777-7777-4777-8777-777777777777';")
          if [[ "$RACE_MEMBERS" != "0" ]]; then
            echo "Concurrent decline race created membership" >&2
            exit 1
          fi
          echo "Concurrent decline-vs-accept atomicity: PASS" | tee -a artifacts/p0-identity-org-context/migration-replay.txt

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start built application
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/harbourview-p0-identity-next.log 2>&1 &
          echo $! > /tmp/harbourview-p0-identity-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/harbourview-p0-identity-next.log
          exit 1

      - name: Capture exact mobile Market Routing evidence
        run: npx playwright test tests/e2e/p0-identity-org-context.spec.ts --project=chromium-desktop --workers=1

      - name: Record exact head
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/p0-identity-org-context
          git rev-parse HEAD > artifacts/p0-identity-org-context/exact-head.txt
          git status --short > artifacts/p0-identity-org-context/git-status.txt
          cp /tmp/harbourview-p0-identity-next.log artifacts/p0-identity-org-context/next.log 2>/dev/null || true

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p0-identity-org-context-evidence-${{ github.sha }}
          path: artifacts/p0-identity-org-context/
          if-no-files-found: warn
          retention-days: 14
