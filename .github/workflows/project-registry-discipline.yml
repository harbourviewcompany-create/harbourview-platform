name: Project Registry Discipline

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  registry-discipline:
    name: Enforce registry impact discipline
    runs-on: ubuntu-latest
    # Dependabot writes its own PR bodies and cannot be made to include a
    # `## Registry Impact` section, so this gate fails on every Dependabot PR by
    # construction. The gate exists to make a human declare the registry blast
    # radius of a change; a version bump to package.json/package-lock.json has none
    # to declare. Human-authored dependency PRs are still checked, because they do
    # not run as this actor.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check project registry discipline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-project-registry-discipline.mjs
