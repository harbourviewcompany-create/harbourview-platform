name: Apply production security hardening (20260804190000)

# Applies exactly one migration file to production, verbatim from the repository.
#
# Why this exists as its own workflow rather than reusing supabase-migrate.yml:
# that workflow runs `supabase db push --include-all`, which applies the entire
# repository-only pending set. The repository currently carries ~830 migrations
# against 802 ledger rows, and its release-control allowlist is scoped to an
# older three-migration release, so dispatching it would either fail its manifest
# gate or reach far beyond this one change. This workflow applies one named file
# and nothing else.
#
# The file is fed to psql with `-1`, so the whole migration is a single
# transaction: it either applies completely or not at all.

on:
  workflow_dispatch:
    inputs:
      production_action:
        description: 'Explicit production migration authorization'
        required: true
        type: choice
        default: HOLD
        options:
          - HOLD
          - APPLY_PRODUCTION_MIGRATIONS

permissions:
  contents: read

concurrency:
  group: apply-production-security-hardening
  cancel-in-progress: false

env:
  MIGRATION_VERSION: '20260804190000'
  MIGRATION_NAME: production_security_hardening
  MIGRATION_FILE: supabase/migrations/20260804190000_production_security_hardening.sql
  ASSERTION_FILE: supabase/tests/production_security_hardening.sql
  PGHOST: aws-1-us-west-2.pooler.supabase.com
  PGPORT: '5432'
  PGUSER: postgres.zvxdgdkukjrrwamdpqrg
  PGDATABASE: postgres

jobs:
  apply:
    name: Apply and verify
    if: inputs.production_action == 'APPLY_PRODUCTION_MIGRATIONS'
    runs-on: ubuntu-latest
    environment: production-database
    timeout-minutes: 20
    steps:
      - name: Require main branch dispatch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Must be dispatched from main. Current ref: $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Build masked connection string
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ENCODED_PASSWORD=$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))
          PY
          )
          DB_URL="postgresql://${PGUSER}:${ENCODED_PASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          echo "::add-mask::$DB_URL"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Refuse if already applied
        run: |
          set -o pipefail
          COUNT=$(psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c \
            "select count(*) from supabase_migrations.schema_migrations
             where version = '${MIGRATION_VERSION}' or name = '${MIGRATION_NAME}';")
          echo "Existing ledger rows for this migration: $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "::error::Already recorded in the ledger. Nothing to do."
            exit 1
          fi

      - name: Capture pre-application evidence
        run: |
          mkdir -p artifacts
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "
            select 'anon_definer_execute=' || count(*)
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where p.prosecdef
              and n.nspname in ('public','api','signals','regulatory_signals')
              and has_function_privilege('anon', p.oid, 'execute');
          " | tee artifacts/before.txt

      - name: Apply the migration in one transaction
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -1 -f "$MIGRATION_FILE" \
            2>&1 | tee artifacts/apply.log

      - name: Record the ledger row under its repository version
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "
            insert into supabase_migrations.schema_migrations (version, name)
            values ('${MIGRATION_VERSION}', '${MIGRATION_NAME}')
            on conflict (version) do nothing;
          "

      - name: Assert the hardened contract holds in production
        run: |
          set -o pipefail
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f "$ASSERTION_FILE" \
            | tee artifacts/assertions.txt
          if [ -s artifacts/assertions.txt ]; then
            echo "::error::Production assertion rows returned -- the hardened contract is not satisfied."
            exit 1
          fi
          echo "All production security assertions returned zero rows."

      - name: Verify the live read and execute paths still work
        run: |
          set -o pipefail
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "
            select 'dashboard_authenticated_read=' ||
                   has_table_privilege('authenticated','api.signals_quality','select')::text
                || ' underlying=' ||
                   has_table_privilege('authenticated','public.signals_quality','select')::text
                || ' anon_closed=' ||
                   (not has_table_privilege('anon','public.signals_quality','select'))::text;

            select 'cron_functions_executable_by_postgres=' || count(*) || '/20'
            from (values
              ('hv_promote_staging_to_artifacts'),('hv_pipeline_tick'),('hv_trigger_score'),
              ('hv_trigger_extract'),('hv_trigger_source_pull_runner'),('hv_source_health_sweep'),
              ('hv_quality_promote_tick'),('hv_route_signals_to_digest'),('hv_alert_tick'),
              ('run_daily_digest'),('run_editorial_digest'),('run_counterparty_enrichment'),
              ('run_country_intel_enrichment'),('run_signal_counterparty_extraction'),
              ('sync_ia_market_graph'),('sync_ia_scoring'),('promote_all_extracted_snapshots'),
              ('hv_extract_signals_from_captured_text'),('prune_cron_job_run_details'),
              ('prune_net_http_response')
            ) as f(name)
            join pg_proc p on p.proname = f.name and p.pronamespace = 'public'::regnamespace
            where has_function_privilege('postgres', p.oid, 'execute');

            select 'anon_definer_execute_after=' || count(*)
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where p.prosecdef
              and n.nspname in ('public','api','signals','regulatory_signals')
              and has_function_privilege('anon', p.oid, 'execute');
          " | tee artifacts/after.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Production security hardening'
            echo
            echo '### Before'
            echo '```'; cat artifacts/before.txt 2>/dev/null || echo 'not captured'; echo '```'
            echo '### After'
            echo '```'; cat artifacts/after.txt 2>/dev/null || echo 'not captured'; echo '```'
            echo '### Assertions'
            if [ -f artifacts/assertions.txt ] && [ ! -s artifacts/assertions.txt ]; then
              echo 'Zero rows returned. Contract satisfied.'
            else
              echo '```'; cat artifacts/assertions.txt 2>/dev/null || echo 'not captured'; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-hardening-apply-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
