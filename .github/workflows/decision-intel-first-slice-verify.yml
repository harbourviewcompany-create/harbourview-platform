name: Decision Intel First Slice Verify

on:
  pull_request:
    branches: [main]
    paths:
      - app/dashboard/intel/**
      - components/dashboard/**
      - lib/dashboard/**
      - lib/intelligence-os/**
      - supabase/migrations/20260911225008_decision_intel_stage0_first_slice.sql
      - supabase/migrations/20260911225106_decision_intel_stage0_review_fixes.sql
      - supabase/migrations/20260911225151_decision_intel_stage0_completion_hardening.sql
      - tests/intel/**
      - docs/control/**
      - .github/workflows/decision-intel-first-slice-verify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-intel-first-slice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-contract:
    name: Production-shaped migration, lineage and RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: cipg
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      PGPASSWORD: cipg
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare production-shaped prerequisites
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create schema api;
          create schema auth;
          grant usage on schema public, api, auth to anon, authenticated, service_role;
          create function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          create function public.set_updated_at() returns trigger language plpgsql as $$ begin new.updated_at = now(); return new; end $$;
          grant execute on function auth.uid() to anon, authenticated, service_role;
          create table public.source_registry (id uuid primary key, name text);
          create table public.source_snapshots (id uuid primary key, source_id uuid references public.source_registry(id), captured_at timestamptz);
          create table public.hv_evidence (id uuid primary key, extracted_text text, storage_path text, private_notes text);
          create table public.countries (id uuid primary key default gen_random_uuid(), country_name text not null, iso_alpha2 text not null unique, iso_alpha3 text);
          create table public.jurisdictions (jurisdiction_id text primary key, name text, iso_alpha3 text);
          create table public.jurisdiction_crossref (id uuid primary key default gen_random_uuid(), countries_iso2 text unique, jurisdictions_id text unique references public.jurisdictions(jurisdiction_id), canonical_iso2 text not null, canonical_name text not null);
          create table public.user_roles (user_id uuid not null, role text not null);
          create table public.user_profiles (id uuid primary key, tier text not null);
          create table public.signals (id text primary key, snapshot_id uuid references public.source_snapshots(id), cluster_rep_id text, source text, url text, date timestamptz, created_at timestamptz not null default now(), reviewed_at timestamptz, reviewed boolean not null default false, action text, quality_label text, quality_confidence numeric, content_type text, cat text, pri text, impact text, commercial_impact text, country text, country_iso2 text, headline text, summary text, title_en text, summary_en text, editorial_title text, editorial_blurb text, analysis jsonb);
          grant select on public.user_profiles, public.user_roles to authenticated;
          insert into public.source_registry values ('10000000-0000-0000-0000-000000000001','Regulator A'),('10000000-0000-0000-0000-000000000002','Industry B');
          insert into public.source_snapshots values ('20000000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001',now());
          insert into public.hv_evidence values ('30000000-0000-0000-0000-000000000001','PRIVATE RAW EVIDENCE','private/path','PRIVATE NOTE');
          insert into public.countries (country_name,iso_alpha2,iso_alpha3) values ('Canada','CA','CAN'),('Germany','DE','DEU');
          insert into public.jurisdictions values ('country_area:CAN','Canada','CAN'),('country_area:DEU','Germany','DEU');
          insert into public.jurisdiction_crossref (countries_iso2,canonical_iso2,canonical_name) values ('CA','CA','Canada'),('DE','DE','Germany');
          insert into public.user_profiles values ('00000000-0000-0000-0000-000000000111','intel');
          insert into public.signals (id,snapshot_id,cluster_rep_id,source,url,date,reviewed,quality_label,quality_confidence,content_type,cat,pri,impact,commercial_impact,country,country_iso2,headline,summary,title_en,summary_en,analysis) values
          ('sig-a','20000000-0000-0000-0000-000000000001','sig-a','Regulator A','https://example.test/a',now(),true,'signal',0.91,'regulatory','regulatory','high','high','Potential market-access change','Germany','DE','Rule changed','Rule changed summary','Rule changed','Rule changed summary','{}'::jsonb),
          ('sig-b',null,'sig-a','Industry B','https://example.test/b',now(),true,'signal',0.78,'regulatory','regulatory','medium','medium','Context','Germany','DE','Second report','Second report summary','Second report','Second report summary','{}'::jsonb);
          SQL
      - name: Apply current first-slice chain
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260911225008_decision_intel_stage0_first_slice.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260911225106_decision_intel_stage0_review_fixes.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260911225151_decision_intel_stage0_completion_hardening.sql
      - name: Verify first-slice invariants
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from public.intel_assertions where source_signal_id='sig-a') then raise exception 'assertions missing'; end if;
            if not exists (select 1 from public.intel_events where id='event:sig-a') then raise exception 'event missing'; end if;
            if exists (select 1 from public.intel_assertions where review_status='verified') then raise exception 'verified state created by migration'; end if;
            if not exists (select 1 from public.intel_event_route_map where signal_id='sig-b' and event_id='event:sig-a') then raise exception 'cluster alias missing'; end if;
          end $$;
          SQL
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Decision Intel tests
        run: npx vitest run tests/intel/decisionIntelFirstSlice.test.ts tests/intel/decisionIntelJurisdictionNavigation.test.ts
