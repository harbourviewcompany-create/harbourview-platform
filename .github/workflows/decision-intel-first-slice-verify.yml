name: Decision Intel First Slice Verify

on:
  pull_request:
    branches: [main]
    paths:
      - app/dashboard/intel/**
      - components/dashboard/**
      - lib/dashboard/**
      - lib/intelligence-os/**
      - supabase/migrations/20260808190000_decision_intel_stage0_first_slice.sql
      - supabase/migrations/20260808203000_decision_intel_stage0_review_fixes.sql
      - tests/intel/decisionIntelFirstSlice.test.ts
      - tests/e2e/decision-intel-first-slice.spec.ts
      - docs/control/INTEL_DECISION_OS_*.md
      - docs/control/DATABASE_CONTROL.md
      - .github/workflows/decision-intel-first-slice-verify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-intel-first-slice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-contract:
    name: Production-shaped migration, lineage and RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: cipg
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      PGPASSWORD: cipg
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare production-shaped Stage 0 dependencies
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create schema api;
          create schema auth;
          grant usage on schema public, api, auth to anon, authenticated, service_role;
          create function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          create function public.set_updated_at() returns trigger language plpgsql as $$ begin new.updated_at = now(); return new; end $$;
          grant execute on function auth.uid() to anon, authenticated, service_role;
          create table public.source_registry (id uuid primary key, name text);
          create table public.source_snapshots (id uuid primary key, source_id uuid references public.source_registry(id), captured_at timestamptz);
          create table public.hv_evidence (id uuid primary key, extracted_text text, storage_path text, private_notes text);
          create table public.jurisdictions (jurisdiction_id text primary key, name text);
          create table public.jurisdiction_crossref (
            id uuid primary key default gen_random_uuid(),
            countries_iso2 text unique,
            jurisdictions_id text unique references public.jurisdictions(jurisdiction_id),
            canonical_iso2 text not null,
            canonical_name text not null
          );
          create table public.user_roles (user_id uuid not null, role text not null);
          create table public.user_profiles (id uuid primary key, tier text not null);
          create table public.signals (
            id text primary key, snapshot_id uuid references public.source_snapshots(id), cluster_rep_id text,
            source text, url text, date timestamptz, created_at timestamptz not null default now(), reviewed_at timestamptz,
            reviewed boolean not null default false, action text, quality_label text, quality_confidence numeric,
            content_type text, cat text, pri text, impact text, commercial_impact text, country text, country_iso2 text,
            headline text, summary text, title_en text, summary_en text, editorial_title text, editorial_blurb text, analysis jsonb
          );
          grant select on public.user_profiles, public.user_roles to authenticated;
          insert into public.source_registry values ('10000000-0000-0000-0000-000000000001','Regulator A'),('10000000-0000-0000-0000-000000000002','Industry B');
          insert into public.source_snapshots values ('20000000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001',now());
          insert into public.hv_evidence values ('30000000-0000-0000-0000-000000000001','PRIVATE RAW EVIDENCE','private/path','PRIVATE NOTE');
          insert into public.jurisdictions values ('country_area:CAN','Canada'),('country_area:DEU','Germany');
          insert into public.jurisdiction_crossref (countries_iso2,jurisdictions_id,canonical_iso2,canonical_name) values
            ('CA','country_area:CAN','CA','Canada'),
            ('DE','country_area:DEU','DE','Germany');
          insert into public.user_profiles values ('00000000-0000-0000-0000-000000000111','intel');
          insert into public.signals (id,snapshot_id,cluster_rep_id,source,url,date,reviewed,action,quality_label,quality_confidence,content_type,cat,pri,impact,commercial_impact,country,country_iso2,headline,summary,title_en,summary_en,analysis) values
          ('sig-a','20000000-0000-0000-0000-000000000001','sig-a','Regulator A','https://example.test/a',now(),true,null,'signal',0.91,'regulatory','regulatory','high','high','Potential market-access change','Germany','DE','Rule changed','Rule changed summary','Rule changed','Rule changed summary','{"recommended_action":"Verify importer eligibility"}'::jsonb),
          ('sig-b','20000000-0000-0000-0000-000000000001','sig-a','Industry B','https://example.test/b',now(),true,null,'signal',0.78,'regulatory','regulatory','medium','medium','Context','Germany','DE','Second report','Second report summary','Second report','Second report summary','{}'::jsonb),
          ('sig-c',null,null,'Regulator A','https://example.test/c',now(),true,null,'signal',0.82,'market','market','medium','medium','Commercial','Canada','CA','Commercial change','Commercial summary','Commercial change','Commercial summary','{}'::jsonb),
          ('sig-rejected',null,null,'Industry B','https://example.test/rejected',now(),true,'rejected','signal',0.99,'regulatory','regulatory','critical','critical','Must not surface','Canada','CA','Rejected','Rejected','Rejected','Rejected','{}'::jsonb);
          SQL
      - name: Apply exact first-slice migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260808190000_decision_intel_stage0_first_slice.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260808203000_decision_intel_stage0_review_fixes.sql
      - name: Verify backfill, jurisdiction, RPC and private-evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if (select count(*) from public.intel_assertions) <> 3 then raise exception 'assertion cardinality'; end if;
            if (select count(*) from public.intel_evidence_refs where source_snapshot_id='20000000-0000-0000-0000-000000000001') <> 2 then raise exception 'shared snapshot cardinality'; end if;
            if (select count(*) from public.intel_events) <> 2 then raise exception 'event cardinality'; end if;
            if exists (select 1 from public.intel_assertions where review_status='verified') then raise exception 'false verification'; end if;
            if exists (select 1 from public.intel_events where review_status='verified') then raise exception 'false verification'; end if;
            if not exists (select 1 from public.intel_assertions where source_signal_id='sig-a' and jurisdiction_id='country_area:DEU') then raise exception 'jurisdiction assertion'; end if;
            if not exists (select 1 from public.intel_events where id='event:sig-a' and jurisdiction_id='country_area:DEU') then raise exception 'jurisdiction event'; end if;
            if not exists (select 1 from public.intel_assertions where source_signal_id='sig-c' and jurisdiction_id='country_area:CAN') then raise exception 'Canada jurisdiction'; end if;
            if has_table_privilege('anon','api.intel_event_dossiers','SELECT') then raise exception 'anon relation read'; end if;
            if has_table_privilege('authenticated','api.intel_event_dossiers','SELECT') then raise exception 'direct customer relation read'; end if;
            if has_table_privilege('authenticated','public.hv_evidence','SELECT') then raise exception 'raw evidence grant'; end if;
            if not has_function_privilege('authenticated','api.get_intel_event_dossier(text)','EXECUTE') then raise exception 'missing dossier RPC'; end if;
          end $$;
          begin;
          set local role authenticated;
          select set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000111',true);
          do $$ declare payload text; begin
            select row_to_json(d)::text into payload from api.get_intel_event_dossier('event:sig-a') d;
            if payload is null then raise exception 'dossier RPC inaccessible'; end if;
            if payload ilike '%PRIVATE RAW EVIDENCE%' or payload ilike '%private/path%' or payload ilike '%PRIVATE NOTE%' then raise exception 'private evidence leak'; end if;
          end $$;
          rollback;
          SQL
      - name: Unit/control tests
        run: npx vitest run tests/intel/decisionIntelFirstSlice.test.ts tests/security/command-centre-boundaries.test.ts

  isolated-playwright:
    name: Required-width dossier Playwright evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: '1'
      HARBOURVIEW_LOCAL_TEST_BUILD: '1'
      NEXT_PUBLIC_HARBOURVIEW_LOCAL_TEST_BUILD: '1'
      HARBOURVIEW_ALLOW_LOCAL_SUPABASE: '1'
      NEXT_PUBLIC_HARBOURVIEW_ALLOW_LOCAL_SUPABASE: '1'
      NEXT_PUBLIC_HARBOURVIEW_CI_RUN_ID: ${{ github.run_id }}
      HARBOURVIEW_PUBLIC_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      DECISION_INTEL_EVENT_ID: event:fixture
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: latest
      - name: Prepare isolated dossier RPC projection
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations /tmp/decision-intel-production-migrations
          if [ -f supabase/seed.sql ]; then mv supabase/seed.sql /tmp/decision-intel-production-seed.sql; fi
          mkdir -p supabase/migrations
          cat > supabase/migrations/00000000000000_decision_intel_visual.sql <<'SQL'
          create schema if not exists api;
          grant usage on schema api to anon, authenticated, service_role;
          create table public.user_profiles (id uuid primary key references auth.users(id) on delete cascade, tier text not null);
          grant select on public.user_profiles to authenticated;
          grant select, insert, update, delete on public.user_profiles to service_role;
          create or replace view api.user_profiles as select id, tier from public.user_profiles;
          grant select on api.user_profiles to authenticated;
          grant select, insert, update, delete on api.user_profiles to service_role;
          create table api.intel_event_dossiers (
            id text primary key, headline text not null, summary text, event_type text, jurisdiction_label text,
            occurred_at timestamptz, detected_at timestamptz, effective_at timestamptz, last_verified_at timestamptz,
            materiality text, consolidation_status text, review_status text, source_count integer,
            what_happened text, what_changed text, why_it_matters text, commercial_implications text,
            regulatory_implications text, affected_entities text[], affected_markets text[], affected_products text[],
            why_now text, confidence numeric, confidence_rationale text, contradictions text[], unknowns text[],
            recommendation_state text, recommendation_reasoning text, action_summary text, urgency text, evidence jsonb
          );
          insert into api.intel_event_dossiers values (
            'event:fixture','German medical cannabis import conditions strengthened',
            'Multiple reviewed observations point to improving import conditions while importer demand remains incompletely verified.',
            'regulatory','Germany',now()-interval '2 days',now()-interval '1 day',null,null,'high','candidate','migrated_reviewed',2,
            'A regulatory and market-access development entered Harbourview review.',
            'Available evidence indicates the import environment changed from the prior known state, but the exact legal delta still requires analyst verification.',
            'The development could change access conditions for qualified exporters and importers.',
            'Potentially improves the commercial path for qualified suppliers while counterparty availability remains a dependency.',
            'Applicable requirements must be rechecked against the effective legal instrument before action.',
            array['Qualified exporters','Licensed importers'],array['Germany','Canada'],array['Medical cannabis flower'],
            'Two distinct source references now support the event candidate.',0.82,
            'High upstream signal quality; analytical confidence remains provisional pending requirement-level verification.',
            array['Secondary reporting differs on timing.'],array['Direct requirement-level verification remains open.'],
            'investigate','The development is material, but the evidence has not been independently verified to an act-now threshold.',
            'Verify the changed requirement and importer eligibility before commercial outreach.','high',
            '[{"sourceLabel":"German regulator","sourceUrl":"https://example.test/regulator","status":"needs_review","observedAt":"2026-08-08T00:00:00Z","relationship":"supports"}]'::jsonb
          );
          revoke all on api.intel_event_dossiers from anon, authenticated;
          create or replace function api.get_intel_event_dossier(p_event_id text)
          returns setof api.intel_event_dossiers language sql stable security definer set search_path=pg_catalog,api
          as $$ select * from api.intel_event_dossiers where id=p_event_id $$;
          create or replace function api.resolve_intel_event_route(p_signal_id text)
          returns table(event_id text) language sql stable security definer set search_path=pg_catalog,api
          as $$ select null::text where false $$;
          revoke all on function api.get_intel_event_dossier(text) from public, anon;
          revoke all on function api.resolve_intel_event_route(text) from public, anon;
          grant execute on function api.get_intel_event_dossier(text) to authenticated;
          grant execute on function api.resolve_intel_event_route(text) to authenticated;
          create or replace function public.get_intel_event_dossier(p_event_id text)
          returns setof api.intel_event_dossiers language sql stable security definer set search_path=pg_catalog,api,public
          as $$ select * from api.intel_event_dossiers where id=p_event_id $$;
          create or replace function public.resolve_intel_event_route(p_signal_id text)
          returns table(event_id text) language sql stable security definer set search_path=pg_catalog,api,public
          as $$ select null::text where false $$;
          revoke all on function public.get_intel_event_dossier(text) from public, anon;
          revoke all on function public.resolve_intel_event_route(text) from public, anon;
          grant execute on function public.get_intel_event_dossier(text) to authenticated, service_role;
          grant execute on function public.resolve_intel_event_route(text) to authenticated, service_role;
          SQL
          : > supabase/seed.sql
      - name: Start isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
      - name: Create isolated Intel-tier test account
        shell: bash
        run: |
          set -euo pipefail
          TEST_EMAIL="decision-intel-${GITHUB_RUN_ID}@harbourview.local"
          TEST_PASSWORD="HvMobile-${GITHUB_RUN_ID}-Aa9!"
          echo "::add-mask::${TEST_EMAIL}"
          echo "::add-mask::${TEST_PASSWORD}"
          echo "E2E_TEST_USER_EMAIL=${TEST_EMAIL}" >> "$GITHUB_ENV"
          echo "E2E_TEST_USER_PASSWORD=${TEST_PASSWORD}" >> "$GITHUB_ENV"
          export E2E_TEST_USER_EMAIL="${TEST_EMAIL}" E2E_TEST_USER_PASSWORD="${TEST_PASSWORD}"
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js'
          const c=createClient(process.env.NEXT_PUBLIC_SUPABASE_URL,process.env.SUPABASE_SERVICE_ROLE_KEY,{auth:{autoRefreshToken:false,persistSession:false},db:{schema:'public'}})
          const {data,error}=await c.auth.admin.createUser({email:process.env.E2E_TEST_USER_EMAIL,password:process.env.E2E_TEST_USER_PASSWORD,email_confirm:true,app_metadata:{subscription_tier:'intel'}})
          if(error) throw error
          const {error:profileError}=await c.from('user_profiles').insert({id:data.user.id,tier:'intel'})
          if(profileError) throw profileError
          NODE
      - name: Build exact source against isolated Supabase
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start exact local production build
        shell: bash
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/decision-intel-next.log 2>&1 & echo $! > /tmp/decision-intel-next.pid
          for attempt in $(seq 1 90); do curl --fail --silent http://127.0.0.1:3000/login >/dev/null && exit 0; sleep 2; done
          cat /tmp/decision-intel-next.log; exit 1
      - name: Run dedicated first-slice Playwright suite
        run: npx playwright test tests/e2e/decision-intel-first-slice.spec.ts --project=chromium-desktop --workers=1 --retries=0
      - name: Collect server evidence
        if: always()
        run: mkdir -p artifacts/decision-intel-first-slice && cp /tmp/decision-intel-next.log artifacts/decision-intel-first-slice/server.log || true
      - name: Upload dossier screenshots and Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: decision-intel-first-slice-${{ github.run_id }}
          path: |
            artifacts/decision-intel-first-slice/**
            playwright-report/**
            test-results/**
          if-no-files-found: warn
          retention-days: 14
      - name: Restore production migration source tree
        if: always()
        run: |
          rm -rf supabase/migrations supabase/seed.sql
          [ ! -d /tmp/decision-intel-production-migrations ] || mv /tmp/decision-intel-production-migrations supabase/migrations
          [ ! -f /tmp/decision-intel-production-seed.sql ] || mv /tmp/decision-intel-production-seed.sql supabase/seed.sql
      - name: Stop isolated services
        if: always()
        run: |
          [ ! -f /tmp/decision-intel-next.pid ] || kill "$(cat /tmp/decision-intel-next.pid)" 2>/dev/null || true
          supabase stop --no-backup || true
