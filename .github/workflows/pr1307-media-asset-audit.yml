name: PR1307 Marketplace Media Asset Audit

on:
  push:
    branches:
      - ops/delete-pr1307-semantic-media-temp
    paths:
      - .github/workflows/pr1307-media-asset-audit.yml

permissions:
  contents: read

jobs:
  asset-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Download decode hash and contact-sheet all referenced representative assets
        shell: bash
        run: |
          cat > /tmp/audit.py <<'PY'
          import csv, hashlib, io, os, requests
          from PIL import Image, ImageOps, ImageDraw

          base='https://zvxdgdkukjrrwamdpqrg.supabase.co/storage/v1/object/public/marketplace-item-public/'
          paths='''representative/v2/advisory-services.png
          representative/v2/bulk-flower.png
          representative/v2/cultivation-inputs.png
          representative/v2/extraction-equipment.png
          representative/v2/facility-supplies.png
          representative/v2/grow-lighting.png
          representative/v2/hemp-biomass.png
          representative/v2/lab-qa.png
          representative/v2/packaging-equipment.png
          representative/v2/packaging-pouches.png
          representative/v2/product-inventory.png
          representative/v2/retail-facility.png
          representative/v2/warehouse-logistics.png
          representative/v3/bud-shredder.png
          representative/v3/capsules.png
          representative/v3/cultivation-hardware.png
          representative/v3/edible-packaging.png
          representative/v3/extract-isolate.png
          representative/v3/glass-jars.png
          representative/v3/grow-media-propagation.png
          representative/v3/humidity-curing.png
          representative/v3/lab-consumables.png
          representative/v3/labels-signage.png
          representative/v3/medical-vaporiser.png
          representative/v3/pre-roll-consumables.png
          representative/v3/precision-scale.png
          representative/v3/processing-facility.png
          representative/v3/rooted-cuttings.png
          representative/v3/seeds.png
          representative/v3/shipping-supplies.png
          representative/v3/tincture-packaging.png
          representative/v3/topical-packaging.png
          representative/v3/vape-hardware.png
          representative/v4/capping-machine.png
          representative/v4/case-erector-sealer.png
          representative/v4/cloning-gel.png
          representative/v4/cultivation-facility.png
          representative/v4/extraction-chiller.png
          representative/v4/extraction-consumables.png
          representative/v4/flower-extract-import.png
          representative/v4/impulse-sealer.png
          representative/v4/induction-sealer.png
          representative/v4/label-applicator.png
          representative/v4/mixed-packaging-suite.png
          representative/v4/parchment-squares.png
          representative/v4/pharmaceutical-packaging.png
          representative/v4/plastic-jars.png
          representative/v4/pre-roll-machine.png
          representative/v4/pre-roll-packaging.png
          representative/v4/silicone-containers.png
          representative/v4/tincture-filling-machine.png
          representative/v4/trellis-netting.png
          representative/v4/vape-filling-machine.png
          representative/v4/vape-packaging.png'''.split()
          os.makedirs('artifacts/pr1307-media-assets/files', exist_ok=True)
          rows=[]; thumbs=[]
          for p in paths:
              u=base+p
              r=requests.get(u,timeout=30)
              r.raise_for_status()
              b=r.content
              sha=hashlib.sha256(b).hexdigest()
              im=Image.open(io.BytesIO(b)); im.load()
              fmt=im.format; w,h=im.size
              out='artifacts/pr1307-media-assets/files/'+p.replace('/','__')
              open(out,'wb').write(b)
              rows.append([p,r.status_code,r.headers.get('content-type',''),len(b),w,h,fmt,sha])
              thumb=ImageOps.fit(im.convert('RGB'),(320,240))
              canvas=Image.new('RGB',(340,290),'white'); canvas.paste(thumb,(10,10))
              d=ImageDraw.Draw(canvas); d.text((10,255),p.split('/')[-1],fill='black')
              thumbs.append(canvas)
          with open('artifacts/pr1307-media-assets/asset-integrity.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['path','http_status','content_type','bytes','width','height','format','sha256']); w.writerows(rows)
          cols=4; rowsn=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*340,rowsn*290),'white')
          for i,t in enumerate(thumbs): sheet.paste(t,((i%cols)*340,(i//cols)*290))
          sheet.save('artifacts/pr1307-media-assets/contact-sheet.jpg',quality=88)
          print(f'PASS assets={len(rows)}')
          PY
          python /tmp/audit.py
      - name: Upload asset audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr1307-media-asset-audit
          path: artifacts/pr1307-media-assets
          if-no-files-found: error
