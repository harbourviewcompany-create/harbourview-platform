name: PR 1257 Remediation Bootstrap

on:
  push:
    branches:
      - agent/command-centre-integration-rule

permissions:
  contents: write

concurrency:
  group: pr1257-remediation-bootstrap
  cancel-in-progress: false

jobs:
  remediate:
    if: contains(github.event.head_commit.message, '[pr1257-bootstrap]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/command-centre-integration-rule
          fetch-depth: 0
          persist-credentials: false

      - name: Merge current main and execute bounded remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Harbourview PR 1257 Remediation"
          git config user.email "harbourviewcompany@gmail.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi

          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/pr1257-remediation.yml').read_text().splitlines()
          start_marker = "          python3 <<'PY'"
          end_marker = "          PY"
          try:
              start = source.index(start_marker) + 1
              end = source.index(end_marker, start)
          except ValueError as error:
              raise SystemExit(f'Unable to locate embedded remediation script: {error}')

          script_lines = [line[10:] if line.startswith('          ') else line for line in source[start:end]]
          script = '\n'.join(script_lines) + '\n'
          exec(compile(script, 'pr1257-remediation.py', 'exec'), {'__name__': '__main__'})
          PY

          git status --short
          git add -A
          git commit -m "fix(command-centre): close PR 1257 review findings"

      - name: Push remediated branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/command-centre-integration-rule
