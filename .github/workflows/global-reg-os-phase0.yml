name: Global Regulatory OS Phase 0

on:
  pull_request:
    paths:
      - 'docs/control/global-regulatory-os/**'
      - 'scripts/global-reg-os/**'
      - 'tests/global-reg-os/**'
      - '.github/workflows/global-reg-os-phase0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize verified Phase 0 source files
        run: bash scripts/global-reg-os/bootstrap-phase0.sh --materialize
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - run: python scripts/global-reg-os/validate-repository-phase0.py
      - run: python scripts/global-reg-os/check-secrets.py
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1.34.3 lint docs/control/global-regulatory-os/canonical/api/openapi.yaml
      - name: Validate AsyncAPI
        run: npx --yes @asyncapi/cli@4.1.0 validate docs/control/global-regulatory-os/canonical/events/asyncapi.yaml

  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Materialize verified Phase 0 source files
        run: bash scripts/global-reg-os/bootstrap-phase0.sh --materialize
      - name: Run clean and simulated-upgrade PostgreSQL 17 validation
        run: bash scripts/global-reg-os/run-postgres-validation-repository.sh
