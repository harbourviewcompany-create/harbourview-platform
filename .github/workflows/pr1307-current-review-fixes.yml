name: PR 1307 Current Review Fixes

on:
  push:
    branches:
      - fix/mobile-marketplace-listing-images
    paths:
      - .github/workflows/pr1307-current-review-fixes.yml

permissions:
  contents: write

jobs:
  patch-and-self-remove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/mobile-marketplace-listing-images
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply current-review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path); s = p.read_text()
              if old not in s: raise SystemExit(f'missing anchor: {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          replace('lib/dashboard/marketplaceMediaProjection.ts',
            "export type DashboardMarketplaceProjection = {\n  rows: Partial<Record<MarketView, import('@/components/dashboard/CommandCentre').MarketRow[]>>\n  mediaById: MarketplaceMediaById\n}\n\nconst REPRESENTATIVE_CAPTION = 'Representative category image. Specifications, supplier fit and commercial terms are available upon inquiry.'",
            "export type DashboardMarketplaceProjection = {\n  rows: Partial<Record<MarketView, import('@/components/dashboard/CommandCentre').MarketRow[]>>\n  mediaById: MarketplaceMediaById\n  mediaStatus: 'live' | 'degraded'\n}\n\nexport const MARKETPLACE_MEDIA_COPY = Object.freeze({\n  representativeBadge: 'Representative image',\n  catalogueBadge: 'Manufacturer catalogue image',\n  representativeCaption: 'Representative category image. Specifications, supplier fit and commercial terms are available upon inquiry.',\n})\n\nconst REPRESENTATIVE_CAPTION = MARKETPLACE_MEDIA_COPY.representativeCaption")
          replace('lib/dashboard/marketplaceMediaProjection.ts', "    badgeLabel: 'Representative image',", "    badgeLabel: MARKETPLACE_MEDIA_COPY.representativeBadge,")

          replace('lib/dashboard/buildDashboardCommandSources.ts', "  getRepresentativeMarketplaceMedia,\n  marketplaceMediaKey,", "  getRepresentativeMarketplaceMedia,\n  MARKETPLACE_MEDIA_COPY,\n  marketplaceMediaKey,")
          replace('lib/dashboard/buildDashboardCommandSources.ts',
            "  const fallback = getRepresentativeMarketplaceMedia(view)\n  const selected = pickMarketplaceCardImage(images ?? [])\n  if (!selected) return fallback\n\n  const src = firstRenderableMarketplaceMediaSrc(selected)\n  if (!src) return fallback",
            "  const fallback = getRepresentativeMarketplaceMedia(view)\n  const renderable = (images ?? []).filter(image => firstRenderableMarketplaceMediaSrc(image) !== null)\n  const selected = pickMarketplaceCardImage(renderable)\n  if (!selected) return fallback\n\n  const src = firstRenderableMarketplaceMediaSrc(selected)\n  if (!src) return fallback")
          replace('lib/dashboard/buildDashboardCommandSources.ts', "      ? selected.sourceDisplayLabel || 'Manufacturer catalogue image'\n      : selected.sourceDisplayLabel || 'Representative image'", "      ? selected.sourceDisplayLabel || MARKETPLACE_MEDIA_COPY.catalogueBadge\n      : selected.sourceDisplayLabel || MARKETPLACE_MEDIA_COPY.representativeBadge")
          replace('lib/dashboard/buildDashboardCommandSources.ts',
            "async function loadMarketplaceMedia(itemIds: string[]): Promise<Record<string, PublicMarketplaceImageDTO[]>> {\n  if (itemIds.length === 0) return {}\n\n  return new Promise(resolve => {\n    let settled = false\n    const finish = (value: Record<string, PublicMarketplaceImageDTO[]>) => {\n      if (settled) return\n      settled = true\n      clearTimeout(timer)\n      resolve(value)\n    }\n    const timer = setTimeout(() => finish({}), MARKETPLACE_MEDIA_TIMEOUT_MS)\n\n    getPublicMarketplaceImagesForItems(itemIds).then(\n      images => finish(images),\n      () => finish({}),\n    )\n  })\n}",
            "async function loadMarketplaceMedia(itemIds: string[]): Promise<{ imagesByItem: Record<string, PublicMarketplaceImageDTO[]>; degraded: boolean }> {\n  if (itemIds.length === 0) return { imagesByItem: {}, degraded: false }\n\n  const controller = new AbortController()\n  return new Promise(resolve => {\n    let settled = false\n    const finish = (imagesByItem: Record<string, PublicMarketplaceImageDTO[]>, degraded: boolean) => {\n      if (settled) return\n      settled = true\n      clearTimeout(timer)\n      resolve({ imagesByItem, degraded })\n    }\n    const timer = setTimeout(() => {\n      controller.abort()\n      finish({}, true)\n    }, MARKETPLACE_MEDIA_TIMEOUT_MS)\n\n    getPublicMarketplaceImagesForItems(itemIds, controller.signal).then(\n      images => finish(images, false),\n      () => finish({}, true),\n    )\n  })\n}")
          replace('lib/dashboard/buildDashboardCommandSources.ts', "  const imagesByItem = await loadMarketplaceMedia(itemIds)\n\n  const rows: Partial<DashboardMarketplaceRows> = {}", "  const { imagesByItem, degraded } = await loadMarketplaceMedia(itemIds)\n\n  const rows: Partial<DashboardMarketplaceRows> = {}")
          replace('lib/dashboard/buildDashboardCommandSources.ts', "  return { rows, mediaById }", "  return { rows, mediaById, mediaStatus: degraded ? 'degraded' : 'live' }")
          replace('lib/dashboard/buildDashboardCommandSources.ts',
            "      fallback: { rows: {}, mediaById: {} },\n      isEmpty: projection => Object.keys(projection.rows).length === 0,",
            "      fallback: { rows: {}, mediaById: {}, mediaStatus: 'degraded' as const },\n      isEmpty: projection => Object.keys(projection.rows).length === 0,\n      classify: projection => Object.keys(projection.rows).length === 0\n        ? 'empty'\n        : projection.mediaStatus === 'degraded' ? 'fallback' : 'live',")

          replace('lib/marketplace/images/public-query.ts', "  rangeStart: number,\n): Promise<PublicMarketplaceImageDTO[] | null> {", "  rangeStart: number,\n  signal?: AbortSignal,\n): Promise<PublicMarketplaceImageDTO[] | null> {")
          replace('lib/marketplace/images/public-query.ts', "      cache: 'no-store',\n      headers:", "      cache: 'no-store',\n      signal,\n      headers:")
          replace('lib/marketplace/images/public-query.ts', "async function queryPublicImageBatch(itemIds: string[]): Promise<PublicMarketplaceImageDTO[]> {", "async function queryPublicImageBatch(itemIds: string[], signal?: AbortSignal): Promise<PublicMarketplaceImageDTO[]> {")
          replace('lib/marketplace/images/public-query.ts', "    const page = await queryPublicImagePage(params, rangeStart);\n    // Fail the complete batch closed rather than returning a partial image set\n    // that could make later listings appear image-less while earlier ones render.\n    if (page === null) return [];", "    const page = await queryPublicImagePage(params, rangeStart, signal);\n    // Reject the complete batch so callers can distinguish degraded enrichment\n    // from a legitimate listing with no approved image rows.\n    if (page === null) throw new Error('MARKETPLACE_MEDIA_QUERY_FAILED');")
          replace('lib/marketplace/images/public-query.ts', "export async function getPublicMarketplaceImagesForItems(itemIds: string[]): Promise<Record<string, PublicMarketplaceImageDTO[]>> {", "export async function getPublicMarketplaceImagesForItems(itemIds: string[], signal?: AbortSignal): Promise<Record<string, PublicMarketplaceImageDTO[]>> {")
          replace('lib/marketplace/images/public-query.ts', "  const batchRows = await Promise.all(batches.map(queryPublicImageBatch));", "  const batchRows = await Promise.all(batches.map(batch => queryPublicImageBatch(batch, signal)));")

          replace('components/dashboard/mobile-command/sections/MarketplaceSections.tsx', "import type { MarketView } from '../../CommandCentre'", "import type { MarketView } from '../../CommandCentre'\nimport { MARKETPLACE_MEDIA_COPY } from '@/lib/dashboard/marketplaceMediaProjection'")
          replace('components/dashboard/mobile-command/sections/MarketplaceSections.tsx', "      badgeLabel: 'Representative image',", "      badgeLabel: MARKETPLACE_MEDIA_COPY.representativeBadge,")

          p = Path('app/country/[country]/role/[role]/page.tsx'); s = p.read_text()
          s = s.replace("import { getListingsBySections } from '@/lib/server/listingsQuery'\nimport type { PublicListing } from '@/lib/server/listingsQuery'\nimport type { DashboardMarketplaceRows, MarketRow, MarketView } from '@/components/dashboard/CommandCentre'\n", "import { getDashboardMarketplaceProjection } from '@/lib/dashboard/buildDashboardCommandSources'\n")
          start = s.index('const VIEW_SECTION_MAP:'); end = s.index('type Props = {', start); s = s[:start] + s[end:]
          s = s.replace('    getCountryRoleMarketplaceRows(countryIso2),', '    getDashboardMarketplaceProjection(countryIso2),')
          s = s.replace("  const marketplaceRows = settledOr(marketplaceRowsResult, {}, 'getCountryRoleMarketplaceRows')", "  const marketplaceProjection = settledOr(marketplaceRowsResult, { rows: {}, mediaById: {}, mediaStatus: 'degraded' as const }, 'getDashboardMarketplaceProjection')")
          s = s.replace('      marketplaceRows={marketplaceRows}', '      marketplaceRows={marketplaceProjection.rows}\n      marketplaceMediaById={marketplaceProjection.mediaById}')
          p.write_text(s)

          wf = Path('.github/workflows/mobile-command-centre-v2-visual.yml'); s = wf.read_text()
          anchor = "      - tests/marketplace/publicImageQueryContract.test.ts\n"
          if 'tests/marketplace/marketplaceImageTrustReconciliation.test.ts' not in s.split('permissions:')[0]: s = s.replace(anchor, anchor + "      - tests/marketplace/marketplaceImageTrustReconciliation.test.ts\n      - tests/dashboard/marketplaceMediaMergeReadiness.test.ts\n", 1)
          anchor = "          tests/marketplace/publicImageQueryContract.test.ts\n"
          if s.count('tests/marketplace/marketplaceImageTrustReconciliation.test.ts') < 2: s = s.replace(anchor, anchor + "          tests/marketplace/marketplaceImageTrustReconciliation.test.ts\n          tests/dashboard/marketplaceMediaMergeReadiness.test.ts\n", 1)
          wf.write_text(s)

          e2e = Path('tests/e2e/mobile-marketplace-media.spec.ts'); s = e2e.read_text(); a = s.index('async function assertHealthyMedia(page: Page) {'); b = s.index("\ntest.describe('Mobile Marketplace media production path'", a)
          helper = '''async function assertHealthyRenderedCards(page: Page) {\n  const cards = page.locator('.hvm2-listing-card')\n  const count = await cards.count()\n  for (let index = 0; index < count; index += 1) {\n    const media = cards.nth(index).locator('.hvm2-listing-media')\n    await expect(media).toBeVisible()\n    const kind = await media.getAttribute('data-media-kind')\n    expect(['actual', 'catalogue', 'representative']).toContain(kind)\n    const image = media.locator('img')\n    await expect(image).toBeVisible()\n    await expect.poll(async () => image.evaluate((node: HTMLImageElement) => node.complete && node.naturalWidth > 0)).toBe(true)\n    const alt = await image.getAttribute('alt')\n    expect(alt?.trim().length ?? 0).toBeGreaterThan(8)\n    const badge = media.locator('.hvm2-listing-media-badge')\n    if (kind === 'actual') await expect(badge).toHaveCount(0)\n    else expect(((await badge.textContent()) ?? '').trim().length).toBeGreaterThan(0)\n  }\n  const geometry = await page.evaluate(() => ({ scrollWidth: document.documentElement.scrollWidth, clientWidth: document.documentElement.clientWidth }))\n  expect(geometry.scrollWidth - geometry.clientWidth).toBeLessThanOrEqual(1)\n}\n\nasync function assertAllMarketplaceViews(page: Page) {\n  for (const label of ['Cannabis', 'Wanted', 'Opportunities', 'Equipment', 'Consumables', 'Services', 'New products']) {\n    const tab = page.getByRole('tab', { name: new RegExp(`^${label}`) })\n    await tab.click()\n    await expect(tab).toHaveAttribute('aria-selected', 'true')\n    await assertHealthyRenderedCards(page)\n  }\n}\n'''
          s = s[:a] + helper + s[b:]
          s = s.replace('        await assertHealthyMedia(page)', "        await assertHealthyRenderedCards(page)\n        await expect(page.locator('.hvm2-listing-media-badge').first()).toHaveText('Illustrative image')\n        await assertAllMarketplaceViews(page)", 1); e2e.write_text(s)

          t = Path('tests/dashboard/marketplaceMediaMergeReadiness.test.ts'); s = t.read_text(); s = s.replace("import { describe, expect, it } from 'vitest'", "import { describe, expect, it } from 'vitest'\nimport { resolveListingMedia } from '@/lib/dashboard/buildDashboardCommandSources'")
          insert = '''\n  it('skips an unusable higher-ranked image and selects the best renderable approved image', () => {\n    const images = [\n      { id: '00000000-0000-4000-8000-000000000001', itemId: 'item-1', imageClass: 'REAL_ITEM_EVIDENCE', role: 'CARD', sourceType: 'SELLER_UPLOAD', sourceDisplayLabel: 'Seller supplied', publicUrl: 'https://example.invalid/private.jpg', thumbnailUrl: null, heroUrl: null, galleryUrl: null, socialUrl: null, altText: 'Unusable evidence', caption: null, isIllustrative: false },\n      { id: '00000000-0000-4000-8000-000000000002', itemId: 'item-1', imageClass: 'MANUFACTURER_CATALOGUE', role: 'CARD', sourceType: 'MANUFACTURER', sourceDisplayLabel: 'Manufacturer catalogue', publicUrl: '/marketplace/images/product-inventory.webp', thumbnailUrl: null, heroUrl: null, galleryUrl: null, socialUrl: null, altText: 'Renderable catalogue image', caption: null, isIllustrative: false },\n    ] as any\n    const media = resolveListingMedia('cannabis', images)\n    expect(media.kind).toBe('catalogue')\n    expect(media.src).toBe('/marketplace/images/product-inventory.webp')\n  })\n'''; pos = s.rfind('\n})'); s = s[:pos] + insert + s[pos:]; t.write_text(s)

          replace('tests/marketplace/publicImageQueryContract.test.ts', "expect(source).toContain('Promise.all(batches.map(queryPublicImageBatch))')", "expect(source).toContain('Promise.all(batches.map(batch => queryPublicImageBatch(batch, signal)))')")
          replace('tests/marketplace/publicImageQueryContract.test.ts', "expect(source).toContain('if (page === null) return []')", "expect(source).toContain(\"if (page === null) throw new Error('MARKETPLACE_MEDIA_QUERY_FAILED')\")\n    expect(source).toContain('signal?: AbortSignal')\n    expect(source).toContain('signal,')")

          Path('docs/control/MARKETPLACE_MEDIA_COPY.md').write_text('''# Marketplace Media Copy Control\n\nVersion: 1.0\nEffective: 2026-08-10\n\nCanonical trust-facing marketplace media disclosures are implemented in `MARKETPLACE_MEDIA_COPY` in `lib/dashboard/marketplaceMediaProjection.ts`.\n\n- Representative badge: `Representative image`\n- Catalogue fallback badge: `Manufacturer catalogue image`\n- Representative caption: `Representative category image. Specifications, supplier fit and commercial terms are available upon inquiry.`\n\nApproved image-specific `sourceDisplayLabel`, reviewed alt text and caption remain authoritative when supplied by the safe public DTO. `REAL_ITEM_EVIDENCE` is the only media class rendered without a provenance qualifier.\n''')
          PY
      - name: Verify focused patch
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run tests/dashboard/marketplaceMediaMergeReadiness.test.ts tests/dashboard/dashboardMarketplaceRows.test.ts tests/dashboard/mobileMarketplaceMedia.test.ts tests/marketplace/marketplaceMediaSelection.test.ts tests/marketplace/publicImageQueryContract.test.ts tests/marketplace/marketplaceImageTrustReconciliation.test.ts tests/security/command-centre-boundaries.test.ts
      - name: Commit verified patch and self-remove
        shell: bash
        run: |
          rm .github/workflows/pr1307-current-review-fixes.yml
          git config user.name 'Harbourview Review Fix Bot'
          git config user.email 'harbourviewcompany@gmail.com'
          git add -A
          git commit -m 'fix(marketplace): close current media review gaps'
          git push origin HEAD:fix/mobile-marketplace-listing-images
