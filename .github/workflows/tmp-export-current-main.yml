name: Temporary Export Replacement Head

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-export-current-main.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Package exact replacement source
        run: tar --exclude=.git -czf /tmp/harbourview-replacement-head.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: harbourview-replacement-head
          path: /tmp/harbourview-replacement-head.tar.gz
          retention-days: 1
          if-no-files-found: error
