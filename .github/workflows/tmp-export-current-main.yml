name: Temporary Export Current Main

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-export-current-main.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Verify exact base
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
      - name: Package exact base source
        run: tar --exclude=.git -czf /tmp/harbourview-current-main.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: harbourview-current-main
          path: /tmp/harbourview-current-main.tar.gz
          retention-days: 1
          if-no-files-found: error
