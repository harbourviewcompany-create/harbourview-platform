name: Mobile Command Centre V2 Visual

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mobile-command-centre-v2-visual.yml
      - scripts/command-centre-review-fixes.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: command-centre-review-remediation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    name: Apply and verify production review fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply fail-closed patches
        shell: bash
        run: |
          set -euo pipefail
          python scripts/command-centre-review-fixes.py
          sed -i '${/^$/d;}' components/dashboard/MobileCommandCentreRebuild.css

      - name: Verify patched tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm ci
          npx vitest run \
            tests/dashboard/loadCommandCentreData.test.ts \
            tests/dashboard/mobileCommandCentreV2.test.ts \
            tests/dashboard/dashboardResponsiveShell.behavior.test.ts \
            tests/platform/command-centre-typed-registry.test.ts \
            tests/security/command-centre-boundaries.test.ts \
            tests/supabase/env.test.ts
          npm run typecheck

      - name: Commit verified remediation
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/command-centre-review-fixes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(command-centre): close production review blockers'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
