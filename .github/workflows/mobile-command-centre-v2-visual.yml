name: Mobile Command Centre V2 Visual

on:
  pull_request:
    branches:
      - main
    paths:
      - components/dashboard/MobileCommandCentreRebuild.tsx
      - components/dashboard/MobileCommandCentreRebuild.css
      - components/dashboard/DashboardResponsiveShell.tsx
      - components/dashboard/mobile-command/**
      - tests/e2e/mobile-command-centre-v2.spec.ts
      - .github/workflows/mobile-command-centre-v2-visual.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-command-centre-v2-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PREVIEW_URL: https://harbourview-git-build-mobile-command-centre-v2-harbourview.vercel.app
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact verified branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Validate authenticated visual inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${E2E_TEST_USER_EMAIL:-}" || { echo 'HOLD: E2E_TEST_USER_EMAIL is not configured.'; exit 1; }
          test -n "${E2E_TEST_USER_PASSWORD:-}" || { echo 'HOLD: E2E_TEST_USER_PASSWORD is not configured.'; exit 1; }
          test -n "${NEXT_PUBLIC_SUPABASE_URL:-}" || { echo 'HOLD: NEXT_PUBLIC_SUPABASE_URL is not configured.'; exit 1; }
          test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" || { echo 'HOLD: NEXT_PUBLIC_SUPABASE_ANON_KEY is not configured.'; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'HOLD: SUPABASE_SERVICE_ROLE_KEY is not configured.'; exit 1; }
          echo 'GO: authenticated visual inputs are configured.'

      - name: Install dependencies
        run: npm ci

      - name: Resolve exact verification target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
              body="$(curl -sS -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" "${PREVIEW_URL}/login" || true)"
            else
              body="$(curl -sS "${PREVIEW_URL}/login" || true)"
            fi
            if printf '%s' "$body" | grep -q "$EXPECTED_SOURCE_SHA"; then
              echo 'mode=preview' >> "$GITHUB_OUTPUT"
              echo "HARBOURVIEW_PUBLIC_BASE_URL=${PREVIEW_URL}" >> "$GITHUB_ENV"
              echo "PLAYWRIGHT_BASE_URL=${PREVIEW_URL}" >> "$GITHUB_ENV"
              echo "GO: exact preview source ${EXPECTED_SOURCE_SHA} is ready."
              exit 0
            fi
            echo "Attempt ${attempt}: preview is not yet serving ${EXPECTED_SOURCE_SHA}"
            sleep 5
          done

          echo 'mode=local-exact-build' >> "$GITHUB_OUTPUT"
          echo 'HARBOURVIEW_PUBLIC_BASE_URL=http://127.0.0.1:3000' >> "$GITHUB_ENV"
          echo 'PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000' >> "$GITHUB_ENV"
          echo 'Preview is unavailable at the exact source SHA; using an exact local production build.'

      - name: Build exact source locally
        if: steps.target.outputs.mode == 'local-exact-build'
        run: npm run build

      - name: Start exact local production build
        if: steps.target.outputs.mode == 'local-exact-build'
        shell: bash
        run: |
          set -euo pipefail
          npm start -- --hostname 127.0.0.1 > /tmp/mobile-command-next.log 2>&1 &
          echo $! > /tmp/mobile-command-next.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              echo 'GO: exact local production build is ready.'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mobile-command-next.log
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated five-width visual gate
        run: npx playwright test tests/e2e/mobile-command-centre-v2.spec.ts --project=chromium-desktop --workers=1 --retries=0

      - name: Upload mobile command visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-command-centre-v2-${{ github.run_id }}
          path: |
            artifacts/mobile-command-v2/
            playwright-report/
            test-results/
            /tmp/mobile-command-next.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local production build
        if: always() && steps.target.outputs.mode == 'local-exact-build'
        shell: bash
        run: |
          if [ -f /tmp/mobile-command-next.pid ]; then
            kill "$(cat /tmp/mobile-command-next.pid)" 2>/dev/null || true
          fi
