name: Mobile Command Centre V2 Visual

on:
  pull_request:
    branches:
      - main
    paths:
      - app/dashboard/**
      - app/api/health/command-centre/**
      - next.config.mjs
      - lib/supabase/env.ts
      - lib/platform/commandCentreRegistry.ts
      - lib/dashboard/commandCentreDataTypes.ts
      - lib/dashboard/loadCommandCentreData.ts
      - lib/dashboard/buildDashboardCommandSources.ts
      - lib/dashboard/marketplaceMediaProjection.ts
      - lib/marketplace/images/**
      - supabase/migrations/*marketplace*.sql
      - components/dashboard/CommandCentreDataBoundary.tsx
      - components/dashboard/CommandCentreModuleRail.tsx
      - components/dashboard/CommandCentreModuleRail.css
      - components/dashboard/MobileCommandCentreRebuild.tsx
      - components/dashboard/MobileCommandCentreRebuild.css
      - components/dashboard/MobileCommandCentreWorkspaces.css
      - components/dashboard/DashboardResponsiveShell.tsx
      - components/dashboard/mobile-command/**
      - components/marketplace/DynamicMarketplaceIntakeForm.tsx
      - tests/dashboard/mobileCommandCentreV2.test.ts
      - tests/dashboard/dashboardResponsiveShell.behavior.test.ts
      - tests/dashboard/loadCommandCentreData.test.ts
      - tests/dashboard/commandCentreHealth.test.ts
      - tests/dashboard/dashboardMarketplaceRows.test.ts
      - tests/dashboard/mobileMarketplaceMedia.test.ts
      - tests/marketplace/marketplaceMediaSelection.test.ts
      - tests/marketplace/publicImageQueryContract.test.ts
      - tests/marketplace/marketplaceImageTrustReconciliation.test.ts
      - tests/dashboard/marketplaceMediaMergeReadiness.test.ts
      - tests/platform/command-centre-typed-registry.test.ts
      - tests/security/command-centre-boundaries.test.ts
      - tests/supabase/env.test.ts
      - tests/e2e/mobile-command-centre-v2.spec.ts
      - tests/e2e/mobile-marketplace-media.spec.ts
      - tests/e2e/mobile-intel-authenticated.spec.ts
      - .github/workflows/mobile-command-centre-v2-visual.yml
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Same fix as ci.yml: on push the old key collapsed to `refs/heads/main`, so
  # consecutive merges cancelled each other's visual verification. Key non-PR
  # runs on the commit, and cancel only within a pull request.
  group: mobile-command-centre-v2-visual-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authenticated-visual:
    name: Authenticated Command Centre and marketplace media evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      HARBOURVIEW_LOCAL_TEST_BUILD: '1'
      NEXT_PUBLIC_HARBOURVIEW_LOCAL_TEST_BUILD: '1'
      HARBOURVIEW_ALLOW_LOCAL_SUPABASE: '1'
      NEXT_PUBLIC_HARBOURVIEW_ALLOW_LOCAL_SUPABASE: '1'
      HARBOURVIEW_PUBLIC_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      MOBILE_COMMAND_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUPABASE_DB_SCHEMA: api
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact verified branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ env.MOBILE_COMMAND_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify registry loader shell readiness auth leakage and local-auth contracts
        run: >-
          npx vitest run
          tests/dashboard/mobileCommandCentreV2.test.ts
          tests/dashboard/dashboardResponsiveShell.behavior.test.ts
          tests/dashboard/loadCommandCentreData.test.ts
          tests/dashboard/commandCentreHealth.test.ts
          tests/dashboard/dashboardMarketplaceRows.test.ts
          tests/dashboard/mobileMarketplaceMedia.test.ts
          tests/marketplace/marketplaceMediaSelection.test.ts
          tests/marketplace/publicImageQueryContract.test.ts
          tests/marketplace/marketplaceImageTrustReconciliation.test.ts
          tests/dashboard/marketplaceMediaMergeReadiness.test.ts
          tests/platform/command-centre-typed-registry.test.ts
          tests/security/command-centre-boundaries.test.ts
          tests/supabase/env.test.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1

      - name: Prepare isolated local Supabase schema
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations /tmp/harbourview-production-migrations
          if [ -f supabase/seed.sql ]; then
            mv supabase/seed.sql /tmp/harbourview-production-seed.sql
          fi
          mkdir -p supabase/migrations
          cat > supabase/migrations/00000000000000_mobile_command_visual.sql <<'SQL'
          create schema if not exists api;
          grant usage on schema api to anon, authenticated, service_role;

          create table if not exists api.user_dashboard_preferences (
            user_id uuid primary key,
            country_iso2 text,
            role_id text
          );

          create table if not exists api.workspace_members (
            user_id uuid not null,
            workspace_id uuid not null default gen_random_uuid(),
            status text not null default 'active'
          );

          create table if not exists api.talent_jobs_public (
            id uuid primary key default gen_random_uuid(),
            title text not null,
            department text,
            location text,
            operator_name text,
            operator_verification_status text,
            created_at timestamptz not null default now()
          );

          create table if not exists api.hv_professionals (
            id uuid primary key default gen_random_uuid(),
            full_name text not null,
            title text,
            credential_type text,
            specialties text[] not null default '{}',
            countries text[] not null default '{}',
            institution text,
            accepts_referrals boolean not null default false,
            consultation_available boolean not null default false,
            bio_public text,
            verification_status text not null default 'verified',
            status text not null default 'active'
          );

          create table if not exists api.daily_digest (
            digest_date date primary key,
            headlines jsonb not null default '[]'::jsonb,
            editorial_headlines jsonb not null default '[]'::jsonb,
            generated_at timestamptz not null default now(),
            status text not null default 'draft'
          );

          create table if not exists api.signals_quality (
            id uuid primary key default gen_random_uuid(),
            headline text not null default '',
            cat text,
            top_lane text,
            pri text,
            country text,
            date timestamptz,
            created_at timestamptz not null default now(),
            reviewed boolean not null default false,
            quality_label text,
            quality_confidence numeric,
            content_type text,
            impact text,
            title_en text,
            summary_en text,
            lang_detected text,
            is_representative boolean,
            cluster_rep_id uuid
          );

          create table if not exists api.signals (
            id uuid primary key default gen_random_uuid(),
            headline text not null default '',
            cat text,
            top_lane text,
            pri text,
            country text,
            date timestamptz,
            created_at timestamptz not null default now(),
            reviewed boolean not null default false,
            action text,
            analysis jsonb,
            quality_label text,
            quality_confidence numeric,
            content_type text,
            impact text,
            title_en text,
            summary_en text,
            lang_detected text,
            is_representative boolean,
            cluster_rep_id uuid
          );

          create or replace view api.signals_with_quality as
            select * from api.signals;

          create table if not exists api.market_metrics (
            id uuid primary key default gen_random_uuid(),
            country_iso2 text,
            metric_name text,
            metric_value numeric,
            metric_unit text,
            source_name text,
            source_url text,
            source_date date
          );

          create table if not exists api.deal_rooms (
            id uuid primary key default gen_random_uuid(),
            title text,
            listing_ref text,
            status text,
            updated_at timestamptz not null default now(),
            initiator_id uuid,
            counterparty_id uuid
          );

          create table if not exists api.marketplace_candidates (
            id uuid primary key default gen_random_uuid(),
            title_public_draft text,
            marketplace_category text,
            listing_type text,
            status text,
            created_at timestamptz not null default now(),
            country text,
            submitted_by uuid,
            submission_source text
          );

          create table if not exists public.marketplace_public_listings_v1 (
            id uuid primary key,
            slug text,
            title text not null,
            description text not null,
            category text not null,
            subcategory text,
            marketplace_section text not null,
            product_type text,
            region text not null,
            condition text,
            location_country text,
            location_region text,
            price_amount numeric,
            price_currency text not null,
            price_display text,
            seller_type text not null,
            is_featured boolean not null default false,
            high_level_specs jsonb not null default '{}'::jsonb,
            created_at timestamptz not null default now(),
            average_rating numeric,
            review_count integer
          );

          insert into public.marketplace_public_listings_v1 (
            id, slug, title, description, category, subcategory,
            marketplace_section, product_type, region, condition,
            location_country, location_region, price_amount, price_currency,
            price_display, seller_type, is_featured, high_level_specs,
            average_rating, review_count
          ) values (
            '00000000-0000-4000-8000-000000000127',
            'visual-safe-bulk-flower',
            'Visual Safe Bulk Flower Lot',
            'Publicly approved bulk flower supply fixture for authenticated mobile verification.',
            'cannabis_inventory',
            'bulk_flower',
            'cannabis_inventory',
            'Dried flower',
            'global',
            'new',
            'CA',
            'Ontario',
            null,
            'CAD',
            'Request reviewed terms',
            'licensed_operator',
            true,
            '{"score": 88, "regulatory_ready": true, "cultivation_standard": "GACP"}'::jsonb,
            4.8,
            12
          ) on conflict (id) do nothing;

          -- Public image projection fixture. It uses the exact public DTO shape
          -- and points to an existing first-party asset so the browser verifies
          -- an image-bearing card without any production data write.
          create table if not exists api.marketplace_item_images (
            id uuid primary key,
            item_id uuid not null,
            image_class text not null,
            image_role text not null,
            source_type text not null,
            public_url text,
            thumbnail_url text,
            hero_url text,
            gallery_url text,
            social_url text,
            alt_text text,
            caption text,
            is_illustrative boolean not null default false,
            review_status text not null,
            rights_status text not null
          );

          insert into api.marketplace_item_images (
            id, item_id, image_class, image_role, source_type,
            public_url, thumbnail_url, hero_url, gallery_url, social_url,
            alt_text, caption, is_illustrative, review_status, rights_status
          ) values (
            '00000000-0000-4000-8000-000000000128',
            '00000000-0000-4000-8000-000000000127',
            'HARBOURVIEW_ILLUSTRATIVE',
            'CARD',
            'HARBOURVIEW_CREATED',
            'https://harbourview.vercel.app/marketplace/images/product-inventory.webp',
            'https://harbourview.vercel.app/marketplace/images/product-inventory.webp',
            'https://harbourview.vercel.app/marketplace/images/product-inventory.webp',
            'https://harbourview.vercel.app/marketplace/images/product-inventory.webp',
            null,
            'Representative cannabis product inventory image',
            'Illustrative catalogue image — not item evidence',
            true,
            'APPROVED_PUBLIC',
            'HARBOURVIEW_CREATED'
          ) on conflict (id) do nothing;

          grant select, insert, update, delete on all tables in schema api to authenticated, service_role;
          grant select on all tables in schema api to anon;
          grant select on public.marketplace_public_listings_v1 to anon, authenticated, service_role;
          SQL
          : > supabase/seed.sql

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

      - name: Create isolated authenticated test account
        shell: bash
        run: |
          set -euo pipefail
          TEST_EMAIL="mobile-command-${GITHUB_RUN_ID}@harbourview.local"
          TEST_PASSWORD="HvMobile-${GITHUB_RUN_ID}-Aa9!"
          echo "::add-mask::${TEST_EMAIL}"
          echo "::add-mask::${TEST_PASSWORD}"
          export E2E_TEST_USER_EMAIL="${TEST_EMAIL}"
          export E2E_TEST_USER_PASSWORD="${TEST_PASSWORD}"
          {
            echo "E2E_TEST_USER_EMAIL=${TEST_EMAIL}"
            echo "E2E_TEST_USER_PASSWORD=${TEST_PASSWORD}"
          } >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js'

          const client = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
            { auth: { autoRefreshToken: false, persistSession: false } },
          )

          const { data, error } = await client.auth.admin.createUser({
            email: process.env.E2E_TEST_USER_EMAIL,
            password: process.env.E2E_TEST_USER_PASSWORD,
            email_confirm: true,
            app_metadata: { mobile_command_visual_test: true },
            user_metadata: { purpose: 'isolated-playwright' },
          })

          if (error) throw error
          if (!data.user) throw new Error('Isolated mobile command test user was not created')
          console.log(`Created isolated visual user ${data.user.id}`)
          NODE

      - name: Build exact source against isolated Supabase
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start exact local production build
        shell: bash
        run: |
          set -euo pipefail
          npm start -- --hostname 127.0.0.1 > /tmp/mobile-command-next.log 2>&1 &
          echo $! > /tmp/mobile-command-next.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              echo 'GO: exact local production build is ready.'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mobile-command-next.log
          exit 1

      - name: Run authenticated Command Centre and marketplace media visual gates
        run: >-
          npx playwright test
          tests/e2e/mobile-command-centre-v2.spec.ts
          tests/e2e/mobile-marketplace-media.spec.ts
          tests/e2e/mobile-intel-authenticated.spec.ts
          --project=chromium-desktop
          --workers=1
          --retries=0

      - name: Collect local server evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/mobile-command-v2
          if [ -f /tmp/mobile-command-next.log ]; then
            cp /tmp/mobile-command-next.log artifacts/mobile-command-v2/server.log
          fi

      - name: Upload Command Centre visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: command-centre-responsive-${{ github.run_id }}
          path: |
            artifacts/mobile-command-v2/
            artifacts/mobile-marketplace-media/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Restore production migration source tree
        if: always()
        shell: bash
        run: |
          rm -rf supabase/migrations supabase/seed.sql
          if [ -d /tmp/harbourview-production-migrations ]; then
            mv /tmp/harbourview-production-migrations supabase/migrations
          fi
          if [ -f /tmp/harbourview-production-seed.sql ]; then
            mv /tmp/harbourview-production-seed.sql supabase/seed.sql
          fi

      - name: Stop isolated services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/mobile-command-next.pid ]; then
            kill "$(cat /tmp/mobile-command-next.pid)" 2>/dev/null || true
          fi
          supabase stop --no-backup || true
