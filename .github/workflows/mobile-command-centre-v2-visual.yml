name: Mobile Command Centre V2 Visual

on:
  push:
    branches:
      - build/mobile-command-centre-v2
    paths:
      - components/dashboard/MobileCommandCentreV2.tsx
      - components/dashboard/MobileCommandCentreV2.css
      - components/dashboard/DashboardResponsiveShell.tsx
      - tests/e2e/mobile-command-centre-v2.spec.ts
      - .github/workflows/mobile-command-centre-v2-visual.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mobile-command-centre-v2-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-preview-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HARBOURVIEW_PUBLIC_BASE_URL: https://harbourview-git-build-mobile-command-centre-v2-harbourview.vercel.app
      PLAYWRIGHT_BASE_URL: https://harbourview-git-build-mobile-command-centre-v2-harbourview.vercel.app
      EXPECTED_PREVIEW_SHA: e4955ccd197120b45b7a782e9d861cf67bc28d0a
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout verified branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: build/mobile-command-centre-v2
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for exact branch preview source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
              body="$(curl -sS -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" "${HARBOURVIEW_PUBLIC_BASE_URL}/login" || true)"
            else
              body="$(curl -sS "${HARBOURVIEW_PUBLIC_BASE_URL}/login" || true)"
            fi
            if printf '%s' "$body" | grep -q "$EXPECTED_PREVIEW_SHA"; then
              echo "Preview is ready at expected application SHA ${EXPECTED_PREVIEW_SHA}"
              exit 0
            fi
            echo "Attempt ${attempt}: preview is not yet serving ${EXPECTED_PREVIEW_SHA}"
            sleep 4
          done
          echo "Preview did not become ready at the expected application SHA"
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated five-width visual gate
        run: npx playwright test tests/e2e/mobile-command-centre-v2.spec.ts --project=chromium-desktop --workers=1 --retries=0

      - name: Upload mobile command visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-command-centre-v2-${{ github.run_id }}
          path: |
            artifacts/mobile-command-v2/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Record visual run on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          gh pr comment 1279 --body "Mobile Command Centre V2 authenticated visual run [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) completed with status **${JOB_RESULT}** against preview application SHA \`${EXPECTED_PREVIEW_SHA}\`. Artifact: \`mobile-command-centre-v2-${GITHUB_RUN_ID}\`."
