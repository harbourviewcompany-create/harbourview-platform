name: Temporary governance pin reconciliation

on:
  push:
    branches:
      - fix/governance-hardening-current-main-20260916

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Pin all known mutable external action refs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pins = {
              'actions/upload-artifact': '043fb46d1a93c77aae656e7c1c64a875d1fc6a0a',
              'supabase/setup-cli': '46f7f98c7f948ad727d22c1e67fab04c223a0520',
              'actions/cache': '55cc8345863c7cc4c66a329aec7e433d2d1c52a9',
              'actions/cache/save': '55cc8345863c7cc4c66a329aec7e433d2d1c52a9',
              'actions/cache/restore': '55cc8345863c7cc4c66a329aec7e433d2d1c52a9',
              'actions/github-script': '3a2844b7e9c422d3c10d287c895573f7108da1b3',
              'actions/setup-python': '5fda3b95a4ea91299a34e894583c3862153e4b97',
              'actions/checkout': '3d3c42e5aac5ba805825da76410c181273ba90b1',
              'actions/setup-node': '820762786026740c76f36085b0efc47a31fe5020',
              'github/codeql-action/upload-sarif': 'b96794f015dfd88f77b49b1c93e0fa7110f94c63',
              'denoland/setup-deno': '22d081ff2d3a40755e97629de92e3bcbfa7cf2ed',
              'peter-evans/create-pull-request': '5f6978faf089d4d20b00c7766989d076bb2fc7f1',
              'the-pr-agent/pr-agent': '8ac8f7aa9bb97ecf3aa050aac9f6462314206692',
          }
          sha = re.compile(r'^[0-9a-f]{40}$', re.I)
          changed = []
          unknown = []
          for path in Path('.github/workflows').glob('*.y*ml'):
              text = path.read_text()
              def repl(m):
                  owner = m.group(1)
                  ref = m.group(2)
                  if sha.fullmatch(ref):
                      return m.group(0)
                  if owner not in pins:
                      unknown.append(f'{path}:{owner}@{ref}')
                      return m.group(0)
                  changed.append(f'{path}:{owner}@{ref}->{pins[owner]}')
                  return f'uses: {owner}@{pins[owner]}'
              new = re.sub(r'^\s*(?:-\s*)?uses:\s*([^@\s]+)@([^\s#]+)', repl, text, flags=re.M)
              if new != text:
                  path.write_text(new)
          if unknown:
              print('ERROR: unknown mutable refs remain:')
              print('\n'.join(unknown))
              raise SystemExit(1)
          print(f'Pinned {len(changed)} mutable references')
          print('\n'.join(changed))
          PY

      - name: Verify fail-closed immutable workflow policy
        run: node scripts/check-immutable-workflow-actions.mjs

      - name: Commit reconciliation and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-governance-pin-current-main-20260916.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          if git diff --cached --quiet; then
            echo 'No governance changes required.'
            exit 0
          fi
          git commit -m 'fix(governance): pin remaining mutable workflow actions on current main'
          git push origin HEAD:"$GITHUB_REF_NAME"
