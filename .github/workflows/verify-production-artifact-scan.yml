name: Verify Production Artifact Scan

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Expected deployed commit SHA to record in evidence
        required: true
        default: 2ee3105e236122083d3fb86a16ca3c8811cce440
      deployment_id:
        description: Vercel deployment ID to record in evidence
        required: true
        default: FRHiKm5k7
      domains:
        description: Comma-separated production domains to scan
        required: true
        default: https://harbourview.vercel.app,https://harbourview-14bdr4iuk-harbourviewnetwork.vercel.app
      protected_domains:
        description: Comma-separated domains where 401/403 is expected because deployment protection is enabled
        required: true
        default: https://harbourview-14bdr4iuk-harbourviewnetwork.vercel.app
      max_discovered_routes:
        description: Maximum rendered internal page routes to add after source and seed routes
        required: true
        default: '120'
      fetch_timeout_ms:
        description: Per-request fetch timeout in milliseconds
        required: true
        default: '15000'
      extra_api_get_routes:
        description: Optional comma-separated extra public API GET routes to scan
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scan:
    name: Verification-only deployed artifact scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Run production artifact scan
        env:
          HARBOURVIEW_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          HARBOURVIEW_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          HARBOURVIEW_SCAN_DOMAINS: ${{ inputs.domains }}
          HARBOURVIEW_PROTECTED_DOMAINS: ${{ inputs.protected_domains }}
          HARBOURVIEW_SCAN_MAX_DISCOVERED_ROUTES: ${{ inputs.max_discovered_routes }}
          HARBOURVIEW_SCAN_FETCH_TIMEOUT_MS: ${{ inputs.fetch_timeout_ms }}
          HARBOURVIEW_EXTRA_API_GET_ROUTES: ${{ inputs.extra_api_get_routes }}
        run: node scripts/verify-production-artifact-scan.mjs

      - name: Upload production artifact scan evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harbourview-production-artifact-scan-${{ inputs.deployment_id }}-${{ github.run_id }}
          path: artifacts/production-artifact-scan/
          if-no-files-found: error
          retention-days: 30
