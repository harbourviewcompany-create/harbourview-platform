name: PR 1230 Temporary Lint Audit and E2E

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'lib/signals/feedbackScores.ts'
      - 'scripts/audit-edge-functions.js'
      - 'components/dashboard/MobileCommandCentre.tsx'
      - '.github/workflows/pr1230-temporary-lint-audit.yml'
      - '.github/workflows/temporary-pr1230-mobile-renderer-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-renderers:
    name: One-time structured renderer repair
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1230 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/pr1227-blockers
          fetch-depth: 0
      - name: Patch declared shapes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/dashboard/MobileCommandCentre.tsx')
          text = path.read_text()
          old_steps = '''      {jurisdictionPlaybook?.steps && jurisdictionPlaybook.steps.length > 0 && (
        <div className="hvm-signal-card hvm-signal-card--rich">
          <div className="hvm-kicker">MARKET ENTRY STEPS</div>
          {jurisdictionPlaybook.steps.slice(0, 5).map(s => (
            <div key={s.step} style={{ marginTop: s.step === 1 ? 4 : 10, paddingTop: s.step === 1 ? 0 : 10, borderTop: s.step === 1 ? 'none' : '1px solid rgba(245,240,232,.08)' }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: '#d4a84b' }}>Step {s.step}: {s.title}</div>
              <div style={{ fontSize: 12, color: 'rgba(245,240,232,.6)', marginTop: 3, lineHeight: 1.5 }}>{s.description}</div>
            </div>
          ))}
        </div>
      )}'''
          new_steps = '''      {jurisdictionPlaybook?.steps && jurisdictionPlaybook.steps.length > 0 && (
        <div className="hvm-signal-card hvm-signal-card--rich">
          <div className="hvm-kicker">MARKET ENTRY STEPS</div>
          {jurisdictionPlaybook.steps.slice(0, 5).map((step, index) => (
            <div key={`${index}-${step}`} style={{ marginTop: index === 0 ? 4 : 10, paddingTop: index === 0 ? 0 : 10, borderTop: index === 0 ? 'none' : '1px solid rgba(245,240,232,.08)' }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: '#d4a84b' }}>Step {index + 1}</div>
              <div style={{ fontSize: 12, color: 'rgba(245,240,232,.6)', marginTop: 3, lineHeight: 1.5 }}>{step}</div>
            </div>
          ))}
        </div>
      )}'''
          old_regulators = '''      {jurisdictionPlaybook?.key_regulators && jurisdictionPlaybook.key_regulators.length > 0 && (
        <div className="hvm-signal-card hvm-signal-card--rich">
          <div className="hvm-kicker">KEY REGULATORS</div>
          {jurisdictionPlaybook.key_regulators.map((r, i) => (
            <div key={r.name} style={{ marginTop: i === 0 ? 4 : 8, paddingTop: i === 0 ? 0 : 8, borderTop: i === 0 ? 'none' : '1px solid rgba(245,240,232,.08)' }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: 'rgba(245,240,232,.9)' }}>{r.name}</div>
              <div style={{ fontSize: 12, color: 'rgba(245,240,232,.5)', marginTop: 2 }}>{r.role}</div>
            </div>
          ))}
        </div>
      )}'''
          new_regulators = '''      {jurisdictionPlaybook?.key_regulators && (
        <div className="hvm-signal-card hvm-signal-card--rich">
          <div className="hvm-kicker">KEY REGULATORS</div>
          <div style={{ marginTop: 4 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: 'rgba(245,240,232,.9)' }}>{jurisdictionPlaybook.key_regulators.primary}</div>
          </div>
          {jurisdictionPlaybook.key_regulators.secondary.map((regulator, index) => (
            <div key={`${index}-${regulator}`} style={{ marginTop: 8, paddingTop: 8, borderTop: '1px solid rgba(245,240,232,.08)' }}>
              <div style={{ fontSize: 12, color: 'rgba(245,240,232,.6)', lineHeight: 1.5 }}>{regulator}</div>
            </div>
          ))}
        </div>
      )}'''
          if text.count(old_steps) != 1:
              raise SystemExit(f'Expected one stale steps block, found {text.count(old_steps)}')
          if text.count(old_regulators) != 1:
              raise SystemExit(f'Expected one stale regulator block, found {text.count(old_regulators)}')
          path.write_text(text.replace(old_steps, new_steps).replace(old_regulators, new_regulators))
          temporary = Path('.github/workflows/temporary-pr1230-mobile-renderer-repair.yml')
          if temporary.exists(): temporary.unlink()
          PY
      - name: Commit focused repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dashboard/MobileCommandCentre.tsx
          git add -u .github/workflows/temporary-pr1230-mobile-renderer-repair.yml || true
          git commit -m "fix: align mobile playbook renderers with declared types"
          git push origin repair/pr1227-blockers

  lint:
    name: Lint Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run ESLint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-node-${{ matrix.node }}.log
      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-node-${{ matrix.node }}
          path: lint-node-${{ matrix.node }}.log
          retention-days: 14

  audit:
    name: Production dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Full audit JSON
        run: npm audit --json > npm-audit.json || true
      - name: Production-only audit JSON
        run: npm audit --omit=dev --json > npm-audit-production.json || true
      - name: Require zero production vulnerabilities
        run: |
          node - <<'NODE'
          const report = require('./npm-audit-production.json')
          const vulnerabilities = report.metadata?.vulnerabilities ?? {}
          const total = Number(vulnerabilities.total ?? 0)
          console.log(JSON.stringify(vulnerabilities, null, 2))
          if (total !== 0) process.exit(1)
          NODE
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-reports
          path: |
            npm-audit.json
            npm-audit-production.json
          retention-days: 14

  e2e:
    name: Playwright Chromium local
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Chromium installation
        run: npx playwright install --list
      - name: Run Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-e2e
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14