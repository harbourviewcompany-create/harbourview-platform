name: PR 1323 Post-Merge Remediation

on:
  push:
    branches:
      - fix/pr1323-postmerge-small-country-retention
    paths:
      - '.github/workflows/pr1323-postmerge-remediation.yml'

permissions:
  contents: write

concurrency:
  group: pr1323-postmerge-remediation
  cancel-in-progress: false

jobs:
  verify-fix-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply source-area retention and unique alpha-2 identity gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/generate-natural-earth-countries.mjs')
          s = p.read_text()

          old = """const MIN_POLYGON_AREA_DEG2 = 0.008\nconst SKIP_ISO2 = new Set(['AQ'])\n"""
          new = """const MIN_POLYGON_AREA_DEG2 = 0.008\nconst SKIP_ISO2 = new Set(['AQ'])\n// Natural Earth ADM0_A3=IOA is the composite Australian Indian Ocean Territories\n// map unit. It carries sovereign alpha-2 AU, so exposing it as a country would\n// collide with Australia in Harbourview's alpha-2 keyed routing model.\nconst SKIP_ISO3 = new Set(['IOA'])\n"""
          if s.count(old) != 1:
              raise SystemExit(f'skip-set target count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = """  if (!iso2 || !iso3 || SKIP_ISO2.has(iso2)) return null\n\n  const polygons = normalizePolygons(feature.geometry, SIMPLIFY_TOLERANCE_DEG)\n  if (polygons.length === 0) return null\n"""
          new = """  if (!iso2 || !iso3 || SKIP_ISO2.has(iso2) || SKIP_ISO3.has(iso3)) return null\n\n  let polygons = normalizePolygons(feature.geometry, SIMPLIFY_TOLERANCE_DEG)\n  if (polygons.length === 0) {\n    const sourcePolygons = feature.geometry.type === 'Polygon'\n      ? [feature.geometry.coordinates]\n      : feature.geometry.coordinates\n    const hasSourceEligibleOuter = sourcePolygons.some((polygon) => {\n      const rawOuter = closeRing(polygon[0])\n      return rawOuter !== null && ringAreaDeg2(rawOuter) >= MIN_POLYGON_AREA_DEG2\n    })\n    if (hasSourceEligibleOuter) {\n      polygons = normalizePolygons(feature.geometry, 0)\n    }\n  }\n  if (polygons.length === 0) return null\n"""
          if s.count(old) != 1:
              raise SystemExit(f'transformFeature target count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = """  for (const feature of source.features ?? []) {\n    const country = transformFeature(feature)\n    if (country) countries.push(country)\n  }\n  countries.sort((a, b) => a.iso2.localeCompare(b.iso2))\n"""
          new = """  for (const feature of source.features ?? []) {\n    const country = transformFeature(feature)\n    if (country) countries.push(country)\n  }\n\n  const duplicateIso2 = [...countries.reduce((counts, country) => {\n    counts.set(country.iso2, (counts.get(country.iso2) ?? 0) + 1)\n    return counts\n  }, new Map())]\n    .filter(([, count]) => count > 1)\n    .map(([iso2]) => iso2)\n  if (duplicateIso2.length > 0) {\n    throw new Error(`Natural Earth output contains duplicate alpha-2 routing keys: ${duplicateIso2.join(', ')}`)\n  }\n\n  countries.sort((a, b) => a.iso2.localeCompare(b.iso2))\n"""
          if s.count(old) != 1:
              raise SystemExit(f'unique-alpha2 target count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Add small-country and alpha-2 uniqueness regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/harbourview/natural-earth-antimeridian-topology.test.ts')
          s = p.read_text()
          marker = "retains source-eligible countries without introducing duplicate alpha-2 routing keys"
          if marker not in s:
              s += """\n\ntest('retains source-eligible countries without introducing duplicate alpha-2 routing keys', () => {\n  const virginIslands = naturalEarthCountriesPayload.countries.find((country) => country.iso2 === 'VI')\n  assert.ok(virginIslands, 'regenerated Natural Earth payload must retain source-eligible VI')\n  assert.ok(virginIslands.polygons.length > 0, 'VI must retain renderable polygon geometry')\n\n  const iso2s = naturalEarthCountriesPayload.countries.map((country) => country.iso2)\n  assert.equal(new Set(iso2s).size, iso2s.length, 'generated country payload must keep alpha-2 routing keys unique')\n  assert.equal(\n    naturalEarthCountriesPayload.countries.some((country) => country.iso3 === 'IOA'),\n    false,\n    'composite Indian Ocean Territories map unit must not alias Australia on AU routing',\n  )\n}, 60_000)\n"""
          p.write_text(s)
          PY

      - name: Regenerate twice and prove Russia immutability
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          text = Path('data/globe/natural-earth-countries.ts').read_text()
          def block(text, iso2):
              m = re.search(rf"    \{{\n      iso2: '{iso2}',.*?(?=\n    \{{\n      iso2: '|\n  \],\n\}})", text, re.S)
              if not m: raise SystemExit(f'{iso2} payload block not found')
              return m.group(0)
          Path('/tmp/ru-before.sha').write_text(hashlib.sha256(block(text, 'RU').encode()).hexdigest())
          PY
          node scripts/generate-natural-earth-countries.mjs
          cp data/globe/natural-earth-countries.ts /tmp/run1.ts
          node scripts/generate-natural-earth-countries.mjs
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          def norm(s):
              return re.sub(r"generatedAt: ['\"][^'\"]+['\"]", "generatedAt: '<normalized>'", s)
          def block(text, iso2):
              m = re.search(rf"    \{{\n      iso2: '{iso2}',.*?(?=\n    \{{\n      iso2: '|\n  \],\n\}})", text, re.S)
              if not m: raise SystemExit(f'{iso2} payload block not found')
              return m.group(0)
          first_text = Path('/tmp/run1.ts').read_text()
          second_text = Path('data/globe/natural-earth-countries.ts').read_text()
          first = norm(first_text)
          second = norm(second_text)
          if first != second: raise SystemExit('normalized regenerations differ')
          if "iso2: 'VI'" not in second_text: raise SystemExit('VI missing after regeneration')
          if "iso3: 'IOA'" in second_text: raise SystemExit('IOA composite map unit survived alpha-2 identity gate')
          ru_before = Path('/tmp/ru-before.sha').read_text().strip()
          ru_after = hashlib.sha256(block(second_text, 'RU').encode()).hexdigest()
          if ru_after != ru_before:
              raise SystemExit(f'Russia payload drifted: before={ru_before} after={ru_after}')
          sha = hashlib.sha256(second.encode()).hexdigest()
          Path('/tmp/normalized.sha').write_text(sha)
          print('normalized_sha256=' + sha)
          print('ru_payload_sha256=' + ru_after)
          print('VI_present=True')
          print('IOA_present=False')
          PY

      - name: Targeted antimeridian topology
        run: npx vitest run tests/harbourview/natural-earth-antimeridian-topology.test.ts
      - name: Russia spherical regression
        run: npx vitest run tests/harbourview/russia-spherical-triangulation.test.ts
      - name: Globe rendering regression
        run: npx vitest run tests/globe-polygon-rendering.test.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full test matrix
        run: npm run test
      - name: Security and leakage
        run: npm run test:security
      - name: Production build
        run: npm run build

      - name: Record evidence and remove temporary workflows
        run: |
          SHA=$(cat /tmp/normalized.sha)
          {
            echo ''
            echo '## 2026-08-11 — PR #1323 post-merge small-country retention remediation'
            echo ''
            echo '- Feature-level fallback preserves source-eligible countries when normal simplification removes every polygon.'
            echo '- Regeneration retained U.S. Virgin Islands (VI), rejected composite IOA/AU routing-key collision, and preserved the pre-remediation Russia generated payload byte-for-byte.'
            echo "- Normalized regenerated-output SHA-256: \`${SHA}\`."
            echo '- PASS: deterministic two-run regeneration; Natural Earth antimeridian topology; Russia spherical regression; globe polygon rendering; lint; typecheck; full npm test matrix; security/leakage; production build.'
            echo '- Temporary PR #1323 verification/diagnostic workflows removed before the remediation commit.'
          } >> docs/control/EVIDENCE_LOG.md
          rm -f .github/workflows/pr1323-small-country-retention-probe.yml
          rm -f .github/workflows/pr1323-postmerge-remediation.yml
          rm -f .github/workflows/pr1323-country-universe-diagnostic.yml

      - name: Commit verified five-file remediation
        run: |
          git config user.name 'Harbourview Verification'
          git config user.email 'harbourviewcompany@gmail.com'
          git add -A
          git diff --cached --name-only
          COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
          if [ "$COUNT" != "5" ]; then
            echo "Expected exactly five final changed files relative to workflow checkout, found $COUNT"
            exit 1
          fi
          git commit -m 'fix(globe): preserve source-eligible small countries'
          git push origin HEAD:fix/pr1323-postmerge-small-country-retention
