name: PR 1323 Country Universe Diagnostic

on:
  push:
    branches:
      - fix/pr1323-postmerge-small-country-retention
    paths:
      - '.github/workflows/pr1323-country-universe-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact feature-level fallback and regenerate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/generate-natural-earth-countries.mjs')
          s = p.read_text()
          old = """  const polygons = normalizePolygons(feature.geometry, SIMPLIFY_TOLERANCE_DEG)\n  if (polygons.length === 0) return null\n"""
          new = """  let polygons = normalizePolygons(feature.geometry, SIMPLIFY_TOLERANCE_DEG)\n  if (polygons.length === 0) {\n    const sourcePolygons = feature.geometry.type === 'Polygon'\n      ? [feature.geometry.coordinates]\n      : feature.geometry.coordinates\n    const hasSourceEligibleOuter = sourcePolygons.some((polygon) => {\n      const rawOuter = closeRing(polygon[0])\n      return rawOuter !== null && ringAreaDeg2(rawOuter) >= MIN_POLYGON_AREA_DEG2\n    })\n    if (hasSourceEligibleOuter) {\n      polygons = normalizePolygons(feature.geometry, 0)\n    }\n  }\n  if (polygons.length === 0) return null\n"""
          if s.count(old) != 1:
              raise SystemExit(f'transformFeature target count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          node scripts/generate-natural-earth-countries.mjs
      - name: Print regenerated canonical/search universe differences
        run: |
          cat > country-diagnostic.ts <<'TS'
          import { countries } from './lib/dashboard/countries'
          import { countryOptions } from './config/globe/country-role-profiles'

          const counts = new Map<string, typeof countries>()
          for (const country of countries) {
            const list = counts.get(country.iso2) ?? []
            list.push(country)
            counts.set(country.iso2, list)
          }
          const duplicates = [...counts.entries()]
            .filter(([, rows]) => rows.length > 1)
            .map(([iso2, rows]) => ({ iso2, rows: rows.map((row) => ({ slug: row.slug, name: row.displayName, iso3: row.iso3 })) }))
          const optionKeys = new Set(countryOptions.map((country) => `${country.iso2}|${country.name}`))
          const missingRows = countries
            .filter((country) => !optionKeys.has(`${country.iso2}|${country.displayName}`))
            .map((country) => ({ iso2: country.iso2, iso3: country.iso3, slug: country.slug, name: country.displayName }))
          const canonicalIso2s = new Set(countries.map((country) => country.iso2))
          const optionIso2s = new Set(countryOptions.map((country) => country.iso2))
          console.log(JSON.stringify({
            countriesLength: countries.length,
            countryOptionsLength: countryOptions.length,
            uniqueCanonicalIso2Count: canonicalIso2s.size,
            uniqueOptionIso2Count: optionIso2s.size,
            duplicates,
            missingRows,
            missingIso2s: [...canonicalIso2s].filter((iso2) => !optionIso2s.has(iso2)),
          }, null, 2))
          TS
          npx tsx country-diagnostic.ts
          rm country-diagnostic.ts
