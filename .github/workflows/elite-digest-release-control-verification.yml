name: Elite Digest Release Control Verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/migration-drift-check.yml'
      - '.github/workflows/supabase-migrate.yml'
      - '.github/workflows/elite-digest-release-control-verification.yml'
      - 'scripts/migration-ledger-manifest.mjs'
      - 'tests/scripts/migration-ledger-manifest.test.mjs'
      - 'tests/sql/elite_digest_production_preflight_read_only.sql'
      - 'tests/sql/elite_digest_production_postflight_read_only.sql'
      - 'supabase/release-controls/elite-digest-production-activation.json'
      - 'docs/ops/ELITE_DIGEST_DEPLOY.md'
      - 'docs/control/ELITE_DIGEST_RELEASE_CONTROL.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify parser and fail-closed release manifest
        run: node --test tests/scripts/migration-ledger-manifest.test.mjs

      - name: Verify ordered Elite Digest migration sequence
        run: node scripts/check-elite-digest-migration-versions.mjs

      - name: Verify workflow control contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/supabase-migrate.yml').read_text()
          required = [
              'workflow_dispatch:',
              'APPLY_PRODUCTION_MIGRATIONS',
              'activation-preflight',
              'activation-postflight',
              'elite-digest-production-activation.json',
              'elite_digest_production_preflight_read_only.sql',
              'elite_digest_production_postflight_read_only.sql',
          ]
          missing = [value for value in required if value not in workflow]
          forbidden = [
              'git push origin HEAD:main',
              'auto-reconcile',
              'contents: write',
          ]
          present = [value for value in forbidden if value in workflow]
          if missing or present:
              raise SystemExit(f'missing={missing}; forbidden_present={present}')
          print('Manual, read-only-evidence-first, fail-closed workflow contract verified.')
          PY

      - name: Verify production SQL packet gates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          preflight = Path('tests/sql/elite_digest_production_preflight_read_only.sql').read_text()
          postflight = Path('tests/sql/elite_digest_production_postflight_read_only.sql').read_text()
          required_preflight = [
              'first_six_applied_exactly',
              'm.name is not distinct from e.expected_name',
              'approved_three_unapplied',
              'begin transaction read only',
          ]
          required_postflight = [
              'approved_three_applied_exactly',
              'feedback_rls_enabled',
              'anon_direct_table_denied',
              'authenticated_direct_table_denied',
              'begin transaction read only',
          ]
          missing = [
              value for value in required_preflight if value not in preflight
          ] + [
              value for value in required_postflight if value not in postflight
          ]
          if missing:
              raise SystemExit(f'missing production SQL packet gates: {missing}')
          print('Exact ledger-name, read-only, RLS, and direct-table packet gates verified.')
          PY

      - name: Existing HNSW and feedback RPC PostgreSQL fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/elite_digest_forward_repair_dry_run.sql

      - name: Existing RPC boundary PostgreSQL 17 fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/elite_digest_boundary_hardening_dry_run.sql

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Full tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Public boundary checks
        run: |
          npm run test:visibility
          npm run test:security
