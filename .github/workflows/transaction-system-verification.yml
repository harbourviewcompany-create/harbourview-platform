name: Transaction System Verification

on:
  push:
    branches:
      - feat/native-transaction-system-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harbourview_transaction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TRANSACTION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/harbourview_transaction_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/native-transaction-system-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Append required transaction control records
        run: node scripts/append-transaction-control-docs.mjs

      - name: Commit required transaction control records
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/control/DATABASE_CONTROL.md docs/control/EVIDENCE_LOG.md; then
            echo 'Required control records already present.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/control/DATABASE_CONTROL.md docs/control/EVIDENCE_LOG.md
            git commit -m 'docs(transactions): record database control and evidence baseline'
            git push origin HEAD:feat/native-transaction-system-foundation
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Transaction migration static contract
        run: node scripts/verify-transaction-system.mjs

      - name: Execute staged migrations in disposable PostgreSQL
        run: |
          psql "$TRANSACTION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/transactions/fixtures/preexisting-schema.sql
          for migration in \
            supabase/migrations/20260811010000_transaction_identity_foundation.sql \
            supabase/migrations/20260811011000_transaction_product_account_foundation.sql \
            supabase/migrations/20260811012000_transaction_core_foundation.sql \
            supabase/migrations/20260811013000_transaction_assertion_diligence_foundation.sql \
            supabase/migrations/20260811014000_transaction_economics_decisions_foundation.sql \
            supabase/migrations/20260811015000_transaction_rls_views_import_staging.sql \
            supabase/migrations/20260811015100_transaction_boundary_hardening.sql
          do
            echo "Applying $migration"
            psql "$TRANSACTION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$TRANSACTION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/transactions/fixtures/verify-applied-schema.sql

      - name: Transaction schema RLS double-counting and leakage tests
        run: npx vitest run tests/transactions

      - name: Existing public visibility regression
        run: npm run test:visibility

      - name: Existing services public leakage regression
        run: npm run test:services-public-leakage

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verification summary
        if: always()
        run: |
          echo "Transaction migrations executed only against the disposable GitHub Actions PostgreSQL service."
          echo "No Supabase production or development project was mutated."
          echo "No workbook fixture was imported."
          echo "No Vercel or production deployment step exists in this workflow."
