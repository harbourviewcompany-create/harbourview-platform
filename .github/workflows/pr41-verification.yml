name: PR41 Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_ref:
        description: 'Commit or branch to verify'
        required: true
        default: '5be74a6e08ee7e3c4a841afdbe3863f2eaa63a0c'

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip pr41 verification]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERIFY_REF: ${{ github.event.inputs.verify_ref || '5be74a6e08ee7e3c4a841afdbe3863f2eaa63a0c' }}
      RESULT_BRANCH: verify/pr41-supabase-smoke
      HARBOURVIEW_PUBLIC_BASE_URL: https://harbourview-platform.vercel.app
      HARBOURVIEW_SMOKE_BASE_URL: http://127.0.0.1:3000
      HARBOURVIEW_SMOKE_WRITE: '1'
      HARBOURVIEW_SMOKE_CLEANUP: '1'
      HARBOURVIEW_ALLOW_PRODUCTION_SMOKE_WRITES: '1'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://zvxdgdkukjrrwamdpqrg.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HARBOURVIEW_ADMIN_REVIEW_ENABLED: 'true'
    steps:
      - name: Check out requested verification ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFY_REF }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run PR41 verification and capture logs
        id: verify_result
        continue-on-error: true
        run: |
          set +e
          mkdir -p verification/proofs smoke-results
          : > pr41-verification.log
          run_step() {
            name="$1"
            shift
            echo "===== ${name} =====" | tee -a pr41-verification.log
            "$@" >> pr41-verification.log 2>&1
            code=$?
            echo "===== ${name} exit ${code} =====" | tee -a pr41-verification.log
            return $code
          }

          npm_ci=0
          typecheck=0
          admin_guard=0
          production_visibility=0
          playwright_install=0
          app_start=0
          anonymous_admin=0
          browser_smoke=0

          run_step "npm ci" npm ci; npm_ci=$?
          run_step "npm run typecheck" npm run typecheck; typecheck=$?
          run_step "npm run test:admin-guard" npm run test:admin-guard; admin_guard=$?
          run_step "HARBOURVIEW_PUBLIC_BASE_URL=https://harbourview-platform.vercel.app npm run probe:production-visibility" npm run probe:production-visibility; production_visibility=$?
          run_step "npx --yes playwright@1.56.1 install --with-deps chromium" npx --yes playwright@1.56.1 install --with-deps chromium; playwright_install=$?

          echo "===== start local app =====" | tee -a pr41-verification.log
          npm run dev -- --hostname 127.0.0.1 --port 3000 >> next-pr41-smoke.log 2>&1 &
          echo $! > next-pr41-smoke.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/marketplace >> pr41-verification.log 2>&1; then
              echo "local app ready" | tee -a pr41-verification.log
              app_start=0
              break
            fi
            sleep 2
            app_start=1
          done
          if [ "$app_start" -ne 0 ]; then
            cat next-pr41-smoke.log >> pr41-verification.log
          fi
          echo "===== start local app exit ${app_start} =====" | tee -a pr41-verification.log

          echo "===== anonymous admin denial =====" | tee -a pr41-verification.log
          admin_status=$(curl -sS -o anonymous-admin.html -w '%{http_code}' http://127.0.0.1:3000/admin || true)
          if [ "$admin_status" = "404" ] && ! grep -q "Harbourview internal" anonymous-admin.html; then
            echo "anonymous /admin denied without admin string leakage: ${admin_status}" | tee -a pr41-verification.log
            anonymous_admin=0
          else
            echo "anonymous /admin denial failed: ${admin_status}" | tee -a pr41-verification.log
            cat anonymous-admin.html >> pr41-verification.log
            anonymous_admin=1
          fi
          echo "===== anonymous admin denial exit ${anonymous_admin} =====" | tee -a pr41-verification.log

          run_step "npm run smoke:marketplace:browser" npm run smoke:marketplace:browser; browser_smoke=$?

          log_b64=$(base64 -w 0 pr41-verification.log)
          next_log_b64=$(base64 -w 0 next-pr41-smoke.log 2>/dev/null || true)
          status="passed"
          for code in "$npm_ci" "$typecheck" "$admin_guard" "$production_visibility" "$playwright_install" "$app_start" "$anonymous_admin" "$browser_smoke"; do
            if [ "$code" -ne 0 ]; then
              status="failed"
            fi
          done
          cat > verification/proofs/pr41-main-verification-result.json <<EOF
          {
            "status": "${status}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "workflow_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "source_branch": "${GITHUB_REF_NAME}",
            "verified_ref": "${VERIFY_REF}",
            "checked_commit": "$(git rev-parse HEAD)",
            "base_url": "http://127.0.0.1:3000",
            "production_visibility_url": "https://harbourview-platform.vercel.app",
            "exit_codes": {
              "npm_ci": ${npm_ci},
              "typecheck": ${typecheck},
              "test_admin_guard": ${admin_guard},
              "production_visibility_probe": ${production_visibility},
              "playwright_install": ${playwright_install},
              "local_app_start": ${app_start},
              "anonymous_admin_denial": ${anonymous_admin},
              "marketplace_browser_smoke": ${browser_smoke}
            },
            "log_base64": "${log_b64}",
            "next_log_base64": "${next_log_b64}"
          }
          EOF
          cp verification/proofs/pr41-main-verification-result.json smoke-results/marketplace-browser-smoke-latest.json
          cat pr41-verification.log
          if [ "${status}" = "passed" ]; then exit 0; fi
          exit 1

      - name: Persist verification result to result branch
        if: always()
        run: |
          cp verification/proofs/pr41-main-verification-result.json /tmp/pr41-main-verification-result.json 2>/dev/null || true
          cp smoke-results/marketplace-browser-smoke-latest.json /tmp/marketplace-browser-smoke-latest.json 2>/dev/null || true
          git fetch origin "${RESULT_BRANCH}:${RESULT_BRANCH}" || true
          git checkout "${RESULT_BRANCH}" || git checkout -b "${RESULT_BRANCH}"
          mkdir -p verification/proofs smoke-results
          cp /tmp/pr41-main-verification-result.json verification/proofs/pr41-main-verification-result.json 2>/dev/null || true
          cp /tmp/marketplace-browser-smoke-latest.json smoke-results/marketplace-browser-smoke-latest.json 2>/dev/null || true
          git config user.name "harbourview-verification-bot"
          git config user.email "harbourviewcompany@gmail.com"
          git add verification/proofs/pr41-main-verification-result.json smoke-results/marketplace-browser-smoke-latest.json
          git commit -m "Record PR41 main verification result [skip smoke] [skip pr41 verification]" || true
          git push origin "HEAD:${RESULT_BRANCH}"

      - name: Fail workflow if verification failed
        if: ${{ steps.verify_result.outcome != 'success' }}
        run: exit 1
