name: PR 1323 VI Regression Fix

on:
  push:
    branches:
      - fix/globe-antimeridian-generator-hardening
    paths:
      - '.github/workflows/pr1323-vi-regression-fix.yml'

permissions:
  contents: write

jobs:
  fix-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply proven VI preservation fix and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/generate-natural-earth-countries.mjs')
          s = p.read_text()
          old = """    const simplifiedOuters = outerCandidates.filter((outer) => ringAreaDeg2(outer) >= MIN_POLYGON_AREA_DEG2)\n    const discardedOuters = outerCandidates.filter((outer) => ringAreaDeg2(outer) < MIN_POLYGON_AREA_DEG2)\n\n    if (simplifiedOuters.length === 0) continue\n"""
          new = """    const areaEligibleOuters = outerCandidates.filter((outer) => ringAreaDeg2(outer) >= MIN_POLYGON_AREA_DEG2)\n    const sourceEligibleFallback = areaEligibleOuters.length === 0\n      && outerCandidates.length === 1\n      && ringAreaDeg2(rawOuter) >= MIN_POLYGON_AREA_DEG2\n      ? outerCandidates[0]\n      : null\n    const simplifiedOuters = sourceEligibleFallback ? [sourceEligibleFallback] : areaEligibleOuters\n    const discardedOuters = outerCandidates.filter((outer) => !simplifiedOuters.includes(outer))\n\n    if (simplifiedOuters.length === 0) continue\n"""
          if old not in s and new not in s:
              raise SystemExit('VI preservation target not found')
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/harbourview/natural-earth-antimeridian-topology.test.ts')
          s = p.read_text()
          marker = "retains source-eligible small countries after simplification"
          if marker not in s:
              s += """\n\ntest('retains source-eligible small countries after simplification', () => {\n  const virginIslands = naturalEarthCountriesPayload.countries.find((country) => country.iso2 === 'VI')\n  assert.ok(virginIslands, 'expected regenerated Natural Earth payload to retain VI')\n  assert.ok(virginIslands.polygons.length > 0, 'expected VI to retain renderable polygon geometry')\n}, 60_000)\n"""
          p.write_text(s)
          PY
      - name: Regenerate Natural Earth payload
        run: node scripts/generate-natural-earth-countries.mjs
      - name: Verify VI retained and normalized regeneration reproducible
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess
          def norm(text):
              return re.sub(r"generatedAt: ['\"][^'\"]+['\"]", "generatedAt: '<normalized>'", text)
          first = norm(Path('data/globe/natural-earth-countries.ts').read_text())
          if "iso2: 'VI'" not in first:
              raise SystemExit('VI missing after regeneration')
          sha1 = hashlib.sha256(first.encode()).hexdigest()
          subprocess.run(['node','scripts/generate-natural-earth-countries.mjs'], check=True)
          second = norm(Path('data/globe/natural-earth-countries.ts').read_text())
          sha2 = hashlib.sha256(second.encode()).hexdigest()
          if first != second:
              raise SystemExit('normalized regenerations differ')
          print(f'normalized_sha256={sha1}')
          print(f'second_normalized_sha256={sha2}')
          PY
      - name: Topology regression
        run: npx vitest run tests/harbourview/natural-earth-antimeridian-topology.test.ts
      - name: Russia spherical regression
        run: npx vitest run tests/harbourview/russia-spherical-triangulation.test.ts
      - name: Globe polygon rendering regression
        run: npx vitest run tests/globe-polygon-rendering.test.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full tests
        run: npm run test
      - name: Canonical security and leakage gate
        run: npm run test:security
      - name: Build
        run: npm run build
      - name: Commit verified fix and remove temporary harness
        run: |
          git rm .github/workflows/pr1323-vi-regression-fix.yml
          git config user.name 'Harbourview Release Bot'
          git config user.email 'harbourviewcompany@gmail.com'
          git add scripts/generate-natural-earth-countries.mjs data/globe/natural-earth-countries.ts tests/harbourview/natural-earth-antimeridian-topology.test.ts
          git commit -m 'fix(globe): preserve source-eligible small countries'
          git push origin HEAD:fix/globe-antimeridian-generator-hardening
