name: Open PR Repair Runner

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/open-pr-repair-runner.yml'
      - 'scripts/open-pr-repair/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  finalize-pr1233:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1241
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/open-pr-repair-runner
      - name: Add final database-adjacent gates to PR 1233
        run: bash scripts/open-pr-repair/finalize-pr1233-db-gates.sh
