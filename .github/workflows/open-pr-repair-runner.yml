name: Open PR Repair Runner

on:
  push:
    branches:
      - agent/open-pr-repair-runner
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create full repository bundle
        run: git bundle create harbourview-platform.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: harbourview-platform-git-bundle
          path: harbourview-platform.bundle
          retention-days: 1
