name: Open PR Repair Runner

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/open-pr-repair-runner.yml'
      - 'scripts/open-pr-repair/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  build-routing-forward-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1241
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/open-pr-repair-runner
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and validate regional routing forward fix
        run: |
          python3 scripts/open-pr-repair/fix-routing-generator-shape.py
          cp scripts/open-pr-repair/build-routing-regional-forward-fix.sh /tmp/build-routing-forward-fix.sh
          git restore scripts/open-pr-repair/build-routing-regional-forward-fix.sh
          bash /tmp/build-routing-forward-fix.sh
