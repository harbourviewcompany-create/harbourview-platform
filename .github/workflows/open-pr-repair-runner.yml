name: Open PR Repair Runner

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/open-pr-repair-runner.yml'
      - 'scripts/open-pr-repair/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  repair-pr1224-followup:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1241
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/open-pr-repair-runner
      - name: Apply reviewed PR 1224 collision follow-up
        run: bash scripts/open-pr-repair/fix-pr1224-followup.sh
