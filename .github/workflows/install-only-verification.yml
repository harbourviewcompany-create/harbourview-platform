name: Install Only Verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/install-only-verification.yml
      - docs/control/NPM_INSTALL_ENVIRONMENT_HOLD.md

permissions:
  contents: write

jobs:
  npm-ci:
    name: npm ci install-only check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/production-market-entry-os-20260912-final2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Show npm environment
        shell: bash
        run: |
          node --version
          npm --version
          npm config get registry

      - name: Regenerate registry lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit registry-generated lockfile
        shell: bash
        run: |
          git config user.name harbourview-lockfile-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current.'
          else
            git add package-lock.json
            git commit -m 'ci: regenerate package lockfile [lockfile-bot]'
            git push origin HEAD:feat/production-market-entry-os-20260912-final2
          fi

      - name: Install dependencies
        shell: bash
        run: npm ci --verbose

      - name: Upload npm debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npm-install-debug-logs
          path: |
            ~/.npm/_logs/*.log
          if-no-files-found: warn
