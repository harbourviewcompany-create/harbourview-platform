name: Install Only Verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/install-only-verification.yml
      - docs/control/NPM_INSTALL_ENVIRONMENT_HOLD.md

permissions:
  contents: write

jobs:
  npm-ci:
    name: npm ci install-only check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Generate registry lockfile
        shell: bash
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git add package-lock.json
          git commit -m "chore: regenerate npm lockfile from registry"
          git push
