name: Signal Engine Runtime Verification

on:
  workflow_dispatch:
  push:
    branches:
      - verify/signal-engine-runtime-matrix
    paths:
      - .github/workflows/signal-engine-runtime-verification.yml
      - scripts/verify-signal-engine-runtime.mjs
      - package.json
      - package-lock.json
      - docs/control/SIGNAL_ENGINE_RUNTIME_VERIFICATION_PR.md

permissions:
  contents: read

env:
  HARBOURVIEW_PUBLIC_BASE_URL: https://harbourview.vercel.app
  NEXT_PUBLIC_SUPABASE_URL: https://zvxdgdkukjrrwamdpqrg.supabase.co
  HV_SIGNAL_RUNTIME_VERIFY: "1"

jobs:
  signal-engine-runtime-verification:
    name: Run Signal Engine runtime verifier
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright no-save
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Check required production secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY or NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Run Signal Engine runtime verification
        env:
          HV_SIGNAL_VERIFY_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          HV_SIGNAL_VERIFY_TOKEN_CONFIRM: ${{ github.run_id }}-${{ github.run_attempt }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HV_SIGNAL_VERIFY_OUTPUT: docs/control/evidence/signal-engine-runtime-verification.latest.json
        run: npm run test:signal-engine-runtime -- --token="$HV_SIGNAL_VERIFY_TOKEN"

      - name: Upload Signal Engine runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-engine-runtime-verification-proof
          path: docs/control/evidence/signal-engine-runtime-verification.latest.json
          if-no-files-found: warn
