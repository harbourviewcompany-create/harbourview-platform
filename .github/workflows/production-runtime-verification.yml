name: Harbourview Production Runtime Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  production-runtime-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HARBOURVIEW_PUBLIC_BASE_URL: https://harbourview.vercel.app
      HARBOURVIEW_PRODUCTION_VERIFY_OUT: artifacts/production-runtime-verification
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production runtime verification
        run: node scripts/production-runtime-verification.mjs

      - name: Upload runtime verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harbourview-production-runtime-verification
          path: artifacts/production-runtime-verification
          if-no-files-found: error

      - name: Post report as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "artifacts/production-runtime-verification/report.md" ]; then
            BODY=$(cat artifacts/production-runtime-verification/report.md)
            HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -d "$(jq -n --arg body "$BODY" '{body: $body}')")
            echo "HTTP status: $HTTP_CODE"
            cat /tmp/response.json
            if [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Failed to post commit comment (HTTP $HTTP_CODE)"
              exit 1
            fi
          else
            echo "::error::No report.md found"
            exit 1
          fi
