name: Harbourview Production Runtime Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-runtime-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HARBOURVIEW_PUBLIC_BASE_URL: https://harbourview.vercel.app
      HARBOURVIEW_PRODUCTION_VERIFY_OUT: artifacts/production-runtime-verification
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production runtime verification
        run: node scripts/production-runtime-verification.mjs

      - name: Upload runtime verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: harbourview-production-runtime-verification
          path: artifacts/production-runtime-verification
          if-no-files-found: error
