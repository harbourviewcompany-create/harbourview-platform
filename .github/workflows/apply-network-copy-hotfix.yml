name: Apply Network Copy Hotfix

on:
  push:
    branches: [hotfix/restore-harbourview-network-public-copy]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/restore-harbourview-network-public-copy
      - name: Patch public copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          files = [
            'app/page.tsx','app/marketplace/page.tsx','app/marketplace/listings/page.tsx',
            'app/marketplace/consumables/page.tsx','app/marketplace/wanted/page.tsx','app/marketplace/sell/page.tsx',
            'app/intake/page.tsx','components/Nav.tsx','components/Footer.tsx','components/ListingCard.tsx',
            'components/marketplace/InquiryForm.tsx'
          ]
          pairs = [
            ('Harbourview Marketplace','Harbourview Network'),
            ('Marketplace Opportunities','Network Opportunities'),
            ('Marketplace opportunities','Network opportunities'),
            ('Marketplace categories','Network categories'),
            ('Marketplace Categories','Network categories'),
            ('Browse Marketplace','Browse Network'),
            ('Explore Marketplace','Explore Network'),
            ('Enter Marketplace','Enter Network'),
            ('How the marketplace works','How the network works'),
            ('Buyers browse Marketplace categories','Buyers browse Network categories'),
            ('actively monitoring the Marketplace','actively monitoring the Network'),
            ('assessed before reaching the Marketplace','assessed before reaching the Network'),
            ('through Harbourview Marketplace','through Harbourview Network'),
            ('A controlled commercial marketplace for regulated products, inputs, services and market-specific opportunities.','A controlled commercial network for regulated cannabis products, inputs, genetics, services and market-specific opportunities.'),
            ('Harbourview Marketplace is a controlled commercial marketplace for regulated products, inputs, services and market-specific opportunities.','Harbourview Network is a controlled commercial network for regulated cannabis products, inputs, genetics, services and market-specific opportunities.'),
            ('Commercial listings, supplier leads and surplus opportunities.','Network opportunities, supplier leads and surplus supply.'),
            ('Marketplace sections represented','Network categories represented'),
            ('Initial listing candidates','Initial Network opportunities'),
            ('Harbourview-reviewed marketplace candidates','Harbourview-reviewed Network opportunities'),
            ('Professional Marketplace','Harbourview Network'),
            ('B2B cannabis industry marketplace','controlled commercial cannabis network'),
            ('B2B listings for the regulated cannabis industry','Network opportunities for regulated cannabis operators'),
            ('A professional marketplace for the regulated cannabis industry','A controlled commercial network for regulated cannabis operators'),
            ('Post a Wanted Request','Post What You Want to Buy'),
            ('Post Wanted Request','Post What You Want to Buy'),
            ('Request Supply Information','Inquire to Buy'),
            ('Submit Supply','Submit Opportunity')
          ]
          for f in files:
            p = Path(f)
            if not p.exists(): continue
            s = p.read_text()
            s = s.replace("title: 'Marketplace',", "title: 'Network | Harbourview',")
            s = s.replace("{ label: 'Marketplace', href: '/marketplace', hasDropdown: true },", "{ label: 'Network', href: '/marketplace', hasDropdown: true },")
            s = s.replace("{ label: 'Marketplace', href: '/marketplace' },", "{ label: 'Network', href: '/marketplace' },")
            s = s.replace('>Marketplace</Link>', '>Network</Link>')
            s = s.replace('<p className="text-white font-semibold text-sm mb-3">Marketplace</p>', '<p className="text-white font-semibold text-sm mb-3">Network</p>')
            s = s.replace('{/* Marketplace */}', '{/* Network */}')
            for a,b in pairs: s = s.replace(a,b)
            if f == 'app/marketplace/page.tsx':
              s = re.sub(r"\n  \{\n    label: 'Supplier Directory',\n    href: '/supplier-directory',\n    description: '[^']*',\n  \},", '', s)
            if f == 'app/page.tsx' and 'Harbourview Network' not in s:
              sec = '''\n      <section className="bg-navy text-white py-20">\n        <div className="page-container max-w-3xl">\n          <h2 className="text-xs font-semibold uppercase tracking-widest text-gold mb-4">Harbourview Network</h2>\n          <h3 className="text-2xl sm:text-3xl font-bold mb-5">A controlled commercial network for regulated cannabis products, inputs, genetics, services and market-specific opportunities.</h3>\n          <p className="text-gray-300 leading-relaxed mb-8">Harbourview Network covers reviewed supply, buyer demand, commercial opportunities and market-specific pathways. Contact details are not public. Harbourview reviews inquiries before coordinating introductions or transaction follow-up.</p>\n          <Link href="/marketplace" className="btn-primary px-8 py-3 text-base">Enter Network</Link>\n        </div>\n      </section>\n'''
              s = s.replace('      <section className="py-20 bg-white">', sec + '\n      <section className="py-20 bg-white">', 1)
            p.write_text(s)
          Path('scripts/test-public-copy.mjs').write_text("""import { readFileSync } from 'node:fs'\n\nconst publicFiles = [\n  'app/page.tsx',\n  'app/marketplace/page.tsx',\n  'app/marketplace/listings/page.tsx',\n  'app/marketplace/consumables/page.tsx',\n  'app/marketplace/wanted/page.tsx',\n  'app/marketplace/sell/page.tsx',\n  'app/intake/page.tsx',\n  'components/Nav.tsx',\n  'components/Footer.tsx',\n  'components/ListingCard.tsx',\n  'components/marketplace/InquiryForm.tsx',\n]\n\nconst disallowed = [\n  'Harbourview Marketplace',\n  'Marketplace categories',\n  'Marketplace Categories',\n  'Browse Marketplace',\n  'Marketplace Opportunities',\n  'B2B cannabis industry marketplace',\n  'Professional Marketplace',\n  'A professional marketplace for the regulated cannabis industry',\n  'B2B listings for the regulated cannabis industry',\n  'Submit Supply',\n  'Post Wanted Request',\n  'Post a Wanted Request',\n  'Request Supply Information',\n]\n\nconst supplierDirectoryRestrictedFiles = new Set([\n  'app/page.tsx',\n  'app/marketplace/page.tsx',\n  'components/Nav.tsx',\n  'components/Footer.tsx',\n])\n\nconst hits = []\nfor (const file of publicFiles) {\n  const body = readFileSync(file, 'utf8')\n  for (const term of disallowed) {\n    if (body.includes(term)) hits.push(`${file}: ${term}`)\n  }\n  if (supplierDirectoryRestrictedFiles.has(file) && body.includes('Supplier Directory')) hits.push(`${file}: Supplier Directory`)\n}\n\nif (hits.length > 0) {\n  console.error('public copy regression detected')\n  for (const hit of hits) console.error(`- ${hit}`)\n  process.exit(1)\n}\n\nconsole.log(`ok public copy: ${publicFiles.length} public files passed Network terminology checks`)\n""")
          Path('.github/workflows/apply-network-copy-hotfix.yml').unlink()
          PY
      - name: Verify
        run: |
          npm ci
          node scripts/test-public-copy.mjs
          npm run typecheck
          npm run build
          npm run test:visibility
          npm run test:listing-quality
          npm run smoke:marketplace
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git status --short
          git add -A
          git commit -m "Restore Harbourview Network public copy"
          git push origin hotfix/restore-harbourview-network-public-copy
