name: Temporary Migration Provenance Scan

on:
  push:
    branches:
      - fix/postmerge-production-visual-runner-20260812

permissions:
  contents: read

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/postmerge-production-visual-runner-20260812
          fetch-depth: 0
      - run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
      - name: Trace attestation history
        run: |
          mkdir -p artifacts/migration-provenance
          {
            echo '## refs containing 1967d234'
            git branch -r --contains 1967d234151f45d67ad90d1a26838fdc9b5a4ed2 || true
            echo '## descendant commits touching migration controls'
            git log --all --format='%H|%aI|%an|%s' -- scripts/migration-ledger-manifest.mjs .github/workflows/migration-drift-check.yml supabase/release-controls/historical-remote-migration-attestations.json | head -100
            echo '## refs where attestation is ancestor'
            for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin); do
              if git merge-base --is-ancestor 1967d234151f45d67ad90d1a26838fdc9b5a4ed2 "$ref" 2>/dev/null; then echo "$ref $(git rev-parse $ref)"; fi
            done
          } | tee artifacts/migration-provenance/attestation-trace.txt
      - uses: actions/upload-artifact@v4
        with:
          name: migration-attestation-trace
          path: artifacts/migration-provenance/attestation-trace.txt
