name: Stage Production Candidate

# Runs on push to the staging branch when the workflow itself or any migration
# changes, and on manual dispatch. If a push lands without producing a run, the
# pushing credential is one whose pushes do not create workflow runs -- start it
# from the Actions tab instead.
on:
  push:
    branches:
      - stage/pr1280-production-ready-20260805
    paths:
      - .github/workflows/stage-production-candidate.yml
      - supabase/migrations/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-pr1280-production-candidate
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      HARBOURVIEW_LOCAL_TEST_BUILD: '1'
      NEXT_PUBLIC_HARBOURVIEW_LOCAL_TEST_BUILD: '1'
      HARBOURVIEW_ALLOW_LOCAL_SUPABASE: '1'
      NEXT_PUBLIC_HARBOURVIEW_ALLOW_LOCAL_SUPABASE: '1'
      NEXT_PUBLIC_HARBOURVIEW_CI_RUN_ID: ${{ github.run_id }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: '2.111.0'

      - name: Restore immutable repair sources and assemble candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/harbourviewcompany-create/harbourview-platform/5f0da6d3d5244b3fa6fc3a5f981831d52b75e65d/.github/workflows/repair-production-readiness.yml -o .github/workflows/repair-production-readiness.yml
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/harbourviewcompany-create/harbourview-platform/0f35bf5f9d73ed38446076cbd46f81c4a90cd843/.github/workflows/repair-production-readiness-v2.yml -o .github/workflows/repair-production-readiness-v2.yml
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/harbourviewcompany-create/harbourview-platform/cab35f9f1d343066b5c1a6d3b9f4150bc151edd4/.github/workflows/repair-production-readiness-v3.yml -o .github/workflows/repair-production-readiness-v3.yml
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/harbourviewcompany-create/harbourview-platform/23af0e37ac7470672656a60335424eda84c2b678/.github/workflows/repair-production-readiness-v4.yml -o .github/workflows/repair-production-readiness-v4.yml
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/harbourviewcompany-create/harbourview-platform/7077adb90093f0665adfc6a3e7de158581d784e8/scripts/tmp_production_readiness_repair.py -o /tmp/production_readiness_repair.py
          python /tmp/production_readiness_repair.py
          python - <<'PY'
          from pathlib import Path

          advisory = Path('supabase/migrations/20260708214318_fix_auth_rls_initplan_scalar_subquery_v2.sql')
          advisory_text = advisory.read_text()
          old_block = '''DROP POLICY IF EXISTS "schema_drift_alerts_admin_only" ON public."schema_drift_alerts";
          CREATE POLICY "schema_drift_alerts_admin_only" ON public."schema_drift_alerts"
            AS PERMISSIVE
            FOR ALL
            TO PUBLIC
            USING ((EXISTS ( SELECT 1
             FROM user_roles
            WHERE ((user_roles.user_id = (SELECT auth.uid())) AND (user_roles.role = 'admin'::text)))));'''
          guarded_block = '''DO $guard_schema_drift_alerts_policy$
          BEGIN
            IF to_regclass('public.schema_drift_alerts') IS NOT NULL THEN
              EXECUTE 'DROP POLICY IF EXISTS "schema_drift_alerts_admin_only" ON public."schema_drift_alerts"';
              EXECUTE $policy$
                CREATE POLICY "schema_drift_alerts_admin_only" ON public."schema_drift_alerts"
                  AS PERMISSIVE
                  FOR ALL
                  TO PUBLIC
                  USING ((EXISTS ( SELECT 1
                   FROM user_roles
                  WHERE ((user_roles.user_id = (SELECT auth.uid())) AND (user_roles.role = 'admin'::text)))))
              $policy$;
            END IF;
          END
          $guard_schema_drift_alerts_policy$;'''
          if old_block not in advisory_text:
              raise SystemExit('schema_drift_alerts advisory block not found exactly')
          advisory.write_text(advisory_text.replace(old_block, guarded_block, 1))

          creator = Path('supabase/migrations/20260710130000_schema_drift_monitor.sql')
          creator_text = creator.read_text()
          old_predicate = "user_roles.user_id = auth.uid()"
          new_predicate = "user_roles.user_id = (select auth.uid())"
          if old_predicate not in creator_text:
              raise SystemExit('schema_drift_alerts creator predicate not found exactly')
          creator.write_text(creator_text.replace(old_predicate, new_predicate, 1))

          # The assembler regenerates supabase/tests/production_security_hardening.sql
          # by exec'ing the embedded Python of the pinned repair workflows, and that
          # generator emits one malformed VALUES list. Where it builds the view and
          # table inventories it wraps each row -- ('{schema}','{relation}') -- but for
          # the authenticated allowlist it emits bare quoted literals:
          #     authenticated_sql = ',\n    '.join(f"'{signature}'" for signature in ...)
          # so the generated CTE reads `values` followed by 'api.get_command_centre_stats()',
          # and psql aborts the whole assertion file with
          #   ERROR: syntax error at or near "'api.get_command_centre_stats()'"
          # before a single check runs.
          #
          # The generator is fetched from a fixed SHA and cannot be corrected from this
          # branch, so the generated file is repaired here instead. This only adds the
          # missing parentheses; no signature, check or defect label is altered, so the
          # assertions still run exactly as written -- including the anon/authenticated
          # SECURITY DEFINER checks, which are the ones that caught the pg_net exposure
          # closed at 20260805234000. Remove this once the pinned generator is fixed.
          assertions = Path('supabase/tests/production_security_hardening.sql')
          lines = assertions.read_text().split('\n')
          repaired: list[str] = []
          wrapped = 0
          index = 0
          while index < len(lines):
              repaired.append(lines[index])
              if lines[index].strip() == 'values' and index + 1 < len(lines) \
                      and lines[index + 1].strip().startswith("'"):
                  index += 1
                  while index < len(lines) and lines[index].strip().startswith("'"):
                      raw = lines[index]
                      indent = raw[:len(raw) - len(raw.lstrip())]
                      body = raw.strip()
                      trailing = ',' if body.endswith(',') else ''
                      literal = body[:-1] if trailing else body
                      repaired.append(f'{indent}({literal}){trailing}')
                      wrapped += 1
                      index += 1
                  continue
              index += 1
          if wrapped:
              assertions.write_text('\n'.join(repaired))
              print(f'repaired {wrapped} bare VALUES literals in the generated assertions')

          # Second defect in the same generator. The authenticated allowlist is
          # written in type-only form -- 'api.clinical_has_active_consent(uuid,text)' --
          # but the check compares it against
          #   format('%I.%I(%s)', ..., pg_get_function_identity_arguments(p.oid))
          # and pg_get_function_identity_arguments includes PARAMETER NAMES, e.g.
          #   api.clinical_has_active_consent(p_patient_id uuid, p_consent_type text)
          # Those can never be equal, so every allowlisted function is reported as a
          # defect and the gate can only pass by revoking grants the application
          # legitimately needs. Confirmed against run 31112554218, which flagged six
          # functions that are all present in the allowlist.
          #
          # oidvectortypes(proargtypes) yields the type-only list the allowlist is
          # written in. regprocedure was rejected: it omits the schema for anything in
          # search_path, so public.hv_is_org_member(uuid) would render unqualified and
          # still not match. Only the comparison is rewritten; the SELECT list keeps
          # identity arguments so the reported defect stays human-readable.
          text = assertions.read_text()
          broken_predicate = (
              "format('%I.%I(%s)', n.nspname, p.proname, "
              "pg_get_function_identity_arguments(p.oid))"
          )
          fixed_predicate = (
              "format('%s.%s(%s)', n.nspname, p.proname, "
              "replace(pg_catalog.oidvectortypes(p.proargtypes), ', ', ','))"
          )
          occurrences = text.count(broken_predicate)
          if occurrences != 1:
              raise SystemExit(
                  f'expected exactly one allowlist comparison to repair, found {occurrences}'
              )
          assertions.write_text(text.replace(broken_predicate, fixed_predicate, 1))
          print('repaired the authenticated allowlist signature comparison')

          # Third defect in the same generator: both SECURITY DEFINER execute
          # audits include the `net` schema, which this project does not own and
          # cannot change. That makes the gate unsatisfiable. Verified read-only
          # against production (zvxdgdkukjrrwamdpqrg):
          #
          #   net.http_get / net.http_post   owner = supabase_admin, prosecdef = t
          #   every acl entry                anon=X/supabase_admin,
          #                                  authenticated=X/supabase_admin, ...
          #   postgres                       rolsuper = false
          #   pg_has_role('postgres','supabase_admin','MEMBER') = false
          #   has_schema_privilege('postgres','net','CREATE')   = false
          #
          # Only the grantor -- supabase_admin -- or a superuser can revoke those
          # entries. `postgres` is the role that runs migrations locally, backs the
          # Supabase SQL editor, and backs the management API, so no route this
          # project has can revoke them. 20260805234000 tries, and reports honestly
          # that it cannot; the run at 869203ec proved it, including via SET ROLE.
          #
          # Removing `net` from the audit costs no coverage of anything this
          # repository can produce: postgres has USAGE but not CREATE on the schema,
          # so no migration can add a routine there, and the only two SECURITY
          # DEFINER routines in it that anon/authenticated can execute are pg_net's
          # own http_get and http_post. Nor are they reachable through the Data API
          # -- PostgREST exposes `public, graphql_public, job_search, api` in
          # production and `public, graphql_public, api` locally, and `net` is in
          # neither list, so the grant only matters to a direct Postgres session as
          # anon, which the anon key does not provide.
          #
          # The audits keep every schema this project does own. Reaching pg_net from
          # application code still goes through a SECURITY DEFINER function in
          # `public`, and those remain audited.
          text = assertions.read_text()
          audited_with_net = "n.nspname in ('public','api','signals','regulatory_signals','net')"
          audited_owned = "n.nspname in ('public','api','signals','regulatory_signals')"
          occurrences = text.count(audited_with_net)
          if occurrences != 2:
              raise SystemExit(
                  f'expected exactly two definer-execute schema filters to narrow, found {occurrences}'
              )
          assertions.write_text(text.replace(audited_with_net, audited_owned))
          print('narrowed both definer-execute audits to project-owned schemas')
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Rebuild complete Supabase history and assert hardened state
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset --local
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atf supabase/tests/production_security_hardening.sql | tee /tmp/production-security-assertions.txt
          test ! -s /tmp/production-security-assertions.txt

      - name: Verify focused contracts
        run: npx vitest run tests/dashboard/aiBriefingFallback.test.ts tests/dashboard/commandCentreHealth.test.ts tests/dashboard/loadCommandCentreData.test.ts tests/dashboard/commandCentreSourcePlan.test.ts tests/platform/command-centre-route-registry.test.ts tests/platform/command-centre-typed-registry.test.ts tests/supabase/productionSecurityHardening.test.ts tests/supabase/env.test.ts

      - name: Verify lint, TypeScript, and production build
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Commit verified product candidate and remove staging controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm -f .github/workflows/repair-production-readiness.yml .github/workflows/repair-production-readiness-v2.yml .github/workflows/repair-production-readiness-v3.yml .github/workflows/repair-production-readiness-v4.yml .github/workflows/stage-production-candidate.yml .github/workflows/country-reference-audit.yml .github/workflows/migration-stub-audit.yml
          git config user.name 'harbourview-release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): close command centre production-readiness defects'
          git fetch origin stage/pr1280-production-ready-20260805
          test "$(git rev-parse origin/stage/pr1280-production-ready-20260805)" = "$GITHUB_SHA"
          git push origin HEAD:stage/pr1280-production-ready-20260805

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
