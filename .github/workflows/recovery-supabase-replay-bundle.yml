name: Recovery Supabase Replay Bundle

on:
  push:
    branches:
      - recovery/supabase-rebuild-20261008
    paths:
      - .github/workflows/recovery-supabase-replay-bundle.yml
      - supabase/migrations/**
      - supabase/release-controls/**
      - scripts/prepare-production-faithful-migration-replay.mjs

permissions:
  contents: read

jobs:
  build-replay-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Prepare production-faithful replay
        run: node scripts/prepare-production-faithful-migration-replay.mjs --apply

      - name: Restore recovered production-only depth migration for clean replay
        shell: bash
        run: |
          set -euo pipefail
          cp             supabase/release-controls/recovered-migration-sources/20260922101715_jurisdiction_data_depth_subnational_source_alignment_v2.sql             supabase/migrations/20260922101715_replay_jurisdiction_data_depth_subnational_source_alignment_v2.sql

      - name: Restore FO/GL evidence prerequisite before dependent depth migration
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/migrations/20260922111959_replay_seed_fo_gl_regulatory_evidence.sql <<'SQL'
          -- Recovery-only zero-state prerequisite. The historical claim migration
          -- references these evidence keys before the later canonical FK repair runs.
          insert into public.regulatory_market_access_evidence(
            evidence_key,jurisdiction_iso2,tier,rationale,authority_name,authority_url,
            source_effective_date,verified_at,expires_at,active
          )
          values
          (
            'hv-mkt-complete-fo-20260913','FO','medical_limited_trade',
            'Faroe Islands Regulation No. 495 of 26 May 2026 lists cannabis in the controlled-substance schedules; authorized activity is within the medical/scientific framework and no general adult-use retail pathway is established by the cited instrument.',
            'Lógasavn / Faroe Islands — Regulation No. 495 of 26 May 2026 on controlled substances',
            'https://www.logir.fo/Bekendtgorelse/495-af-26-05-2026-for-Faeroerne-om-euforiserende-stoffer',
            date '2026-05-26',now(),now()+interval '1 year',true
          ),
          (
            'hv-mkt-complete-gl-20260913','GL','medical_limited_trade',
            'Greenland controlled-substance law places cannabis within an authorization-based medical/scientific framework; no general adult-use commercial retail pathway is established by the cited framework.',
            'Greenland Self-Government — Regulation No. 61 of 22 August 2025 on controlled substances',
            'https://nalunaarutit.gl/groenlandsk-lovgivning/2025/selvstyrets-bekendtgørelse-nr-61-af-01_09_2025?sc_lang=da',
            null,now(),now()+interval '1 year',true
          )
          on conflict (evidence_key) do update set
            tier=excluded.tier,
            rationale=excluded.rationale,
            authority_name=excluded.authority_name,
            authority_url=excluded.authority_url,
            source_effective_date=excluded.source_effective_date,
            verified_at=excluded.verified_at,
            expires_at=excluded.expires_at,
            active=true;
          SQL

      - name: Replace production-local country UUIDs for zero-state replay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patches = {
            "20260922120000_primary_tv_va_source_enrichment.sql": [
              ("values('39d4e117-d0ae-4669-8f0c-b631afee0ef1','TV','depth-v1-tv'",
               "values((select id from public.countries where iso_alpha2='TV'),'TV','depth-v1-tv'"),
            ],
            "20260922121000_primary_ca_ke_regulatory_enrichment.sql": [
              ("values('a2c3726a-12a5-40c6-a640-65a735c579ac','CA','depth-v1-ca'",
               "values((select id from public.countries where iso_alpha2='CA'),'CA','depth-v1-ca'"),
              ("values('8ff64be8-1f33-42b5-9ba7-7cdd13c6fe6a','KE','depth-v1-ke'",
               "values((select id from public.countries where iso_alpha2='KE'),'KE','depth-v1-ke'"),
            ],
            "20260923061000_primary_lv_law_2026_enrichment.sql": [
              ("select 'a4e3067f-de8f-40a8-9633-24271c893c51','LV','depth-v1-lv-industrial-hemp'",
               "select (select id from public.countries where iso_alpha2='LV'),'LV','depth-v1-lv-industrial-hemp'"),
            ],
            "20260923072000_primary_mc_cannabis_control_enrichment.sql": [
              ("select '1a237176-7a4f-43ba-9d94-ea63b9ad3382','MC','depth-v1-mc-authorized-non-narcotic-cannabis'",
               "select (select id from public.countries where iso_alpha2='MC'),'MC','depth-v1-mc-authorized-non-narcotic-cannabis'"),
            ],
            "20260925081500_primary_vu_hemp_medical_enrichment.sql": [
              ("select '58526c26-b97d-410d-aa39-3e1a3b6e66b0','VU','depth-v1-vu-medical-hemp'",
               "select (select id from public.countries where iso_alpha2='VU'),'VU','depth-v1-vu-medical-hemp'"),
            ],
            "20260925090000_primary_ml_law83_14_enrichment.sql": [
              ("select 'ee9ec5dd-845e-41ae-b088-98a84f667a74','ML','depth-v1-ml-authorized-research'",
               "select (select id from public.countries where iso_alpha2='ML'),'ML','depth-v1-ml-authorized-research'"),
            ],
          }

          root = Path("supabase/migrations")
          for filename, replacements in patches.items():
              p = root / filename
              s = p.read_text()
              for old, new in replacements:
                  if s.count(old) != 1:
                      raise SystemExit(f"zero-state replay anchor mismatch in {filename}: {old}")
                  s = s.replace(old, new)
              p.write_text(s)
          PY

      - name: Build replay manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("supabase/migrations")
          rows = []
          for p in sorted(root.glob("*.sql")):
              b = p.read_bytes()
              rows.append({
                  "file": p.name,
                  "size": len(b),
                  "sha256": hashlib.sha256(b).hexdigest(),
              })
          pathlib.Path("recovery-replay-manifest.json").write_text(
              json.dumps({"count": len(rows), "files": rows}, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Prepared {len(rows)} SQL migrations")
          PY

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Validate full zero-state replay
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset --local
          eval "$(supabase status -o env)"
          psql "$DB_URL" -At -F $'\t' -c "select version, coalesce(name,'') from supabase_migrations.schema_migrations order by version" > recovery-ledger.tsv
          psql "$DB_URL" -At -c "select count(*) from supabase_migrations.schema_migrations" > recovery-ledger-count.txt

      - name: Upload prepared replay bundle
        uses: actions/upload-artifact@v4
        with:
          name: harbourview-recovery-replay-${{ github.run_id }}
          path: |
            supabase/migrations/*.sql
            recovery-replay-manifest.json
            recovery-ledger.tsv
            recovery-ledger-count.txt
          if-no-files-found: error
          retention-days: 3

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
