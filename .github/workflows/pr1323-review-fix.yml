name: PR 1323 Review Fix

on:
  push:
    branches:
      - fix/globe-antimeridian-generator-hardening

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply validated review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          generator = Path('scripts/generate-natural-earth-countries.mjs')
          text = generator.read_text()

          text = replace_once(text, """  const targetSign = Math.sign(signedRingAreaDeg2(runs[0]))
          return runs.map((candidate) => {
            const sign = Math.sign(signedRingAreaDeg2(candidate))
            return targetSign !== 0 && sign !== 0 && sign !== targetSign
              ? reverseClosedRing(candidate)
              : candidate
          })""", """  const signedAreas = runs.map((candidate) => signedRingAreaDeg2(candidate))
          const referenceIndex = signedAreas.reduce(
            (best, area, index) => (Math.abs(area) > Math.abs(signedAreas[best]) ? index : best),
            0,
          )
          const targetSign = Math.sign(signedAreas[referenceIndex])
          return runs.map((candidate, index) => {
            const sign = Math.sign(signedAreas[index])
            return targetSign !== 0 && sign !== 0 && sign !== targetSign
              ? reverseClosedRing(candidate)
              : candidate
          })""", 'winding reference')

          text = replace_once(text, """    for (const hole of simplifiedHoles) {
              const reference = ringReferencePoint(hole)
              const containingIndex = outputPolygons.findIndex(({ outer }) => pointInRing(reference, outer))
              if (containingIndex >= 0) {
                outputPolygons[containingIndex].holes.push(hole)
              } else if (outputPolygons.length === 1) {
                outputPolygons[0].holes.push(hole)
              }
            }""", """    for (const hole of simplifiedHoles) {
              const candidatePoints = hole.slice(0, -1)
              const containingIndex = outputPolygons.findIndex(({ outer }) =>
                candidatePoints.some((point) => pointInRing(point, outer)),
              )
              if (containingIndex >= 0) {
                outputPolygons[containingIndex].holes.push(hole)
              } else if (outputPolygons.length === 1) {
                outputPolygons[0].holes.push(hole)
              } else {
                console.warn('Natural Earth hole could not be assigned to a split outer fragment', {
                  reference: ringReferencePoint(hole),
                  outerCount: outputPolygons.length,
                })
              }
            }""", 'hole assignment')
          generator.write_text(text)

          test_file = Path('tests/harbourview/natural-earth-antimeridian-topology.test.ts')
          text = test_file.read_text()
          text = replace_once(text, "import test from 'node:test'", "import { test } from 'vitest'", 'vitest import')

          text = replace_once(text, """  const result = spawnSync(process.execPath, ['--input-type=module', '--eval', source], {
            cwd: process.cwd(),
            encoding: 'utf8',
            maxBuffer: 20 * 1024 * 1024,
          })

          assert.equal(result.status, 0, result.stderr || result.stdout)""", """  const result = spawnSync(process.execPath, ['--input-type=module', '--eval', source], {
            cwd: process.cwd(),
            encoding: 'utf8',
            maxBuffer: 20 * 1024 * 1024,
            timeout: 30_000,
          })

          const failureContext = [
            `status=${String(result.status)}`,
            `signal=${String(result.signal)}`,
            `error=${result.error ? String(result.error) : 'none'}`,
            `stderr=${result.stderr || '<empty>'}`,
            `stdout=${result.stdout || '<empty>'}`,
          ].join('\\n')
          assert.equal(result.status, 0, failureContext)""", 'spawn timeout')

          text = replace_once(text, """      degenerateTriangleCount: number
              triangleCount: number
            }>""", """      degenerateTriangleCount: number
              triangleCount: number
              sourceHoleCount: number
              generatedHoleCount: number
            }>""", 'hole count type')

          text = replace_once(text, """      let degenerateTriangleCount = 0
              let triangleCount = 0

              for (const polygon of country.polygons) {""", """      let degenerateTriangleCount = 0
              let triangleCount = 0
              const sourcePolygons = feature.geometry?.type === 'Polygon'
                ? [feature.geometry.coordinates]
                : feature.geometry?.coordinates ?? []
              const sourceHoleCount = sourcePolygons.reduce(
                (sum, polygon) => sum + Math.max(0, polygon.length - 1),
                0,
              )
              const generatedHoleCount = country.polygons.reduce(
                (sum, polygon) => sum + polygon.rings.filter((ring) => ring.kind === 'hole').length,
                0,
              )

              for (const polygon of country.polygons) {""", 'hole count calculation')

          text = replace_once(text, """        degenerateTriangleCount,
                triangleCount,
              }""", """        degenerateTriangleCount,
                triangleCount,
                sourceHoleCount,
                generatedHoleCount,
              }""", 'hole count output')

          text = replace_once(text, """    assert.equal(geometry.degenerateTriangleCount, 0, `${iso2}: Earcut emitted degenerate triangles`)
            assert.ok(geometry.triangleCount > 0, `${iso2}: expected triangulated geometry`)""", """    assert.equal(geometry.degenerateTriangleCount, 0, `${iso2}: Earcut emitted degenerate triangles`)
            assert.ok(
              geometry.generatedHoleCount >= geometry.sourceHoleCount,
              `${iso2}: source holes lost (${geometry.sourceHoleCount} source, ${geometry.generatedHoleCount} generated)`,
            )
            assert.ok(geometry.triangleCount > 0, `${iso2}: expected triangulated geometry`)""", 'hole preservation assertion')
          test_file.write_text(text)
          PY

      - name: Regenerate Natural Earth data
        run: node scripts/generate-natural-earth-countries.mjs

      - name: Topology regression via Vitest
        run: npx vitest run tests/harbourview/natural-earth-antimeridian-topology.test.ts

      - name: Spherical regression
        run: npx vitest run tests/harbourview/russia-spherical-triangulation.test.ts

      - name: Verify normalized two-run reproducibility
        run: |
          cp data/globe/natural-earth-countries.ts /tmp/first.ts
          sleep 1
          node scripts/generate-natural-earth-countries.mjs
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          a = Path('/tmp/first.ts').read_text()
          b = Path('data/globe/natural-earth-countries.ts').read_text()
          normalize = lambda s: re.sub(r"generatedAt: '[^']+'", "generatedAt: '<normalized>'", s)
          an, bn = normalize(a), normalize(b)
          if an != bn:
              raise SystemExit('Generated Natural Earth geometry is not deterministic after normalizing generatedAt')
          print('normalized_sha256=' + hashlib.sha256(an.encode()).hexdigest())
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Security leakage regression
        run: npx vitest run tests/harbourview/public-dom-forbidden-strings.test.tsx tests/harbourview/public-route-smoke.test.ts tests/network/public-projection-leakage.test.ts tests/marketplace/publicProjection.test.ts

      - name: Build
        run: npm run build

      - name: Append mandatory evidence entry
        run: |
          cat >> docs/control/EVIDENCE_LOG.md <<'EOF'

          | 2026-08-10 | PR #1323 Natural Earth antimeridian generator hardening review-closeout | `node scripts/generate-natural-earth-countries.mjs`; `npx vitest run tests/harbourview/natural-earth-antimeridian-topology.test.ts`; `npx vitest run tests/harbourview/russia-spherical-triangulation.test.ts`; normalized two-run regeneration comparison; `npm run typecheck`; targeted security/leakage Vitest; `npm run build` | PASS: regeneration completed; topology and spherical regressions pass; no source holes lost in seam-affected regression set; normalized regeneration deterministic; typecheck/security/build pass | PR #1323; workflow `PR 1323 Review Fix` | Current — pre-merge evidence |
          EOF

      - name: Commit validated review fixes
        env:
          BRANCH: fix/globe-antimeridian-generator-hardening
        run: |
          git config user.name "Harbourview"
          git config user.email "harbourviewcompany@gmail.com"
          git restore data/globe/natural-earth-countries.ts
          git add scripts/generate-natural-earth-countries.mjs tests/harbourview/natural-earth-antimeridian-topology.test.ts docs/control/EVIDENCE_LOG.md
          git diff --cached --check
          git commit -m "fix(globe): close PR 1323 review blockers"
          git push origin HEAD:$BRANCH
