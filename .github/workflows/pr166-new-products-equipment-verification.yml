name: PR 166 New Products Equipment Verification

on:
  pull_request:
    branches:
      - main
    # Scoped to the surfaces this check actually covers. It previously ran a
    # full install + typecheck + build + server boot on every PR to main to
    # scan one marketplace route for leaked internal fields.
    #
    # The scan reads the rendered HTML of /marketplace/new-products, so the
    # filter has to cover everything that composes that HTML, not just the
    # marketplace tree: the page renders through components/PublicUi.tsx, sits
    # inside app/layout.tsx, and is served through proxy.ts. A change to any of
    # those can introduce a leaked marker while touching no marketplace file.
    paths:
      - 'app/marketplace/**'
      - 'lib/marketplace/**'
      - 'components/marketplace/**'
      - 'tests/marketplace/**'
      # Shared rendering dependencies of the scanned route. Broadened to the
      # whole component tree rather than an enumerated list: the chain is
      # transitive (app/layout.tsx -> ShellWrapper -> Nav/Footer;
      # PublicUi.tsx -> ui/HarbourviewPanel.tsx), so any hand-maintained
      # enumeration goes stale the first time someone adds an import.
      - 'components/**'
      - 'app/layout.tsx'
      - 'app/globals.css'
      - 'proxy.ts'
      - '.github/workflows/pr166-new-products-equipment-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-new-products-equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Public visibility
        run: npm run test:visibility

      - name: New products equipment intake
        run: npm run test:new-products-equipment-intake

      - name: Build
        run: npm run build

      - name: Start built app
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/harbourview-next.log 2>&1 &
          echo $! > /tmp/harbourview-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/marketplace/new-products >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/harbourview-next.log
          exit 1

      - name: Scan new products route for forbidden leakage strings
        run: |
          html="$(curl -fsS http://127.0.0.1:3000/marketplace/new-products)"
          forbidden_markers=(
            'sourceUrl'
            'sourceName'
            'contactEmail'
            'provenanceSummary'
            'sourceEvidence'
            'Evidence captured'
            'pricing metadata'
            'internal notes'
            'internalReviewNotes'
            'review metadata'
            'reviewedBy'
            'lastReviewedAt'
            'nextReviewDueAt'
          )
          for forbidden in "${forbidden_markers[@]}"; do
            if printf '%s' "$html" | grep -Fqi "$forbidden"; then
              echo "Forbidden string leaked on /marketplace/new-products: $forbidden"
              exit 1
            fi
          done
          echo "PASS /marketplace/new-products exact forbidden-marker scan"
