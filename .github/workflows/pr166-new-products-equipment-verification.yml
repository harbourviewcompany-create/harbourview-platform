name: PR 166 New Products Equipment Verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-new-products-equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:visibility
      - run: npm run test:new-products-equipment-intake
      - run: npm run build
      - name: Start built app
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/harbourview-next.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/marketplace/new-products >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/harbourview-next.log
          exit 1
      - name: Scan exact forbidden fields
        env:
          PROBE_BASE_URL: http://127.0.0.1:3000
          PROBE_ROUTES: /marketplace/new-products
          PROBE_API_ROUTES: ''
          PROBE_MAX_ASSETS: '1'
        run: node scripts/verification/public-leakage-probe.mjs
