name: Supply Imagery Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/supply/**'
      - 'components/supply/**'
      - 'public/images/supply/**'
      - 'scripts/validate-supply-images.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:supply-images
      - run: npm run typecheck
      - run: npm run test:visibility
      - run: npm run build
