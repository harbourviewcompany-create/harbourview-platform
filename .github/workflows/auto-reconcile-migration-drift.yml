name: Auto-reconcile migration drift

# Runs the same reconciliation that has been happening manually all week
# (fetch live ledger -> diff against repo -> reconstruct missing files),
# on a schedule, so applied-but-uncommitted migrations get caught and
# turned into a PR within the hour instead of whenever someone next
# happens to notice the drift gate is red.
#
# This never merges anything itself. It writes files copied verbatim from
# what's already live (see scripts/auto-reconcile-migration-drift.mjs for
# why that's safe) and opens a normal PR, which still has to pass full CI
# -- typecheck, build, every feature-specific verify suite -- before a
# human or an agent merges it.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-reconcile-migration-drift
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: zvxdgdkukjrrwamdpqrg
  PGHOST: aws-1-us-west-2.pooler.supabase.com
  PGPORT: '5432'
  PGUSER: postgres.zvxdgdkukjrrwamdpqrg
  PGDATABASE: postgres

jobs:
  reconcile:
    name: Detect and reconstruct applied-not-committed migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Fetch live migration ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p artifacts
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list --linked > artifacts/remote-migrations.txt

      - name: Run reconciliation
        id: reconcile
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['PGPASSWORD'], safe=''))")
          DSN="postgresql://${PGUSER}:${ENCODED_PASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          node scripts/auto-reconcile-migration-drift.mjs \
            --remote-list artifacts/remote-migrations.txt \
            --local-dir supabase/migrations \
            --attestations supabase/release-controls/historical-remote-migration-attestations.json \
            --equivalences supabase/release-controls/migration-live-version-equivalences.json \
            --control-file supabase/release-controls/elite-digest-production-activation.json \
            --psql-dsn "$DSN" \
            --summary-out artifacts/summary.md

      - name: Check for new files
        id: changes
        run: |
          if git status --porcelain supabase/migrations/ | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open reconciliation PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto/migration-drift-reconciliation-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "harbourview-auto-reconcile"
          git config user.email "auto-reconcile@harbourview.local"
          git checkout -b "$BRANCH"
          git add supabase/migrations/
          {
            echo "chore(migrations): auto-reconcile applied-not-committed drift"
            echo
            cat artifacts/summary.md
            echo
            echo "Auto-generated by .github/workflows/auto-reconcile-migration-drift.yml."
            echo "Every statement here is copied verbatim from supabase_migrations.schema_migrations"
            echo "for an already-live version -- nothing in this PR changes production, it only"
            echo "brings the repo's record of it up to date. Still needs full CI + review before"
            echo "merging, same as any other PR."
          } > /tmp/commit-message.txt
          git commit -F /tmp/commit-message.txt
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(migrations): auto-reconcile applied-not-committed drift" \
            --body-file artifacts/summary.md \
            --label "automated,migrations"
