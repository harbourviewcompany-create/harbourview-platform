name: Repair Supply Imagery Workflow

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/supply-imagery-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch validator and cleanup
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/supply-imagery-implementation.yml')
          s=p.read_text()
          old="const slugs = [...sql.matchAll(/,'([a-z0-9]+(?:-[a-z0-9]+)+)','(?:packaging|consumables|processing|cultivation|labs_testing)'/g)].map((m) => m[1])\\nconst unique = [...new Set(slugs)]"
          new="const unique = fs.readdirSync('public/images/supply').filter((f) => f.endsWith('.webp')).map((f) => f.slice(0, -5)).sort()\\nfor (const slug of unique) { if (!sql.includes(`'${slug}'`)) throw new Error(`Image slug is not canonical: ${slug}`) }"
          if old not in s: raise SystemExit('validator marker missing')
          s=s.replace(old,new)
          s=s.replace("rm .github/workflows/supply-imagery-implementation.yml", "rm .github/workflows/supply-imagery-implementation.yml .github/workflows/supply-imagery-repair.yml")
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/supply-imagery-implementation.yml
          git commit -m "fix: validate all generated canonical supply images"
          git push origin HEAD:${{ github.head_ref }}
