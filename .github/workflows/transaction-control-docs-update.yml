name: Transaction Control Docs Update

on:
  push:
    branches:
      - feat/native-transaction-system-foundation
    paths:
      - .github/workflows/transaction-control-docs-update.yml
      - scripts/append-transaction-control-docs.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-control-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/native-transaction-system-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Append control records
        run: node scripts/append-transaction-control-docs.mjs

      - name: Commit control records
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/control/DATABASE_CONTROL.md docs/control/EVIDENCE_LOG.md; then
            echo 'Control records already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/control/DATABASE_CONTROL.md docs/control/EVIDENCE_LOG.md
          git commit -m 'docs(transactions): record database control and evidence baseline'
          git push origin HEAD:feat/native-transaction-system-foundation
