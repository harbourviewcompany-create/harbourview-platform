name: Temporary Key Regulators Repair

on:
  push:
    branches:
      - repair/mobile-playbook-steps-production

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/mobile-playbook-steps-production
          fetch-depth: 0
      - name: Patch key regulators renderer and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/dashboard/MobileCommandCentre.tsx')
          text = path.read_text()
          old = '''      {jurisdictionPlaybook?.key_regulators && jurisdictionPlaybook.key_regulators.length > 0 && (
        <div className="hvm-signal-card hvm-signal-card--rich">
          <div className="hvm-kicker">KEY REGULATORS</div>
          {jurisdictionPlaybook.key_regulators.map((r, i) => (
            <div key={r.name} style={{ marginTop: i === 0 ? 4 : 8, paddingTop: i === 0 ? 0 : 8, borderTop: i === 0 ? 'none' : '1px solid rgba(245,240,232,.08)' }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: 'rgba(245,240,232,.9)' }}>{r.name}</div>
              <div style={{ fontSize: 12, color: 'rgba(245,240,232,.5)', marginTop: 2 }}>{r.role}</div>
            </div>
          ))}
        </div>
      )}'''
          new = '''      {jurisdictionPlaybook?.key_regulators && (
        <div className="hvm-signal-card hvm-signal-card--rich">
          <div className="hvm-kicker">KEY REGULATORS</div>
          <div style={{ marginTop: 4 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: 'rgba(245,240,232,.9)' }}>{jurisdictionPlaybook.key_regulators.primary}</div>
          </div>
          {jurisdictionPlaybook.key_regulators.secondary.map((regulator, index) => (
            <div key={`${index}-${regulator}`} style={{ marginTop: 8, paddingTop: 8, borderTop: '1px solid rgba(245,240,232,.08)' }}>
              <div style={{ fontSize: 12, color: 'rgba(245,240,232,.6)', lineHeight: 1.5 }}>{regulator}</div>
            </div>
          ))}
        </div>
      )}'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one stale key-regulators block, found {count}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/temporary-key-regulators-repair.yml').unlink()
          PY
      - name: Commit focused repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dashboard/MobileCommandCentre.tsx .github/workflows/temporary-key-regulators-repair.yml
          git commit -m "fix: align mobile key regulators with canonical shape"
          git push origin repair/mobile-playbook-steps-production
