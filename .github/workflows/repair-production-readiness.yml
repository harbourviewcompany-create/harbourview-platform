name: Repair Production Readiness

on:
  push:
    branches:
      - build/harbourview-production-command-platform
    paths:
      - .github/workflows/repair-production-readiness.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-production-readiness
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      HARBOURVIEW_LOCAL_TEST_BUILD: '1'
      NEXT_PUBLIC_HARBOURVIEW_LOCAL_TEST_BUILD: '1'
      HARBOURVIEW_ALLOW_LOCAL_SUPABASE: '1'
      NEXT_PUBLIC_HARBOURVIEW_ALLOW_LOCAL_SUPABASE: '1'
      NEXT_PUBLIC_HARBOURVIEW_CI_RUN_ID: ${{ github.run_id }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/harbourview-production-command-platform
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: latest

      - name: Apply reviewed production-readiness repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)

          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              if source.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match for {old!r}, found {source.count(old)}')
              write(path, source.replace(old, new, 1))

          # Keep personally identifying account data out of the generic loader context.
          replace_once(
              'app/dashboard/page.tsx',
              "    userId,\n    userEmail,\n    hasOrganization: hasOrg,",
              "    userId,\n    hasOrganization: hasOrg,",
          )

          # Give the dependent operator licence source a complete combined timeout budget.
          replace_once(
              'lib/dashboard/buildDashboardCommandSources.ts',
              "      fallback: { entitled: false as const },\n      sourceLabel: 'Authorized operator licence matrix',",
              "      fallback: { entitled: false as const },\n      timeoutMs: 12_000,\n      sourceLabel: 'Authorized operator licence matrix',",
          )

          # Match the local-Supabase control documentation to the actual server/browser gates.
          replace_once(
              'lib/supabase/env.ts',
              " * - the target is a loopback host;\n * - the process is not running in a Vercel deployment environment.\n *\n * Browser gates require a numeric workflow run id plus literal NEXT_PUBLIC_",
              " * - the target is a loopback host;\n * - on the server path only, the process is not running in a Vercel\n *   deployment environment. The browser path cannot read unprefixed Vercel\n *   variables and relies on the complete NEXT_PUBLIC_ marker set instead.\n *\n * Browser gates require a numeric workflow run id plus literal NEXT_PUBLIC_",
          )

          # Bound both Supabase Management API requests.
          auth_script = read('scripts/configure-supabase-auth-production.mjs')
          auth_script = auth_script.replace(
              "const API_ROOT = 'https://api.supabase.com/v1'\n",
              "const API_ROOT = 'https://api.supabase.com/v1'\nconst MANAGEMENT_API_TIMEOUT_MS = 15_000\n",
              1,
          )
          auth_script = auth_script.replace(
              "const response = await fetch(`${API_ROOT}/projects/${PROJECT_REF}/config/auth`, { headers })",
              "const response = await fetch(`${API_ROOT}/projects/${PROJECT_REF}/config/auth`, {\n    headers,\n    signal: AbortSignal.timeout(MANAGEMENT_API_TIMEOUT_MS),\n  })",
              1,
          )
          auth_script = auth_script.replace(
              "  body: JSON.stringify({ password_hibp_enabled: true }),\n})",
              "  body: JSON.stringify({ password_hibp_enabled: true }),\n  signal: AbortSignal.timeout(MANAGEMENT_API_TIMEOUT_MS),\n})",
              1,
          )
          write('scripts/configure-supabase-auth-production.mjs', auth_script)

          # Desktop transaction workspaces now consume and preserve the same URL contract as mobile.
          write('components/dashboard/DesktopCommandWorkspace.css', textwrap.dedent('''\
          .desktop-command-workspace-layer {
            --hvm2-bg: #020814;
            --hvm2-panel: #07111f;
            --hvm2-text: #f5f1e8;
            --hvm2-muted: #9aa8b6;
            --hvm2-gold: #c6a55a;
            --hvm2-gold-light: #f3cf86;
            --hvm2-border-soft: rgba(198, 165, 90, 0.24);
            position: fixed;
            inset: 0;
            z-index: 120;
            overflow-y: auto;
            padding: 72px 24px 40px;
            background: rgba(2, 8, 20, 0.92);
            backdrop-filter: blur(12px);
          }

          .desktop-command-workspace-layer > .hvm2-workspace {
            width: min(880px, 100%);
            margin: 0 auto;
            padding: 24px;
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
          }

          .desktop-command-workspace-layer .hvm2-workspace-header h3 {
            font-size: 30px;
          }

          @media (max-width: 767px) {
            .desktop-command-workspace-layer {
              display: none;
            }
          }
          '''))

          write('components/dashboard/DesktopCommandWorkspace.tsx', textwrap.dedent('''\
          'use client'

          import { usePathname, useRouter, useSearchParams } from 'next/navigation'
          import type { MarketView } from './CommandCentre'
          import {
            FinancingWorkspacePanel,
            MarketplaceWorkspacePanel,
          } from './mobile-command/WorkspacePanels'
          import type { MobileCommandTool } from './mobile-command/contracts'
          import './DesktopCommandWorkspace.css'

          const MARKET_VIEWS = new Set<MarketView>([
            'cannabis',
            'equipment',
            'consumables',
            'new-products',
            'services',
            'opportunities',
            'wanted',
          ])
          const WORKSPACE_TOOLS = new Set<MobileCommandTool>([
            'wanted-intake',
            'supply-intake',
            'introduction',
            'financing-intake',
          ])

          function parseTool(value: string | null): MobileCommandTool | null {
            return value && WORKSPACE_TOOLS.has(value as MobileCommandTool)
              ? value as MobileCommandTool
              : null
          }

          function parseMarketView(value: string | null): MarketView {
            return value && MARKET_VIEWS.has(value as MarketView)
              ? value as MarketView
              : 'cannabis'
          }

          export default function DesktopCommandWorkspace() {
            const pathname = usePathname()
            const router = useRouter()
            const searchParams = useSearchParams()
            const tool = parseTool(searchParams.get('tool'))
            const activeMarketView = parseMarketView(searchParams.get('marketView'))

            if (!tool) return null

            const replaceParams = (mutate: (params: URLSearchParams) => void) => {
              const params = new URLSearchParams(searchParams.toString())
              mutate(params)
              const query = params.toString()
              router.replace(query ? `${pathname}?${query}` : pathname, { scroll: false })
            }
            const close = () => replaceParams(params => {
              params.delete('tool')
              params.delete('listing')
            })
            const viewSubmissions = () => replaceParams(params => {
              params.set('page', 'marketplace')
              params.delete('tool')
              params.delete('listing')
            })

            return (
              <div className="desktop-command-workspace-layer" data-desktop-command-workspace={tool}>
                <MarketplaceWorkspacePanel
                  tool={tool}
                  selectedListing={null}
                  activeMarketView={activeMarketView}
                  onClose={close}
                  onViewSubmissions={viewSubmissions}
                />
                <FinancingWorkspacePanel open={tool === 'financing-intake'} onClose={close} />
              </div>
            )
          }
          '''))

          shell = read('components/dashboard/DashboardResponsiveShell.tsx')
          shell = shell.replace(
              "const MobileCommandCentreRebuild = dynamic(\n",
              "const DesktopCommandWorkspace = dynamic(\n  () => import('@/components/dashboard/DesktopCommandWorkspace'),\n  { ssr: false },\n)\n\nconst MobileCommandCentreRebuild = dynamic(\n",
              1,
          )
          shell = shell.replace(
              "      {isMobile\n        ? <MobileCommandCentreRebuild {...props} />\n        : <CommandCentre {...props} />}",
              "      {isMobile\n        ? <MobileCommandCentreRebuild {...props} />\n        : (\n          <>\n            <CommandCentre {...props} />\n            <DesktopCommandWorkspace />\n          </>\n        )}",
              1,
          )
          write('components/dashboard/DashboardResponsiveShell.tsx', shell)

          # Fix the historical marketplace conversion dependency for deterministic clean replay.
          historical = read('supabase/migrations/20260304000000_marketplace_conversion_v1.sql').strip()
          if not historical.startswith('alter table public.marketplace_inquiries'):
              raise SystemExit('Unexpected historical marketplace conversion migration shape')
          guarded_historical = textwrap.dedent(f'''\
          -- Deterministic replay correction: production applied this version only where the
          -- relation already existed. A forward repair migration below owns production state.
          do $$
          begin
            if to_regclass('public.marketplace_inquiries') is not null then
          {textwrap.indent(historical, '    ')}
            end if;
          end
          $$;
          ''')
          write('supabase/migrations/20260304000000_marketplace_conversion_v1.sql', guarded_historical)

          write('supabase/migrations/20260804233000_marketplace_inquiries_conversion_repair.sql', textwrap.dedent('''\
          -- Forward repair for environments where marketplace_inquiries was created after
          -- the historical conversion migration. This migration is idempotent and data-safe.
          do $$
          begin
            if to_regclass('public.marketplace_inquiries') is null then
              raise exception 'public.marketplace_inquiries must exist before conversion repair';
            end if;

            alter table public.marketplace_inquiries
              add column if not exists review_status text not null default 'received',
              add column if not exists priority text not null default 'medium',
              add column if not exists last_contacted_at timestamptz null,
              add column if not exists next_follow_up_at timestamptz null,
              add column if not exists internal_response_notes text null;

            alter table public.marketplace_inquiries
              drop constraint if exists marketplace_inquiries_review_status_check;
            alter table public.marketplace_inquiries
              add constraint marketplace_inquiries_review_status_check
              check (review_status in ('received', 'triaged', 'contacted', 'qualified', 'closed'));

            alter table public.marketplace_inquiries
              drop constraint if exists marketplace_inquiries_priority_check;
            alter table public.marketplace_inquiries
              add constraint marketplace_inquiries_priority_check
              check (priority in ('low', 'medium', 'high', 'urgent'));
          end
          $$;
          '''))

          # Correct the view grant model: public projections remain readable through RLS;
          # internal/admin projections remain service-role only.
          migration_path = 'supabase/migrations/20260804190000_production_security_hardening.sql'
          migration = read(migration_path)
          public_views = {
              ('intelligence', 'public_country_intelligence'),
              ('public', 'country_intel_public'),
              ('public', 'genetics_public_claims'),
              ('public', 'genetics_public_collaboration_projects'),
              ('public', 'genetics_public_country_opportunities'),
              ('public', 'genetics_public_cultivar_aliases'),
              ('public', 'genetics_public_cultivar_passports'),
              ('public', 'genetics_public_evidence_summaries'),
              ('public', 'genetics_public_profiles'),
              ('public', 'genetics_public_service_providers'),
              ('public', 'ia_sources_live'),
              ('public', 'local_intel_jurisdiction_combined'),
              ('public', 'marketplace_public_listings_v1'),
              ('public', 'platform_coverage_summary'),
              ('public', 'public_country_profile_dto'),
              ('public', 'signals_intelligence_feed'),
              ('public', 'v_jurisdiction_unified'),
              ('regulatory_signals', 'public_signals'),
              ('regulatory_signals', 'public_source_status'),
              ('regulatory_signals', 'public_watchlist_collection_signals'),
              ('regulatory_signals', 'public_watchlist_collections'),
          }

          view_pattern = re.compile(
              r"  if public\.view_exists\('([^']+)', '([^']+)'\) then\n"
              r"    alter view ([a-z_]+)\.([a-z_0-9]+) set \(security_invoker = true\);\n"
              r"    revoke all privileges on table \3\.\4 from public, anon, authenticated;\n"
              r"    grant select on table \3\.\4 to service_role;\n"
              r"  end if;"
          )

          def replace_view(match: re.Match[str]) -> str:
              schema, relation, alter_schema, alter_relation = match.groups()
              if (schema, relation) != (alter_schema, alter_relation):
                  raise SystemExit(f'View guard mismatch: {match.group(0)}')
              grants = (
                  f"    grant select on table {schema}.{relation} to anon, authenticated, service_role;"
                  if (schema, relation) in public_views
                  else f"    grant select on table {schema}.{relation} to service_role;"
              )
              return (
                  f"  if public.view_exists('{schema}', '{relation}') then\n"
                  f"    alter view {schema}.{relation} set (security_invoker = true);\n"
                  f"    revoke all privileges on table {schema}.{relation} from public, anon, authenticated;\n"
                  f"{grants}\n"
                  "  end if;"
              )

          migration, replaced_count = view_pattern.subn(replace_view, migration)
          if replaced_count < 30:
              raise SystemExit(f'Expected explicit view inventory, replaced only {replaced_count} blocks')

          intelligence_block = textwrap.dedent('''\
            if public.view_exists('intelligence', 'public_country_intelligence') then
              alter view intelligence.public_country_intelligence set (security_invoker = true);
              revoke all privileges on table intelligence.public_country_intelligence from public, anon, authenticated;
              grant select on table intelligence.public_country_intelligence to anon, authenticated, service_role;
            end if;
          ''')
          inventory_end = "  if public.view_exists('regulatory_signals', 'public_watchlist_collections') then"
          last_start = migration.index(inventory_end)
          last_end = migration.index('  end if;', last_start) + len('  end if;')
          migration = migration[:last_end] + '\n' + intelligence_block.rstrip() + migration[last_end:]

          duplicate_start = migration.index('-- Internal/admin projections are never direct application-role surfaces.')
          duplicate_end = migration.index('-- RLS-enabled tables without policies', duplicate_start)
          migration = (
              migration[:duplicate_start]
              + '-- Internal/admin projections are closed in the explicit inventory above.\n\n'
              + migration[duplicate_end:]
          )

          migration = migration.replace(
              "-- Remove direct access to asynchronous network internals from browser roles.\nrevoke usage on schema net from public, anon, authenticated;\ngrant usage on schema net to service_role;",
              "-- Remove direct access to asynchronous network internals from browser roles.\ndo $$\nbegin\n  if exists (select 1 from pg_namespace where nspname = 'net') then\n    revoke usage on schema net from public, anon, authenticated;\n    grant usage on schema net to service_role;\n  end if;\nend\n$$;",
              1,
          )
          migration = migration.replace(
              "-- Explicit inventory of exposed views identified by the production advisor.\n-- Each literal ALTER VIEW is paired with its own existence guard.\ndo $$",
              "-- Explicit inventory of exposed views identified by the production advisor.\n-- Public projections retain read access for anon/authenticated and execute with\n-- caller privileges; internal projections remain service-role only.\ndo $$",
              1,
          )
          write(migration_path, migration)

          # State-based database assertions: explicit view inventory, public read
          # contracts, internal closure and both application roles for definer RPCs.
          inventory_values = sorted(public_views | {
              ('api', 'hv_artifacts'),
              ('api', 'hv_processing_jobs'),
              ('api', 'schema_drift_alerts'),
              ('api', 'scraper_source_state'),
              ('public', 'admin_active_matches'),
              ('public', 'admin_pending_buyer_requests'),
              ('public', 'admin_pending_listings'),
              ('public', 'content_coverage_queue'),
              ('public', 'jurisdiction_cross_table_conflicts'),
              ('public', 'local_intel_next_batch'),
              ('public', 'playbook_regulator_drift'),
              ('public', 'playbook_staleness_queue'),
              ('public', 'signals_for_digest'),
              ('public', 'signals_quality'),
              ('public', 'source_domain_type'),
              ('public', 'source_yield_report'),
          })
          public_value_sql = ',\n    '.join(f"('{schema}','{relation}')" for schema, relation in sorted(public_views))
          inventory_value_sql = ',\n    '.join(f"('{schema}','{relation}')" for schema, relation in inventory_values)
          authenticated_signatures = [
              'api.get_command_centre_stats()',
              'api.get_corridor_stats(text)',
              'api.get_source_registry_coverage(text)',
              'api.regulatory_pending_changes_feed()',
              'api.submit_signal_relevance_feedback(text,text,text,text)',
              'api.is_verified_clinician(uuid)',
              'api.clinical_has_active_consent(uuid,text)',
              'api.clinical_request_verification(text,text,text,uuid)',
              'public.hv_is_org_member(uuid)',
              'public.hv_is_platform_staff()',
              'public.is_genetics_admin_or_reviewer()',
              'public.is_hv_staff()',
              'public.current_user_tier()',
              'public.is_regulatory_tier_admin()',
          ]
          authenticated_sql = ',\n    '.join(f"'{signature}'" for signature in authenticated_signatures)
          write('supabase/tests/production_security_hardening.sql', textwrap.dedent(f'''\
          -- Must return zero rows after 20260804190000_production_security_hardening.sql.

          -- Every explicitly hardened view must execute with caller privileges.
          with hardened_views(schema_name, view_name) as (
            values
              {inventory_value_sql}
          )
          select h.schema_name, h.view_name, 'missing_security_invoker' as defect
          from hardened_views h
          join pg_namespace n on n.nspname = h.schema_name
          join pg_class c on c.relnamespace = n.oid and c.relname = h.view_name and c.relkind = 'v'
          where not coalesce((
            select bool_or(option_name = 'security_invoker' and option_value = 'true')
            from pg_options_to_table(c.reloptions)
          ), false);

          -- Retained public projections must remain readable by guest and signed-in callers.
          with public_views(schema_name, view_name) as (
            values
              {public_value_sql}
          )
          select p.schema_name, p.view_name, 'public_read_contract_missing' as defect
          from public_views p
          where to_regclass(format('%I.%I', p.schema_name, p.view_name)) is not null
            and not (
              has_table_privilege('anon', format('%I.%I', p.schema_name, p.view_name), 'select')
              and has_table_privilege('authenticated', format('%I.%I', p.schema_name, p.view_name), 'select')
              and has_table_privilege('service_role', format('%I.%I', p.schema_name, p.view_name), 'select')
            );

          -- Internal projections must remain closed to application roles.
          with internal_views(schema_name, view_name) as (
            values
              ('api','hv_artifacts'),
              ('api','hv_processing_jobs'),
              ('api','schema_drift_alerts'),
              ('api','scraper_source_state'),
              ('public','admin_active_matches'),
              ('public','admin_pending_buyer_requests'),
              ('public','admin_pending_listings'),
              ('public','content_coverage_queue'),
              ('public','jurisdiction_cross_table_conflicts'),
              ('public','local_intel_next_batch'),
              ('public','playbook_regulator_drift'),
              ('public','playbook_staleness_queue'),
              ('public','signals_for_digest'),
              ('public','signals_quality'),
              ('public','source_domain_type'),
              ('public','source_yield_report')
          )
          select i.schema_name, i.view_name, 'internal_view_exposed' as defect
          from internal_views i
          where to_regclass(format('%I.%I', i.schema_name, i.view_name)) is not null
            and (
              has_table_privilege('anon', format('%I.%I', i.schema_name, i.view_name), 'select,insert,update,delete')
              or has_table_privilege('authenticated', format('%I.%I', i.schema_name, i.view_name), 'select,insert,update,delete')
            );

          -- Policyless RLS tables must expose no table privileges to application roles.
          select n.nspname as schema_name, c.relname as table_name, 'policyless_rls_grant' as defect
          from pg_class c
          join pg_namespace n on n.oid = c.relnamespace
          where c.relkind in ('r','p','f')
            and c.relrowsecurity
            and n.nspname in ('public','api','signals','regulatory_signals')
            and not exists (select 1 from pg_policy p where p.polrelid = c.oid)
            and (
              has_table_privilege('anon', c.oid, 'select,insert,update,delete')
              or has_table_privilege('authenticated', c.oid, 'select,insert,update,delete')
            );

          -- No SECURITY DEFINER routine is executable by anon.
          select n.nspname, p.proname, pg_get_function_identity_arguments(p.oid), 'anon_definer_execute' as defect
          from pg_proc p
          join pg_namespace n on n.oid = p.pronamespace
          where p.prosecdef
            and n.nspname in ('public','api','signals','regulatory_signals','net')
            and has_function_privilege('anon', p.oid, 'execute');

          -- Authenticated execution is limited to the exact audited allowlist.
          with authenticated_allowlist(signature) as (
            values
              {authenticated_sql}
          )
          select n.nspname, p.proname, pg_get_function_identity_arguments(p.oid), 'authenticated_definer_execute' as defect
          from pg_proc p
          join pg_namespace n on n.oid = p.pronamespace
          where p.prosecdef
            and n.nspname in ('public','api','signals','regulatory_signals','net')
            and has_function_privilege('authenticated', p.oid, 'execute')
            and format('%I.%I(%s)', n.nspname, p.proname, pg_get_function_identity_arguments(p.oid))
              not in (select signature from authenticated_allowlist);

          -- Foreign integration tables remain backend-only.
          select foreign_table_schema, foreign_table_name, 'foreign_table_exposed' as defect
          from information_schema.foreign_tables
          where foreign_table_schema in ('public','api','signals','regulatory_signals')
            and (
              has_table_privilege('anon', format('%I.%I', foreign_table_schema, foreign_table_name), 'select')
              or has_table_privilege('authenticated', format('%I.%I', foreign_table_schema, foreign_table_name), 'select')
            );
          '''))

          # Keep the unit test focused on static safety invariants; runtime privilege
          # outcomes are owned by the SQL assertion gate above.
          write('tests/supabase/productionSecurityHardening.test.ts', textwrap.dedent('''\
          import { readFileSync } from 'node:fs'
          import { describe, expect, it } from 'vitest'

          const migration = readFileSync('supabase/migrations/20260804190000_production_security_hardening.sql', 'utf8')
          const assertions = readFileSync('supabase/tests/production_security_hardening.sql', 'utf8')
          const authControl = readFileSync('scripts/configure-supabase-auth-production.mjs', 'utf8')

          describe('production Supabase security hardening controls', () => {
            it('contains no synthetic deny policies or destructive business-data operations', () => {
              expect(migration).not.toMatch(/using\s*\(\s*false\s*\)/i)
              expect(migration).not.toMatch(/with\s+check\s*\(\s*false\s*\)/i)
              expect(migration).not.toMatch(/\b(truncate|drop\s+table|delete\s+from)\b/i)
            })

            it('uses explicit guarded view contracts and a guarded net-schema control', () => {
              expect(migration).toContain("if public.view_exists('public', 'marketplace_public_listings_v1') then")
              expect(migration).toContain('grant select on table public.marketplace_public_listings_v1 to anon, authenticated, service_role')
              expect(migration).toContain("if exists (select 1 from pg_namespace where nspname = 'net') then")
            })

            it('keeps state validation in the zero-row SQL assertion suite', () => {
              expect(assertions).toContain('public_read_contract_missing')
              expect(assertions).toContain('internal_view_exposed')
              expect(assertions).toContain('authenticated_definer_execute')
            })

            it('locks the Auth change to the production project and bounds Management API requests', () => {
              expect(authControl).toContain("const PROJECT_REF = 'zvxdgdkukjrrwamdpqrg'")
              expect(authControl).toContain('AbortSignal.timeout(MANAGEMENT_API_TIMEOUT_MS)')
              expect(authControl.match(/AbortSignal\.timeout\(MANAGEMENT_API_TIMEOUT_MS\)/g)).toHaveLength(2)
            })
          })
          '''))

          # Remove duplicated briefing coverage from the health endpoint suite.
          health = read('tests/dashboard/commandCentreHealth.test.ts')
          health = re.sub(
              r"\n  it\('keeps the executive briefing available.*?\n  \}\)\n(?=\}\)\s*$)",
              '\n',
              health,
              flags=re.S,
          )
          write('tests/dashboard/commandCentreHealth.test.ts', health)

          # Pin the reachable no-source bundle branch.
          loader_test = read('tests/dashboard/loadCommandCentreData.test.ts')
          loader_case = textwrap.dedent('''
            it('reports a live bundle when every source is disabled', async () => {
              const disabledLoad = vi.fn(async () => ['should-not-load'])
              const bundle = await loadCommandCentreData(context, {
                disabled: {
                  enabled: false,
                  load: disabledLoad,
                  fallback: [],
                  sourceLabel: 'Disabled source',
                },
              })

              expect(disabledLoad).not.toHaveBeenCalled()
              expect(bundle.data.disabled).toEqual([])
              expect(bundle.sources.disabled.requested).toBe(false)
              expect(bundle.state).toBe('live')
            })
          ''')
          loader_test = loader_test.rsplit('\n})', 1)[0] + '\n' + textwrap.indent(loader_case, '  ') + '\n})\n'
          write('tests/dashboard/loadCommandCentreData.test.ts', loader_test)

          # Make the transaction-route test assert its exclusivity claim.
          route_test = read('tests/platform/command-centre-route-registry.test.ts')
          old_route_case = """  it('activates only the three transaction workflows with verified in-shell reload parity', () => {\n    for (const source of ['/marketplace/sell', '/marketplace/wanted', '/marketplace/financing']) {\n      const policy = COMMAND_CENTRE_ROUTE_POLICY.find(route => route.source === source)\n      expect(policy?.mode).toBe('redirect-now')\n      expect(policy?.destination).toContain('tool=')\n    }\n    expect(COMMAND_CENTRE_ROUTE_POLICY.find(route => route.source === '/intake')?.mode).toBe('retain-public')\n  })"""
          new_route_case = """  it('routes only the three transaction workflows to in-shell tools', () => {\n    const transactionSources = ['/marketplace/sell', '/marketplace/wanted', '/marketplace/financing']\n    for (const source of transactionSources) {\n      const policy = COMMAND_CENTRE_ROUTE_POLICY.find(route => route.source === source)\n      expect(policy).toBeDefined()\n      expect(policy?.mode).toBe('redirect-now')\n      expect(policy?.destination).toContain('tool=')\n    }\n    const toolRedirects = COMMAND_CENTRE_ROUTE_POLICY\n      .filter(route => route.mode === 'redirect-now' && route.destination.includes('tool='))\n      .map(route => route.source)\n    expect(new Set(toolRedirects)).toEqual(new Set(transactionSources))\n    expect(COMMAND_CENTRE_ROUTE_POLICY.find(route => route.source === '/intake')?.mode).toBe('retain-public')\n  })"""
          if old_route_case not in route_test:
              raise SystemExit('Transaction route test block not found')
          write('tests/platform/command-centre-route-registry.test.ts', route_test.replace(old_route_case, new_route_case, 1))

          # Prove desktop URL-restored transaction workspaces in the authenticated visual gate.
          e2e = read('tests/e2e/mobile-command-centre-v2.spec.ts')
          desktop_marker = "            report.verifiedDesktopPages = verifiedPages\n"
          desktop_probe = textwrap.dedent('''\
                      const desktopWorkflows = [
                        { url: '/dashboard?country=CA&role=exporter&page=marketplace&section=supply&marketView=cannabis&tool=supply-intake', tool: 'supply-intake' },
                        { url: '/dashboard?country=CA&role=exporter&page=marketplace&section=marketplace&marketView=wanted&tool=wanted-intake', tool: 'wanted-intake' },
                        { url: '/dashboard?country=CA&role=exporter&page=trade-calc&section=financing&marketView=cannabis&tool=financing-intake', tool: 'financing-intake' },
                      ] as const
                      for (const workflow of desktopWorkflows) {
                        const workflowResponse = await page.goto(workflow.url, { waitUntil: 'domcontentloaded', timeout: 60_000 })
                        expect(workflowResponse?.status()).toBeLessThan(400)
                        await expect(page.locator(`[data-desktop-command-workspace="${workflow.tool}"]`)).toBeVisible()
                        await expect(page.locator(`[data-mobile-command-tool="${workflow.tool}"]`)).toBeVisible()
                        await page.reload({ waitUntil: 'domcontentloaded' })
                        await expect(page.locator(`[data-desktop-command-workspace="${workflow.tool}"]`)).toBeVisible()
                      }
                      report.desktopReloadRestoredWorkflows = desktopWorkflows.map(workflow => workflow.tool)
          ''')
          if desktop_marker not in e2e:
              raise SystemExit('Desktop visual marker not found')
          e2e = e2e.replace(desktop_marker, desktop_marker + textwrap.indent(desktop_probe, '            '), 1)
          write('tests/e2e/mobile-command-centre-v2.spec.ts', e2e)

          # Update database and architecture control ledgers with exact, unapplied state.
          database_control = read('docs/control/DATABASE_CONTROL.md')
          old_database_entry = """## Production security hardening\n\nThe controlling migration and release procedure are defined in `docs/control/SUPABASE_PRODUCTION_SECURITY_HARDENING.md`. Production application is gated on local migration replay, zero-row security assertions, a current backup/PITR checkpoint, leaked-password protection verification, and complete application leakage/authorization evidence."""
          new_database_entry = """## 2026-08-04 — Production security hardening\n\n- **Migration:** `20260804190000_production_security_hardening.sql`, followed by the forward marketplace conversion repair.\n- **Controlling document:** `docs/control/SUPABASE_PRODUCTION_SECURITY_HARDENING.md`.\n- **Deterministic replay corrections:** the March intelligence-view and marketplace-conversion files contain syntax/dependency corrections required for a zero-state rebuild. They do not authorize or substitute for production forward migrations.\n- **Required verification:** complete local migration replay, zero-row security assertions, a current backup/PITR checkpoint, leaked-password protection verification, and complete application leakage/authorization evidence.\n- **Production approval:** HOLD until a separate operator-authorized migration and Auth activation."""
          if old_database_entry not in database_control:
              raise SystemExit('Database control entry not found')
          write('docs/control/DATABASE_CONTROL.md', database_control.replace(old_database_entry, new_database_entry, 1))

          write('docs/control/SUPABASE_PRODUCTION_SECURITY_HARDENING.md', textwrap.dedent('''\
          # Supabase Production Security Hardening

          ## Authority and scope

          This control applies to Supabase project `zvxdgdkukjrrwamdpqrg`. It governs view execution context, RLS fail-closed behavior, foreign-table exposure, privileged RPC execution, mutable function search paths, extension placement, public projection availability and leaked-password protection.

          ## Migrations

          `supabase/migrations/20260804190000_production_security_hardening.sql` is the canonical privilege/context change. `20260804233000_marketplace_inquiries_conversion_repair.sql` is the data-preserving forward repair for the historical marketplace migration-order defect. Neither migration deletes business records.

          Required outcomes:

          - Every enumerated application view uses `security_invoker=true` and therefore executes with caller privileges against underlying RLS.
          - Retained public projections revoke historical blanket privileges, then grant `SELECT` only to `anon`, `authenticated` and `service_role`.
          - Internal/admin projections revoke all privileges from `public`, `anon` and `authenticated`; only `service_role` retains `SELECT`.
          - RLS-enabled tables without an approved policy remain deny-by-default, and foreign integration tables remain unavailable to browser roles.
          - SECURITY DEFINER routines are service-role only except for the exact audited authenticated allowlist.
          - Custom application routines have a pinned search path.
          - Future PostgreSQL-owned functions and tables in controlled schemas start closed through explicit default-privilege revocation.
          - Relocatable `vector` and `pg_trgm` extensions live in `extensions`.
          - `pg_net` remains vendor-managed; direct `net` schema access is revoked from browser roles when that schema exists.
          - `api.get_github_pat()` and `public.get_github_pat()` retain `service_role` execution only where those exact signatures exist.

          ## Leaked-password protection

          The setting is outside SQL migration control. Use:

          ```bash
          SUPABASE_ACCESS_TOKEN=<management-token> node scripts/configure-supabase-auth-production.mjs --apply
          ```

          The script is locked to project `zvxdgdkukjrrwamdpqrg`, sends only `{"password_hibp_enabled": true}`, applies a 15-second timeout to each Management API request, and verifies the setting after the PATCH. The operation requires a supported Supabase plan.

          ## Pre-deployment evidence

          1. Run the production-security workflow against an isolated local Supabase stack.
          2. Confirm the complete migration history rebuilds from zero and the SQL assertion artifact is empty.
          3. Capture the exact pre-change grants for every affected view and routine.
          4. Create a production database backup or confirm PITR availability.
          5. Apply the migrations in a controlled release window.
          6. Run `supabase/tests/production_security_hardening.sql` against production.
          7. Run Supabase security advisors and capture remaining findings.
          8. Apply and verify leaked-password protection.
          9. Run Harbourview public leakage, guest-read, admin authorization, Command Centre and production-visibility probes.

          ## Rollback

          The primary rollback is a reviewed forward migration generated from the captured pre-change grant inventory. Restore only affected function signatures or relation privileges; never restore blanket grants. Use PITR or backup restoration only when the resulting database state cannot be reconstructed safely through a forward migration.

          ## GO criteria

          GO requires zero rows from the verification SQL, green application and security workflows, leaked-password protection enabled, retained public projections readable by their intended roles, and no new public provenance or operator-data exposure. The zero-row assertion admits no implicit exceptions; any future exception must be documented and encoded explicitly in the SQL gate.
          '''))

          architecture = read('docs/control/PRODUCTION_COMMAND_CENTRE_ARCHITECTURE.md')
          architecture = architecture.replace(
              "- `redirect-now`: already represented by desktop and mobile command modules;\n- `retain-public`: canonical public/SEO entry surface retained outside the authenticated operating shell;\n- `redirect-now`: legacy or transactional route with verified authenticated Command Centre parity and reload restoration;\n- `intercept-next`: transitional route awaiting a contained workflow (none remain in the current route policy).",
              "- `redirect-now`: legacy or transactional route with verified desktop/mobile Command Centre parity and reload restoration;\n- `retain-public`: canonical public/SEO entry surface retained outside the authenticated operating shell, including signals, marketplace browse pages and professional projections.",
              1,
          )
          current_start = architecture.index('## 14. Current branch state')
          current_end = architecture.index('## Controlled customer-facing copy contract', current_start)
          current_state = textwrap.dedent('''\
          ## 14. Current branch state

          Implemented in this branch:

          - canonical typed module and route policy registry;
          - demand-driven shared server loader with per-source states and timeouts;
          - registry-driven desktop/mobile module coverage;
          - contained, URL-restored supply, wanted and financing workspaces on both responsive shells;
          - centralized controlled customer-facing copy;
          - authenticated visual and zero-state database verification gates.

          Not yet complete:

          - retirement of retained public/SEO routes before guest parity is proven;
          - complete interception of confidential intake, quote, evidence-upload and remaining legacy transactions;
          - production Supabase migration/Auth activation;
          - production Vercel promotion and alias movement;
          - final operator release authorization.

          The branch remains implementation-active and must stay draft until all acceptance gates are satisfied.

          ''')
          architecture = architecture[:current_start] + current_state + architecture[current_end:]
          closure_start = architecture.index('## Production release closure')
          architecture = architecture[:closure_start] + textwrap.dedent('''\
          ## Production release closure

          The loader, source plan, controlled-copy module, public route policy and three transaction workspaces are implemented and require exact-head evidence before closure. Retained public routes are not retired until guest, SEO, disclaimer and workflow parity pass. Confidential intake, quote, evidence-upload and other legacy transaction paths remain open work unless separately verified. Production migration, Auth activation, Vercel promotion and alias movement remain HOLD pending green gates and explicit operator authorization.
          ''')
          write('docs/control/PRODUCTION_COMMAND_CENTRE_ARCHITECTURE.md', architecture)

          handoff_path = 'docs/control/CLAUDE_PRODUCTION_COMMAND_CENTRE_HANDOFF.md'
          handoff = read(handoff_path).replace('redirect-after-parity', 'redirect-now')
          write(handoff_path, handoff)

          print('Production-readiness repair tree prepared.')
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Start and rebuild complete local Supabase history
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset --local
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atf supabase/tests/production_security_hardening.sql | tee /tmp/production-security-assertions.txt
          test ! -s /tmp/production-security-assertions.txt

      - name: Verify focused contracts
        run: >-
          npx vitest run
          tests/dashboard/aiBriefingFallback.test.ts
          tests/dashboard/commandCentreHealth.test.ts
          tests/dashboard/loadCommandCentreData.test.ts
          tests/dashboard/commandCentreSourcePlan.test.ts
          tests/platform/command-centre-route-registry.test.ts
          tests/platform/command-centre-typed-registry.test.ts
          tests/supabase/productionSecurityHardening.test.ts
          tests/supabase/env.test.ts

      - name: Verify lint typecheck and production build
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Commit verified repair tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'harbourview-release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git add \
            app/account/upgrade/page.tsx \
            app/api/ai/briefing/route.ts \
            app/dashboard/page.tsx \
            components/dashboard/DesktopCommandWorkspace.css \
            components/dashboard/DesktopCommandWorkspace.tsx \
            components/dashboard/DashboardResponsiveShell.tsx \
            docs/control/CLAUDE_PRODUCTION_COMMAND_CENTRE_HANDOFF.md \
            docs/control/DATABASE_CONTROL.md \
            docs/control/PRODUCTION_COMMAND_CENTRE_ARCHITECTURE.md \
            docs/control/SUPABASE_PRODUCTION_SECURITY_HARDENING.md \
            lib/dashboard/buildDashboardCommandSources.ts \
            lib/supabase/env.ts \
            scripts/configure-supabase-auth-production.mjs \
            supabase/migrations/20260304000000_marketplace_conversion_v1.sql \
            supabase/migrations/20260804190000_production_security_hardening.sql \
            supabase/migrations/20260804233000_marketplace_inquiries_conversion_repair.sql \
            supabase/tests/production_security_hardening.sql \
            tests/dashboard/aiBriefingFallback.test.ts \
            tests/dashboard/commandCentreHealth.test.ts \
            tests/dashboard/loadCommandCentreData.test.ts \
            tests/e2e/mobile-command-centre-v2.spec.ts \
            tests/platform/command-centre-route-registry.test.ts \
            tests/supabase/productionSecurityHardening.test.ts
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git commit -m 'fix(release): close command centre production-readiness defects'
          git push origin HEAD:build/harbourview-production-command-platform

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
