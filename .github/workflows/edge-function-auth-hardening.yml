name: Edge Function Auth Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/harbourview-auth.ts'
      - 'supabase/functions/job-refresh/**'
      - 'supabase/functions/schema-drift-monitor/**'
      - 'supabase/functions/hv-source-pull-runner/**'
      - 'supabase/functions/hv-private-pipeline-runner/**'
      - 'supabase/functions/compute-passport-score/**'
      - 'supabase/functions/generate-org-snapshot/**'
      - 'supabase/migrations/*harden_edge_function_cron_auth.sql'
      - 'tests/security/edge-function-auth-hardening.test.ts'
      - '.github/workflows/edge-function-auth-hardening.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Edge auth hardening tests
        run: npx vitest run tests/security/edge-function-auth-hardening.test.ts
      - name: Build
        run: npm run build
