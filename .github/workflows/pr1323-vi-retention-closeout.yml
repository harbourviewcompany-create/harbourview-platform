name: PR 1323 VI Retention Closeout

on:
  push:
    branches:
      - fix/pr1323-vi-retention-closeout
    paths:
      - '.github/workflows/pr1323-vi-retention-closeout.yml'

permissions:
  contents: write

jobs:
  fix-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply VI retention fix and regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/generate-natural-earth-countries.mjs')
          s = p.read_text()
          old = """  const polygons = normalizePolygons(feature.geometry, SIMPLIFY_TOLERANCE_DEG)\n  if (polygons.length === 0) return null\n"""
          new = """  let polygons = normalizePolygons(feature.geometry, SIMPLIFY_TOLERANCE_DEG)\n  // Preserve the U.S. Virgin Islands when simplification alone drops its\n  // otherwise valid Natural Earth source geometry below the output threshold.\n  // Keep every other country on the established generator path.\n  if (polygons.length === 0 && iso2 === 'VI') {\n    polygons = normalizePolygons(feature.geometry, 0)\n  }\n  if (polygons.length === 0) return null\n"""
          if s.count(old) != 1:
              raise SystemExit(f'generator transform target count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/globe-natural-earth-countries.test.ts')
          s = p.read_text()
          old = """    expect(iso2s.has('US')).toBe(true)\n    expect(iso2s.has('CA')).toBe(true)\n"""
          new = """    expect(iso2s.has('US')).toBe(true)\n    expect(iso2s.has('VI')).toBe(true)\n    expect(iso2s.has('CA')).toBe(true)\n"""
          if s.count(old) != 1:
              raise SystemExit(f'VI assertion target count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove merged temporary probe from working tree
        run: rm -f .github/workflows/pr1323-small-country-retention-probe.yml
      - name: Deterministic regeneration and VI proof
        run: |
          node scripts/generate-natural-earth-countries.mjs
          cp data/globe/natural-earth-countries.ts /tmp/run1.ts
          node scripts/generate-natural-earth-countries.mjs
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          def norm(text):
              return re.sub(r"generatedAt: ['\"][^'\"]+['\"]", "generatedAt: '<normalized>'", text)
          a = norm(Path('/tmp/run1.ts').read_text())
          b = norm(Path('data/globe/natural-earth-countries.ts').read_text())
          if a != b:
              raise SystemExit('normalized regenerations differ')
          if "iso2: 'VI'" not in b:
              raise SystemExit('VI missing from regenerated payload')
          print('normalized_sha256=' + hashlib.sha256(b.encode()).hexdigest())
          print('VI_present=true')
          PY
      - name: Topology regression
        run: npx vitest run tests/harbourview/natural-earth-antimeridian-topology.test.ts
      - name: Russia spherical regression
        run: npx vitest run tests/harbourview/russia-spherical-triangulation.test.ts
      - name: Globe rendering regression
        run: npx vitest run tests/globe-polygon-rendering.test.ts
      - name: Natural Earth payload regression
        run: npx vitest run tests/globe-natural-earth-countries.test.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full tests
        run: npm run test
      - name: Security and leakage
        run: npm run test:security
      - name: Build
        run: npm run build
      - name: Final deterministic payload proof
        run: |
          cp data/globe/natural-earth-countries.ts /tmp/pre-final.ts
          node scripts/generate-natural-earth-countries.mjs
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          def norm(text):
              return re.sub(r"generatedAt: ['\"][^'\"]+['\"]", "generatedAt: '<normalized>'", text)
          a = norm(Path('/tmp/pre-final.ts').read_text())
          b = norm(Path('data/globe/natural-earth-countries.ts').read_text())
          if a != b:
              raise SystemExit('post-build normalized payload drift')
          if "iso2: 'VI'" not in b:
              raise SystemExit('VI missing after build')
          print('final_normalized_sha256=' + hashlib.sha256(b.encode()).hexdigest())
          PY
      - name: Restore generatedAt-only churn and commit exact corrective scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          before = Path('/tmp/pre-final.ts').read_text()
          current = Path('data/globe/natural-earth-countries.ts').read_text()
          before_match = re.search(r"generatedAt: (['\"])[^'\"]+\1", before)
          current_match = re.search(r"generatedAt: (['\"])[^'\"]+\1", current)
          if before_match and current_match:
              current = current[:current_match.start()] + before_match.group(0) + current[current_match.end():]
          Path('data/globe/natural-earth-countries.ts').write_text(current)
          PY
          rm -f .github/workflows/pr1323-vi-retention-closeout.yml
          git config user.name 'Harbourview Release Bot'
          git config user.email 'harbourviewcompany@gmail.com'
          git add -A
          echo 'Final corrective scope:'
          git diff --cached --name-only
          git commit -m 'fix(globe): retain U.S. Virgin Islands geometry'
          git push origin HEAD:fix/pr1323-vi-retention-closeout
