name: Manual Migration Ledger
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact protected-main commit SHA to audit
        required: true
        type: string
      remote_ledger_path:
        description: Repository path in the audited commit to a sanitized version/name JSON export
        required: true
        type: string
      canonical_hash_path:
        description: Optional reviewed JSON path in the audited commit containing canonical SHA-256 values
        required: false
        type: string
permissions:
  contents: read
jobs:
  ledger:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted verifier revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate protected-main ancestry
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main "$COMMIT_SHA"
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main
      - name: Checkout audited commit as data only
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          path: audited
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate ledger paths
        env:
          REMOTE_LEDGER_PATH: ${{ inputs.remote_ledger_path }}
          CANONICAL_HASH_PATH: ${{ inputs.canonical_hash_path }}
        run: |
          set -euo pipefail
          validate_path() {
            local value="$1"
            [[ "$value" =~ ^[A-Za-z0-9_./-]+\.json$ ]]
            [[ "$value" != /* ]]
            [[ "$value" != *..* ]]
            test -f "audited/$value"
          }
          validate_path "$REMOTE_LEDGER_PATH"
          if [[ -n "$CANONICAL_HASH_PATH" ]]; then validate_path "$CANONICAL_HASH_PATH"; fi
      - name: Generate comparison with trusted verifier
        env:
          MIGRATION_DIR: audited/supabase/migrations
          SUPABASE_MIGRATIONS_JSON: audited/${{ inputs.remote_ledger_path }}
          CANONICAL_MIGRATION_HASHES_JSON: ${{ inputs.canonical_hash_path && format('audited/{0}', inputs.canonical_hash_path) || '' }}
          LEDGER_OUTPUT_DIR: release-evidence
        run: node scripts/verification/migration-ledger.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-ledger-${{ inputs.commit_sha }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 30
