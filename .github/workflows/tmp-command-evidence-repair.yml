name: Temporary Command evidence assertion repair

on:
  push:
    branches:
      - agent/mobile-command-p0-remediation-20260813
    paths:
      - .github/workflows/tmp-command-evidence-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/mobile-command-p0-remediation-20260813
          fetch-depth: 1

      - name: Make zero-state assertion state-aware and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/mobile-command-centre-v2.spec.ts')
          source = path.read_text()
          old = """  if (await opportunityZero.count()) {\n    await expect(opportunityZero).toContainText('No matching opportunities currently')\n    await expect(opportunityZero).toBeVisible()\n  } else {\n    await expect(populatedOpportunity).toBeVisible()\n  }\n"""
          new = """  if (await opportunityZero.count()) {\n    const zeroState = await opportunityZero.getAttribute('data-command-zero-state')\n    expect(['empty', 'no-match']).toContain(zeroState)\n    await expect(opportunityZero).toContainText(\n      zeroState === 'no-match' ? 'No matching opportunities currently' : 'No opportunities are available yet',\n    )\n    await expect(opportunityZero).toBeVisible()\n  } else {\n    await expect(populatedOpportunity).toBeVisible()\n  }\n"""
          if old not in source:
              raise SystemExit('Expected stale opportunity zero-state assertion was not found; refusing an ambiguous edit')
          path.write_text(source.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-command-evidence-repair.yml
          git diff --check
          git diff -- tests/e2e/mobile-command-centre-v2.spec.ts

      - name: Commit focused repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Harbourview CI'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/e2e/mobile-command-centre-v2.spec.ts .github/workflows/tmp-command-evidence-repair.yml
          git diff --cached --check
          git commit -m 'test(command): make zero-state evidence assertion state-aware'
          git push origin HEAD:agent/mobile-command-p0-remediation-20260813
