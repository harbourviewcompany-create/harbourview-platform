name: Type check

on:
  # The `pull_request: [main]` and `push: [main]` triggers were removed because
  # `ci.yml`'s "Type Check" job runs the identical `npm run typecheck` on those
  # same events, against a shared cached node_modules rather than a separate
  # `npm install` — a strictly more expensive duplicate.
  #
  # `push: [claude/intelligence-pipeline-complete]` is NOT a duplicate and is
  # retained: `ci.yml` triggers only on `main`, so removing this left that
  # branch with no typecheck at all. An earlier revision of this comment
  # claimed ci.yml covered "the same push/pull_request events" — that was
  # wrong for this branch.
  push:
    branches:
      - claude/intelligence-pipeline-complete
  workflow_dispatch:

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Type check
        run: npm run typecheck
