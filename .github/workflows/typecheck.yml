name: Type check

on:
  # Automatic triggers removed: `ci.yml`'s "Type Check" job runs the identical
  # `npm run typecheck` on the same push/pull_request events, and does so
  # against a shared, cached node_modules rather than a separate
  # `npm install` — so this workflow was a strictly more expensive duplicate.
  # Kept dispatchable for running a typecheck in isolation on demand.
  workflow_dispatch:

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Type check
        run: npm run typecheck
