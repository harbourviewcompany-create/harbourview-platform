name: PR 1222 Supply Visual Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-visual:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/supply-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright package
        run: npm install --no-save --ignore-scripts playwright@1.54.0

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start built app
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/harbourview-next.log 2>&1 &
          echo $! > /tmp/harbourview-next.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/supply >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/harbourview-next.log
          exit 1

      - name: Capture supply screenshots
        env:
          BASE_URL: http://127.0.0.1:3000
        run: |
          mkdir -p verification-results/pr1222-supply
          cat > scripts/capture-pr1222-supply.mjs <<'EOF'
          import { chromium } from 'playwright'
          import fs from 'node:fs/promises'

          const base = process.env.BASE_URL
          const out = 'verification-results/pr1222-supply'
          const routes = [
            { name: 'catalog', path: '/supply' },
            { name: 'detail-cr-mylar-pouch-3-5g-matte-black', path: '/supply/cr-mylar-pouch-3-5g-matte-black' },
          ]
          const viewports = [
            { name: '375', width: 375, height: 812 },
            { name: '1440', width: 1440, height: 1100 },
          ]

          await fs.mkdir(out, { recursive: true })
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox'],
          })
          const manifest = []
          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height }, deviceScaleFactor: 1 })
              const page = await context.newPage()
              await page.emulateMedia({ reducedMotion: 'reduce' })
              for (const route of routes) {
                const url = `${base}${route.path}`
                const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 })
                if (!response || !response.ok()) throw new Error(`${url} returned ${response?.status() ?? 'no response'}`)
                const filename = `${out}/${route.name}-${viewport.name}.png`
                await page.screenshot({ path: filename, fullPage: true })
                const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth)
                if (overflow) throw new Error(`${url} has horizontal overflow at ${viewport.width}px`)
                manifest.push({ route: route.path, viewport, filename, status: response.status(), title: await page.title() })
              }
              await context.close()
            }
          } finally {
            await browser.close()
          }
          await fs.writeFile(`${out}/manifest.json`, JSON.stringify(manifest, null, 2))
          EOF
          node scripts/capture-pr1222-supply.mjs
          rm scripts/capture-pr1222-supply.mjs

      - name: Verify exact protected Vercel routes
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_IMMUTABLE_BASE_URL: https://harbourview-7gq72hysc-harbourview.vercel.app
        run: |
          mkdir -p verification-results/pr1222-vercel
          cat > scripts/verify-pr1222-vercel-routes.mjs <<'EOF'
          import fs from 'node:fs/promises'

          const base = process.env.VERCEL_IMMUTABLE_BASE_URL
          const bypass = process.env.VERCEL_AUTOMATION_BYPASS_SECRET
          if (!base) throw new Error('VERCEL_IMMUTABLE_BASE_URL is required')
          if (!bypass) throw new Error('VERCEL_AUTOMATION_BYPASS_SECRET is required')

          const routes = [
            {
              path: '/supply',
              expectedTitle: 'Supply Catalog | Harbourview',
              requiredText: ['Harbourview Supply', 'Browse the catalog', 'Request a Quote'],
            },
            {
              path: '/supply/cr-mylar-pouch-3-5g-matte-black',
              expectedTitle: 'Child-Resistant Mylar Pouch, 3.5g, Matte Black | Harbourview Supply',
              requiredText: ['Harbourview Supply', 'Child-Resistant Mylar Pouch, 3.5g, Matte Black', 'Commercial review'],
            },
          ]

          const decode = (value) => value
            .replace(/&amp;/g, '&')
            .replace(/&quot;/g, '"')
            .replace(/&#39;/g, "'")
            .replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>')

          const visibleText = (html) => decode(html
            .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ')
            .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ')
            .replace(/<[^>]+>/g, ' ')
            .replace(/\s+/g, ' ')
            .trim())

          const results = []
          for (const route of routes) {
            const requestedUrl = `${base}${route.path}`
            const response = await fetch(requestedUrl, {
              redirect: 'follow',
              headers: {
                'x-vercel-protection-bypass': bypass,
                'x-vercel-set-bypass-cookie': 'true',
                'user-agent': 'Harbourview-PR1222-Verification/1.0',
              },
            })
            const html = await response.text()
            const titleMatch = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)
            const title = titleMatch ? decode(titleMatch[1].replace(/\s+/g, ' ').trim()) : ''
            const text = visibleText(html)
            const requiredText = route.requiredText.map((marker) => ({ marker, present: text.includes(marker) }))
            const result = {
              requestedUrl,
              status: response.status,
              finalUrl: response.url,
              title,
              expectedTitle: route.expectedTitle,
              titleMatches: title === route.expectedTitle,
              requiredText,
              visibleTextExcerpt: text.slice(0, 1200),
            }
            results.push(result)

            if (response.status !== 200) throw new Error(`${requestedUrl} returned ${response.status}; final URL ${response.url}`)
            if (response.url.includes('vercel.com/sso-api')) throw new Error(`${requestedUrl} remained behind Vercel SSO`)
            if (title !== route.expectedTitle) throw new Error(`${requestedUrl} title mismatch: ${JSON.stringify(title)}`)
            const missing = requiredText.filter((item) => !item.present).map((item) => item.marker)
            if (missing.length) throw new Error(`${requestedUrl} missing visible text: ${missing.join(', ')}`)
          }

          const output = {
            verifiedAt: new Date().toISOString(),
            deploymentBaseUrl: base,
            githubSha: process.env.GITHUB_SHA,
            routes: results,
          }
          await fs.writeFile('verification-results/pr1222-vercel/route-verification.json', JSON.stringify(output, null, 2))
          await fs.writeFile(
            'verification-results/pr1222-vercel/route-verification.md',
            [
              '# PR #1222 protected Vercel route verification',
              '',
              `- Verified at: ${output.verifiedAt}`,
              `- Workflow SHA: ${output.githubSha}`,
              `- Immutable deployment: ${base}`,
              '',
              ...results.flatMap((result) => [
                `## ${new URL(result.requestedUrl).pathname}`,
                '',
                `- HTTP status: ${result.status}`,
                `- Effective URL: ${result.finalUrl}`,
                `- Page title: ${result.title}`,
                `- Required visible text: ${result.requiredText.map((item) => `${item.marker}=${item.present ? 'present' : 'missing'}`).join('; ')}`,
                '',
              ]),
            ].join('\n'),
          )
          console.log(JSON.stringify(output, null, 2))
          EOF
          node scripts/verify-pr1222-vercel-routes.mjs
          rm scripts/verify-pr1222-vercel-routes.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1222-supply-responsive-screenshots
          path: verification-results/pr1222-supply/
          if-no-files-found: error
          retention-days: 30

      - name: Upload protected-route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1222-vercel-protected-route-verification
          path: verification-results/pr1222-vercel/
          if-no-files-found: error
          retention-days: 30
