name: Apply Clinical Prescriber OS production migrations

# =============================================================================
# Clinical Prescriber OS — Production Migration Runner
# Target DB: zvxdgdkukjrrwamdpqrg (Supabase pooler)
#
# SAFETY
#   - Requires confirm=APPLY
#   - Protected by GitHub environment: production-database
#   - Concurrency group prevents overlapping runs
#   - Idempotent via supabase_migrations.schema_migrations ledger
#
# RECOVERY NOTES (forward-only migrations)
#   1. Identify last successful version:
#        SELECT version FROM supabase_migrations.schema_migrations
#        ORDER BY version DESC LIMIT 20;
#   2. Individual SQL files are expected to be defensive / re-runnable.
#   3. If a migration leaves the schema in a bad state, restore from
#      Supabase Point-in-Time Recovery (PITR) to a timestamp before the run.
#   4. After recovery, re-run the appropriate phase with confirm=APPLY.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to run Clinical Prescriber OS migrations on production zvxdgdkukjrrwamdpqrg'
        required: true
        type: string
      phase:
        description: 'Which phase to apply'
        required: true
        type: choice
        default: full-prescriber
        options:
          - foundation
          - patient-core
          - prescriber-os
          - api-exposure
          - full-prescriber
      dry_run:
        description: 'If true, only list what would be applied and run verification (no writes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: clinical-prescriber-os-production
  cancel-in-progress: false

jobs:
  apply:
    name: Apply Clinical migrations on zvxdgdkukjrrwamdpqrg
    runs-on: ubuntu-latest
    environment: production-database
    timeout-minutes: 30
    steps:
      - name: Require APPLY confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "APPLY" ]; then
            echo "::error::Refusing to run. Set confirm=APPLY."
            exit 1
          fi

      - name: Run header
        run: |
          echo "=============================================="
          echo "Clinical Prescriber OS Production Migration"
          echo "Phase:     ${{ inputs.phase }}"
          echo "Dry-run:   ${{ inputs.dry_run }}"
          echo "Runner:    ${{ runner.name }}"
          echo "Run ID:    ${{ github.run_id }}"
          echo "Run URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "=============================================="

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Apply ordered Clinical SQL
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: aws-1-us-west-2.pooler.supabase.com
          PGPORT: "5432"
          PGUSER: postgres.zvxdgdkukjrrwamdpqrg
          PGDATABASE: postgres
          PGCONNECT_TIMEOUT: "10"
          PHASE: ${{ inputs.phase }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          apply() {
            local f="$1"
            test -f "$f"
            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY-RUN] Would apply $f"
              return 0
            fi
            echo "Applying $f ..."
            psql -v ON_ERROR_STOP=1 -f "$f"
          }

          record() {
            local VERSION="$1"
            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY-RUN] Would record version $VERSION"
              return 0
            fi
            psql -v ON_ERROR_STOP=1 -c "INSERT INTO supabase_migrations.schema_migrations (version) VALUES ('$VERSION') ON CONFLICT DO NOTHING;"
            echo "Recorded version $VERSION"
          }

          # --- Phase definitions ---
          foundation=(
            supabase/migrations/20260814134500_clinical_evidence_v1_governance.sql
            supabase/migrations/20260814135500_clinical_evidence_v1_source_reconciliation.sql
            supabase/migrations/20260814143500_clinical_evidence_v1_production_foundation.sql
            supabase/migrations/20260814144000_clinical_evidence_v1_audit_immutability.sql
            supabase/migrations/20260814150000_clinical_evidence_v1_1_operations.sql
            supabase/migrations/20260814151000_clinical_evidence_v1_1_canadian_nabilone_source.sql
          )
          # Patient / consent / care-team / encounter core required by Prescriber OS
          # reconciliation (FK to clinical_patients, clinical_has_active_consent, etc.)
          patient_core=(
            supabase/migrations/20260727160000_clinical_control_foundation.sql
            supabase/migrations/20260727161000_clinical_patient_core.sql
            supabase/migrations/20260727162000_clinical_workflows.sql
          )
          prescriber=(
            supabase/migrations/20260818210936_clinical_monitoring_protocols.sql
            supabase/migrations/20260818212800_clinical_prescriber_governance_preflight.sql
            supabase/migrations/20260818212900_clinical_interaction_published_uniqueness.sql
            supabase/migrations/20260818213000_clinical_prescriber_os_reconciliation.sql
            supabase/migrations/20260818213100_clinical_provenance_remediation_audit.sql
            supabase/migrations/20260818213200_clinical_prescriber_sku_links.sql
            supabase/migrations/20260818213300_clinical_prescriber_pharmacovigilance.sql
          )
          exposure=(
            supabase/migrations/20260819210000_clinical_prescriber_os_api_schema_exposure.sql
          )

          # --- Dependency guards ---
          require_versions() {
            local label="$1"
            shift
            local missing=0
            for v in "$@"; do
              exists=$(psql -qAt -c "select 1 from supabase_migrations.schema_migrations where version = '$v' limit 1" || true)
              if [ "$exists" != "1" ]; then
                echo "::error::Missing required migration version $v (needed for $label)"
                missing=1
              fi
            done
            if [ "$missing" -eq 1 ]; then
              echo "::error::Dependency check failed for $label. Apply prerequisite phases first."
              exit 1
            fi
            echo "Dependency check passed for $label"
          }

          case "$PHASE" in
            prescriber-os|full-prescriber)
              require_versions "patient-core" \
                "20260727160000" "20260727161000" "20260727162000"
              ;;
            api-exposure)
              # Soft dependency: exposure is more useful after prescriber, but not hard-required
              ;;
          esac

          run_list() {
            local -n arr=$1
            local applied=0 skipped=0
            for f in "${arr[@]}"; do
              ver=$(basename "$f" | cut -d_ -f1)
              exists=$(psql -qAt -c "select 1 from supabase_migrations.schema_migrations where version = '$ver' limit 1" || true)
              if [ "$exists" = "1" ]; then
                echo "Skip $ver (already in schema_migrations)"
                skipped=$((skipped + 1))
                continue
              fi
              apply "$f"
              record "$ver"
              applied=$((applied + 1))
            done
            echo "List summary: applied=$applied skipped=$skipped"
          }

          echo "Starting phase: $PHASE (dry_run=$DRY_RUN)"

          case "$PHASE" in
            foundation)
              run_list foundation
              ;;
            patient-core)
              run_list patient_core
              ;;
            prescriber-os)
              run_list patient_core
              run_list prescriber
              ;;
            api-exposure)
              run_list exposure
              ;;
            full-prescriber)
              run_list foundation
              run_list patient_core
              run_list prescriber
              run_list exposure
              ;;
            *)
              echo "::error::Unknown phase: $PHASE"
              exit 1
              ;;
          esac

          echo "Phase $PHASE complete."

      - name: Verify schema objects and dump ledger
        if: always()
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: aws-1-us-west-2.pooler.supabase.com
          PGPORT: "5432"
          PGUSER: postgres.zvxdgdkukjrrwamdpqrg
          PGDATABASE: postgres
          PGCONNECT_TIMEOUT: "10"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Verification + ledger dump"
          echo "=============================================="

          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- Core tables / views that Prescriber OS and API exposure expect
          SELECT
            to_regclass('public.clinical_patients')              AS patients,
            to_regclass('public.clinical_encounters')            AS encounters,
            to_regclass('api.clinical_safety_rules')             AS safety,
            to_regclass('api.clinical_regimen_protocols')        AS regimen,
            to_regclass('api.clinical_monitoring_protocols')     AS monitoring,
            to_regclass('api.clinical_guideline_recommendations') AS guidelines,
            to_regclass('api.clinical_evidence_records')         AS evidence;

          -- Foundation columns on clinical_evidence_records
          SELECT count(*) AS foundation_cols
          FROM information_schema.columns
          WHERE table_schema = 'public'
            AND table_name = 'clinical_evidence_records'
            AND column_name IN ('publication_scope', 'freshness_status', 'grading_method_key');

          -- Hard assertions (fail the job if missing after a real apply)
          DO $$
          BEGIN
            IF to_regclass('public.clinical_patients') IS NULL THEN
              RAISE EXCEPTION 'Missing public.clinical_patients';
            END IF;
            IF to_regclass('public.clinical_encounters') IS NULL THEN
              RAISE EXCEPTION 'Missing public.clinical_encounters';
            END IF;
          END $$;

          -- Recent migration ledger (last 25 versions)
          SELECT version
          FROM supabase_migrations.schema_migrations
          ORDER BY version DESC
          LIMIT 25;
          SQL

          echo "=============================================="
          echo "Verification PASS"
          echo "=============================================="
