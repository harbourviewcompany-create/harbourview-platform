name: PR Completion Plan

on:
  push:
    branches: [ops/pr-completion-plan-20260815]
    paths:
      - .github/workflows/pr-completion-plan.yml
      - ops/pr-completion-plan-trigger.txt

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect merges against current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          branches=(
            'agent/p0-org-onboarding-regression-20260815'
            'release-closure-20260814'
            'ops/production-baseline-20260814'
            'agent/clinical-professional-command-20260814'
            'fix/command-centre-standalone-wiring-v2'
            'agent/mobile-command-p0-remediation-20260813'
            'kimi/rebase-decision-intel-2026-08-12'
            'kimi/rebase-transactions-2026-08-12'
          )
          for branch in "${branches[@]}"; do
            echo "===== ${branch} ====="
            git reset --hard >/dev/null
            git clean -fd >/dev/null
            git checkout -B merge-plan "origin/${branch}" >/dev/null 2>&1
            if git merge --no-commit --no-ff origin/main >/tmp/merge.out 2>&1; then
              echo 'CLEAN'
              git merge --abort >/dev/null 2>&1 || true
            else
              echo 'CONFLICTS:'
              git diff --name-only --diff-filter=U | sort
              git merge --abort >/dev/null 2>&1 || true
            fi
          done
