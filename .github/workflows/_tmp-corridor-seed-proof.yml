name: Temporary Corridor Seed Proof

on:
  push:
    branches:
      - fix/corridor-replay-seed-fidelity-20260816
    paths:
      - .github/workflows/_tmp-corridor-seed-proof.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/corridor-replay-seed-fidelity-20260816
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact provenance and replay-count assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260701230000_corridor_intelligence_tables_stub.sql')
          text = path.read_text()
          old = '-- Reconstructed from production migration-ledger evidence for zero-state replay.\n'
          new = '-- Reconstructed from the live production catalog for zero-state migration replay.\n-- Seed values below are restored from production migration-ledger evidence.\n'
          if old not in text:
              raise SystemExit('expected corridor reconstruction provenance header not found')
          text = text.replace(old, new, 1)
          assertion = '''\n\n-- Fail closed if replay no longer reproduces the production seed cardinalities.\ndo $corridor_seed_fidelity$\nbegin\n  if (select count(*) from public.corridor_processing_times) <> 59 then\n    raise exception 'corridor_processing_times replay seed count mismatch';\n  end if;\n  if (select count(*) from public.corridor_regulatory_alerts) <> 15 then\n    raise exception 'corridor_regulatory_alerts replay seed count mismatch';\n  end if;\nend\n$corridor_seed_fidelity$;\n'''
          if '$corridor_seed_fidelity$' not in text:
              text += assertion
          path.write_text(text)
          PY
          git diff --check -- supabase/migrations/20260701230000_corridor_intelligence_tables_stub.sql

      - name: Commit migration only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260701230000_corridor_intelligence_tables_stub.sql
          git commit -m "test(migrations): assert corridor replay seed counts"
          git push origin HEAD:fix/corridor-replay-seed-fidelity-20260816
