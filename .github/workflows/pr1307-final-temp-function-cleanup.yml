name: PR1307 Final Temporary Edge Function Cleanup

on:
  push:
    branches:
      - audit/pr1307-marketplace-media-final-20260812
    paths:
      - .github/workflows/pr1307-final-temp-function-cleanup.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Delete PR1307 temporary functions and prove absence
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=zvxdgdkukjrrwamdpqrg
          for fn in \
            pr1307-semantic-media-rollout-temp \
            pr1307-media-finalize-temp \
            pr1307-media-final-asset-transfer-temp \
            pr1307-media-final-audit-export-temp
          do
            if supabase functions list --project-ref "$PROJECT" | grep -q "$fn"; then
              supabase functions delete "$fn" --project-ref "$PROJECT"
            fi
          done
          LIST="$(supabase functions list --project-ref "$PROJECT")"
          for fn in \
            pr1307-semantic-media-rollout-temp \
            pr1307-media-finalize-temp \
            pr1307-media-final-asset-transfer-temp \
            pr1307-media-final-audit-export-temp
          do
            if printf '%s\n' "$LIST" | grep -q "$fn"; then
              echo "Temporary function still present: $fn" >&2
              exit 1
            fi
          done
          echo 'PASS: all PR1307 temporary Edge Functions absent'
