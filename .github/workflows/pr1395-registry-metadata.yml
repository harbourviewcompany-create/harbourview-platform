name: PR 1395 Registry Metadata Repair

on:
  push:
    branches:
      - fix/pr1344-reconstruction-repair
    paths:
      - .github/workflows/pr1395-registry-metadata.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/pr1344-reconstruction-repair
          fetch-depth: 0
          persist-credentials: true
      - name: Update PR registry impact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(cat <<'EOF'
          ## Summary
          Complete the PR 1344 reconstruction on current main while preserving newer main-side entitlement, Stripe, mobile Command architecture, and control history.

          ## Registry Impact
          - [x] Harbourview Platform
          - [x] No - no registry change required

          This repair does not create a new project, deployment target, Supabase project, external service, or ownership boundary.
          EOF
          )
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/1395" --raw-field body="$BODY" >/dev/null
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr1395-registry-metadata.yml
          git config user.name 'harbourview-release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove PR 1395 registry metadata repair workflow'
          git push origin HEAD:fix/pr1344-reconstruction-repair
