name: PR32 Local Verification

on:
  push:
    branches:
      - harbourview-globe-v1-tickets-1-3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: npm ci, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm run build
        run: npm run build
