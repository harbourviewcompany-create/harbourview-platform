name: Wrangler Security Pin

on:
  push:
    branches:
      - build/harbourview-production-command-platform
    paths:
      - .github/workflows/wrangler-security-pin.yml

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: wrangler-security-pin-production-command-platform
  cancel-in-progress: false

jobs:
  pin-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Pin audited Wrangler release in dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/wrangler-security-pin
          npm install --package-lock-only --ignore-scripts --save-dev-exact wrangler@4.35.0
          git diff -- package.json package-lock.json > artifacts/wrangler-security-pin/dependency.patch

      - name: Install exact dependency tree
        run: npm ci

      - name: Verify Wrangler and build Worker without deployment
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler --version | tee artifacts/wrangler-security-pin/wrangler-version.txt
          npx wrangler deploy --dry-run --outdir artifacts/wrangler-security-pin/worker-bundle

      - name: Verify dependency vulnerability ceiling
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > artifacts/wrangler-security-pin/npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('artifacts/wrangler-security-pin/npm-audit.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          const summary = {
            critical: Number(counts.critical ?? 0),
            high: Number(counts.high ?? 0),
            moderate: Number(counts.moderate ?? 0),
            low: Number(counts.low ?? 0),
            total: Number(counts.total ?? 0),
          }
          fs.writeFileSync(
            'artifacts/wrangler-security-pin/audit-summary.json',
            `${JSON.stringify(summary, null, 2)}\n`,
          )
          console.log(summary)
          if (summary.critical > 0 || summary.high > 0) process.exitCode = 1
          NODE

      - name: Commit verified dependency pin
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency metadata change was required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(security): pin audited Wrangler dependency'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:build/harbourview-production-command-platform
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Upload pin and dry-run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wrangler-security-pin-${{ github.run_id }}
          path: artifacts/wrangler-security-pin/
          if-no-files-found: warn
          retention-days: 14

      - name: Record pin result on open PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            echo 'No open PR found for this branch; skipping PR comment.'
            exit 0
          fi
          audit_summary='not generated'
          if [ -f artifacts/wrangler-security-pin/audit-summary.json ]; then
            audit_summary="$(tr -d '\n' < artifacts/wrangler-security-pin/audit-summary.json)"
          fi
          gh pr comment "$pr_number" --body "Wrangler security pin run [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) completed with status **${JOB_RESULT}**. Audit summary: \`${audit_summary}\`. Artifact: \`wrangler-security-pin-${GITHUB_RUN_ID}\`."
