name: Wrangler Security Pin

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/wrangler-security-pin.yml

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: wrangler-security-pin-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pin-and-verify:
    if: github.head_ref == 'build/harbourview-production-command-platform'
    name: Pin and verify audited Wrangler toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Pin patched Wrangler and Undici dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/wrangler-security-pin
          npm pkg set 'overrides.undici=7.29.0'
          npm install --package-lock-only --ignore-scripts --save-dev-exact wrangler@4.118.0
          git diff -- package.json package-lock.json > artifacts/wrangler-security-pin/dependency.patch

      - name: Install exact dependency tree
        run: npm ci

      - name: Verify Wrangler and build Worker without deployment
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler --version | tee artifacts/wrangler-security-pin/wrangler-version.txt
          node -e "const version=require('undici/package.json').version; console.log('undici', version); if(version!=='7.29.0') process.exit(1)" | tee artifacts/wrangler-security-pin/undici-version.txt
          npx wrangler deploy --dry-run --outdir artifacts/wrangler-security-pin/worker-bundle

      - name: Verify dependency vulnerability ceiling
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > artifacts/wrangler-security-pin/npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('artifacts/wrangler-security-pin/npm-audit.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          const summary = {
            critical: Number(counts.critical ?? 0),
            high: Number(counts.high ?? 0),
            moderate: Number(counts.moderate ?? 0),
            low: Number(counts.low ?? 0),
            total: Number(counts.total ?? 0),
          }
          fs.writeFileSync(
            'artifacts/wrangler-security-pin/audit-summary.json',
            `${JSON.stringify(summary, null, 2)}\n`,
          )
          console.log(summary)
          if (summary.critical > 0 || summary.high > 0) process.exitCode = 1
          NODE

      - name: Commit verified dependency pin to PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency metadata change was required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(security): pin audited Wrangler dependency'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:${{ github.head_ref }}
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Upload pin and dry-run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wrangler-security-pin-${{ github.run_id }}
          path: artifacts/wrangler-security-pin/
          if-no-files-found: warn
          retention-days: 14
