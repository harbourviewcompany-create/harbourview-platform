name: Wrangler Security Pin

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/wrangler-security-pin.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: wrangler-security-pin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  pin-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.head_ref || 'build/mobile-command-centre-v2' }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Override vulnerable Undici transitive dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/wrangler-security-pin
          npm pkg set 'overrides.undici=7.29.0'
          npm install --package-lock-only --ignore-scripts
          git diff -- package.json package-lock.json > artifacts/wrangler-security-pin/dependency.patch

      - name: Install exact dependency tree
        run: npm ci

      - name: Verify resolved dependency graph
        shell: bash
        run: |
          set -euo pipefail
          npm ls wrangler miniflare undici | tee artifacts/wrangler-security-pin/dependency-tree.txt
          node <<'NODE'
          const fs = require('node:fs')
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const resolved = lock.packages?.['node_modules/undici']?.version
          if (resolved !== '7.29.0') {
            throw new Error(`Expected undici 7.29.0, resolved ${resolved ?? 'missing'}`)
          }
          console.log(`Resolved patched undici ${resolved}`)
          NODE

      - name: Verify Wrangler and build Worker without deployment
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler --version | tee artifacts/wrangler-security-pin/wrangler-version.txt
          npx wrangler deploy --dry-run --outdir artifacts/wrangler-security-pin/worker-bundle

      - name: Verify dependency vulnerability ceiling
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > artifacts/wrangler-security-pin/npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('artifacts/wrangler-security-pin/npm-audit.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          const summary = {
            critical: Number(counts.critical ?? 0),
            high: Number(counts.high ?? 0),
            moderate: Number(counts.moderate ?? 0),
            low: Number(counts.low ?? 0),
            total: Number(counts.total ?? 0),
          }
          fs.writeFileSync(
            'artifacts/wrangler-security-pin/audit-summary.json',
            `${JSON.stringify(summary, null, 2)}\n`,
          )
          console.log(summary)
          if (summary.critical > 0 || summary.high > 0) process.exitCode = 1
          NODE

      - name: Commit verified dependency override
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency metadata change was required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(security): override vulnerable Undici transitive'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${TARGET_BRANCH}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Upload dependency and Worker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wrangler-security-pin-${{ github.run_id }}
          path: artifacts/wrangler-security-pin/
          if-no-files-found: warn
          retention-days: 14

      - name: Record verification result on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="${PR_NUMBER:-}"
          if [ -z "$pr_number" ]; then
            pr_number="$(gh pr list --head "${TARGET_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          fi
          if [ -z "$pr_number" ]; then
            echo 'No open PR found for this branch; skipping PR comment.'
            exit 0
          fi
          audit_summary='not generated'
          if [ -f artifacts/wrangler-security-pin/audit-summary.json ]; then
            audit_summary="$(tr -d '\n' < artifacts/wrangler-security-pin/audit-summary.json)"
          fi
          gh pr comment "$pr_number" --body "Dependency and Wrangler verification run [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) completed with status **${JOB_RESULT}** against source \`${TARGET_SHA}\`. Audit summary: \`${audit_summary}\`. Artifact: \`wrangler-security-pin-${GITHUB_RUN_ID}\`."
