name: Prepare Harbourview Recovery Replay

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize production-faithful replay
        run: node scripts/prepare-production-faithful-migration-replay.mjs --apply

      - name: Commit prepared replay to recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Harbourview Recovery"
          git config user.email "harbourviewcompany@gmail.com"
          git rm .github/workflows/recovery-prepare-supabase-replay.yml
          git add -A supabase/migrations
          git commit -m "chore(recovery): materialize production-faithful Supabase replay"
          git push origin "HEAD:${{ github.head_ref }}"
