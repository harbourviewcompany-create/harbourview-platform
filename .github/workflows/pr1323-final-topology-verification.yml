name: PR 1323 Final Topology Verification

on:
  push:
    branches:
      - fix/globe-antimeridian-generator-hardening
    paths:
      - 'scripts/generate-natural-earth-countries.mjs'
      - 'tests/harbourview/natural-earth-antimeridian-topology.test.ts'
      - 'tests/harbourview/russia-spherical-triangulation.test.ts'
      - 'tests/globe-polygon-rendering.test.ts'
      - 'data/globe/natural-earth-countries.ts'
      - '.github/workflows/pr1323-final-topology-verification.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Reproduce pre-fix multi-crossing source-hole loss
        run: |
          git show d91ee35bf008715b37a9e94df242242e73191917:scripts/generate-natural-earth-countries.mjs > /tmp/pre-source-hole-fix.mjs
          node --input-type=module <<'NODE'
          import * as generator from 'file:///tmp/pre-source-hole-fix.mjs'
          const geometry = {
            type: 'Polygon',
            coordinates: [
              [[160, 70], [-160, 70], [-160, 20], [160, 20], [160, 70]],
              [[170, 60], [-170, 60], [-170, 50], [170, 50], [170, 45], [-170, 45], [-170, 35], [170, 35], [170, 60]],
            ],
          }
          const fragments = generator.splitRingAtAntimeridian(geometry.coordinates[1])
          const areas = fragments.map(generator.signedRingAreaDeg2)
          const referenceIndex = areas.reduce((best, area, index) => Math.abs(area) > Math.abs(areas[best]) ? index : best, 0)
          const referenceSign = Math.sign(areas[referenceIndex])
          const solidIslands = fragments.filter((fragment, index) => {
            const sign = Math.sign(areas[index])
            return referenceSign !== 0 && sign !== 0 && sign !== referenceSign
          })
          if (solidIslands.length === 0) throw new Error('diagnostic failed to construct a multi-crossing source-hole island')
          const polygons = generator.normalizePolygons(geometry, 0)
          const sameRing = (a, b) => JSON.stringify(a) === JSON.stringify(b)
          const preservedAsOuter = solidIslands.filter((island) => polygons.some((polygon) => {
            const outer = polygon.rings.find((ring) => ring.kind === 'outer')
            return outer && sameRing(outer.points, island)
          })).length
          const misclassifiedAsHole = solidIslands.filter((island) => polygons.some((polygon) =>
            polygon.rings.some((ring) => ring.kind === 'hole' && sameRing(ring.points, island)),
          )).length
          console.log(JSON.stringify({ solidIslandCount: solidIslands.length, preservedAsOuter, misclassifiedAsHole }))
          if (preservedAsOuter !== 0 || misclassifiedAsHole === 0) {
            throw new Error('pre-fix generator did not reproduce the reviewed source-hole topology defect')
          }
          NODE

      - name: Apply validated topology-test accounting and source-hole regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/harbourview/natural-earth-antimeridian-topology.test.ts')
          text = path.read_text()

          text = text.replace(
            "          const sourceAbsoluteArea = Math.abs(generator.signedRingAreaDeg2(sourceHole))\n",
            "          const expectedAbsoluteArea = eligibleFragments.reduce(\n            (sum, fragment) => sum + Math.abs(generator.signedRingAreaDeg2(fragment)),\n            0,\n          )\n",
          )
          text = text.replace('            sourceAbsoluteArea,\n', '            expectedAbsoluteArea,\n')
          text = text.replace('      sourceAbsoluteArea: number\n', '      expectedAbsoluteArea: number\n')
          text = text.replace(
            'Math.abs(sourceHole.sourceAbsoluteArea - sourceHole.matchedAbsoluteArea)',
            'Math.abs(sourceHole.expectedAbsoluteArea - sourceHole.matchedAbsoluteArea)',
          )
          text = text.replace(
            'source=${sourceHole.sourceAbsoluteArea}',
            'expected=${sourceHole.expectedAbsoluteArea}',
          )

          marker = "test('holes owned only by MIN_POLYGON_AREA_DEG2-discarded fragments are excluded', () => {"
          regression = r'''test('multi-crossing source hole preserves opposite-winding solid islands', () => {
  const result = runGeometryProbe<{
    cutoutCount: number
    preservedIslandOuterCount: number
    cutoutMisclassifiedAsHoleCount: number
  }>(`
    const geometry = {
      type: 'Polygon',
      coordinates: [
        [[160, 70], [-160, 70], [-160, 20], [160, 20], [160, 70]],
        [[170, 60], [-170, 60], [-170, 50], [170, 50], [170, 45], [-170, 45], [-170, 35], [170, 35], [170, 60]],
      ],
    }
    const topology = generator.classifySplitRingFragments(geometry.coordinates[1], 0)
    const polygons = generator.normalizePolygons(geometry, 0)
    const sameRing = (a, b) => JSON.stringify(a) === JSON.stringify(b)
    const preservedIslandOuterCount = topology.cutouts.filter((cutout) =>
      polygons.some((polygon) => {
        const outer = polygon.rings.find((ring) => ring.kind === 'outer')
        return outer && sameRing(outer.points, cutout)
      }),
    ).length
    const cutoutMisclassifiedAsHoleCount = topology.cutouts.filter((cutout) =>
      polygons.some((polygon) => polygon.rings.some((ring) =>
        ring.kind === 'hole' && sameRing(ring.points, cutout),
      )),
    ).length
    console.log(JSON.stringify({
      cutoutCount: topology.cutouts.length,
      preservedIslandOuterCount,
      cutoutMisclassifiedAsHoleCount,
    }))
  `)

  assert.ok(result.cutoutCount > 0, 'synthetic source hole must contain an opposite-winding solid island')
  assert.equal(
    result.preservedIslandOuterCount,
    result.cutoutCount,
    'every opposite-winding source-hole fragment must survive as solid geography',
  )
  assert.equal(
    result.cutoutMisclassifiedAsHoleCount,
    0,
    'opposite-winding source-hole fragments must not be emitted as holes',
  )
}, 60_000)

'''
          if 'multi-crossing source hole preserves opposite-winding solid islands' not in text:
            if marker not in text:
              raise SystemExit('source-hole regression insertion marker not found')
            text = text.replace(marker, regression + marker, 1)

          path.write_text(text)
          PY

          if ! git diff --quiet -- tests/harbourview/natural-earth-antimeridian-topology.test.ts; then
            git config user.name 'Harbourview Release Bot'
            git config user.email 'harbourviewcompany@gmail.com'
            git add tests/harbourview/natural-earth-antimeridian-topology.test.ts
            git commit -m 'test(globe): verify multi-crossing source-hole preservation'
            git push origin HEAD:fix/globe-antimeridian-generator-hardening
          fi

      - name: Verify committed payload matches one regeneration
        run: |
          cp data/globe/natural-earth-countries.ts /tmp/committed.ts
          node scripts/generate-natural-earth-countries.mjs
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          committed = Path('/tmp/committed.ts').read_text()
          regenerated = Path('data/globe/natural-earth-countries.ts').read_text()
          normalize = lambda s: re.sub(r"generatedAt: '[^']+'", "generatedAt: '<normalized>'", s)
          a, b = normalize(committed), normalize(regenerated)
          if a != b:
              raise SystemExit('Committed Natural Earth payload differs from generator output after generatedAt normalization')
          print('committed_payload_normalized_sha256=' + hashlib.sha256(a.encode()).hexdigest())
          PY

      - name: Verify complete antimeridian topology suite
        run: npx vitest run tests/harbourview/natural-earth-antimeridian-topology.test.ts

      - name: Verify Russia spherical regression
        run: npx vitest run tests/harbourview/russia-spherical-triangulation.test.ts

      - name: Verify established globe polygon regression
        run: npx vitest run tests/globe-polygon-rendering.test.ts

      - name: Verify normalized two-run regeneration reproducibility
        run: |
          cp data/globe/natural-earth-countries.ts /tmp/first.ts
          sleep 1
          node scripts/generate-natural-earth-countries.mjs
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          first = Path('/tmp/first.ts').read_text()
          second = Path('data/globe/natural-earth-countries.ts').read_text()
          normalize = lambda s: re.sub(r"generatedAt: '[^']+'", "generatedAt: '<normalized>'", s)
          a, b = normalize(first), normalize(second)
          if a != b:
              raise SystemExit('Generated Natural Earth geometry is not deterministic after generatedAt normalization')
          print('normalized_sha256=' + hashlib.sha256(a.encode()).hexdigest())
          PY

      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full tests
        run: npm run test
      - name: Targeted security leakage
        run: npx vitest run tests/harbourview/public-dom-forbidden-strings.test.tsx tests/harbourview/public-route-smoke.test.ts tests/network/public-projection-leakage.test.ts tests/marketplace/publicProjection.test.ts
      - name: Production build
        run: npm run build
