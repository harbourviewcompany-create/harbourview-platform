name: PR 1323 Final Topology Verification

on:
  push:
    branches:
      - fix/globe-antimeridian-generator-hardening
    paths:
      - 'docs/control/EVIDENCE_LOG.md'
      - '.github/workflows/pr1323-final-topology-verification.yml'

permissions:
  contents: write

jobs:
  record-evidence:
    name: Record verified antimeridian evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Replace stale PR 1323 evidence row
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/control/EVIDENCE_LOG.md')
          text = path.read_text()
          lines = text.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith('| 2026-08-10 | PR #1323 Natural Earth antimeridian generator hardening review-closeout |')]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one PR #1323 evidence row, found {len(matches)}')
          lines[matches[0]] = "| 2026-08-10 | PR #1323 Natural Earth antimeridian generator hardening review-closeout | `node scripts/generate-natural-earth-countries.mjs`; committed-payload normalized comparison; `npx vitest run tests/harbourview/natural-earth-antimeridian-topology.test.ts`; `npx vitest run tests/harbourview/russia-spherical-triangulation.test.ts`; `npx vitest run tests/globe-polygon-rendering.test.ts`; normalized two-run regeneration comparison; `npm run lint`; `npm run typecheck`; `npm run test`; targeted security/leakage Vitest; `npm run build` | PASS on exact verified head `b9d62ca56c9cc380a88cfd089ffca09eb9491ce9`, workflow run `31450185534`: regeneration 194 countries / 15,370 vertex points; committed payload matches regeneration after `generatedAt` normalization; antimeridian topology 9/9; Russia spherical 4/4; globe polygon rendering 20/20; normalized two-run SHA-256 `4b8c2a287187ab9438006c77ebabc5b02d3ed9f7bb77fb93bd623cf01f4e71f3`; lint exit 0 with 146 warnings and 0 errors; typecheck PASS; full `npm run test` PASS; targeted security/leakage 13/13; production build PASS (126 static pages). No production change. | PR #1323; workflow `PR 1323 Final Topology Verification`, run `31450185534` | Current — pre-merge evidence |"
          path.write_text('\n'.join(lines) + ('\n' if text.endswith('\n') else ''))
          PY
      - name: Commit evidence only
        run: |
          if git diff --quiet -- docs/control/EVIDENCE_LOG.md; then
            echo 'Evidence row already current.'
            exit 0
          fi
          git config user.name 'Harbourview Release Bot'
          git config user.email 'harbourviewcompany@gmail.com'
          git add docs/control/EVIDENCE_LOG.md
          git commit -m 'docs(control): record final PR 1323 verification evidence'
          git push origin HEAD:fix/globe-antimeridian-generator-hardening
