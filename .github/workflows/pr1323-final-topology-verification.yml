name: PR 1323 Final Topology Verification

on:
  push:
    branches:
      - fix/globe-antimeridian-generator-hardening
    paths:
      - 'scripts/generate-natural-earth-countries.mjs'
      - 'tests/harbourview/natural-earth-antimeridian-topology.test.ts'
      - 'tests/harbourview/russia-spherical-triangulation.test.ts'
      - 'tests/globe-polygon-rendering.test.ts'
      - 'data/globe/natural-earth-countries.ts'
      - 'docs/control/EVIDENCE_LOG.md'
      - '.github/workflows/pr1323-final-topology-verification.yml'

permissions:
  contents: write

jobs:
  verify:
    name: Verify final antimeridian topology
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Apply validated Russia multipart span-test correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/globe-polygon-rendering.test.ts')
          text = path.read_text()
          old = """  it('keeps generated Natural Earth Russia geometry on a contiguous Asia antimeridian span', () => {\n    const russia = naturalEarthCountriesPayload.countries.find((country) => country.iso2 === 'RU')\n    expect(russia).toBeTruthy()\n\n    const referenceLongitude = polygonGeometryInternals.countryMinimumCircularSpanReferenceLongitude(\n      russia!,\n    )\n    const normalizedLongitudes = allNormalizedOuterLongitudes(russia!)\n    const geometry = createCountryBufferGeometry(russia!, { geometryMode: 'surface' })\n\n    expect(referenceLongitude).toBeGreaterThan(90)\n    expect(referenceLongitude).toBeLessThan(120)\n    expect(longitudeSpan(normalizedLongitudes)).toBeLessThan(180)\n    expect(normalizedLongitudes.some((lon) => lon > 180)).toBe(true)\n    expect(geometry.getAttribute('position').count).toBeGreaterThan(100)\n    expect(geometry.index?.count).toBeGreaterThan(150)\n\n    geometry.dispose()\n  })\n"""
          new = """  it('keeps each generated Natural Earth Russia polygon on a contiguous antimeridian span', () => {\n    const russia = naturalEarthCountriesPayload.countries.find((country) => country.iso2 === 'RU')\n    expect(russia).toBeTruthy()\n\n    const referenceLongitude = polygonGeometryInternals.countryMinimumCircularSpanReferenceLongitude(\n      russia!,\n    )\n    const normalizedPolygons = polygonGeometryInternals.normalizePolygonTopology(russia!)\n    const normalizedLongitudes = normalizedPolygons.flatMap((polygon) => polygon.outer.map(([lon]) => lon))\n    const perPolygonSpans = normalizedPolygons.map((polygon) =>\n      longitudeSpan(polygon.outer.map(([lon]) => lon)),\n    )\n    const geometry = createCountryBufferGeometry(russia!, { geometryMode: 'surface' })\n\n    expect(referenceLongitude).toBeGreaterThan(90)\n    expect(referenceLongitude).toBeLessThan(120)\n    expect(perPolygonSpans.length).toBeGreaterThan(1)\n    expect(perPolygonSpans.every((span) => span < 180)).toBe(true)\n    expect(normalizedLongitudes.some((lon) => lon > 180)).toBe(true)\n    expect(geometry.getAttribute('position').count).toBeGreaterThan(100)\n    expect(geometry.index?.count).toBeGreaterThan(150)\n\n    geometry.dispose()\n  })\n"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Russia renderer-test target block not found')
          PY

      - name: Commit validated Russia renderer-test correction
        run: |
          if ! git diff --quiet -- tests/globe-polygon-rendering.test.ts; then
            git config user.name 'Harbourview Release Bot'
            git config user.email 'harbourviewcompany@gmail.com'
            git add tests/globe-polygon-rendering.test.ts
            git commit -m 'test(globe): align Russia span invariant with per-polygon runtime'
            git push origin HEAD:fix/globe-antimeridian-generator-hardening
          fi

      - name: Verify committed payload matches one regeneration
        run: |
          cp data/globe/natural-earth-countries.ts /tmp/committed.ts
          node scripts/generate-natural-earth-countries.mjs
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          committed = Path('/tmp/committed.ts').read_text()
          regenerated = Path('data/globe/natural-earth-countries.ts').read_text()
          normalize = lambda s: re.sub(r"generatedAt: '[^']+'", "generatedAt: '<normalized>'", s)
          a, b = normalize(committed), normalize(regenerated)
          if a != b:
              raise SystemExit('Committed Natural Earth payload differs from generator output after generatedAt normalization')
          print('committed_payload_normalized_sha256=' + hashlib.sha256(a.encode()).hexdigest())
          PY

      - name: Verify complete antimeridian topology suite
        run: npx vitest run tests/harbourview/natural-earth-antimeridian-topology.test.ts

      - name: Verify Russia spherical regression
        run: npx vitest run tests/harbourview/russia-spherical-triangulation.test.ts

      - name: Verify established globe polygon regression
        run: npx vitest run tests/globe-polygon-rendering.test.ts

      - name: Verify normalized two-run regeneration reproducibility
        run: |
          cp data/globe/natural-earth-countries.ts /tmp/first.ts
          sleep 1
          node scripts/generate-natural-earth-countries.mjs
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          first = Path('/tmp/first.ts').read_text()
          second = Path('data/globe/natural-earth-countries.ts').read_text()
          normalize = lambda s: re.sub(r"generatedAt: '[^']+'", "generatedAt: '<normalized>'", s)
          a, b = normalize(first), normalize(second)
          if a != b:
              raise SystemExit('Generated Natural Earth geometry is not deterministic after generatedAt normalization')
          print('normalized_sha256=' + hashlib.sha256(a.encode()).hexdigest())
          PY

      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full repository tests
        run: npm run test
      - name: Targeted security and leakage
        run: npx vitest run tests/harbourview/public-dom-forbidden-strings.test.tsx tests/harbourview/public-route-smoke.test.ts tests/network/public-projection-leakage.test.ts tests/marketplace/publicProjection.test.ts
      - name: Production build
        run: npm run build
