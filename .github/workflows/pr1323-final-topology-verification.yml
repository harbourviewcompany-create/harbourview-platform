name: PR 1323 Final Topology Verification

on:
  push:
    branches:
      - fix/globe-antimeridian-generator-hardening
    paths:
      - 'scripts/generate-natural-earth-countries.mjs'
      - 'tests/harbourview/natural-earth-antimeridian-topology.test.ts'
      - 'tests/harbourview/russia-spherical-triangulation.test.ts'
      - 'tests/globe-polygon-rendering.test.ts'
      - 'data/globe/natural-earth-countries.ts'
      - 'docs/control/EVIDENCE_LOG.md'
      - '.github/workflows/pr1323-final-topology-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify final antimeridian topology
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Verify committed payload matches one regeneration
        run: |
          cp data/globe/natural-earth-countries.ts /tmp/committed.ts
          node scripts/generate-natural-earth-countries.mjs
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          committed = Path('/tmp/committed.ts').read_text()
          regenerated = Path('data/globe/natural-earth-countries.ts').read_text()
          normalize = lambda s: re.sub(r"generatedAt: '[^']+'", "generatedAt: '<normalized>'", s)
          a, b = normalize(committed), normalize(regenerated)
          if a != b:
              raise SystemExit('Committed Natural Earth payload differs from generator output after generatedAt normalization')
          print('committed_payload_normalized_sha256=' + hashlib.sha256(a.encode()).hexdigest())
          PY

      - name: Verify complete antimeridian topology suite
        run: npx vitest run tests/harbourview/natural-earth-antimeridian-topology.test.ts

      - name: Verify Russia spherical regression
        run: npx vitest run tests/harbourview/russia-spherical-triangulation.test.ts

      - name: Verify established globe polygon regression
        run: npx vitest run tests/globe-polygon-rendering.test.ts

      - name: Verify normalized two-run regeneration reproducibility
        run: |
          cp data/globe/natural-earth-countries.ts /tmp/first.ts
          sleep 1
          node scripts/generate-natural-earth-countries.mjs
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          first = Path('/tmp/first.ts').read_text()
          second = Path('data/globe/natural-earth-countries.ts').read_text()
          normalize = lambda s: re.sub(r"generatedAt: '[^']+'", "generatedAt: '<normalized>'", s)
          a, b = normalize(first), normalize(second)
          if a != b:
              raise SystemExit('Generated Natural Earth geometry is not deterministic after generatedAt normalization')
          print('normalized_sha256=' + hashlib.sha256(a.encode()).hexdigest())
          PY

      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full repository tests
        run: npm run test
      - name: Targeted security and leakage
        run: npx vitest run tests/harbourview/public-dom-forbidden-strings.test.tsx tests/harbourview/public-route-smoke.test.ts tests/network/public-projection-leakage.test.ts tests/marketplace/publicProjection.test.ts
      - name: Production build
        run: npm run build
