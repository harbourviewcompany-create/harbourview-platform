name: Branch Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout head branch for package lock commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          mkdir -p ci-artifacts
          npm run typecheck 2>&1 | tee ci-artifacts/typecheck.log

      - name: Intelligence fixtures projection
        run: npm run test:intelligence-fixtures

      - name: Intelligence OS extraction
        run: npm run test:intelligence-os

      - name: Listing quality
        run: npm run test:listing-quality

      - name: Public images
        run: npm run test:public-images

      - name: Public visibility
        run: npm run test:visibility

      - name: Public leakage gate
        run: npm run verify:leakage

      - name: Admin authorization gate
        run: npm run verify:admin-auth

      - name: Marketplace flow guard
        run: npm run verify:marketplace-smoke

      - name: Services public leakage
        run: npm run test:services-public-leakage

      - name: Build
        run: |
          npm run build 2>&1 | tee ci-artifacts/build.log

      - name: Gate merge on typecheck + build
        run: |
          echo "Typecheck and build completed successfully."

      - name: Upload typecheck/build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-verification-typecheck-build-logs
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Start built app for route visibility checks
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/harbourview-next.log 2>&1 &
          echo $! > /tmp/harbourview-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/compliance >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/harbourview-next.log
          exit 1

      - name: Compliance visibility
        env:
          HARBOURVIEW_PUBLIC_BASE_URL: http://127.0.0.1:3000
        run: npm run test:compliance-visibility

      - name: Visibility
        run: npm run test:visibility

      - name: Install Playwright Chromium for globe e2e artifacts
        run: |
          npx playwright install --with-deps chromium

      - name: Globe route e2e evidence
        env:
          HARBOURVIEW_PUBLIC_BASE_URL: http://127.0.0.1:3000
          HARBOURVIEW_GLOBE_E2E_ARTIFACT_DIR: ci-artifacts/globe-route-e2e
        run: npm run test:globe-route-e2e 2>&1 | tee ci-artifacts/globe-route-e2e.log

      - name: Production visibility probe (safe/no writes)
        run: npm run verify:production-visibility 2>&1 | tee ci-artifacts/probe-production-visibility.log

      - name: Upload route evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-verification-route-evidence
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  contact-production-visual:
    name: Contact production visual verification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium in temporary verifier directory
        run: |
          mkdir -p .tmp/contact-visual
          cd .tmp/contact-visual
          npm init -y
          npm install --no-audit --no-fund playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Run contact production visual verification
        env:
          BASE_URL: https://harbourview.vercel.app
          ARTIFACT_DIR: verification-results/contact-production-visual
        run: node scripts/verify-contact-production-visual.mjs

      - name: Upload contact production visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbourview-contact-production-visual-verification
          path: verification-results/contact-production-visual/
          if-no-files-found: error
          retention-days: 30
