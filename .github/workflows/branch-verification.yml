name: Branch Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Listing quality
        run: npm run test:listing-quality

      - name: Public visibility
        run: npm run test:visibility

      - name: Build
        run: npm run build

      - name: Start built app for route visibility checks
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/harbourview-next.log 2>&1 &
          echo $! > /tmp/harbourview-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/compliance >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/harbourview-next.log
          exit 1

      - name: Compliance visibility
        env:
          HARBOURVIEW_PUBLIC_BASE_URL: http://127.0.0.1:3000
        run: npm run test:compliance-visibility

      - name: Visibility
        run: npm run test:visibility

  contact-production-visual:
    name: Contact production visual verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium in temporary verifier directory
        run: |
          mkdir -p .tmp/contact-visual
          cd .tmp/contact-visual
          npm init -y
          npm install --no-audit --no-fund playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Run contact production visual verification
        env:
          BASE_URL: https://harbourview.vercel.app
          ARTIFACT_DIR: verification-results/contact-production-visual
        run: node scripts/verify-contact-production-visual.mjs

      - name: Upload contact production visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbourview-contact-production-visual-verification
          path: verification-results/contact-production-visual/
          if-no-files-found: error
          retention-days: 30

# branch-verification harness trigger
