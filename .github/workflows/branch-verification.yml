name: Branch Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  pr1222-targeted-repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/supply-catalog'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/supply-catalog
          fetch-depth: 0
          persist-credentials: true

      - name: Repair MobileCommandCentre playbook rendering and restore workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('components/dashboard/MobileCommandCentre.tsx')
          source = path.read_text(encoding='utf-8')

          steps_pattern = re.compile(
              r"\{jurisdictionPlaybook\?\.steps && jurisdictionPlaybook\.steps\.length > 0 && \(.*?\n      \)\}\n      (?=\{jurisdictionPlaybook\?\.key_regulators)",
              re.S,
          )
          steps_replacement = '''{jurisdictionPlaybook?.steps && jurisdictionPlaybook.steps.length > 0 && (
        <div className="hvm-signal-card hvm-signal-card--rich">
          <div className="hvm-kicker">MARKET ENTRY STEPS</div>
          {jurisdictionPlaybook.steps.slice(0, 5).map((step, i) => (
            <div key={`${i}-${step}`} style={{ marginTop: i === 0 ? 4 : 10, paddingTop: i === 0 ? 0 : 10, borderTop: i === 0 ? 'none' : '1px solid rgba(245,240,232,.08)' }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: '#d4a84b' }}>Step {i + 1}</div>
              <div style={{ fontSize: 12, color: 'rgba(245,240,232,.6)', marginTop: 3, lineHeight: 1.5 }}>{step}</div>
            </div>
          ))}
        </div>
      )}
      '''
          source, steps_count = steps_pattern.subn(steps_replacement, source, count=1)
          if steps_count != 1:
              raise SystemExit(f'Expected one playbook steps block, replaced {steps_count}')

          regulators_pattern = re.compile(
              r"\{jurisdictionPlaybook\?\.key_regulators && jurisdictionPlaybook\.key_regulators\.length > 0 && \(.*?\n      \)\}\n      (?=\{jurisdictionPlaybook\?\.common_pitfalls)",
              re.S,
          )
          regulators_replacement = '''{jurisdictionPlaybook?.key_regulators && (
        <div className="hvm-signal-card hvm-signal-card--rich">
          <div className="hvm-kicker">KEY REGULATORS</div>
          {[jurisdictionPlaybook.key_regulators.primary, ...jurisdictionPlaybook.key_regulators.secondary]
            .filter((name): name is string => Boolean(name))
            .map((name, i) => (
              <div key={`${i}-${name}`} style={{ marginTop: i === 0 ? 4 : 8, paddingTop: i === 0 ? 0 : 8, borderTop: i === 0 ? 'none' : '1px solid rgba(245,240,232,.08)' }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: 'rgba(245,240,232,.9)' }}>{name}</div>
                <div style={{ fontSize: 12, color: 'rgba(245,240,232,.5)', marginTop: 2 }}>{i === 0 ? 'Primary authority' : 'Supporting authority'}</div>
              </div>
            ))}
        </div>
      )}
      '''
          source, regulators_count = regulators_pattern.subn(regulators_replacement, source, count=1)
          if regulators_count != 1:
              raise SystemExit(f'Expected one key regulators block, replaced {regulators_count}')

          path.write_text(source, encoding='utf-8')
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/branch-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dashboard/MobileCommandCentre.tsx .github/workflows/branch-verification.yml
          git commit -m "fix(types): align mobile jurisdiction playbook rendering"
          git push origin HEAD:feature/supply-catalog

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout head branch for package lock commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate package lock diagnostic
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated package lock diagnostic
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update package lock for dependency drift [generated]"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Intelligence fixtures projection
        run: npm run test:intelligence-fixtures

      - name: Intelligence OS extraction
        run: npm run test:intelligence-os

      - name: Listing quality
        run: npm run test:listing-quality

      - name: Public images
        run: npm run test:public-images

      - name: Public visibility
        run: npm run test:visibility

      - name: Services public leakage
        run: npm run test:services-public-leakage

      - name: Build
        run: npm run build

      - name: Start built app for route visibility checks
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/harbourview-next.log 2>&1 &
          echo $! > /tmp/harbourview-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/compliance >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/harbourview-next.log
          exit 1

      - name: Compliance visibility
        env:
          HARBOURVIEW_PUBLIC_BASE_URL: http://127.0.0.1:3000
        run: npm run test:compliance-visibility

      - name: Visibility
        run: npm run test:visibility

      - name: Install Playwright Chromium
        run: npx -y -p @playwright/test@1.54.0 playwright install --with-deps chromium

      - name: Wait for production deployment to be ready
        env:
          HARBOURVIEW_PUBLIC_BASE_URL: https://harbourview.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Waiting for production to serve current commit..."
          for i in {1..18}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              ${VERCEL_AUTOMATION_BYPASS_SECRET:+-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"} \
              "$HARBOURVIEW_PUBLIC_BASE_URL/")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "Production is responding. Waiting 15s for full propagation..."
              sleep 15
              exit 0
            fi
            sleep 10
          done
          echo "Production did not become ready in time — continuing anyway"

      - name: Production e2e route and mobile probes safe no writes
        continue-on-error: true
        env:
          HARBOURVIEW_PUBLIC_BASE_URL: https://harbourview.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e

      - name: Upload Playwright production probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbourview-production-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Production visibility probe safe no writes
        continue-on-error: true
        env:
          HARBOURVIEW_PUBLIC_BASE_URL: https://harbourview.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run probe:production-visibility

  contact-production-visual:
    name: Contact production visual verification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium in temporary verifier directory
        run: |
          mkdir -p .tmp/contact-visual
          cd .tmp/contact-visual
          npm init -y
          npm install --no-audit --no-fund playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Run contact production visual verification
        env:
          BASE_URL: https://harbourview.vercel.app
          ARTIFACT_DIR: verification-results/contact-production-visual
        run: node scripts/verify-contact-production-visual.mjs

      - name: Upload contact production visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbourview-contact-production-visual-verification
          path: verification-results/contact-production-visual/
          if-no-files-found: error
          retention-days: 30
