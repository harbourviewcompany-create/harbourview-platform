name: Branch Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verified ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Verify production runtime baseline
        run: npm run verify:runtime

      - name: Assert lockfile remains unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Typecheck
        run: npm run typecheck

      - name: Intelligence fixtures projection
        run: npm run test:intelligence-fixtures

      - name: Intelligence OS extraction
        run: npm run test:intelligence-os

      - name: Listing quality
        run: npm run test:listing-quality

      - name: Public images
        run: npm run test:public-images

      - name: Public visibility
        run: npm run test:visibility

      - name: Services public leakage
        run: npm run test:services-public-leakage

      - name: Build
        run: npm run build

      - name: Start built app for route visibility checks
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/harbourview-next.log 2>&1 &
          echo $! > /tmp/harbourview-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/compliance >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/harbourview-next.log
          exit 1

      - name: Compliance visibility
        env:
          HARBOURVIEW_PUBLIC_BASE_URL: http://127.0.0.1:3000
        run: npm run test:compliance-visibility

      - name: Visibility
        run: npm run test:visibility

      - name: Install lockfile-matched Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Launch lockfile-matched Chromium
        run: node -e "const { chromium } = require('@playwright/test'); (async () => { const browser = await chromium.launch(); await browser.close(); })().catch((error) => { console.error(error); process.exit(1); })"
