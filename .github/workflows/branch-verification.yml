name: Branch Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout verified ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Verify production runtime baseline
        run: npm run verify:runtime

      - name: Assert lockfile remains unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Typecheck
        run: npm run typecheck

      - name: Intelligence fixtures projection
        run: npm run test:intelligence-fixtures

      - name: Intelligence OS extraction
        run: npm run test:intelligence-os

      - name: Listing quality
        run: npm run test:listing-quality

      - name: Public images
        run: npm run test:public-images

      - name: Public visibility
        run: npm run test:visibility

      - name: Services public leakage
        run: npm run test:services-public-leakage

      - name: Build
        run: npm run build

      - name: Start built app for route visibility checks
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/harbourview-next.log 2>&1 &
          echo $! > /tmp/harbourview-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/compliance >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/harbourview-next.log
          exit 1

      - name: Compliance visibility
        env:
          HARBOURVIEW_PUBLIC_BASE_URL: http://127.0.0.1:3000
        run: npm run test:compliance-visibility

      - name: Visibility
        run: npm run test:visibility

      - name: Install lockfile-matched Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for production deployment to be ready
        env:
          HARBOURVIEW_PUBLIC_BASE_URL: https://harbourview.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Waiting for production to serve current commit..."
          for i in {1..18}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              ${VERCEL_AUTOMATION_BYPASS_SECRET:+-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"} \
              "$HARBOURVIEW_PUBLIC_BASE_URL/")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "Production is responding. Waiting 15s for full propagation..."
              sleep 15
              exit 0
            fi
            sleep 10
          done
          echo "Production did not become ready in time — continuing anyway"

      - name: Production e2e route and mobile probes safe no writes
        continue-on-error: true
        env:
          HARBOURVIEW_PUBLIC_BASE_URL: https://harbourview.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e

      - name: Upload Playwright production probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbourview-production-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Production visibility probe safe no writes
        continue-on-error: true
        env:
          HARBOURVIEW_PUBLIC_BASE_URL: https://harbourview.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run probe:production-visibility

  contact-production-visual:
    name: Contact production visual verification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install lockfile-matched Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run contact production visual verification
        env:
          BASE_URL: https://harbourview.vercel.app
          ARTIFACT_DIR: verification-results/contact-production-visual
        run: node scripts/verify-contact-production-visual.mjs

      - name: Upload contact production visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbourview-contact-production-visual-verification
          path: verification-results/contact-production-visual/
          if-no-files-found: error
          retention-days: 30
