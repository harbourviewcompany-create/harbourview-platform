name: Elite Digest Release Hardening

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: elite-digest-release-hardening
  cancel-in-progress: true

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/elite-digest-release-hardening
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Correct escaped JSX template literal in one-use patcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-elite-digest-hardening.mjs')
          text = path.read_text()
          old = r'<div key={\`${i}-\${step}\`}'
          new = r'<div key={\`\${i}-\${step}\`}'
          if text.count(old) != 1:
              raise SystemExit(f'expected one escaped-template target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Apply asserted hardening patch
        run: node scripts/apply-elite-digest-hardening.mjs

      - name: Repair generated regression-test string literal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/signals/eliteDigestHardening.test.ts')
          text = path.read_text()
          old = ").toBe('AT&T \"policy\" 'shift' — next')"
          new = ').toBe(`AT&T "policy" \'shift\' — next`)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one test-literal target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Apply schema-generic feedback client type repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/signals/feedbackScores.ts')
          text = path.read_text()
          import_block = "import type { SupabaseClient } from '@supabase/supabase-js'\n"
          replacement = import_block + "\ntype AnySchemaSupabaseClient = SupabaseClient<any, any, any, any, any>\n"
          if text.count(import_block) != 1:
              raise SystemExit('feedbackScores import assertion failed')
          text = text.replace(import_block, replacement)
          if text.count('_userClient: SupabaseClient,') != 1:
              raise SystemExit('feedbackScores parameter assertion failed')
          text = text.replace('_userClient: SupabaseClient,', '_userClient: AnySchemaSupabaseClient,')
          if text.count('let client: SupabaseClient = _userClient') != 1:
              raise SystemExit('feedbackScores local client assertion failed')
          text = text.replace(
              'let client: SupabaseClient = _userClient',
              'let client: AnySchemaSupabaseClient = _userClient',
          )
          path.write_text(text)
          PY

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run targeted Elite Digest tests
        run: npx vitest run tests/signals/eliteDigestHardening.test.ts tests/signals/digestRank.test.ts

      - name: Run full test suite
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Commit verified branch changes
        run: |
          git config user.name "harbourview-release-bot"
          git config user.email "harbourviewcompany@gmail.com"
          git rm .github/workflows/elite-digest-release-hardening.yml
          git rm scripts/apply-elite-digest-hardening.mjs
          git add \
            app/api/dashboard/digest/route.ts \
            components/dashboard/MobileCommandCentre.tsx \
            lib/dashboard/mapPublicToDashboardSignal.ts \
            lib/signals/digestPresentation.ts \
            lib/signals/feedbackScores.ts \
            lib/utils/htmlEntities.ts \
            supabase/migrations/20260731130000_elite_digest_release_hardening.sql \
            tests/signals/eliteDigestHardening.test.ts
          git diff --cached --check
          git commit -m "fix: harden Elite Digest release [elite-hardening-applied]"
          git push origin HEAD:agent/elite-digest-release-hardening
