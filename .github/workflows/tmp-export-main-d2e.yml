name: Temporary Export Main D2E

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-export-main-d2e.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Verify exact base and record tree
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          git rev-parse 'HEAD^{tree}' | tee /tmp/tree-sha.txt
      - name: Package exact base
        run: tar --exclude=.git -czf /tmp/harbourview-main-d2e.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: harbourview-main-d2e-tree
          path: |
            /tmp/harbourview-main-d2e.tar.gz
            /tmp/tree-sha.txt
          retention-days: 1
          if-no-files-found: error
