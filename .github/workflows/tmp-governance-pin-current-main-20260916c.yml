name: Temporary governance pin reconciliation v3

on:
  push:
    branches:
      - fix/governance-hardening-current-main-20260916

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin known mutable refs and fail closed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pins={'actions/upload-artifact':'043fb46d1a93c77aae656e7c1c64a875d1fc6a0a','supabase/setup-cli':'46f7f98c7f948ad727d22c1e67fab04c223a0520','actions/cache':'55cc8345863c7cc4c66a329aec7e433d2d1c52a9','actions/cache/save':'55cc8345863c7cc4c66a329aec7e433d2d1c52a9','actions/cache/restore':'55cc8345863c7cc4c66a329aec7e433d2d1c52a9','actions/github-script':'3a2844b7e9c422d3c10d287c895573f7108da1b3','actions/setup-python':'5fda3b95a4ea91299a34e894583c3862153e4b97','actions/checkout':'3d3c42e5aac5ba805825da76410c181273ba90b1','actions/setup-node':'820762786026740c76f36085b0efc47a31fe5020','github/codeql-action/upload-sarif':'b96794f015dfd88f77b49b1c93e0fa7110f94c63','denoland/setup-deno':'22d081ff2d3a40755e97629de92e3bcbfa7cf2ed','peter-evans/create-pull-request':'5f6978faf089d4d20b00c7766989d076bb2fc7f1','the-pr-agent/pr-agent':'8ac8f7aa9bb97ecf3aa050aac9f6462314206692'}
          sha=re.compile(r'^[0-9a-f]{40}$',re.I); unknown=[]; changed=[]
          for p in Path('.github/workflows').glob('*.y*ml'):
            t=p.read_text()
            def r(m):
              o,ref=m.group(1),m.group(2)
              if sha.fullmatch(ref): return m.group(0)
              if o not in pins: unknown.append(f'{p}:{o}@{ref}'); return m.group(0)
              changed.append(f'{p}:{o}@{ref}'); return f'uses: {o}@{pins[o]}'
            n=re.sub(r'^\s*(?:-\s*)?uses:\s*([^@\s]+)@([^\s#]+)',r,t,flags=re.M)
            if n!=t:p.write_text(n)
          if unknown: print('\n'.join(unknown)); raise SystemExit(1)
          print(f'Pinned {len(changed)} refs')
          PY
      - name: Remove all temporary reconciliation workflows and commit
        shell: bash
        run: |
          rm -f .github/workflows/tmp-governance-pin-current-main-20260916.yml .github/workflows/tmp-governance-pin-current-main-20260916b.yml .github/workflows/tmp-governance-pin-current-main-20260916c.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'fix(governance): pin remaining mutable workflow actions on current main'
          git push origin HEAD:"$GITHUB_REF_NAME"
