name: Bootstrap Elite Digest Boundary Documentation

on:
  push:
    branches:
      - 'fix/elite-digest-boundary-hardening'
    paths:
      - '.github/workflows/bootstrap-elite-digest-boundary-docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-elite-digest-boundary-docs.yml'

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fix/elite-digest-boundary-hardening'
          fetch-depth: 0
      - name: Update control documents
        run: |
          python - <<'PY'
          from pathlib import Path

          def append_once(path: str, marker: str, section: str) -> None:
              target = Path(path)
              text = target.read_text()
              if marker not in text:
                  target.write_text(text.rstrip() + '\n\n' + section.strip() + '\n')

          append_once(
              'docs/control/DATABASE_CONTROL.md',
              '## 2026-08-02 — Elite Digest RPC-only boundary forward hardening',
              '''
          ## 2026-08-02 — Elite Digest RPC-only boundary forward hardening

          - **Environment:** repository and disposable PostgreSQL 17 + pgvector fixture only. No Supabase migration was applied by this change.
          - **Base commit:** `951d0ea587e3ec8f4485bc828e810eb33113d235`.
          - **Migration:** `20260802163000_elite_digest_rpc_boundary_hardening.sql`, applied only after the existing HNSW and feedback-RPC forward migrations.
          - **Tables affected:** `public.signal_relevance_feedback` privileges only. Existing rows, IDs, verdicts, notes, surfaces, timestamps and RLS policies are preserved.
          - **Functions affected:** direct `anon`/`authenticated` execution is revoked from `public.hv_dedup_assign(double precision, integer)` and `public._digest_cluster_size(text)`; `service_role` retains execution.
          - **Data API contract:** `anon` and `authenticated` receive no direct privileges on `public.signal_relevance_feedback`. Authenticated writes use `api.submit_signal_relevance_feedback`; ranking reads use the service-role-only `api.signal_relevance_feedback_for_ranking` projection.
          - **RLS impact:** RLS remains enabled as defense in depth. It is not forced because the controlled `SECURITY DEFINER` writer must retain owner access.
          - **Backward compatibility:** server ranking, health checks and authenticated feedback submission retain their existing RPC contracts. Direct client table access is intentionally removed.
          - **Data preservation:** the PostgreSQL fixture fingerprints pre-existing feedback before applying the migration and verifies an identical row count and content digest afterward.
          - **Rollback/forward-fix:** restore only the explicitly captured prior grants through a new migration. Do not rewrite migration history or delete operator feedback.
          - **Required verification:** migration-version validation; PostgreSQL 17 + pgvector boundary fixture; lint; typecheck; full tests; production build; visibility and security checks; standard CI; Branch Verification.
          - **Production approval:** HOLD until a separate operator-authorized migration activation.
          ''',
          )

          append_once(
              'docs/control/EVIDENCE_LOG.md',
              '## 2026-08-02 — Elite Digest RPC-only boundary hardening',
              '''
          ## 2026-08-02 — Elite Digest RPC-only boundary hardening

          - Base: `951d0ea587e3ec8f4485bc828e810eb33113d235`
          - Branch: `fix/elite-digest-boundary-hardening`
          - Migration: `20260802163000_elite_digest_rpc_boundary_hardening.sql`
          - Scope: revoke public-role execution from the HNSW dedup and Digest cluster helper; remove direct client privileges from `public.signal_relevance_feedback`; preserve authenticated feedback and service-role ranking through narrow `api` RPCs.
          - Data handling: no existing feedback row is deleted or rewritten. The PostgreSQL fixture fingerprints fixture data before the migration and proves identical storage afterward.
          - Production boundary: no migration application, production data write, deployment invocation, alias movement or secret-value access is authorized by this entry.
          - Verification evidence: exact-head workflow and standard check run IDs will be recorded in the PR after completion.
          ''',
          )

          deploy = Path('docs/ops/ELITE_DIGEST_DEPLOY.md')
          deploy_text = deploy.read_text()
          old_sequence = '20260802152500_signal_feedback_api_rpcs.sql\n```'
          new_sequence = (
              '20260802152500_signal_feedback_api_rpcs.sql\n'
              '20260802163000_elite_digest_rpc_boundary_hardening.sql\n```'
          )
          if '20260802163000_elite_digest_rpc_boundary_hardening.sql' not in deploy_text:
              if old_sequence not in deploy_text:
                  raise SystemExit('Elite Digest migration sequence anchor not found')
              deploy_text = deploy_text.replace(old_sequence, new_sequence, 1)

          marker = '### Forward privilege and Data API hardening'
          if marker not in deploy_text:
              heading = '\n## 2. Environment names'
              if heading not in deploy_text:
                  raise SystemExit('Environment-name heading not found')
              section = '''

          ### Forward privilege and Data API hardening

          Apply the ninth migration only after the HNSW restoration and feedback RPC
          migration:

          ```text
          20260802163000_elite_digest_rpc_boundary_hardening.sql
          ```

          This migration preserves all feedback rows while enforcing the approved boundary:

          - `public.hv_dedup_assign(double precision, integer)` and
            `public._digest_cluster_size(text)` are executable only by `service_role`.
          - `anon` and `authenticated` have no direct privileges on
            `public.signal_relevance_feedback`.
          - authenticated clients submit one current verdict through
            `api.submit_signal_relevance_feedback`.
          - ranking reads only `signal_id` and `verdict` through the service-role-only
            `api.signal_relevance_feedback_for_ranking` projection.
          - RLS remains enabled as defense in depth.

          Before production application, verify the target has no duplicate
          `(signal_id, user_id)` rows, capture the existing grants and function
          definitions, and run the PostgreSQL 17 + pgvector boundary fixture.
          '''
              deploy_text = deploy_text.replace(
                  heading,
                  '\n' + section.strip() + heading,
                  1,
              )
          deploy.write_text(deploy_text.rstrip() + '\n')
          PY
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/control/DATABASE_CONTROL.md \
            docs/control/EVIDENCE_LOG.md \
            docs/ops/ELITE_DIGEST_DEPLOY.md
          git diff --cached --check
          git commit -m "docs(control): record Elite Digest boundary hardening"
          git push origin HEAD:fix/elite-digest-boundary-hardening
