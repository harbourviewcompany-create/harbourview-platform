name: Production Route Audit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-route-audit:
    name: Production Route Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Probe production routes
        continue-on-error: true
        env:
          HARBOURVIEW_PUBLIC_BASE_URL: https://harbourview.vercel.app
          HARBOURVIEW_PRODUCTION_PROBE_ATTEMPTS: 60
          HARBOURVIEW_PRODUCTION_PROBE_WAIT_MS: 10000
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/probe-production-routes.mjs
