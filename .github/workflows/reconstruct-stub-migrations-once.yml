name: Reconstruct Stub Migrations Once

on:
  push:
    branches:
      - ops/run-reconstruct-once

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reconstruct-stub-migrations
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Dump production migration ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: zvxdgdkukjrrwamdpqrg
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db dump --linked --schema supabase_migrations -f /tmp/ledger-schema.sql
          supabase db dump --linked --schema supabase_migrations --data-only -f /tmp/ledger-data.sql

      - name: Load ledger into throwaway Postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/ledger-schema.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/ledger-data.sql
          rows=$(psql -h 127.0.0.1 -U postgres -d postgres -tAc "select count(*) from supabase_migrations.schema_migrations;")
          echo "loaded ${rows} ledger rows"
          test "${rows}" -ge 100

      - name: Reconstruct applied placeholder migrations
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          node scripts/reconstruct-stub-migrations.mjs 2>&1 | tee reconstruct.log

      - name: Verify reconstructed migration corpus
        run: |
          set -euo pipefail
          node scripts/check-migration-sql-parses.mjs
          node scripts/check-no-secret-strings.mjs

      - name: Upload reconstruction log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstruct-stub-migrations-${{ github.run_id }}
          path: reconstruct.log
          if-no-files-found: warn
          retention-days: 14

      - name: Open reconstruction pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/migrations; then
            echo "No reconstruction changes produced."
            exit 0
          fi
          branch="ops/reconstructed-stub-migrations-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add supabase/migrations
          changed=$(git diff --cached --name-only -- supabase/migrations | wc -l)
          git commit -m "fix(migrations): reconstruct ${changed} placeholder migrations from production"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --draft \
            --title "fix(migrations): reconstruct ${changed} placeholder migrations from production" \
            --body "One-time controlled reconstruction from the production migration ledger. ${changed} applied placeholder migration files were restored from supabase_migrations.schema_migrations.statements. The run verified SQL parsing and secret scanning before this PR was opened. The script skips versions absent from the production ledger, so this is repository replay-fidelity repair only. Workflow run: ${{ github.run_id }}."
