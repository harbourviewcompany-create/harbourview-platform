name: PR 1323 Final Clean Verify

on:
  push:
    branches:
      - fix/globe-antimeridian-generator-hardening
    paths:
      - '.github/workflows/pr1323-final-clean-verify.yml'

permissions:
  contents: write

jobs:
  verify-and-close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replace obsolete Russia longitude lower bound
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/globe-polygon-rendering.test.ts')
          s = p.read_text()
          old = """    const normalizedLongitudes = allNormalizedOuterLongitudes(russia!)\n    expect(Math.max(...normalizedLongitudes)).toBeGreaterThanOrEqual(180)\n"""
          older = """    const normalizedLongitudes = allNormalizedOuterLongitudes(russia!)\n    expect(Math.max(...normalizedLongitudes)).toBeGreaterThan(180)\n"""
          new = """    const normalizedLongitudes = allNormalizedOuterLongitudes(russia!)\n    // Per-polygon minimum-circular-span normalization keeps dateline fragments\n    // on their own ±180 side rather than shifting valid points beyond 180.\n    // Require coverage on both seam sides so the far-eastern Russia fragment\n    // cannot disappear while the per-polygon span checks still pass.\n    expect(Math.min(...normalizedLongitudes)).toBeLessThan(-170)\n    expect(Math.max(...normalizedLongitudes)).toBeGreaterThan(170)\n"""
          if old in s:
              s = s.replace(old, new, 1)
          elif older in s:
              s = s.replace(older, new, 1)
          elif new not in s:
              raise SystemExit('Russia longitude assertion target not found')
          p.write_text(s)
          PY
      - name: Verify perimeter-based area tolerance is present
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('tests/harbourview/natural-earth-antimeridian-topology.test.ts').read_text()
          required = [
            'const sourcePerimeter = openSourceHole.reduce',
            'normalizedLonDelta(point[0], next[0])',
            'const areaTolerance = sourcePerimeter * tolerance + sourceAbsoluteArea * 0.02 + 1e-9',
          ]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit(f'missing perimeter-area tolerance logic: {missing}')
          PY
      - name: Preserve committed payload and regenerate twice
        run: |
          cp data/globe/natural-earth-countries.ts /tmp/committed-natural-earth.ts
          node scripts/generate-natural-earth-countries.mjs
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess
          def norm(text):
              return re.sub(r"generatedAt: ['\"][^'\"]+['\"]", "generatedAt: '<normalized>'", text)
          committed = norm(Path('/tmp/committed-natural-earth.ts').read_text())
          generated1 = norm(Path('data/globe/natural-earth-countries.ts').read_text())
          if committed != generated1:
              raise SystemExit('checked-in Natural Earth payload differs from regeneration after generatedAt normalization')
          sha1 = hashlib.sha256(generated1.encode()).hexdigest()
          subprocess.run(['node','scripts/generate-natural-earth-countries.mjs'], check=True)
          generated2 = norm(Path('data/globe/natural-earth-countries.ts').read_text())
          sha2 = hashlib.sha256(generated2.encode()).hexdigest()
          expected = '4b8c2a287187ab9438006c77ebabc5b02d3ed9f7bb77fb93bd623cf01f4e71f3'
          if generated1 != generated2:
              raise SystemExit('two normalized regenerations differ')
          if sha1 != expected or sha2 != expected:
              raise SystemExit(f'unexpected normalized SHA: {sha1} / {sha2}')
          print(f'normalized_sha256={sha1}')
          print(f'second_normalized_sha256={sha2}')
          PY
      - name: Antimeridian topology
        run: npx vitest run tests/harbourview/natural-earth-antimeridian-topology.test.ts
      - name: Russia spherical regression
        run: npx vitest run tests/harbourview/russia-spherical-triangulation.test.ts
      - name: Globe polygon rendering
        run: npx vitest run tests/globe-polygon-rendering.test.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full tests
        run: npm run test
      - name: Canonical security and leakage gate
        run: npm run test:security
      - name: Build
        run: npm run build
      - name: Commit validated test fix and remove verifier
        run: |
          git checkout -- data/globe/natural-earth-countries.ts
          git rm .github/workflows/pr1323-final-clean-verify.yml
          git config user.name 'Harbourview Release Bot'
          git config user.email 'harbourviewcompany@gmail.com'
          git add tests/globe-polygon-rendering.test.ts tests/harbourview/natural-earth-antimeridian-topology.test.ts
          git commit -m 'test(globe): align Russia seam coverage with renderer normalization'
          git push origin HEAD:fix/globe-antimeridian-generator-hardening
