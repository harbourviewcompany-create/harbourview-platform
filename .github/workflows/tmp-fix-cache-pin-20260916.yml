name: Temporary cache pin repair

on:
  push:
    branches: [fix/governance-cache-pin-current-main-20260916]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/governance-cache-pin-current-main-20260916
      - name: Repair immutable cache action pin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old = '55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
          new = '5a3ec84eff668545956fd18022155c47e93e2684'
          for name in ['.github/workflows/ci.yml', '.github/workflows/security-scan.yml']:
              p = Path(name)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'expected cache pin missing from {name}')
              p.write_text(s.replace(old, new))
          PY
      - name: Remove temporary workflow and commit repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-cache-pin-20260916.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml .github/workflows/security-scan.yml .github/workflows/tmp-fix-cache-pin-20260916.yml
          git commit -m 'fix(governance): pin actions cache to immutable v4.2.3'
          git push origin HEAD:fix/governance-cache-pin-current-main-20260916
