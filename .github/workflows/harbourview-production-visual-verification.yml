name: Harbourview Production Visual Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/harbourview-production-visual-verification.yml

jobs:
  production-visual-verification:
    name: Harbourview Production Visual Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production visual verification
        env:
          HARBOURVIEW_PUBLIC_BASE_URL: https://harbourview.vercel.app
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts/production-visual/screenshots
          node <<'NODE'
          const { chromium } = require('playwright')
          const fs = require('node:fs/promises')
          const path = require('node:path')

          const baseUrl = process.env.HARBOURVIEW_PUBLIC_BASE_URL || 'https://harbourview.vercel.app'
          const runId = process.env.GITHUB_RUN_ID || String(Date.now())
          const outputDir = path.join(process.cwd(), 'artifacts', 'production-visual')
          const screenshotsDir = path.join(outputDir, 'screenshots')

          const viewports = [
            { name: 'desktop-1440x900', width: 1440, height: 900 },
            { name: 'laptop-1366x768', width: 1366, height: 768 },
            { name: 'mobile-390x844', width: 390, height: 844 },
          ]

          const publicRoutes = [
            '/',
            '/marketplace',
            '/marketplace/sell',
            '/intelligence',
            '/signals',
            '/about',
            '/contact',
          ]

          const protectedRoutes = [
            '/marketplace/wanted',
          ]

          const forbiddenLeakageStrings = [
            'View source listing',
            'sourceUrl',
            'sourceName',
            'Evidence captured',
            'provenanceSummary',
            'sourceEvidence',
            'verificationStatus',
            'availabilityStatus',
            'sellerAuthorizationStatus',
            'internalReviewNotes',
            'reviewedBy',
            'lastReviewedAt',
            'nextReviewDueAt',
          ]

          const approvedHeroAssets = [
            'harbourview-globe-hero-v2.svg',
            'harbourview-coming-soon-placeholder.svg',
          ]

          const networkCtaNames = [/^Enter Harbourview Network/i, /^Preview Network/i, /^Enter Network/i, /^Marketplace/i]
          const intelligenceCtaName = /^Request Intelligence/i

          const failures = []
          const evidence = {
            baseUrl,
            runId,
            sha: process.env.GITHUB_SHA || null,
            checkedAt: new Date().toISOString(),
            viewports: [],
            routeFetches: [],
            routeBrowsers: [],
            protectedRouteBrowsers: [],
            ctaClicks: [],
            admin: null,
            failures,
          }

          function fail(assertion, detail) {
            const item = { assertion, detail }
            failures.push(item)
            console.error(`ASSERTION FAILED [${assertion}]: ${detail}`)
          }

          function bustedUrl(routePath) {
            const url = new URL(routePath, baseUrl)
            url.searchParams.set('hv_prod_visual_ts', `${runId}-${Date.now()}-${Math.random().toString(16).slice(2)}`)
            return url.toString()
          }

          function decodeAssetUrl(value) {
            try {
              return decodeURIComponent(value || '')
            } catch {
              return value || ''
            }
          }

          async function firstExistingLocator(page, namePatterns) {
            for (const name of namePatterns) {
              const locator = page.getByRole('link', { name }).first()
              if ((await locator.count()) > 0) return { locator, name: String(name) }
            }
            return { locator: null, name: namePatterns.map(String).join(' | ') }
          }

          async function locatorVisibleAboveFold(locator, viewport) {
            if (!locator || (await locator.count()) < 1) return { visible: false, reason: 'not found' }
            const first = locator.first()
            if (!(await first.isVisible().catch(() => false))) return { visible: false, reason: 'not visible' }
            const box = await first.boundingBox()
            if (!box) return { visible: false, reason: 'no bounding box' }
            const aboveFold = box.y >= -1 && box.y + box.height <= viewport.height + 1
            return { visible: aboveFold, reason: aboveFold ? 'visible above fold' : `outside fold: y=${box.y}, height=${box.height}, viewportHeight=${viewport.height}`, box }
          }

          async function clickCta(context, label, namePatterns, expectedPathPrefix) {
            const page = await context.newPage()
            const result = { label, expectedPathPrefix, matchedName: null, found: false, finalUrl: null, ok: false }
            try {
              await page.goto(bustedUrl('/'), { waitUntil: 'domcontentloaded', timeout: 30000 })
              await page.waitForLoadState('networkidle', { timeout: 10000 }).catch(() => {})
              const matched = await firstExistingLocator(page, namePatterns)
              result.matchedName = matched.name
              result.found = Boolean(matched.locator)
              if (!matched.locator) {
                fail(`cta-${label}-exists`, `No homepage CTA link matched ${matched.name}`)
                return result
              }
              await matched.locator.click({ timeout: 10000 })
              await page.waitForLoadState('domcontentloaded', { timeout: 15000 }).catch(() => {})
              result.finalUrl = page.url()
              const finalPath = new URL(result.finalUrl).pathname
              result.ok = finalPath.startsWith(expectedPathPrefix)
              if (!result.ok) {
                fail(`cta-${label}-routes`, `CTA matched ${matched.name} landed on ${finalPath}; expected path prefix ${expectedPathPrefix}`)
              }
            } catch (error) {
              fail(`cta-${label}-click`, error && error.message ? error.message : String(error))
              result.error = error && error.message ? error.message : String(error)
            } finally {
              evidence.ctaClicks.push(result)
              await page.close().catch(() => {})
            }
            return result
          }

          async function main() {
            await fs.mkdir(screenshotsDir, { recursive: true })
            const browser = await chromium.launch({ headless: true })
            const context = await browser.newContext({ ignoreHTTPSErrors: true })

            try {
              for (const viewport of viewports) {
                const page = await context.newPage()
                await page.setViewportSize({ width: viewport.width, height: viewport.height })
                const url = bustedUrl('/')
                const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 })
                await page.waitForLoadState('networkidle', { timeout: 10000 }).catch(() => {})
                await page.waitForTimeout(1200)

                const screenshotPath = path.join(screenshotsDir, `${viewport.name}.png`)
                await page.screenshot({ path: screenshotPath, fullPage: true })

                const overflow = await page.evaluate(() => ({
                  documentScrollWidth: document.documentElement.scrollWidth,
                  documentClientWidth: document.documentElement.clientWidth,
                  bodyScrollWidth: document.body ? document.body.scrollWidth : null,
                  windowInnerWidth: window.innerWidth,
                }))
                const horizontalOverflow = Math.max(
                  overflow.documentScrollWidth - overflow.documentClientWidth,
                  (overflow.bodyScrollWidth || 0) - overflow.documentClientWidth,
                )
                if (horizontalOverflow > 2) {
                  fail(`horizontal-overflow-${viewport.name}`, `Horizontal overflow ${horizontalOverflow}px at ${viewport.width}x${viewport.height}`)
                }

                const networkMatched = await firstExistingLocator(page, networkCtaNames)
                const intelligenceLocator = page.getByRole('link', { name: intelligenceCtaName }).first()
                const networkVisibility = await locatorVisibleAboveFold(networkMatched.locator, viewport)
                const intelligenceVisibility = await locatorVisibleAboveFold(intelligenceLocator, viewport)

                if (!networkVisibility.visible) {
                  fail(`network-cta-visible-above-fold-${viewport.name}`, `${networkMatched.name}: ${networkVisibility.reason}`)
                }
                if (!intelligenceVisibility.visible) {
                  fail(`intelligence-cta-visible-above-fold-${viewport.name}`, `${intelligenceCtaName}: ${intelligenceVisibility.reason}`)
                }

                const imageSources = await page.$$eval('img', (imgs) =>
                  imgs.map((img) => img.currentSrc || img.src || img.getAttribute('src') || '').filter(Boolean),
                )
                const decodedSources = imageSources.map(decodeAssetUrl)
                const approvedAssetFound = decodedSources.some((src) =>
                  approvedHeroAssets.some((asset) => src.includes(asset)),
                )
                if (!approvedAssetFound) {
                  fail(`approved-hero-asset-${viewport.name}`, `No approved hero image asset found. Sources: ${decodedSources.join(' | ') || 'none'}`)
                }

                const h1Text = await page.locator('h1').first().innerText({ timeout: 10000 }).catch(() => '')
                if (!/market access|opening soon|full site/i.test(h1Text)) {
                  fail(`homepage-hero-title-${viewport.name}`, `Unexpected or missing H1 text: ${h1Text}`)
                }

                evidence.viewports.push({
                  ...viewport,
                  status: response ? response.status() : null,
                  screenshot: `screenshots/${viewport.name}.png`,
                  overflow,
                  horizontalOverflow,
                  networkVisibility,
                  intelligenceVisibility,
                  imageSources: decodedSources,
                  approvedAssetFound,
                  h1Text,
                })

                await page.close()
              }

              await clickCta(context, 'network-or-marketplace', networkCtaNames, '/marketplace')
              await clickCta(context, 'intelligence', [intelligenceCtaName], '/intelligence')

              for (const routePath of publicRoutes) {
                const url = bustedUrl(routePath)
                const apiResponse = await context.request.get(url, {
                  timeout: 30000,
                  headers: {
                    'cache-control': 'no-cache',
                    pragma: 'no-cache',
                  },
                })
                const text = await apiResponse.text()
                const leaked = forbiddenLeakageStrings.filter((needle) => text.includes(needle))
                if (!apiResponse.ok()) {
                  fail(`route-fetch-status-${routePath}`, `Fetch returned ${apiResponse.status()} for ${routePath}`)
                }
                if (!/Harbourview/i.test(text)) {
                  fail(`route-fetch-harbourview-copy-${routePath}`, `Fetch body did not include Harbourview copy for ${routePath}`)
                }
                if (leaked.length) {
                  fail(`route-fetch-forbidden-leakage-${routePath}`, `Forbidden strings in fetch body: ${leaked.join(', ')}`)
                }
                evidence.routeFetches.push({ routePath, status: apiResponse.status(), ok: apiResponse.ok(), leaked })

                const page = await context.newPage()
                const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 })
                await page.waitForLoadState('networkidle', { timeout: 10000 }).catch(() => {})
                const content = await page.content()
                const bodyText = await page.locator('body').innerText({ timeout: 10000 }).catch(() => '')
                const browserLeaked = forbiddenLeakageStrings.filter((needle) => content.includes(needle) || bodyText.includes(needle))
                const status = response ? response.status() : null
                if (!response || status < 200 || status >= 400) {
                  fail(`route-browser-status-${routePath}`, `Browser route returned ${status} for ${routePath}`)
                }
                if (!/Harbourview/i.test(bodyText)) {
                  fail(`route-browser-harbourview-copy-${routePath}`, `Rendered body did not include Harbourview copy for ${routePath}`)
                }
                if (browserLeaked.length) {
                  fail(`route-browser-forbidden-leakage-${routePath}`, `Forbidden strings in rendered route: ${browserLeaked.join(', ')}`)
                }
                evidence.routeBrowsers.push({ routePath, status, leaked: browserLeaked })
                await page.close()
              }

              for (const routePath of protectedRoutes) {
                const page = await context.newPage()
                const response = await page.goto(bustedUrl(routePath), { waitUntil: 'domcontentloaded', timeout: 30000 })
                await page.waitForLoadState('networkidle', { timeout: 10000 }).catch(() => {})
                const content = await page.content()
                const bodyText = await page.locator('body').innerText({ timeout: 10000 }).catch(() => '')
                const leaked = forbiddenLeakageStrings.filter((needle) => content.includes(needle) || bodyText.includes(needle))
                const status = response ? response.status() : null
                const finalUrl = page.url()
                const protectedByLogin = finalUrl.includes('/login?next=%2Fdashboard') && /sign in/i.test(bodyText)
                if (!protectedByLogin) {
                  fail(`protected-route-auth-${routePath}`, `Expected authenticated redirect for ${routePath}; finalUrl=${finalUrl}, bodySample=${bodyText.slice(0, 180)}`)
                }
                if (leaked.length) {
                  fail(`protected-route-forbidden-leakage-${routePath}`, `Forbidden strings in protected route: ${leaked.join(', ')}`)
                }
                evidence.protectedRouteBrowsers.push({ routePath, status, finalUrl, protectedByLogin, leaked })
                await page.close()
              }

              const adminPage = await context.newPage()
              const adminUrl = bustedUrl('/admin')
              const adminResponse = await adminPage.goto(adminUrl, { waitUntil: 'domcontentloaded', timeout: 30000 }).catch((error) => {
                fail('admin-browser-load', error && error.message ? error.message : String(error))
                return null
              })
              await adminPage.waitForLoadState('networkidle', { timeout: 10000 }).catch(() => {})
              const adminStatus = adminResponse ? adminResponse.status() : null
              const adminText = await adminPage.locator('body').innerText({ timeout: 10000 }).catch(() => '')
              const adminDenied = adminStatus === 401 || /unauthorized|access denied|admin access|sign in|required/i.test(adminText)
              evidence.admin = { status: adminStatus, denied: adminDenied, bodySample: adminText.slice(0, 500) }
              if (!adminDenied) {
                fail('admin-anonymous-denial', `Admin did not clearly deny anonymous access. Status=${adminStatus}, bodySample=${adminText.slice(0, 220)}`)
              }
              await adminPage.close()
            } finally {
              await browser.close()
            }

            const reportJsonPath = path.join(outputDir, 'report.json')
            const reportMdPath = path.join(outputDir, 'report.md')
            await fs.writeFile(reportJsonPath, JSON.stringify(evidence, null, 2))
            const status = failures.length ? 'HOLD' : 'GO'
            const failureLines = failures.length
              ? failures.map((failure) => `- ${failure.assertion}: ${failure.detail}`).join('\n')
              : '- None'
            const md = `# Harbourview Production Visual Verification\n\nStatus: ${status}\n\nBase URL: ${baseUrl}\n\nRun ID: ${runId}\n\nCommit: ${process.env.GITHUB_SHA || 'unknown'}\n\n## Viewport screenshots\n\n${evidence.viewports.map((item) => `- ${item.name}: ${item.screenshot}`).join('\n')}\n\n## Failures\n\n${failureLines}\n`
            await fs.writeFile(reportMdPath, md)

            if (failures.length) {
              process.exit(1)
            }
          }

          main().catch(async (error) => {
            console.error(error)
            await fs.mkdir(outputDir, { recursive: true })
            await fs.writeFile(path.join(outputDir, 'fatal-error.txt'), error && error.stack ? error.stack : String(error))
            process.exit(1)
          })
          NODE

      - name: Upload production visual verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harbourview-production-visual-verification-${{ github.run_id }}
          path: artifacts/production-visual
          if-no-files-found: error
          retention-days: 14
