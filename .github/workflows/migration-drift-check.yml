name: Migration Drift Check

# Detects migrations applied outside the repository and reports repository-only
# pending migrations.

on:
  pull_request:
    branches: [main]

concurrency:
  group: migration-drift-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: zvxdgdkukjrrwamdpqrg

jobs:
  migration-sql-parses:
    name: Verify migration SQL parses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install libpg-query
        run: npm ci --no-audit --no-fund
      - name: Self-test the checker
        run: node scripts/check-migration-sql-parses.mjs --self-test
      - name: Parse every migration
        run: node scripts/check-migration-sql-parses.mjs

  parser-contract:
    name: Verify migration-list parser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Run parser and fail-closed manifest tests
        run: >-
          node --test
          tests/scripts/migration-ledger-manifest.test.mjs
          tests/scripts/historical-migration-attestations.test.mjs
          tests/scripts/notify-new-migration-drift.test.mjs
          tests/scripts/lint-workflow-continue-on-error-guards.test.mjs

  check-placeholder-landmines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Grep for known placeholder-comment landmines
        run: |
          PATTERNS=("Keep other functions as they were" "rest of the file unchanged" "\.\.\. rest stays the same" "// TODO: implement" "placeholder, do not ship")
          FOUND=0
          for p in "${PATTERNS[@]}"; do
            if grep -rIn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next --exclude-dir=docs --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.sql' --include='*.mjs' --include='*.cjs' -- "$p" .; then FOUND=1; fi
          done
          if [ "$FOUND" -eq 1 ]; then echo "::error::Found placeholder-comment code landmines."; exit 1; fi
