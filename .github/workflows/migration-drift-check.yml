name: Migration Drift Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  SUPABASE_PROJECT_REF: zvxdgdkukjrrwamdpqrg

jobs:
  # Nothing in this repository parsed the production migration tree until
  # 2026-08-14. The one job that stands up a real database
  # (mobile-command-centre-v2-visual.yml) moves supabase/migrations aside and
  # substitutes a small hand-written schema, so two migrations that could not be
  # replayed -- an apostrophe closing a string literal, and a CREATE FUNCTION
  # with no statement terminator -- reached main fully green.
  #
  # This parses every migration with libpg-query, the real PostgreSQL grammar.
  # It resolves no names, so vault/cron/net/auth/pgvector references and missing
  # tables are never failures here; only genuine syntax errors are. Full replay
  # was considered and rejected: on a clean database these migrations fail for
  # environmental reasons the author cannot fix, and a gate that is red for
  # unfixable reasons is one people learn to ignore.
  migration-sql-parses:
    name: Verify migration SQL parses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install libpg-query
        run: npm ci --no-audit --no-fund
      - name: Self-test the checker
        run: node scripts/check-migration-sql-parses.mjs --self-test
      - name: Parse every migration
        run: node scripts/check-migration-sql-parses.mjs

  parser-contract:
    name: Verify migration-list parser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parser fixture contract
        shell: bash
        run: bash scripts/test-migration-list-parser.sh

  drift-report:
    name: Compare Repo vs Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate expected project ref
        run: |
          if [ "${SUPABASE_PROJECT_REF}" != "zvxdgdkukjrrwamdpqrg" ]; then
            echo "::error::Unexpected project ref: ${SUPABASE_PROJECT_REF}"
            exit 1
          fi

      - name: Install Supabase CLI
        run: npm install -g supabase@2.76.8

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is required."
            exit 1
          fi

          timeout 60s supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password '${{ secrets.SUPABASE_DB_PASSWORD }}'

      - name: Sync production migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: timeout 60s supabase migration list --linked --output env > /tmp/migrations.env

      - name: Compare migration history
        run: |
          node scripts/compare-migration-history.mjs \
            --migration-env /tmp/migrations.env \
            --repo-root supabase/migrations \
            --expected-project-ref "$SUPABASE_PROJECT_REF"
