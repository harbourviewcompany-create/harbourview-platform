name: Migration Drift Check

# Detects migrations applied outside the repository and reports repository-only
# pending migrations. The parser accepts both ASCII and box-drawing table output
# from Supabase CLI and fails if a nonempty linked-project result parses as zero
# remote rows. Historical apply-time aliases are recognized only when their
# canonical repository migration remains pinned to the exact Git blob SHA.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/migration-drift-check.yml'
      - 'scripts/migration-ledger-manifest.mjs'
      - 'tests/scripts/migration-ledger-manifest.test.mjs'
      - 'supabase/migrations/**'
      - 'supabase/release-controls/elite-digest-production-activation.json'
      - 'supabase/release-controls/migration-live-version-equivalences.json'
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: zvxdgdkukjrrwamdpqrg

jobs:
  parser-contract:
    name: Verify migration-list parser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run parser and fail-closed manifest tests
        run: node --test tests/scripts/migration-ledger-manifest.test.mjs

  check-drift:
    name: Compare repository and live migration ledgers
    # Previously excluded from pull_request (`if: github.event_name != 'pull_request'`),
    # which meant this job only ran on push-to-main, hourly schedule, or manual dispatch —
    # i.e. only AFTER a merge, never as a gate on one. Every PR touching migrations could
    # merge regardless of live/repo drift, which is how the ledger has required manual
    # reconciliation multiple times (Jul 18, Jul 27, Aug 12) despite this check existing
    # and failing the whole time. Now runs on pull_request too, so drift is visible and
    # blockable before merge, not just logged after the fact.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Read live migration ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p artifacts/migration-drift
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list --linked \
            > artifacts/migration-drift/remote-migrations.txt

      - name: Generate exact drift manifest
        id: manifest
        continue-on-error: true
        run: |
          node scripts/migration-ledger-manifest.mjs \
            --remote-list artifacts/migration-drift/remote-migrations.txt \
            --local-dir supabase/migrations \
            --control-file supabase/release-controls/elite-digest-production-activation.json \
            --json-out artifacts/migration-drift/manifest.json \
            --markdown-out artifacts/migration-drift/manifest.md \
            --mode drift \
            --source-sha "$GITHUB_SHA"

      - name: Publish manifest summary
        if: always()
        run: |
          if [ -f artifacts/migration-drift/manifest.md ]; then
            cat artifacts/migration-drift/manifest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload drift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-drift-${{ github.sha }}
          path: artifacts/migration-drift/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce drift result
        if: always()
        run: |
          if [ "${{ steps.manifest.outcome }}" != "success" ]; then
            echo "::error::Migration drift parser or remote-ledger reconciliation failed."
            exit 1
          fi

  check-placeholder-landmines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Grep for known placeholder-comment landmines
        run: |
          PATTERNS=(
            "Keep other functions as they were"
            "rest of the file unchanged"
            "\.\.\. rest stays the same"
            "// TODO: implement"
            "placeholder, do not ship"
          )
          FOUND=0
          for p in "${PATTERNS[@]}"; do
            if grep -rIn \
                 --exclude-dir=node_modules --exclude-dir=.git \
                 --exclude-dir=.next --exclude-dir=docs \
                 --include='*.ts' --include='*.tsx' \
                 --include='*.js' --include='*.jsx' \
                 --include='*.sql' --include='*.mjs' --include='*.cjs' \
                 -- "$p" .; then
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Found placeholder-comment code landmines. Replace them with complete implementations before merging."
            exit 1
          fi
