name: Global Regulatory OS Phase 0 Replacement

on:
  pull_request:
    # EVIDENCE_LOG.md is deliberately NOT a trigger path. AGENTS.md requires an
    # entry in it from every merged PR, so listing it here made this workflow
    # fire on changes with no Global Regulatory OS involvement at all — and the
    # "Verify migration isolation" step below asserts the PR touches no
    # migrations. Any PR that both renamed a migration and recorded the required
    # evidence therefore failed by construction: satisfying AGENTS.md broke this
    # gate, and satisfying this gate broke AGENTS.md. That deadlock blocked the
    # duplicate-version fix this repository needs before any migration apply can
    # be recorded at all.
    #
    # This gate's scope is the Global Regulatory OS canonical surface, and the
    # paths below still cover it. Dropping EVIDENCE_LOG.md narrows what triggers
    # the workflow; it does not weaken any assertion the workflow makes. A PR
    # touching both the evidence log and this gate's real surface still trips it
    # through the remaining paths.
    paths:
      - 'docs/control/global-regulatory-os/**'
      - 'scripts/global-reg-os/**'
      - '.github/workflows/global-reg-os-phase0-replacement.yml'
      - 'docs/control/DATABASE_CONTROL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Verify source, manifest, proof matrix and registries
        run: python scripts/global-reg-os/validate_phase0_package.py
      - name: Verify no secret material
        run: python scripts/global-reg-os/check_secrets.py
      - name: Confirm manifest is deterministic
        run: |
          cp docs/control/global-regulatory-os/canonical/MANIFEST.json /tmp/MANIFEST.json
          python scripts/global-reg-os/regenerate_manifest.py
          diff -u /tmp/MANIFEST.json docs/control/global-regulatory-os/canonical/MANIFEST.json
      - name: Verify migration isolation and ledger parser
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
          git diff --exit-code "${{ github.event.pull_request.base.sha }}" HEAD -- supabase/migrations
          node --test tests/scripts/migration-ledger-manifest.test.mjs
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1.34.3 lint docs/control/global-regulatory-os/canonical/api/openapi.yaml
      - name: Validate AsyncAPI
        run: npx --yes @asyncapi/cli@4.1.0 validate docs/control/global-regulatory-os/canonical/events/asyncapi.yaml

  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Clean install, simulated upgrade and authorization tests
        run: bash scripts/global-reg-os/run_postgres_validation.sh
