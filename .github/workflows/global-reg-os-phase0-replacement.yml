name: Global Regulatory OS Phase 0 Replacement

on:
  pull_request:
    paths:
      - 'docs/control/global-regulatory-os/**'
      - 'scripts/global-reg-os/**'
      - '.github/workflows/global-reg-os-phase0-replacement.yml'
      - 'docs/control/DATABASE_CONTROL.md'
      - 'docs/control/EVIDENCE_LOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-manifest:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/global-reg-os-phase0-replacement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-reg-os-phase0-replacement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate canonical manifest
        run: python scripts/global-reg-os/regenerate_manifest.py
      - name: Commit deterministic manifest only when changed
        run: |
          if git diff --quiet -- docs/control/global-regulatory-os/canonical/MANIFEST.json; then
            echo 'Manifest already deterministic.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/control/global-regulatory-os/canonical/MANIFEST.json
          git commit -m 'chore(global-reg-os): regenerate canonical manifest'
          git push origin HEAD:agent/global-reg-os-phase0-replacement

  contracts-and-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Verify source, manifest, proof matrix and registries
        run: python scripts/global-reg-os/validate_phase0_package.py
      - name: Verify no secret material
        run: python scripts/global-reg-os/check_secrets.py
      - name: Confirm manifest is deterministic
        run: |
          cp docs/control/global-regulatory-os/canonical/MANIFEST.json /tmp/MANIFEST.json
          python scripts/global-reg-os/regenerate_manifest.py
          diff -u /tmp/MANIFEST.json docs/control/global-regulatory-os/canonical/MANIFEST.json
      - name: Verify migration isolation and ledger parser
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
          git diff --exit-code "${{ github.event.pull_request.base.sha }}" HEAD -- supabase/migrations
          node --test tests/scripts/migration-ledger-manifest.test.mjs
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1.34.3 lint docs/control/global-regulatory-os/canonical/api/openapi.yaml
      - name: Validate AsyncAPI
        run: npx --yes @asyncapi/cli@4.1.0 validate docs/control/global-regulatory-os/canonical/events/asyncapi.yaml

  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Clean install, simulated upgrade and authorization tests
        run: bash scripts/global-reg-os/run_postgres_validation.sh
