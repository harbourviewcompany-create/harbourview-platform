name: Global Regulatory OS Phase 0 Replacement

on:
  push:
    branches:
      - agent/global-reg-os-phase0-replacement
    paths:
      - '.github/workflows/global-reg-os-phase0-replacement.yml'
  pull_request:
    paths:
      - 'docs/control/global-regulatory-os/**'
      - 'scripts/global-reg-os/**'
      - '.github/workflows/global-reg-os-phase0-replacement.yml'
      - 'docs/control/DATABASE_CONTROL.md'
      - 'docs/control/EVIDENCE_LOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-verified-validation-defects:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-reg-os-phase0-replacement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Patch verified OpenAPI and runtime-grant defects
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('docs/control/global-regulatory-os/canonical/api/openapi.yaml')
          text = api.read_text(encoding='utf-8')
          description = '  description: Evidence-first API for jurisdictions, sources, regulatory instruments, obligations, licences, counterparties, corridors, market metrics, alerts and workflow.\n'
          if '  license:\n' not in text.split('servers:', 1)[0]:
              text = text.replace(description, description + '  license:\n    name: Proprietary\n', 1)
          tag_descriptions = {
              'Jurisdictions': 'Jurisdiction coverage, profiles and regulatory geography.',
              'Sources': 'Source registry and acquisition operations.',
              'Evidence': 'Evidence documents, claims and lineage.',
              'Regulatory': 'Regulatory instruments and change intelligence.',
              'Compliance': 'Obligations and applicability evaluation.',
              'Registry': 'Entities, licences and counterparty intelligence.',
              'Trade': 'Trade corridors and market-entry determinations.',
              'Markets': 'Market metrics and observations.',
              'Workflow': 'Alerts and controlled workflow operations.',
          }
          for name, detail in tag_descriptions.items():
              old = f'  - name: {name}\n'
              new = old + f'    description: {detail}\n'
              if new not in text:
                  if old not in text:
                      raise SystemExit(f'missing OpenAPI tag: {name}')
                  text = text.replace(old, new, 1)
          summaries = {
              'listJurisdictions': 'List jurisdictions',
              'getJurisdiction': 'Get a jurisdiction',
              'listSources': 'List registered sources',
              'createSource': 'Create a registered source',
              'requestAcquisition': 'Request a source acquisition',
              'listDocuments': 'List evidence documents',
              'getClaimWithLineage': 'Get a claim with evidence lineage',
              'listRegulatoryChanges': 'List regulatory changes',
              'listObligations': 'List compliance obligations',
              'evaluateApplicability': 'Evaluate obligation applicability',
              'searchEntities': 'Search registry entities',
              'getCounterpartyProfile': 'Get a counterparty profile',
              'createCorridor': 'Create a trade corridor',
              'evaluateCorridor': 'Evaluate a trade corridor',
              'getCorridorDetermination': 'Get a corridor determination',
              'listMetricDefinitions': 'List market metric definitions',
              'listMarketObservations': 'List market observations',
              'listAlerts': 'List workflow alerts',
          }
          for operation_id, summary in summaries.items():
              marker = f'      operationId: {operation_id}\n'
              replacement = marker + f'      summary: {summary}\n'
              if replacement not in text:
                  if marker not in text:
                      raise SystemExit(f'missing operationId: {operation_id}')
                  text = text.replace(marker, replacement, 1)
          webhook = '  regulatoryChangeApproved:\n    post:\n      requestBody:'
          webhook_replacement = '  regulatoryChangeApproved:\n    post:\n      operationId: receiveRegulatoryChangeApproved\n      summary: Receive an approved regulatory change event\n      requestBody:'
          if webhook in text:
              text = text.replace(webhook, webhook_replacement, 1)
          elif 'operationId: receiveRegulatoryChangeApproved' not in text:
              raise SystemExit('missing regulatoryChangeApproved webhook')
          api.write_text(text, encoding='utf-8')

          grants = Path('docs/control/global-regulatory-os/canonical/db/migrations/0013_database_roles_and_grants.sql')
          sql = grants.read_text(encoding='utf-8')
          role_marker = 'END $roles$;\n\nGRANT hv_public_runtime,hv_tenant_runtime,hv_analyst_runtime,hv_ingestion_runtime,hv_governance_runtime TO hv_authenticator;'
          role_replacement = "END $roles$;\nALTER ROLE hv_context_owner NOLOGIN NOINHERIT BYPASSRLS;\nGRANT USAGE,CREATE ON SCHEMA app TO hv_context_owner;\n\nGRANT hv_public_runtime,hv_tenant_runtime,hv_analyst_runtime,hv_ingestion_runtime,hv_governance_runtime TO hv_authenticator;\nGRANT USAGE ON SCHEMA app TO hv_authenticator,hv_public_runtime,hv_tenant_runtime,hv_analyst_runtime,hv_ingestion_runtime,hv_governance_runtime;"
          if 'GRANT USAGE ON SCHEMA app TO hv_authenticator,hv_public_runtime,hv_tenant_runtime' not in sql:
              if role_marker not in sql:
                  raise SystemExit('missing trusted-role grant marker')
              sql = sql.replace(role_marker, role_replacement, 1)
          grants.write_text(sql, encoding='utf-8')

          patchset = Path('docs/control/global-regulatory-os/canonical/HARBOURVIEW_PATCHSET.md')
          patch_text = patchset.read_text(encoding='utf-8')
          old = '7. Regenerate `MANIFEST.json` after all changes.'
          new = '7. Complete OpenAPI operation summaries, tag metadata and webhook identity so the canonical contract passes structural lint.\n8. Restore explicit `app` schema usage and trusted-context owner privileges for runtime accessors and negative privilege-escalation tests.\n9. Regenerate `MANIFEST.json` after all changes.'
          if old in patch_text:
              patch_text = patch_text.replace(old, new, 1)
          patchset.write_text(patch_text, encoding='utf-8')

          for filename in [
              'docs/control/global-regulatory-os/canonical/VALIDATION_REPORT.md',
              'docs/control/global-regulatory-os/VALIDATION_REPORT.md',
          ]:
              report = Path(filename)
              report_text = report.read_text(encoding='utf-8')
              marker = '- Canonical manifest is regenerated after the trusted-context and Phase 0 proof additions.\n'
              addition = '- OpenAPI operation metadata and trusted runtime schema grants are validated in the replacement workflow.\n'
              if addition not in report_text:
                  if marker not in report_text:
                      raise SystemExit(f'missing validation report marker: {filename}')
                  report_text = report_text.replace(marker, marker + addition, 1)
              report.write_text(report_text, encoding='utf-8')
          PY
      - name: Regenerate and verify canonical evidence
        run: |
          python scripts/global-reg-os/regenerate_manifest.py
          python scripts/global-reg-os/validate_phase0_package.py
          python scripts/global-reg-os/check_secrets.py
          python -m py_compile scripts/global-reg-os/*.py
          find scripts/global-reg-os -type d -name __pycache__ -prune -exec rm -rf {} +
          test "$(grep -c '^[[:space:]]*summary:' docs/control/global-regulatory-os/canonical/api/openapi.yaml)" = '19'
          grep -q 'GRANT USAGE ON SCHEMA app TO hv_authenticator,hv_public_runtime,hv_tenant_runtime' docs/control/global-regulatory-os/canonical/db/migrations/0013_database_roles_and_grants.sql
          changed="$(git diff --name-only | wc -l | tr -d ' ')"
          echo "Verified repair files: $changed"
          test "$changed" = '6'
      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/control/global-regulatory-os
          git commit -m 'fix: close Phase 0 contract and runtime grant gaps'
          git push origin HEAD:agent/global-reg-os-phase0-replacement

  contracts-and-control:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Verify source, manifest, proof matrix and registries
        run: python scripts/global-reg-os/validate_phase0_package.py
      - name: Verify no secret material
        run: python scripts/global-reg-os/check_secrets.py
      - name: Confirm manifest is deterministic
        run: |
          cp docs/control/global-regulatory-os/canonical/MANIFEST.json /tmp/MANIFEST.json
          python scripts/global-reg-os/regenerate_manifest.py
          diff -u /tmp/MANIFEST.json docs/control/global-regulatory-os/canonical/MANIFEST.json
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1.34.3 lint docs/control/global-regulatory-os/canonical/api/openapi.yaml
      - name: Validate AsyncAPI
        run: npx --yes @asyncapi/cli@4.1.0 validate docs/control/global-regulatory-os/canonical/events/asyncapi.yaml

  postgres-17:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Clean install, simulated upgrade and authorization tests
        run: bash scripts/global-reg-os/run_postgres_validation.sh
