name: PR Secret Scanner Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/check-no-secret-strings.mjs
      - .github/workflows/secret-scan-pr.yml
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.json'
      - '**/*.md'
      - '**/*.sql'

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanner regression and diff gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run scanner regression self-test
        run: node scripts/check-no-secret-strings.mjs --self-test

      - name: Scan PR diff for committed secret-looking values
        run: node scripts/check-no-secret-strings.mjs --base "${{ github.event.pull_request.base.sha }}" --head HEAD
