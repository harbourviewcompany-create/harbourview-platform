name: Command Centre Production Ready Apply

on:
  pull_request:
    branches:
      - build/harbourview-production-command-platform
    paths:
      - .production-ready-chunk.*

permissions:
  contents: write

concurrency:
  group: command-centre-production-ready-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://zvxdgdkukjrrwamdpqrg.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Reconstruct and verify exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .production-ready-chunk.00 \
            .production-ready-chunk.01 \
            .production-ready-chunk.02 \
            .production-ready-chunk.03 \
            .production-ready-chunk.04 \
            .production-ready-chunk.05 \
            .production-ready-chunk.06 \
            .production-ready-chunk.07 \
            .production-ready-chunk.07a \
            .production-ready-chunk.08 \
            .production-ready-chunk.10 \
            .production-ready-chunk.11 > /tmp/production-ready-bundle.b64
          echo 'e89dd4cf1a8b3d8ddb583d84cb812468eb7162fe912eb724e0b3c29cf7f71542  /tmp/production-ready-bundle.b64' | sha256sum --check
          base64 --decode /tmp/production-ready-bundle.b64 > /tmp/production-ready-bundle.tgz
          tar -tzf /tmp/production-ready-bundle.tgz >/dev/null

      - name: Build clean candidate tree
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git reset --hard "$BASE_SHA"
          rm -f .production-ready-bundle.b64
          tar -xzf /tmp/production-ready-bundle.tgz
          python - <<'PY'
          from pathlib import Path

          registry = Path('lib/platform/commandCentreRegistry.ts')
          source = registry.read_text()
          old_type = "export type CommandCentreRouteMode = 'redirect-now' | 'redirect-after-parity' | 'intercept-next'"
          new_type = "export type CommandCentreRouteMode = 'redirect-now' | 'redirect-after-parity' | 'intercept-next' | 'retain-public'"
          old_check = "!['redirect-now', 'redirect-after-parity', 'intercept-next'].includes"
          new_check = "!['redirect-now', 'redirect-after-parity', 'intercept-next', 'retain-public'].includes"
          if source.count(old_type) != 1 or source.count(old_check) != 1:
              raise SystemExit('Route-mode compatibility patch did not match exactly once')
          registry.write_text(source.replace(old_type, new_type).replace(old_check, new_check))

          boundary = Path('tests/security/command-centre-boundaries.test.ts')
          source = boundary.read_text()
          old_redirect_tail = """      {
                source: '/intelligence/counterparty-intelligence',
                destination: '/dashboard?page=evidence',
                permanent: false,
              },
            ])
          """
          new_redirect_tail = """      {
                source: '/intelligence/counterparty-intelligence',
                destination: '/dashboard?page=evidence',
                permanent: false,
              },
              {
                source: '/marketplace/sell',
                destination: '/dashboard?page=marketplace&section=supply&marketView=cannabis&tool=supply-intake',
                permanent: false,
              },
              {
                source: '/marketplace/wanted',
                destination: '/dashboard?page=marketplace&section=marketplace&marketView=wanted&tool=wanted-intake',
                permanent: false,
              },
              {
                source: '/marketplace/financing',
                destination: '/dashboard?page=trade-calc&section=financing&tool=financing-intake',
                permanent: false,
              },
            ])
          """
          if source.count(old_redirect_tail) != 1:
              raise SystemExit(f'Approved redirect contract patch expected one match, found {source.count(old_redirect_tail)}')
          boundary.write_text(source.replace(old_redirect_tail, new_redirect_tail, 1))
          PY
          git diff --check

      - name: Verify product tree
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:command-centre-production
          npx vitest run \
            tests/dashboard/loadCommandCentreData.test.ts \
            tests/platform/command-centre-route-registry.test.ts \
            tests/platform/command-centre-typed-registry.test.ts \
            tests/security/command-centre-boundaries.test.ts
          npm run typecheck
          npm run build

      - name: Commit verified non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/**'
          git diff --cached --check
          git commit -m 'feat(command-centre): close production readiness blockers'
          git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
