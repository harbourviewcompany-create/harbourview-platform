name: PR 1323 Country Fallback Closeout

on:
  push:
    branches:
      - fix/globe-antimeridian-generator-hardening
    paths:
      - '.github/workflows/pr1323-country-fallback-closeout.yml'

permissions:
  contents: write

jobs:
  verify-fix-and-close:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply feature-level source-eligibility fallback and VI regression
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/generate-natural-earth-countries.mjs')
          s = p.read_text()
          old = """  const polygons = normalizePolygons(feature.geometry, SIMPLIFY_TOLERANCE_DEG)\n  if (polygons.length === 0) return null\n"""
          new = """  let polygons = normalizePolygons(feature.geometry, SIMPLIFY_TOLERANCE_DEG)\n  if (polygons.length === 0) {\n    const sourcePolygons = feature.geometry.type === 'Polygon'\n      ? [feature.geometry.coordinates]\n      : feature.geometry.coordinates\n    const hasSourceEligibleOuter = sourcePolygons.some((polygon) => {\n      const rawOuter = closeRing(polygon[0])\n      return rawOuter !== null && ringAreaDeg2(rawOuter) >= MIN_POLYGON_AREA_DEG2\n    })\n    if (hasSourceEligibleOuter) {\n      polygons = normalizePolygons(feature.geometry, 0)\n    }\n  }\n  if (polygons.length === 0) return null\n"""
          old_count = s.count(old)
          new_count = s.count(new)
          if old_count == 1:
              s = s.replace(old, new, 1)
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(f'transformFeature fallback target mismatch: old={old_count} new={new_count}')
          p.write_text(s)

          p = Path('tests/harbourview/natural-earth-antimeridian-topology.test.ts')
          s = p.read_text()
          marker = "retains source-eligible countries when normal simplification removes every polygon"
          if marker not in s:
              s += """\n\ntest('retains source-eligible countries when normal simplification removes every polygon', () => {\n  const virginIslands = naturalEarthCountriesPayload.countries.find((country) => country.iso2 === 'VI')\n  assert.ok(virginIslands, 'expected regenerated Natural Earth payload to retain VI')\n  assert.ok(virginIslands.polygons.length > 0, 'expected VI to retain renderable polygon geometry')\n}, 60_000)\n"""
          p.write_text(s)
          PY

      - name: Capture committed Russia geometry fingerprint
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          text = Path('data/globe/natural-earth-countries.ts').read_text()
          match = re.search(r"    \{\n      iso2: 'RU',.*?(?=\n    \{\n      iso2: '|\n  \],\n\})", text, re.S)
          if not match:
              raise SystemExit('RU payload block not found before regeneration')
          digest = hashlib.sha256(match.group(0).encode()).hexdigest()
          Path('/tmp/ru-before.sha').write_text(digest)
          print(f'ru_before_sha256={digest}')
          PY

      - name: Regenerate and prove VI recovery without Russia payload drift
        run: |
          node scripts/generate-natural-earth-countries.mjs
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess

          def norm(text):
              return re.sub(r"generatedAt: ['\"][^'\"]+['\"]", "generatedAt: '<normalized>'", text)

          def country_block(text, iso2):
              match = re.search(rf"    \{{\n      iso2: '{iso2}',.*?(?=\n    \{{\n      iso2: '|\n  \],\n\}})", text, re.S)
              if not match:
                  raise SystemExit(f'{iso2} payload block not found')
              return match.group(0)

          first_text = Path('data/globe/natural-earth-countries.ts').read_text()
          if "iso2: 'VI'" not in first_text:
              raise SystemExit('VI missing after feature-level fallback regeneration')

          ru_before = Path('/tmp/ru-before.sha').read_text().strip()
          ru_after = hashlib.sha256(country_block(first_text, 'RU').encode()).hexdigest()
          if ru_after != ru_before:
              raise SystemExit(f'Russia generated payload drifted: before={ru_before} after={ru_after}')

          first = norm(first_text)
          sha1 = hashlib.sha256(first.encode()).hexdigest()
          subprocess.run(['node', 'scripts/generate-natural-earth-countries.mjs'], check=True)
          second_text = Path('data/globe/natural-earth-countries.ts').read_text()
          second = norm(second_text)
          sha2 = hashlib.sha256(second.encode()).hexdigest()
          if first != second:
              raise SystemExit('normalized regenerations differ')
          if "iso2: 'VI'" not in second_text:
              raise SystemExit('VI missing on second regeneration')
          if hashlib.sha256(country_block(second_text, 'RU').encode()).hexdigest() != ru_before:
              raise SystemExit('Russia payload drifted on second regeneration')
          Path('/tmp/normalized.sha').write_text(sha2)
          print(f'normalized_sha256_run1={sha1}')
          print(f'normalized_sha256_run2={sha2}')
          print(f'ru_payload_sha256={ru_after}')
          PY

      - name: Antimeridian topology and source-hole preservation
        run: npx vitest run tests/harbourview/natural-earth-antimeridian-topology.test.ts
      - name: Russia spherical regression
        run: npx vitest run tests/harbourview/russia-spherical-triangulation.test.ts
      - name: Globe polygon rendering regression
        run: npx vitest run tests/globe-polygon-rendering.test.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full tests
        run: npm run test
      - name: Canonical security and leakage gate
        run: npm run test:security
      - name: Build
        run: npm run build

      - name: Post-build deterministic regeneration proof
        run: |
          node scripts/generate-natural-earth-countries.mjs
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          text = Path('data/globe/natural-earth-countries.ts').read_text()
          if "iso2: 'VI'" not in text:
              raise SystemExit('VI missing after post-build regeneration')
          normalized = re.sub(r"generatedAt: ['\"][^'\"]+['\"]", "generatedAt: '<normalized>'", text)
          digest = hashlib.sha256(normalized.encode()).hexdigest()
          expected = Path('/tmp/normalized.sha').read_text().strip()
          if digest != expected:
              raise SystemExit(f'post-build normalized SHA drift: expected={expected} actual={digest}')
          print(f'post_build_normalized_sha256={digest}')
          PY

      - name: Record verified closeout evidence
        run: |
          SHA=$(cat /tmp/normalized.sha)
          MARKER='PR #1323 country-fallback closeout'
          if ! grep -Fq "$MARKER" docs/control/EVIDENCE_LOG.md; then
            cat >> docs/control/EVIDENCE_LOG.md <<EOF

          ### PR #1323 country-fallback closeout
          - Verified source-eligible feature preservation after simplification: U.S. Virgin Islands (VI) remains present with renderable geometry.
          - Feature-level fallback activates only when normal simplification produces zero polygons and at least one raw source outer meets the repository minimum-area threshold; Russia's generated payload fingerprint remained unchanged.
          - Source-hole/topology regression: PASS (`npx vitest run tests/harbourview/natural-earth-antimeridian-topology.test.ts`).
          - Russia spherical regression: PASS (`npx vitest run tests/harbourview/russia-spherical-triangulation.test.ts`).
          - Globe polygon rendering regression: PASS (`npx vitest run tests/globe-polygon-rendering.test.ts`).
          - Lint: PASS (`npm run lint`). Typecheck: PASS (`npm run typecheck`). Full tests: PASS (`npm run test`). Security/leakage: PASS (`npm run test:security`). Build: PASS (`npm run build`).
          - Deterministic normalized regeneration SHA-256: `$SHA` (two consecutive regenerations plus post-build regeneration matched).
          - Workflow evidence: GitHub Actions run `${GITHUB_RUN_ID}` on `${GITHUB_SHA}`. No deployment or production mutation performed.
          EOF
          fi

      - name: Commit verified fix and remove all PR 1323 temporary workflows
        run: |
          git fetch origin fix/globe-antimeridian-generator-hardening
          REMOTE_SHA=$(git rev-parse origin/fix/globe-antimeridian-generator-hardening)
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "Branch moved during verification: start=$GITHUB_SHA remote=$REMOTE_SHA"
            exit 23
          fi
          git rm -f .github/workflows/pr1323-country-fallback-closeout.yml
          git rm -f .github/workflows/pr1323-final-clean-verify.yml 2>/dev/null || true
          git rm -f .github/workflows/pr1323-vi-regression-fix.yml 2>/dev/null || true
          git rm -f .github/workflows/pr1323-review-fix.yml 2>/dev/null || true
          git config user.name 'Harbourview Release Bot'
          git config user.email 'harbourviewcompany@gmail.com'
          git add scripts/generate-natural-earth-countries.mjs data/globe/natural-earth-countries.ts tests/harbourview/natural-earth-antimeridian-topology.test.ts docs/control/EVIDENCE_LOG.md
          git commit -m 'fix(globe): preserve source-eligible small countries'
          git push origin HEAD:fix/globe-antimeridian-generator-hardening
