name: Repair Production Readiness V5

on:
  push:
    branches:
      - build/harbourview-production-command-platform
    paths:
      - .github/workflows/repair-production-readiness-v5.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-production-readiness-v5
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/harbourview-production-command-platform
          fetch-depth: 1
          persist-credentials: true

      - name: Apply reviewed repair payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path

          encoded = "â"
          payload = base64.b64decode(encoded)
          expected = "ec2e9f50321fea752b5decc9e88e3eca437adf42a410e7172fa1320a6257f124"
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"repair payload checksum mismatch: {actual}")

          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              for member in archive.getmembers():
                  target = Path(member.name)
                  if target.is_absolute() or '..' in target.parts:
                      raise SystemExit(f"unsafe archive member: {member.name}")
              archive.extractall('.')
          PY

          rm -f \
            .github/workflows/repair-production-readiness.yml \
            .github/workflows/repair-production-readiness-v2.yml \
            .github/workflows/repair-production-readiness-v3.yml \
            .github/workflows/repair-production-readiness-v4.yml \
            .github/workflows/repair-production-readiness-v5.yml

          test "$(git hash-object supabase/migrations/20260302000000_intelligence_globe_v1.sql)" = "1003ae45a05c32ecd9ae005719be3c67fef3a2ac"
          grep -Fq "('public','marketplace_public_listings_v1','public')" supabase/migrations/20260804190000_production_security_hardening.sql
          grep -Fq "page=marketplace&section=marketplace&marketView=cannabis" tests/e2e/mobile-command-centre-v2.spec.ts
          git diff --check

      - name: Commit focused reversible repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'harbourview-release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): repair command centre verification gates'
          git push origin HEAD:build/harbourview-production-command-platform
