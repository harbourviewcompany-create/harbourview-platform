name: Immutable Action Enforcement (one-shot)

on:
  push:
    branches:
      - fix/governance-hardening-rebased-20260914

permissions:
  contents: write

jobs:
  pin:
    if: github.event.head_commit.message != 'chore(security): pin workflow actions immutably'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pin known mutable action refs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'actions/upload-artifact@v7': 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a',
              'supabase/setup-cli@v3': 'supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520',
              'denoland/setup-deno@v2': 'denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed',
              'actions/checkout@v4': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1',
              'actions/setup-node@v4': 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020',
              'actions/cache@v6': 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9',
              'github/codeql-action/upload-sarif@v4': 'github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63',
              'the-pr-agent/pr-agent@main': 'the-pr-agent/pr-agent@8ac8f7aa9bb97ecf3aa050aac9f6462314206692',
          }

          for path in Path('.github/workflows').glob('*.y*ml'):
              text = path.read_text()
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
                  print(f'updated {path}')
          PY

      - name: Fail closed on remaining mutable external refs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'uses:\s*([^@\s]+)@([^\s#]+)')
          bad = []
          for path in Path('.github/workflows').glob('*.y*ml'):
              for lineno, line in enumerate(path.read_text().splitlines(), 1):
                  m = pattern.search(line)
                  if not m:
                      continue
                  ref = m.group(2)
                  if not re.fullmatch(r'[0-9a-fA-F]{40}', ref):
                      bad.append(f'{path}:{lineno}: {m.group(0)}')
          if bad:
              print('REMAINING MUTABLE WORKFLOW REFERENCES:')
              print('\n'.join(bad))
              raise SystemExit(1)
          print('GO: every external workflow action/reusable-workflow reference is pinned to a full 40-character commit SHA.')
          PY

      - name: Commit immutable pins
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'chore(security): pin workflow actions immutably'
          git push origin HEAD:${{ github.ref_name }}
