name: Temporary production auth SMTP restore
on:
  push:
    paths:
      - ".github/workflows/restore-auth-smtp.yml"

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore production Gmail SMTP
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SMTP_PASSWORD: ${{ secrets.SUPABASE_SMTP_PASSWORD }}
        run: node scripts/configure-supabase-email-production.mjs
