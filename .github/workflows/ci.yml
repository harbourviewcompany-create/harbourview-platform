name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  # ── Critical environment variable sanity check ──────────────────────────────
  # Runs on every push/PR to main. Fails hard if any production-critical secret
  # is absent from GitHub Actions secrets. Warnings (degraded-only vars) are
  # logged but do not block the pipeline.
  #
  # To add or adjust checked variables, edit scripts/check-critical-env.mjs.
  # To add a new GitHub Actions secret: repo Settings → Secrets → Actions.
  env-check:
    name: Critical Env Secrets
    runs-on: ubuntu-latest
    # Run in parallel with typecheck — no dependency needed.
    env:
      # Critical — will fail the job if absent
      HF_TOKEN_SERVER:                   ${{ secrets.HF_TOKEN_SERVER }}
      GEMINI_API_KEY:                    ${{ secrets.GEMINI_API_KEY }}
      HARBOURVIEW_EDGE_OPERATOR_SECRET:  ${{ secrets.HARBOURVIEW_EDGE_OPERATOR_SECRET }}
      CRON_SECRET:                       ${{ secrets.CRON_SECRET }}
      SUPABASE_SERVICE_ROLE_KEY:         ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Warnings — absent degrades features but does not block pipeline
      HF_ENDPOINT_EMBED_BGE_M3:         ${{ secrets.HF_ENDPOINT_EMBED_BGE_M3 }}
      XAI_API_KEY:                       ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Check critical environment variables
        run: node scripts/check-critical-env.mjs

  security:
    name: Security / Leakage
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:visibility
      - run: npm run test:services-public-leakage
      - run: npm run test:used-surplus-public-leakage

  domain:
    name: Domain Logic
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:globe-router
      - run: npm run test:country-role
      - run: npm run test:genetics-routing
      - run: npm run test:genetics-profile-redaction
      - run: npm run test:regulatory-signals-contract
      - run: npm run test:intelligence-os

  intake:
    name: Intake & Listings
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:new-products-equipment-intake
      - run: npm run test:listing-quality
      - run: npm run test:public-images

  signal-engine:
    name: Signal Engine Runtime
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:signal-engine-runtime
      - run: npm run test:regulatory-signals-contract

  # ── Security Gate ──────────────────────────────────────────────────────────
  # Mandatory for every PR. Runs the 17 critical test files identified during
  # the repo consolidation audit (June 2026). These tests cover:
  #   - Public data leakage (fuzz + projection)
  #   - Middleware auth and admin-route matching
  #   - Medical / regulatory guardrails
  #   - Dashboard data integrity and DTO boundaries
  #   - Marketplace action-level validation
  #   - Supabase admin isolation
  #   - Globe rendering and motion preferences
  #   - Education DTO boundaries
  #   - Used-surplus API response shape + field allowlisting
  #
  # Never remove the `needs` dependency on this job from `build` — doing so
  # would allow a regression in any of these guards to ship silently to production.
  security-tests:
    name: Security Test Gate
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Public leakage fuzz (security)
        run: npx vitest run tests/security/public-leakage-fuzz.test.ts
      - name: Public safety fuzz (harbourview)
        run: npx vitest run tests/harbourview/public-safety-fuzz.test.ts
      - name: Middleware admin matcher
        run: npx vitest run tests/harbourview/middleware-admin-matcher.test.ts
      - name: Middleware redirects
        run: npx vitest run tests/harbourview/middleware-redirects.test.ts
      - name: Middleware signals matcher
        run: npx vitest run tests/harbourview/middleware-signals-matcher.test.ts
      - name: Global CSS regression
        run: npx vitest run tests/harbourview/global-css-regression.test.ts
      - name: Medical guardrails
        run: npx vitest run tests/education/medical-guardrails.test.ts
      - name: Education DTO boundary
        run: npx vitest run tests/education/dto-boundary.test.ts
      - name: Commercial dashboard integrity
        run: npx vitest run tests/dashboard/commercialDashboard.test.tsx
      - name: Dashboard routing
        run: npx vitest run tests/dashboard/routing.test.ts
      - name: Marketplace submission actions
        run: npx vitest run tests/actions/marketplaceSubmissionActions.test.ts
      - name: Supabase admin data client isolation
        run: npx vitest run tests/supabase/adminDataClient.test.ts
      - name: Supabase env validation
        run: npx vitest run tests/supabase/env.test.ts
      - name: Globe motion preferences
        run: npx vitest run tests/globe-motion-preferences.test.ts
      - name: Used-surplus preview route
        run: npx vitest run tests/api/used-surplus-preview-route.test.ts
      - name: Globe interactive readiness
        run: npx vitest run tests/harbourview/globe-interactive-readiness.test.ts
      - name: Natural Earth countries
        run: npx vitest run tests/globe-natural-earth-countries.test.ts

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [security, domain, intake, signal-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run smoke:marketplace
      - run: npm run smoke:marketplace:rls
      - run: npm run test:compliance-visibility
      - run: npm run test:admin-guard

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [smoke, env-check, security-tests]
    env:
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      STRIPE_SECRET_KEY:         ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  # E2E runs only on push to main (not PRs) — Playwright is slow
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_TEST_USER_EMAIL:       ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD:    ${{ secrets.E2E_TEST_USER_PASSWORD }}
