name: PR1307 Marketplace Media V5 Audit

on:
  push:
    branches:
      - ops/delete-pr1307-semantic-media-temp
    paths:
      - .github/workflows/pr1307-media-v5-audit.yml

permissions:
  contents: read

jobs:
  audit-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pillow
      - name: Verify public retrieval decode dimensions and SHA-256
        run: |
          cat > /tmp/audit.py <<'PY'
          import csv,hashlib,io,os,requests
          from PIL import Image
          base='https://zvxdgdkukjrrwamdpqrg.supabase.co/storage/v1/object/public/marketplace-item-public/'
          paths=['representative/v5/co2-extraction-system.png','representative/v5/retail-facility.png','representative/v5/confidential-inventory.png']
          os.makedirs('artifacts/pr1307-media-v5',exist_ok=True)
          rows=[]
          for p in paths:
            r=requests.get(base+p,timeout=30); r.raise_for_status(); b=r.content
            im=Image.open(io.BytesIO(b)); im.load()
            assert im.format=='PNG', (p,im.format)
            assert im.size==(1728,1344), (p,im.size)
            rows.append([p,r.status_code,r.headers.get('content-type',''),len(b),im.width,im.height,im.format,hashlib.sha256(b).hexdigest()])
          with open('artifacts/pr1307-media-v5/asset-integrity-v5.csv','w',newline='',encoding='utf-8') as f:
            w=csv.writer(f); w.writerow(['path','http_status','content_type','bytes','width','height','format','sha256']); w.writerows(rows)
          print('PASS v5_assets=3')
          PY
          python /tmp/audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: pr1307-media-v5-audit
          path: artifacts/pr1307-media-v5
          if-no-files-found: error
