name: Temporary Harbourview auth URL repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    name: Repair Supabase Auth URL configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Patch and verify Auth URL configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: zvxdgdkukjrrwamdpqrg
          CANONICAL_SITE_URL: https://harbourview.vercel.app
          CANONICAL_ALLOW_PATTERN: https://harbourview.vercel.app/**
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is unavailable."
            exit 1
          fi

          AUTH_CONFIG_URL="https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth"
          CURRENT_FILE="$(mktemp)"
          PATCH_FILE="$(mktemp)"
          VERIFY_FILE="$(mktemp)"
          trap 'rm -f "$CURRENT_FILE" "$PATCH_FILE" "$VERIFY_FILE"' EXIT

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "$AUTH_CONFIG_URL" > "$CURRENT_FILE"

          BEFORE_SITE_URL="$(jq -r '.site_url // ""' "$CURRENT_FILE")"
          BEFORE_ALLOW_LIST="$(jq -r 'if (.uri_allow_list | type) == "array" then (.uri_allow_list | join(",")) else (.uri_allow_list // "") end' "$CURRENT_FILE")"

          UPDATED_ALLOW_LIST="$(python3 - "$BEFORE_ALLOW_LIST" "$CANONICAL_ALLOW_PATTERN" <<'PY'
import sys
existing, required = sys.argv[1], sys.argv[2]
items = []
for value in existing.split(','):
    value = value.strip()
    if value and value not in items:
        items.append(value)
if required not in items:
    items.append(required)
print(','.join(items))
PY
          )"

          jq -n \
            --arg site_url "$CANONICAL_SITE_URL" \
            --arg uri_allow_list "$UPDATED_ALLOW_LIST" \
            '{site_url: $site_url, uri_allow_list: $uri_allow_list}' > "$PATCH_FILE"

          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @"$PATCH_FILE" \
            "$AUTH_CONFIG_URL" > /dev/null

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "$AUTH_CONFIG_URL" > "$VERIFY_FILE"

          AFTER_SITE_URL="$(jq -r '.site_url // ""' "$VERIFY_FILE")"
          AFTER_ALLOW_LIST="$(jq -r 'if (.uri_allow_list | type) == "array" then (.uri_allow_list | join(",")) else (.uri_allow_list // "") end' "$VERIFY_FILE")"

          if [ "$AFTER_SITE_URL" != "$CANONICAL_SITE_URL" ]; then
            echo "::error::Site URL verification failed."
            exit 1
          fi

          case ",${AFTER_ALLOW_LIST}," in
            *",${CANONICAL_ALLOW_PATTERN},"*) ;;
            *)
              echo "::error::Canonical redirect allow-list entry is missing."
              exit 1
              ;;
          esac

          {
            echo "## Harbourview Auth URL repair"
            echo ""
            echo "- Previous Site URL: \`${BEFORE_SITE_URL:-unset}\`"
            echo "- Verified Site URL: \`${AFTER_SITE_URL}\`"
            echo "- Canonical redirect pattern present: yes"
            echo "- No users, passwords, roles, database rows, or email templates changed."
          } >> "$GITHUB_STEP_SUMMARY"
