name: Set Vercel CRON_SECRET (One-time setup)

on:
  workflow_dispatch:

# Run this once to set CRON_SECRET as a Vercel environment variable.
# After this runs successfully, the daily Vercel cron at 12:00 UTC will
# start executing the /api/cron/regulatory-watch endpoint automatically.
#
# Requires:
#   - CRON_SECRET GitHub Actions secret (already set)
#   - HV GitHub Actions secret = Vercel API token

jobs:
  set-env-var:
    runs-on: ubuntu-latest
    steps:
      - name: Set CRON_SECRET on Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.HV }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROJECT_ID: prj_Zp8HBDstqAAOCN6W7LAElahsq3qS
          TEAM_ID: team_0rK4jTvMLlSufR0ZzX4LCKYi
        run: |
          echo "Setting CRON_SECRET on Vercel project..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID" \
            -d "{
              \"key\": \"CRON_SECRET\",
              \"value\": \"$CRON_SECRET\",
              \"type\": \"secret\",
              \"target\": [\"production\", \"preview\", \"development\"]
            }")
          
          http_status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$response" | grep -v "HTTP_STATUS:")
          
          echo "HTTP Status: $http_status"
          
          if [ "$http_status" = "200" ] || [ "$http_status" = "201" ]; then
            echo "✓ CRON_SECRET set on Vercel successfully"
            echo "The daily regulatory-watch cron (12:00 UTC) will now execute."
            echo "You can also trigger it manually via the 'Trigger Regulatory Watch' workflow."
          elif [ "$http_status" = "409" ]; then
            echo "⚠ CRON_SECRET already exists on Vercel — updating..."
            # Get existing env var ID
            existing=$(curl -s \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID" | \
              python3 -c "import sys,json; envs=json.load(sys.stdin).get('envs',[]); \
              match=[e['id'] for e in envs if e['key']=='CRON_SECRET']; \
              print(match[0] if match else '')")
            
            if [ -n "$existing" ]; then
              curl -s -X PATCH \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.vercel.com/v10/projects/$PROJECT_ID/env/$existing?teamId=$TEAM_ID" \
                -d "{\"value\": \"$CRON_SECRET\"}"
              echo "✓ CRON_SECRET updated on Vercel"
            fi
          else
            echo "::error::Failed to set CRON_SECRET (status $http_status)"
            echo "Response: $body"
            exit 1
          fi
      
      - name: Trigger first run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Sleeping 10s for Vercel env var to propagate..."
          sleep 10
          echo "Triggering first regulatory-watch run..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://harbourview.vercel.app/api/cron/regulatory-watch")
          http_status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$response" | grep -v "HTTP_STATUS:")
          echo "Status: $http_status"
          echo "Response: $body"
          if [ "$http_status" = "200" ]; then
            echo "✓ First regulatory-watch run complete"
          else
            echo "::warning::First run returned $http_status - may need a redeploy for env var to take effect"
          fi
