name: Temporary Governance Remediation

on:
  push:
    branches:
      - remediation/platform-governance-hardening-20260912

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Apply deterministic workflow hardening through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: harbourviewcompany-create/harbourview-platform
          BRANCH: remediation/platform-governance-hardening-20260912
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.parse
          repo=os.environ['REPO']; branch=os.environ['BRANCH']; token=os.environ['GH_TOKEN']
          api=f'https://api.github.com/repos/{repo}/contents/'
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2026-03-10','Content-Type':'application/json'}
          mutable={'actions/upload-artifact@v7':'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1','supabase/setup-cli@v3':'supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0'}
          trusted={'jurisdiction-command-visual.yml','mobile-command-centre-v2-visual.yml','p0-org-onboarding-regression-verify.yml','clinical-prescriber-os-reconciliation-visual.yml','clinical-evidence-v1-1-verify.yml','migration-drift-check.yml','decision-intel-first-slice-verify.yml','clinical-evidence-operating-system-verify.yml','education-command-visual.yml','mobile-genetics-command-visual.yml'}
          paths=['.github/workflows/activate-full-regulatory-tier-coverage.yml','.github/workflows/apply-p0-p2-canonical-pipeline.yml','.github/workflows/activate-p0-identity-org-context.yml','.github/workflows/wbcc-windows-verification.yml','.github/workflows/apply-regulatory-tier-classifier-negation-fix.yml','.github/workflows/candidate-b-verification.yml','.github/workflows/production-browser-verification.yml','.github/workflows/reconstruct-stub-migrations.yml','.github/workflows/gate-1-build-evidence.yml','.github/workflows/verify-production-artifact-scan.yml','.github/workflows/dashboard-target-verification.yml','.github/workflows/apply-production-security-hardening.yml','.github/workflows/consumables-imagery-post-merge-verification.yml','.github/workflows/harbourview-production-visual-verification.yml','.github/workflows/supabase-migrate.yml','.github/workflows/pr1222-supply-visual-verification.yml','.github/workflows/promote-production.yml','.github/workflows/apply-import-aware-regulatory-tier-classifier.yml']+[f'.github/workflows/{x}' for x in trusted]
          def req(method,url,body=None):
            data=None if body is None else json.dumps(body).encode(); r=urllib.request.Request(url,data=data,headers=headers,method=method)
            with urllib.request.urlopen(r) as x: return json.load(x)
          for path in dict.fromkeys(paths):
            try: obj=req('GET',api+path+'?ref='+urllib.parse.quote(branch,safe=''))
            except Exception as e: print('SKIP',path,e); continue
            raw=base64.b64decode(obj['content']).decode(); new=raw
            for old,repl in mutable.items(): new=new.replace(old,repl)
            if path.rsplit('/',1)[-1] in trusted:
              ls=new.splitlines(); out=[]; i=0; changed=False
              while i<len(ls):
                if ls[i]=='  pull_request:':
                  changed=True; i+=1
                  while i<len(ls) and (ls[i].startswith('    ') or ls[i].strip()==''): i+=1
                  out += ['  push:','    branches:','      - main']; continue
                out.append(ls[i]); i+=1
              new='\n'.join(out)+'\n'
            if new==raw: continue
            payload={'message':'fix(governance): harden workflow trust boundary and pin actions','content':base64.b64encode(new.encode()).decode(),'sha':obj['sha'],'branch':branch}
            result=req('PUT',api+path,payload); print('UPDATED',path,result.get('commit',{}).get('sha'))
          temp='.github/workflows/_temporary-governance-remediation.yml'; obj=req('GET',api+temp+'?ref='+urllib.parse.quote(branch,safe=''))
          req('DELETE',api+temp,{'message':'chore(governance): remove temporary remediation workflow','sha':obj['sha'],'branch':branch})
          print('REMOVED',temp)
          PY
          # deterministic self-trigger marker
          echo remediation-triggered
