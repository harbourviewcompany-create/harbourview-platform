name: Fix Security Migration Lint
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/fix-security-migration-lint.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
      - name: Convert dynamic security operations to explicit guarded statements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('supabase/migrations/20260804190000_production_security_hardening.sql')
          source = path.read_text()

          def section(start_marker, end_marker):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return start, end, source[start:end]

          start, end, block = section('-- Explicit inventory', '-- Internal/admin')
          views = re.findall(r"\('([^']+)','([^']+)'\)", block)
          if len(views) != 36: raise SystemExit(f'Expected 36 views, found {len(views)}')
          lines = ['-- Explicit inventory of exposed views identified by the production advisor.', '-- Each literal ALTER VIEW is paired with its own existence guard.', 'do $$', 'begin']
          for schema, relation in views:
              lines += [f"  if public.view_exists('{schema}', '{relation}') then", f'    alter view {schema}.{relation} set (security_invoker = true);', f'    revoke all privileges on table {schema}.{relation} from public, anon, authenticated;', f'    grant select on table {schema}.{relation} to service_role;', '  end if;']
          lines += ['end', '$$;', '']
          source = source[:start] + '\n'.join(lines) + source[end:]

          start, end, block = section('-- Audited service-role RPC allowlist', '-- Audited authenticated')
          service = re.findall(r"'([^']+\([^']*\))'", block)
          if len(service) < 40: raise SystemExit(f'Expected service allowlist, found {len(service)}')
          lines = ['-- Audited service-role RPC allowlist. Every grant names one exact signature.', 'do $$', 'begin']
          for signature in service:
              lines += [f"  if to_regprocedure('{signature}') is not null then", f'    grant execute on function {signature} to service_role;', '  end if;']
          lines += ['end', '$$;', '']
          source = source[:start] + '\n'.join(lines) + source[end:]

          start, end, block = section('-- Audited authenticated RPC/policy-helper allowlist.', '-- Pin search_path')
          authenticated = re.findall(r"'([^']+\([^']*\))'", block)
          if len(authenticated) < 10: raise SystemExit(f'Expected authenticated allowlist, found {len(authenticated)}')
          lines = ['-- Audited authenticated RPC/policy-helper allowlist.', 'do $$', 'begin']
          for signature in authenticated:
              lines += [f"  if to_regprocedure('{signature}') is not null then", f'    grant execute on function {signature} to authenticated;', '  end if;']
          lines += ['end', '$$;', '']
          source = source[:start] + '\n'.join(lines) + source[end:]
          path.write_text(source)
          print(len(views), len(service), len(authenticated))
          PY
          git diff --check
      - name: Commit migration fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260804190000_production_security_hardening.sql
          git diff --cached --check
          git commit -m 'security(supabase): make hardening operations explicitly auditable'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
