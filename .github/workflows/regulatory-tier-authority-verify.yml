name: Regulatory Tier Authority Verify

on:
  pull_request:
    branches: [main]
    paths:
      - lib/globe/derive-regulatory-tier.ts
      - tests/globe/derive-regulatory-tier.test.ts
      - tests/sql/full_regulatory_tier_coverage_regression.sql
      - supabase/migrations/20260822134600_reconcile_legacy_heatmap_territory_rows.sql
      - supabase/migrations/20260830140000_full_regulatory_tier_coverage.sql
      - supabase/migrations/20260830141000_subnational_regulatory_tier_evidence_alignment.sql
      - supabase/migrations/20260830184434_resync_market_access_status_from_regulatory_tier.sql
      - supabase/migrations/20260830185137_fix_regulatory_tier_rationale_mismatches.sql
      - supabase/migrations/20260830191900_fix_market_access_status_trigger_type_resolution.sql
      - supabase/migrations/20260830192000_regulatory_tier_authority_write_guard.sql
      - .github/workflows/regulatory-tier-authority-verify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regulatory-tier-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Classifier unit regression
        run: npx vitest run tests/globe/derive-regulatory-tier.test.ts

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.109.1

      - name: Prepare production-faithful migration replay
        run: node scripts/prepare-production-faithful-migration-replay.mjs --apply

      - name: Full zero-state migration replay through authority repair
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset --local
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/sql/full_regulatory_tier_coverage_regression.sql | tee /tmp/regulatory-tier-regression.txt
          grep -q 'FULL_REGULATORY_TIER_COVERAGE_REGRESSION|PASS' /tmp/regulatory-tier-regression.txt

          shape="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) || '|' || count(*) filter (where regulatory_tier is null) || '|' || count(*) filter (where iso_alpha2 ~ '^(US|CA|DE|AU)-') || '|' || count(*) filter (where iso_alpha2 ~ '^(US|CA|DE|AU)-' and regulatory_tier is not null) from public.countries;")"
          test "$shape" = "291|0|88|88"

          parity="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from public.countries c where api.derive_regulatory_tier(api.briefing_text_for_iso(c.iso_alpha2)) is not null and c.regulatory_tier is distinct from api.derive_regulatory_tier(api.briefing_text_for_iso(c.iso_alpha2));")"
          test "$parity" = "0"

          market_parity="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from public.countries where market_access_status::text is distinct from case regulatory_tier when 'legal_commercial_access' then 'open' when 'medical_limited_trade' then 'regulated' when 'domestic_only' then 'emerging' when 'cbd_hemp_only' then 'limited' when 'prohibited' then 'restricted' else 'unknown' end;")"
          test "$market_parity" = "0"

          ledger="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select string_agg(version,',' order by version) from supabase_migrations.schema_migrations where version in ('20260822134500','20260822134600','20260830140000','20260830141000','20260830184434','20260830185137','20260830191900','20260830192000');")"
          test "$ledger" = "20260822134500,20260822134600,20260830140000,20260830141000,20260830184434,20260830185137,20260830191900,20260830192000"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
