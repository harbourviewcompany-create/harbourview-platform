name: Exact Deployment Repair Proof

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

env:
  EXPECTED_PROJECT_ID: prj_Zp8HBDstqAAOCN6W7LAElahsq3qS
  EXPECTED_DEPLOYMENT_ID: dpl_71bGk64DXz1YVqAf9Y41FDyWrqCp
  HARBOURVIEW_DEPLOYMENT_URL: https://harbourview-5yo2ys1a4-harbourview.vercel.app
  EXPECTED_GIT_SHA: c210e2862aa67e03f5d52dfce4cb3f01b1474b4a
  EXPECTED_ENVIRONMENT: production

jobs:
  read-only-proof:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install reviewed dependency graph
        run: npm ci

      - name: Install lockfile-matched Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run repaired verifier against immutable deployment read-only
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/verify-exact-deployment.mjs
