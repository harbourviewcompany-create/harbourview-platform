name: Temporary Export Main Source PR

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-export-main-source-pr.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Record exact base commit
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
      - name: Package exact base source snapshot
        run: tar --exclude=.git -czf /tmp/harbourview-main-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: harbourview-main-snapshot
          path: /tmp/harbourview-main-snapshot.tar.gz
          retention-days: 1
          if-no-files-found: error
