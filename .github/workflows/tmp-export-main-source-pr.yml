name: Temporary Export Main Source PR

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-export-main-source-pr.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact PR base commit
        run: test "$(git rev-parse HEAD^1)" = "6fd3cb2a2f43fb4a998c52ae03f06e5d0cb14eb5"
      - name: Remove temporary workflow and package exact base source snapshot
        run: |
          rm -f .github/workflows/tmp-export-main-source-pr.yml
          tar --exclude=.git -czf /tmp/harbourview-main-6fd3cb2.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: harbourview-main-6fd3cb2
          path: /tmp/harbourview-main-6fd3cb2.tar.gz
          retention-days: 1
          if-no-files-found: error
