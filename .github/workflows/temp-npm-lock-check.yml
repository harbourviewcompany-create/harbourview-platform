name: Temporary NPM Lock Check

on:
  push:
    branches:
      - fix/package-lock-ai-drift-main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/package-lock-ai-drift-main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package JSON
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json valid')"
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update package lock for dependency drift
          file_pattern: package-lock.json
