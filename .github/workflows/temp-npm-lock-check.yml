name: Temporary NPM Lock Check

on:
  push:
    branches:
      - fix/package-lock-ai-drift-main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package JSON
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json valid')"
      - name: Run package-lock-only dry check
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify npm ci
        run: npm ci
      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
