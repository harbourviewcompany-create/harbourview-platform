name: Temporary Lock Sync

on:
  push:
    branches:
      - fix/main-build-blockers-current
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/main-build-blockers-current
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Remove temporary workflow
        run: rm -f .github/workflows/_temporary-lock-sync.yml
      - name: Commit lock synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/_temporary-lock-sync.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "Synchronize package lock with manifest"
          git push origin HEAD:fix/main-build-blockers-current
