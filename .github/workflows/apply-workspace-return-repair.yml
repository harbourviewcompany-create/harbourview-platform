name: Apply Workspace Return Repair

on:
  push:
    branches:
      - build/harbourview-production-command-platform
    paths:
      - .github/workflows/apply-workspace-return-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-workspace-return-repair
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/harbourview-production-command-platform
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply and verify workspace return repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_workspace_return_repair.py
          rm scripts/tmp_workspace_return_repair.py
          npx vitest run tests/dashboard/mobileCommandCentreV2.test.ts tests/platform/command-centre-route-registry.test.ts
          npm run typecheck
          git diff --check

      - name: Commit targeted repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'harbourview-release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/apply-workspace-return-repair.yml
          git commit -m 'fix(mobile): return workflows to their owning section'
          git push origin HEAD:build/harbourview-production-command-platform
