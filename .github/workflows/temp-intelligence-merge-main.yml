name: Temporary Intelligence Merge Main

on:
  push:
    branches:
      - feature/intelligence-v1-fixtures-pr1

permissions:
  contents: write

jobs:
  merge-main:
    if: ${{ !contains(github.event.head_commit.message, '[main-merged]') && !contains(github.event.head_commit.message, '[remove-temp-merge-workflow]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/intelligence-v1-fixtures-pr1
          fetch-depth: 0
      - name: Merge latest main
        run: |
          git config user.name "harbourviewcompany-create"
          git config user.email "harbourviewcompany@gmail.com"
          git fetch origin main
          git merge --no-edit origin/main -m "Merge latest main into intelligence fixtures PR [main-merged]"
          git push
