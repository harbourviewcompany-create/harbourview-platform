name: Temporary esbuild convergence

on:
  push:
    branches:
      - deps/esbuild-0.28.2-converged
    paths:
      - .github/workflows/tmp-dependency-esbuild.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deps/esbuild-0.28.2-converged
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate dependency lockfile
        run: npm install --save-dev esbuild@0.28.2 --package-lock-only --ignore-scripts
      - name: Commit dependency files
        run: |
          git config user.name "Harbourview Release Automation"
          git config user.email "harbourviewcompany@gmail.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes generated"
          else
            git commit -m "chore(deps-dev): bump esbuild from 0.28.1 to 0.28.2"
            git push origin HEAD:deps/esbuild-0.28.2-converged
          fi
