name: CI Hygiene Review Closeout

on:
  push:
    branches:
      - fix/ci-main-e2e-readiness-hygiene
    paths:
      - .github/workflows/ci-hygiene-review-closeout.yml

permissions:
  contents: write

jobs:
  verify-and-close:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-main-e2e-readiness-hygiene
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply in-scope review findings
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > tests/ci/workflow-infrastructure-hygiene.test.ts
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/control/EVIDENCE_LOG.md')
          text = path.read_text()
          old = 'MIGRATION_LEDGER=EXTERNAL_GATE'
          new = 'migration_ledger=EXTERNAL_GATE'
          if old not in text:
              raise SystemExit('Expected evidence-key text not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - name: Targeted Supabase readiness tests
        run: npx vitest run tests/ci/supabase-e2e-readiness.test.ts
      - name: Workflow infrastructure hygiene tests
        run: npx vitest run tests/ci/workflow-infrastructure-hygiene.test.ts
      - name: Secret-string scan
        run: node scripts/check-no-secret-strings.mjs --base origin/main --head HEAD
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm run test
      - name: Security / leakage suite
        run: npm run test:security
      - name: Build
        run: npm run build
      - name: Finalize evidence, prove five-file scope, and remove verifier
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('docs/control/EVIDENCE_LOG.md')
          text = path.read_text()
          run_id = os.environ['GITHUB_RUN_ID']
          old = 'CI Hygiene Reconciled Closeout run `31611087826`'
          new = f'CI Hygiene Review Closeout run `{run_id}`'
          if old not in text:
              raise SystemExit('Expected previous verification run marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/ci-hygiene-review-closeout.yml
          mapfile -t unique_changed < <(git diff --name-only origin/main | sort -u)
          printf 'Permanent changed files:\n'
          printf '%s\n' "${unique_changed[@]}"
          expected=(
            '.github/workflows/ci.yml'
            'docs/control/EVIDENCE_LOG.md'
            'scripts/check-supabase-e2e-readiness.mjs'
            'tests/ci/supabase-e2e-readiness.test.ts'
            'tests/ci/workflow-infrastructure-hygiene.test.ts'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "${#unique_changed[@]}" -ne 5 ] || ! diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${unique_changed[@]}"); then
            echo 'HOLD: permanent diff is not exactly the authorized five files.' >&2
            exit 1
          fi
          git config user.name "Harbourview CI"
          git config user.email "harbourviewcompany@gmail.com"
          git add tests/ci/workflow-infrastructure-hygiene.test.ts docs/control/EVIDENCE_LOG.md .github/workflows/ci-hygiene-review-closeout.yml
          git commit -m "test: close infrastructure hygiene review findings"
          git push origin HEAD:fix/ci-main-e2e-readiness-hygiene
