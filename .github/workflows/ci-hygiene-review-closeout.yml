name: CI Hygiene Review Closeout

on:
  push:
    branches:
      - fix/ci-main-e2e-readiness-hygiene
    paths:
      - .github/workflows/ci-hygiene-review-closeout.yml

permissions:
  contents: write

jobs:
  verify-and-close:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-main-e2e-readiness-hygiene
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply in-scope review findings
        shell: bash
        run: |
          cat > tests/ci/workflow-infrastructure-hygiene.test.ts <<'EOF'
          import fs from 'node:fs'
          import path from 'node:path'

          import { describe, expect, it } from 'vitest'

          const root = process.cwd()
          const read = (relativePath: string) => fs.readFileSync(path.join(root, relativePath), 'utf8')
          const activeYamlLines = (raw: string) =>
            raw
              .split(/\r?\n/)
              .filter((line) => !line.trimStart().startsWith('#'))
              .join('\n')

          function hasCanonicalSyncWorkflowStructure(raw: string) {
            const active = activeYamlLines(raw)
            return [
              /^on:\s*$/m,
              /^ {2}workflow_dispatch:\s*$/m,
              /^jobs:\s*$/m,
              /^ {2}sync-tokens:\s*$/m,
              /^ {4}runs-on:\s+ubuntu-latest\s*$/m,
            ].every((pattern) => pattern.test(active))
          }

          describe('CI infrastructure hygiene', () => {
            it('keeps PR runs cancellable while allowing running main pushes to finish', () => {
              const ci = read('.github/workflows/ci.yml')

              expect(ci).toContain('group: ci-${{ github.ref }}')
              expect(ci).toContain("cancel-in-progress: ${{ github.event_name == 'pull_request' }}")
              expect(ci).not.toContain('cancel-in-progress: true')
            })

            it('keeps E2E main-push-only, optional-credential-aware, and diagnoses readiness before Playwright', () => {
              const ci = read('.github/workflows/ci.yml')
              const e2eStart = ci.indexOf('  e2e:')
              const e2e = ci.slice(e2eStart)

              expect(e2eStart).toBeGreaterThan(-1)
              expect(e2e).toContain('needs: build')
              expect(e2e).toContain("if: github.event_name == 'push' && github.ref == 'refs/heads/main'")
              expect(e2e).toContain('name: Check optional E2E credentials')
              expect(e2e).toContain("if: steps.e2e-creds.outputs.configured == 'true'")
              expect(e2e).toContain("if: steps.e2e-creds.outputs.configured != 'true'")

              const credentialGateIndex = e2e.indexOf('name: Check optional E2E credentials')
              const readinessIndex = e2e.indexOf('name: Supabase E2E readiness')
              const playwrightInstallIndex = e2e.indexOf('npx playwright install --with-deps chromium')
              const e2eRunIndex = e2e.indexOf('npm run test:e2e')

              expect(readinessIndex).toBeGreaterThan(credentialGateIndex)
              expect(playwrightInstallIndex).toBeGreaterThan(readinessIndex)
              expect(e2eRunIndex).toBeGreaterThan(playwrightInstallIndex)
              expect(e2e).toContain('node scripts/check-supabase-e2e-readiness.mjs')
            })
          })

          describe('Figma token workflow hygiene', () => {
            it('keeps the manual trigger and sync job at canonical YAML mapping indentation', () => {
              const raw = read('.github/workflows/sync-figma-tokens.yml')
              const active = activeYamlLines(raw)

              expect(hasCanonicalSyncWorkflowStructure(raw)).toBe(true)
              expect(active).toMatch(/^ {2}workflow_dispatch:\s*$/m)
              expect(active).not.toMatch(/^ {2}(?:push|pull_request|schedule):\s*$/m)
              expect(active).toMatch(/^ {2}sync-tokens:\s*$/m)
              expect(active).toMatch(/^ {4}runs-on:\s+ubuntu-latest\s*$/m)
              expect(active).toContain(
                'commit-message: "${{ github.event.inputs.commit_message || \'chore: Sync design tokens from Figma\' }}"',
              )
            })

            it('rejects the malformed mapping indentation that would detach a sync-job field', () => {
              const raw = read('.github/workflows/sync-figma-tokens.yml')
              const malformed = raw.replace(/^ {4}runs-on:/m, '     runs-on:')

              expect(malformed).not.toBe(raw)
              expect(hasCanonicalSyncWorkflowStructure(malformed)).toBe(false)
            })

            it('does not require active Figma API credentials in the current execution path', () => {
              const raw = read('.github/workflows/sync-figma-tokens.yml')
              const active = activeYamlLines(raw)

              expect(active).not.toContain('FIGMA_TOKEN:')
              expect(active).not.toContain('FIGMA_FILE_KEY:')
              expect(active).not.toContain('scripts/fetch-figma-tokens.js')
              expect(active).toContain('npm run tokens:generate || npx style-dictionary build --config ./style-dictionary.config.js')
            })
          })
          EOF
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/control/EVIDENCE_LOG.md')
          text = path.read_text()
          old = 'MIGRATION_LEDGER=EXTERNAL_GATE'
          new = 'migration_ledger=EXTERNAL_GATE'
          if old not in text:
              raise SystemExit('Expected evidence-key text not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - name: Targeted Supabase readiness tests
        run: npx vitest run tests/ci/supabase-e2e-readiness.test.ts
      - name: Workflow infrastructure hygiene tests
        run: npx vitest run tests/ci/workflow-infrastructure-hygiene.test.ts
      - name: Secret-string scan
        run: node scripts/check-no-secret-strings.mjs --base origin/main --head HEAD
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm run test
      - name: Security / leakage suite
        run: npm run test:security
      - name: Build
        run: npm run build
      - name: Finalize evidence, prove five-file scope, and remove verifier
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('docs/control/EVIDENCE_LOG.md')
          text = path.read_text()
          run_id = os.environ['GITHUB_RUN_ID']
          old = 'CI Hygiene Reconciled Closeout run `31611087826`'
          new = f'CI Hygiene Review Closeout run `{run_id}`'
          if old not in text:
              raise SystemExit('Expected previous verification run marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/ci-hygiene-review-closeout.yml
          mapfile -t changed < <(git diff --name-only origin/main -- . ':!.github/workflows/ci-hygiene-review-closeout.yml' && git diff --name-only --cached origin/main -- . ':!.github/workflows/ci-hygiene-review-closeout.yml')
          mapfile -t unique_changed < <(printf '%s\n' "${changed[@]}" | sed '/^$/d' | sort -u)
          printf 'Permanent changed files:\n%s\n' "${unique_changed[*]}"
          expected=(
            '.github/workflows/ci.yml'
            'docs/control/EVIDENCE_LOG.md'
            'scripts/check-supabase-e2e-readiness.mjs'
            'tests/ci/supabase-e2e-readiness.test.ts'
            'tests/ci/workflow-infrastructure-hygiene.test.ts'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "${#unique_changed[@]}" -ne 5 ] || ! diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${unique_changed[@]}"); then
            echo 'HOLD: permanent diff is not exactly the authorized five files.' >&2
            exit 1
          fi
          git config user.name "Harbourview CI"
          git config user.email "harbourviewcompany@gmail.com"
          git add tests/ci/workflow-infrastructure-hygiene.test.ts docs/control/EVIDENCE_LOG.md
          git commit -m "test: close infrastructure hygiene review findings"
          git push origin HEAD:fix/ci-main-e2e-readiness-hygiene
