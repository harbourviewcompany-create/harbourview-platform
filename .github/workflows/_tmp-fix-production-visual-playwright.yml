name: Temporary Production Visual Playwright Patch

on:
  push:
    branches:
      - fix/postmerge-production-visual-runner-20260812

permissions:
  contents: read

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/postmerge-production-visual-runner-20260812
      - name: Patch only the production visual runtime mismatch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/harbourview-production-visual-verification.yml')
          s = p.read_text()
          old = """      - name: Set up Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: 20\n\n      - name: Install Playwright Chromium\n        run: |\n          npm install --no-save playwright@1.53.0\n          npx playwright install --with-deps chromium\n"""
          new = """      - name: Set up Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n\n      - name: Install repository dependencies\n        run: npm ci\n\n      - name: Install Playwright Chromium\n        run: npx playwright install --with-deps chromium\n"""
          if old not in s:
              raise SystemExit('expected workflow block not found; refusing to patch')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          grep -q "node-version: 22" .github/workflows/harbourview-production-visual-verification.yml
          grep -q "run: npm ci" .github/workflows/harbourview-production-visual-verification.yml
          grep -q "npx playwright install --with-deps chromium" .github/workflows/harbourview-production-visual-verification.yml
          ! grep -q "playwright@1.53.0" .github/workflows/harbourview-production-visual-verification.yml
      - name: Export patched workflow
        uses: actions/upload-artifact@v4
        with:
          name: patched-production-visual-workflow
          path: .github/workflows/harbourview-production-visual-verification.yml
          if-no-files-found: error
