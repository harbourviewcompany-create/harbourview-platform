name: Configure production Supabase auth email

on:
  push:
    branches:
      - main
    paths:
      - scripts/configure-supabase-email-production.mjs
      - .github/workflows/configure-supabase-email-production.yml

permissions:
  contents: read

concurrency:
  group: configure-production-supabase-auth-email
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Apply production auth email configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SMTP_PASSWORD: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/configure-supabase-email-production.mjs

      - name: Record safe completion summary
        if: success()
        run: |
          {
            echo "## Production auth email"
            echo ""
            echo "Supabase Auth email confirmation is enabled."
            echo "Custom SMTP is configured through Resend."
            echo "No secret values are printed."
          } >> "$GITHUB_STEP_SUMMARY"
