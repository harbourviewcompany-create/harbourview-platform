name: Temporary PR 1234 Lockfile Regeneration

on:
  push:
    branches:
      - tmp/pr-1234-main-sync

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/pr-1234-main-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate combined package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate dependency merge
        run: |
          node - <<'NODE'
          const pkg = require('./package.json')
          const lock = require('./package-lock.json')
          if (pkg.dependencies.linkedom !== '^0.18.12') throw new Error('main linkedom dependency was not preserved')
          if (pkg.devDependencies.eslint !== '9.39.5') throw new Error('ESLint compatibility pin was not preserved')
          if (lock.packages[''].dependencies.linkedom !== '^0.18.12') throw new Error('lockfile is missing linkedom root dependency')
          if (lock.packages[''].devDependencies.eslint !== '9.39.5') throw new Error('lockfile is missing ESLint compatibility pin')
          NODE
      - name: Remove temporary workflow and commit lockfile
        run: |
          rm .github/workflows/tmp-pr1234-rebase-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git add -u .github/workflows/tmp-pr1234-rebase-lock.yml
          git commit -m "chore: regenerate lockfile after main rebase"
          git push origin HEAD:tmp/pr-1234-main-sync
