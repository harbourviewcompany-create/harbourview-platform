name: PR 1306 Globe Visual Verify

on:
  push:
    branches:
      - fix/russia-globe-hole-definitive
  workflow_dispatch:

permissions:
  contents: read

jobs:
  globe-mobile-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://harbourview-git-fix-russia-globe-hole-definitive-harbourview.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for matching Vercel preview
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            status="$(curl -L -sS -o /tmp/hv-preview.html -w '%{http_code}' "$BASE_URL/")"
            if [ "$status" = "200" ] && grep -qi "harbourview" /tmp/hv-preview.html; then
              echo "Preview ready: $BASE_URL"
              exit 0
            fi
            echo "Preview not ready yet (HTTP $status); retry $i/60"
            sleep 5
          done
          echo "Preview did not become publicly reachable in time"
          exit 1
      - name: Capture globe evidence
        run: |
          xvfb-run -a node <<'NODE'
          const { chromium } = require('@playwright/test')
          const fs = require('node:fs')
          const path = require('node:path')

          const baseURL = process.env.BASE_URL
          const outDir = path.resolve('artifacts/pr1306-globe-visual')
          fs.mkdirSync(outDir, { recursive: true })

          const targets = [
            { name: 'russia', query: 'Russia' },
            { name: 'united-states', query: 'United States' },
            { name: 'fiji', query: 'Fiji' },
            { name: 'new-zealand', query: 'New Zealand' },
          ]
          const viewports = [
            { width: 375, height: 812 },
            { width: 390, height: 844 },
            { width: 430, height: 932 },
          ]

          async function makePage(browser, viewport) {
            const context = await browser.newContext({ viewport, deviceScaleFactor: 1, reducedMotion: 'no-preference' })
            await context.addInitScript(() => {
              Object.defineProperty(navigator, 'hardwareConcurrency', { configurable: true, get: () => 8 })
              Object.defineProperty(navigator, 'deviceMemory', { configurable: true, get: () => 8 })
            })
            const page = await context.newPage()
            return { context, page }
          }

          async function waitForInteractiveGlobe(page) {
            await page.goto(baseURL, { waitUntil: 'domcontentloaded', timeout: 60000 })
            await page.locator('canvas').first().waitFor({ state: 'visible', timeout: 30000 })
            await page.waitForTimeout(2500)
          }

          async function selectMarket(page, query) {
            const input = page.getByRole('combobox', { name: /search countries/i })
            await input.fill(query)
            await page.waitForTimeout(250)
            const option = page.getByRole('option', { name: new RegExp(query, 'i') }).first()
            if (await option.count()) await option.click()
            else await input.press('Enter')
            await page.waitForTimeout(1800)
          }

          ;(async () => {
            const browser = await chromium.launch({
              headless: false,
              args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist', '--disable-dev-shm-usage'],
            })
            const summary = []

            for (const viewport of viewports) {
              const { context, page } = await makePage(browser, viewport)
              const errors = []
              page.on('pageerror', error => errors.push(`pageerror: ${error.message}`))
              page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`) })

              await waitForInteractiveGlobe(page)
              await page.screenshot({ path: path.join(outDir, `russia-idle-${viewport.width}x${viewport.height}.png`) })

              const canvas = page.locator('canvas').first()
              const box = await canvas.boundingBox()
              if (!box) throw new Error('Globe canvas has no bounding box')
              await page.mouse.move(box.x + box.width * 0.72, box.y + box.height * 0.53)
              await page.mouse.down()
              await page.mouse.move(box.x + box.width * 0.42, box.y + box.height * 0.50, { steps: 18 })
              await page.mouse.up()
              await page.waitForTimeout(900)
              await page.screenshot({ path: path.join(outDir, `russia-rotated-${viewport.width}x${viewport.height}.png`) })

              await selectMarket(page, 'Russia')
              await page.getByText('Market overview', { exact: true }).waitFor({ state: 'visible', timeout: 15000 })
              await page.screenshot({ path: path.join(outDir, `russia-selected-${viewport.width}x${viewport.height}.png`) })
              summary.push({ viewport, errors })
              await context.close()
            }

            for (const target of targets.slice(1)) {
              const { context, page } = await makePage(browser, { width: 390, height: 844 })
              await waitForInteractiveGlobe(page)
              await selectMarket(page, target.query)
              await page.getByText('Market overview', { exact: true }).waitFor({ state: 'visible', timeout: 15000 })
              await page.screenshot({ path: path.join(outDir, `${target.name}-selected-390x844.png`) })
              await context.close()
            }

            fs.writeFileSync(path.join(outDir, 'summary.json'), JSON.stringify({ baseURL, capturedAt: new Date().toISOString(), summary }, null, 2))
            await browser.close()
          })().catch(err => {
            console.error(err)
            process.exit(1)
          })
          NODE
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1306-globe-visual-${{ github.sha }}
          path: artifacts/pr1306-globe-visual/
          if-no-files-found: error
          retention-days: 14
