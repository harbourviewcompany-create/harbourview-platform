name: PR1309 Final Test Alignment

on:
  push:
    branches: [build/decision-intel-stage0-first-slice]
    paths:
      - .github/workflows/pr1309-final-test-alignment.yml

permissions:
  contents: write

jobs:
  patch-and-self-remove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/decision-intel-stage0-first-slice
          fetch-depth: 0
      - name: Align static test with canonical control wording
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/intel/decisionIntelFirstSlice.test.ts')
          text = p.read_text()
          old = "expect(databaseControl).toContain('`SECURITY DEFINER` RPCs')"
          new = "expect(databaseControl).toContain('`SECURITY DEFINER` RPC `api.get_intel_event_dossier(text)`')"
          if old not in text:
              raise SystemExit('target assertion not found')
          p.write_text(text.replace(old, new, 1))
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "harbourview-release-operator"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr1309-final-test-alignment.yml
          git add tests/intel/decisionIntelFirstSlice.test.ts
          git commit -m "test(intel): align final RPC control assertion"
          git push origin HEAD:build/decision-intel-stage0-first-slice
