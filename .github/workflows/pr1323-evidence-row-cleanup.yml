name: PR 1323 Evidence Row Cleanup
on:
  push:
    branches: [fix/globe-antimeridian-generator-hardening]
    paths: ['.github/workflows/pr1323-evidence-row-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace stale canonical evidence row and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/control/EVIDENCE_LOG.md')
          text=p.read_text()
          lines=text.splitlines()
          matches=[i for i,l in enumerate(lines) if l.startswith('| 2026-08-10 | PR #1323 Natural Earth antimeridian generator hardening review-closeout |')]
          if len(matches)!=1:
              raise SystemExit(f'expected exactly one PR #1323 evidence row, found {len(matches)}')
          lines[matches[0]]="| 2026-08-10 | PR #1323 Natural Earth antimeridian generator hardening review-closeout | `node scripts/generate-natural-earth-countries.mjs`; committed-payload normalized comparison; `npx vitest run tests/harbourview/natural-earth-antimeridian-topology.test.ts`; `npx vitest run tests/harbourview/russia-spherical-triangulation.test.ts`; `npx vitest run tests/globe-polygon-rendering.test.ts`; normalized two-run regeneration comparison; `npm run lint`; `npm run typecheck`; `npm run test`; targeted security/leakage Vitest; `npm run build` | PASS on exact verified implementation head `b9d62ca56c9cc380a88cfd089ffca09eb9491ce9`, workflow run `31450185534`: regeneration 194 countries / 15,370 vertex points; committed payload matches regeneration after `generatedAt` normalization; antimeridian topology 9/9; Russia spherical 4/4; globe polygon rendering 20/20; normalized two-run SHA-256 `4b8c2a287187ab9438006c77ebabc5b02d3ed9f7bb77fb93bd623cf01f4e71f3`; lint exit 0 with 146 warnings and 0 errors; typecheck PASS; full `npm run test` PASS; targeted security/leakage 13/13; production build PASS (126 static pages). No production change. | PR #1323; workflow `PR 1323 Final Topology Verification`, run `31450185534` | Current — pre-merge evidence |"
          p.write_text('\n'.join(lines)+('\n' if text.endswith('\n') else ''))
          PY
          rm .github/workflows/pr1323-evidence-row-cleanup.yml
          git config user.name 'Harbourview Release Bot'
          git config user.email 'harbourviewcompany@gmail.com'
          git add docs/control/EVIDENCE_LOG.md .github/workflows/pr1323-evidence-row-cleanup.yml
          git commit -m 'docs(control): finalize PR 1323 evidence row'
          git push origin HEAD:fix/globe-antimeridian-generator-hardening
