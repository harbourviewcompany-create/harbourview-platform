name: Production Governance Audit

on:
  pull_request:
    paths:
      - '.github/CODEOWNERS'
      - '.github/workflows/**'
      - 'scripts/verify-production-governance.sh'
      - 'supabase/migrations/**'
      - 'supabase/release-controls/**'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: production-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: governance-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify governance controls
        run: bash scripts/verify-production-governance.sh
