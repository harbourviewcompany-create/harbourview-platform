name: PR 1323 Evidence Final
on:
  push:
    branches: [fix/globe-antimeridian-generator-hardening]
    paths: ['.github/workflows/pr1323-evidence-final.yml']
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append evidence
        run: |
          if ! grep -q 'HV-PR1323-FINAL-TOPOLOGY-20260810' docs/control/EVIDENCE_LOG.md; then
            echo '' | base64 -d >> docs/control/EVIDENCE_LOG.md
          fi
      - name: Commit evidence
        run: |
          if git diff --quiet -- docs/control/EVIDENCE_LOG.md; then exit 0; fi
          git config user.name 'Harbourview Release Bot'
          git config user.email 'harbourviewcompany@gmail.com'
          git add docs/control/EVIDENCE_LOG.md
          git commit -m 'docs(control): record PR 1323 final topology evidence'
          git push origin HEAD:fix/globe-antimeridian-generator-hardening
