name: Restore MobileCommandCentre

on:
  push:
    branches:
      - fix/restore-mobile-command-centre
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore MobileCommandCentre from pre-merge commit
        env:
          PRE_MERGE: 94f7165ca9e123e981d307d84739fa44477bfc6b
          FILE: components/dashboard/MobileCommandCentre.tsx
        run: |
          set -euo pipefail
          git checkout "$PRE_MERGE" -- "$FILE"
          if grep -q 'TEMPORARY STUB' "$FILE"; then
            echo 'Still a stub' >&2
            exit 1
          fi
          wc -l "$FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'fix(dashboard): restore full MobileCommandCentre from pre-#1203'
          git push origin HEAD:fix/restore-mobile-command-centre
