name: Production Security Hardening

on:
  pull_request:
    branches:
      - main
    paths:
      # This job is the ONLY real replay gate in the repository: it runs
      # `supabase db reset --local`, rebuilding the database from the full
      # migration tree. It was filtered to five files, so it almost never fired
      # -- and on 2026-08-14 that let a replay break sit undetected on main.
      # The #1403 backfill committed 20260728191340/192052 from production,
      # duplicating the never-applied 20260728000000/010000 already in the repo,
      # and a fresh replay ran both pairs until the second ALTER TABLE ... RENAME
      # TO failed with 42P07. It surfaced only because #1417 happened to touch
      # one of the five paths below.
      #
      # A gate that cannot fire on the thing it checks is not a gate. Any change
      # under supabase/migrations/** now runs it.
      - supabase/migrations/**
      - supabase/tests/production_security_hardening.sql
      - scripts/configure-supabase-auth-production.mjs
      - tests/supabase/productionSecurityHardening.test.ts
      - .github/workflows/production-security-hardening.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-security-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/supabase/productionSecurityHardening.test.ts tests/dashboard/commandCentreSourcePlan.test.ts tests/platform/command-centre-copy.test.ts tests/supabase/env.test.ts
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: latest
      - name: Reset complete migration history locally
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset --local
      - name: Assert hardened local database
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atf supabase/tests/production_security_hardening.sql | tee production-security-assertions.txt
          if [ -s production-security-assertions.txt ]; then
            echo 'Unexpected security assertion rows were returned.'
            exit 1
          fi
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-security-hardening-${{ github.run_id }}
          path: production-security-assertions.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
