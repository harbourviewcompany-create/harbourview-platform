name: Apply Effective pg_net Boundary Repair

on:
  push:
    branches:
      - build/harbourview-production-command-platform
    paths:
      - .github/workflows/apply-effective-pg-net-boundary-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-effective-pg-net-boundary-repair
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/harbourview-production-command-platform
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply effective pg_net boundary repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_effective_pg_net_boundary_repair.py
          rm scripts/tmp_effective_pg_net_boundary_repair.py
          npx vitest run tests/supabase/productionSecurityHardening.test.ts
          git diff --check

      - name: Commit targeted repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'harbourview-release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/apply-effective-pg-net-boundary-repair.yml
          git commit -m 'fix(security): assert effective pg_net browser denial'
          git push origin HEAD:build/harbourview-production-command-platform
