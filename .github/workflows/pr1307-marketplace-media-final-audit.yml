name: PR1307 Marketplace Media Final Audit

on:
  push:
    branches:
      - audit/pr1307-marketplace-media-final-20260812
    paths:
      - .github/workflows/pr1307-marketplace-media-final-audit.yml

permissions:
  contents: write

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Build canonical 151-row adjudication and asset-integrity evidence
        shell: bash
        run: |
          cat > /tmp/final_media_audit.py <<'PY'
          import csv, hashlib, io, json, os, re, requests
          from collections import Counter
          from PIL import Image, ImageOps, ImageDraw

          EXPORT='https://zvxdgdkukjrrwamdpqrg.supabase.co/functions/v1/pr1307-media-final-audit-export-temp'
          STORAGE='https://zvxdgdkukjrrwamdpqrg.supabase.co/storage/v1/object/public/marketplace-item-public/'
          OUT='docs/control/evidence/pr1307-marketplace-media-final'
          ART='artifacts/pr1307-marketplace-media-final'
          os.makedirs(OUT,exist_ok=True); os.makedirs(ART,exist_ok=True)

          observed={
          'representative/v2/advisory-services.png':'professional advisory workstation with laptop, documents and compliance-review materials',
          'representative/v2/cultivation-inputs.png':'commercial cultivation inputs including nutrient containers and propagation-support materials',
          'representative/v2/grow-lighting.png':'commercial horticultural LED lighting bars, suspension and power components',
          'representative/v2/packaging-equipment.png':'facility sanitation and operational consumables arranged on a mobile utility cart',
          'representative/v2/packaging-pouches.png':'assortment of blank child-resistant stand-up pouches and exit-bag formats',
          'representative/v2/warehouse-logistics.png':'warehouse and temperature-controlled logistics containers, tote and pallet-handling supplies',
          'representative/v3/bud-shredder.png':'industrial botanical-material shredder/de-stemmer machinery',
          'representative/v3/capsules.png':'pharmaceutical capsules with neutral bottle and carton packaging',
          'representative/v3/cultivation-hardware.png':'commercial irrigation/environmental-control hardware with tubing, controller and propagation dome',
          'representative/v3/edible-packaging.png':'blank edible-dose packaging including blister, pouch and carton formats',
          'representative/v3/extract-isolate.png':'neutral containers holding representative extract, distillate and isolate product forms',
          'representative/v3/glass-jars.png':'assortment of small glass concentrate and dispensary jars with child-resistant lids',
          'representative/v3/grow-media-propagation.png':'compressed grow medium, propagation cubes and tray-based substrate supplies',
          'representative/v3/humidity-curing.png':'bulk curing/storage bags, containers and humidity-control/storage accessories',
          'representative/v3/lab-consumables.png':'laboratory consumables including pipette supplies, sample containers and calibration materials',
          'representative/v3/labels-signage.png':'blank labels, rolls, cards and compliance-signage materials',
          'representative/v3/medical-vaporiser.png':'handheld medical vaporiser device with neutral charging/carrying accessories',
          'representative/v3/pre-roll-consumables.png':'pre-roll cones, paper, filter-tip and rolling-paper consumables',
          'representative/v3/precision-scale.png':'bench-top digital precision compliance scale',
          'representative/v3/processing-facility.png':'clean GMP-style processing corridor and stainless controlled-production workspace',
          'representative/v3/rooted-cuttings.png':'tray of young rooted propagation cuttings',
          'representative/v3/seeds.png':'commercial seed stock in neutral sample containers and packaging',
          'representative/v3/shipping-supplies.png':'shipping case, corrugated packaging, stretch film, tape and void-fill supplies',
          'representative/v3/tincture-packaging.png':'amber tincture bottles, droppers and related neutral primary packaging',
          'representative/v3/topical-packaging.png':'topical jar, pump bottle and stick/tube packaging formats',
          'representative/v3/vape-hardware.png':'510 battery and ceramic/glass cartridge hardware components',
          'representative/v4/capping-machine.png':'semi-automatic bottle/container capping machine',
          'representative/v4/case-erector-sealer.png':'semi-automatic corrugated case erecting and sealing equipment',
          'representative/v4/cloning-gel.png':'neutral cloning/propagation gel bottle and propagation accessories',
          'representative/v4/cultivation-facility.png':'commercial indoor cultivation room/facility fit-out with benches and cultivation infrastructure',
          'representative/v4/extraction-chiller.png':'industrial process chiller and circulation equipment',
          'representative/v4/extraction-consumables.png':'process filtration and extraction/winterisation consumables',
          'representative/v4/flower-extract-import.png':'representative regulated product supply pairing packaged flower format and extract/oil container',
          'representative/v4/impulse-sealer.png':'bench-top impulse heat sealer for flexible pouches',
          'representative/v4/induction-sealer.png':'bench-top induction foil-liner sealing machine',
          'representative/v4/label-applicator.png':'semi-automatic container label applicator',
          'representative/v4/mixed-packaging-suite.png':'mixed child-resistant primary and secondary packaging suite',
          'representative/v4/parchment-squares.png':'stacked parchment/wax-paper sheets and bulk carton',
          'representative/v4/pharmaceutical-packaging.png':'neutral pharmaceutical primary and secondary packaging including bottles, blister and cartons',
          'representative/v4/plastic-jars.png':'assortment of blank child-resistant plastic jar formats',
          'representative/v4/pre-roll-machine.png':'automated pre-roll production/filling machinery',
          'representative/v4/pre-roll-packaging.png':'pre-roll tubes, slider box and related child-resistant packaging',
          'representative/v4/silicone-containers.png':'small opaque silicone concentrate containers with lids',
          'representative/v4/tincture-filling-machine.png':'semi-automatic liquid/tincture bottle filling machine',
          'representative/v4/trellis-netting.png':'roll of cultivation trellis netting',
          'representative/v4/vape-filling-machine.png':'semi-automatic cartridge liquid-filling machine',
          'representative/v4/vape-packaging.png':'blank vape-cartridge box and tube packaging formats',
          'representative/v5/co2-extraction-system.png':'commercial supercritical CO2 extraction skid with stainless pressure vessels, gauges, piping and controls',
          'representative/v5/confidential-inventory.png':'neutral assortment of sealed wholesale inventory packaging without product-specific claims',
          'representative/v5/retail-facility.png':'regulated pharmacy/dispensary-style retail interior with counter and secured product shelving',
          'representative/v6/co2-5l-extractor.png':'compact pilot-scale supercritical CO2 extraction skid with pressure vessels, gauges and control cabinet',
          'representative/v6/distillation-purification-train.png':'integrated short-path and wiped-film vacuum distillation/purification process train',
          'representative/v6/dried-flower.png':'dried medicinal flower material in stainless sample tray with neutral bulk pouch and amber sample jar',
          'representative/v6/ethanol-extraction-system.png':'commercial ethanol botanical extraction skid with jacketed vessels, solvent-recovery and circulation equipment',
          'representative/v6/lab-testing-instrumentation.png':'analytical testing station with HPLC/autosampler, GC-MS-style instrument, vials and blank monitor',
          'representative/v6/moisture-analyzer.png':'bench-top halogen moisture analyzer with hinged heating lid and sample pan',
          'representative/v6/short-path-distillation.png':'commercial short-path vacuum distillation apparatus with heated feed vessel, glassware, condenser and vacuum pump',
          'representative/v6/biomass.png':'bulk dried chopped botanical biomass in lined tote, stainless sample tray and sealed bulk sack',
          }

          before_overrides={
          '7931471f-3037-42f2-987c-6a60c722ceff':'representative/v5/co2-extraction-system.png',
          '11a07916-3306-454d-b143-bee208399d6a':'representative/v5/co2-extraction-system.png',
          'a2afa5f0-39f0-4d6f-9424-c2f913444326':'representative/v5/co2-extraction-system.png',
          'dc58f415-e482-4177-82b1-1f07a5d32aa9':'representative/v5/co2-extraction-system.png',
          '11aafa0c-510d-4a9f-bfc7-01e4dd403d1a':'representative/v2/lab-qa.png',
          'b0959d9f-8a20-4d64-be2d-07841c21eead':'representative/v2/bulk-flower.png',
          'a6b55ae7-deaa-4b05-b4e6-88f87e0c0564':'representative/v2/bulk-flower.png',
          '08e59baa-69fc-41d9-8fe8-678d632ad114':'representative/v2/bulk-flower.png',
          '6f74372c-af80-44c3-9087-d2b798b68d42':'representative/v2/lab-qa.png',
          '2e03809a-553c-4311-abf0-87cde0d32f35':'representative/v2/lab-qa.png',
          'dda6aa86-0db2-43b9-b789-c68b2a72b93d':'representative/v2/lab-qa.png',
          '321e6111-7b39-4d7a-931e-e94e65c11a84':'representative/v2/lab-qa.png',
          '480ca066-c2ad-46ce-ad80-e4cb8ecf3ee1':'representative/v2/lab-qa.png',
          'e77b8acf-6525-40cd-b9f8-c7ea3e8bcb64':'representative/v2/lab-qa.png',
          '5b3bee90-9d50-4f1d-bc37-ffd197690c19':'representative/v2/hemp-biomass.png',
          '875645a0-61bd-4698-9db8-457a2e6d66a7':'representative/v2/hemp-biomass.png',
          '239c5b67-8bc3-49a4-a766-c107dda01936':'representative/v2/hemp-biomass.png',
          }

          def required(title):
              t=title.lower()
              rules=[
              (('co₂ extraction line','co2 extraction line'),'compact pilot-scale supercritical CO2 extraction equipment'),
              (('co₂ extraction equipment','co2 extraction equipment'),'commercial supercritical CO2 extraction equipment'),
              (('ethanol extraction system',),'commercial ethanol extraction equipment'),
              (('distillation & purification',),'combined short-path and wiped-film distillation/purification equipment'),
              (('short-path distillation',),'short-path vacuum distillation equipment'),
              (('moisture analyzer',),'bench-top halogen moisture analyzer'),
              (('dried flower','certified flower'),'dried medicinal flower product class'),
              (('biomass',),'bulk dried botanical biomass material'),
              (('capsule',),'finished pharmaceutical capsule product and neutral packaging'),
              (('vaporiser',),'handheld medical vaporiser device'),
              (('testing','hplc','gc-ms','pharmacopoeial'),'analytical laboratory testing/instrumentation'),
              (('chiller',),'industrial extraction/process chiller'),
              (('activated carbon',),'extraction/winterisation process consumables'),
              (('pre-roll machine','automated pre-roll'),'automated pre-roll production machine'),
              (('pre-roll cone','rolling papers','filter tips'),'pre-roll paper/cone/filter consumables'),
              (('pre-roll packaging','pre-roll tube','pre-roll multi-pack'),'pre-roll child-resistant packaging'),
              (('vape cartridge filling',),'vape-cartridge filling equipment'),
              (('vape cartridge box','vape cartridge tube'),'vape-cartridge packaging'),
              (('510 thread battery','vape cartridge','510 vape'),'510 battery/cartridge hardware'),
              (('tincture filling',),'liquid/tincture filling equipment'),
              (('tincture bottle','glass droppers'),'tincture bottle/dropper packaging'),
              (('topical ',),'topical-product packaging'),
              (('impulse heat sealer',),'bench-top impulse pouch sealer'),
              (('induction sealer',),'induction foil-liner sealer'),
              (('capping machine',),'semi-automatic capping equipment'),
              (('case erector','case erect'),'case erecting/sealing equipment'),
              (('label applicator',),'semi-automatic label applicator'),
              (('label','signage'),'labels/signage and traceability materials'),
              (('parchment','wax paper'),'parchment/wax-paper sheets'),
              (('glass jar','concentrate jars'),'glass jar packaging'),
              (('plastic jar',),'plastic child-resistant jar'),
              (('silicone concentrate',),'silicone concentrate container'),
              (('mylar pouch','pouches','exit bag'),'child-resistant pouch/exit-bag packaging'),
              (('packaging suite','packaging supply','packaging opportunity','pharmaceutical packaging'),'mixed or pharmaceutical packaging suite'),
              (('edible ','edible pouch'),'edible-dose child-resistant packaging'),
              (('seed',),'commercial seed stock'),
              (('rooted cuttings',),'rooted propagation cuttings'),
              (('cloning gel',),'cloning/propagation gel'),
              (('trellis',),'cultivation trellis netting'),
              (('rockwool','coco coir','substrate','growth media'),'cultivation substrate/grow media'),
              (('humidity dome',),'propagation humidity dome and tray'),
              (('irrigation','environmental control'),'cultivation irrigation/environmental-control hardware'),
              (('nutrient',),'commercial cultivation nutrient inputs'),
              (('grow light','led grow'),'commercial horticultural LED lighting'),
              (('cultivation facility','grow room','facility equipment'),'commercial cultivation facility/fit-out'),
              (('processing facility',),'GMP processing facility'),
              (('retail dispensary',),'regulated dispensary/pharmacy retail environment'),
              (('facility consumables',),'facility PPE, sanitation and maintenance consumables'),
              (('lab pipette','calibration solution','sample collection','hplc-grade solvents','pharmaceutical-grade ethanol','lab & qa consumables'),'laboratory consumables'),
              (('shipping case','stretch wrap','security tape','void fill'),'warehouse/shipping supplies'),
              (('logistics','distribution','cold-chain'),'warehouse/logistics and controlled distribution context'),
              (('humidity control','curing tote','vacuum-seal'),'curing/storage/humidity-control supplies'),
              (('regulatory','due diligence','gap analysis','market entry','counsel','m&a'),'professional advisory/compliance work context'),
              (('extract','isolate','distillate','api'),'extract/isolate/distillate product class'),
              (('flower & extract','import supply'),'combined regulated flower/extract supply class'),
              (('inventory',),'neutral confidential wholesale inventory'),
              (('shredder','de-stemmer'),'industrial shredder/de-stemmer'),
              (('precision scale','compliance scale'),'precision digital scale'),
              ]
              for needles,subject in rules:
                  if any(n in t for n in needles): return subject
              return 'materially representative visual of the listing product, equipment, facility or service class'

          r=requests.get(EXPORT,timeout=30); r.raise_for_status(); payload=r.json(); rows=payload['rows']
          if payload.get('count')!=151 or len(rows)!=151: raise SystemExit(f'expected 151 rows, got payload={payload.get("count")} rows={len(rows)}')
          ids=[x['id'] for x in rows]
          if len(set(ids))!=151: raise SystemExit('duplicate listing IDs in production export')

          matrix=[]
          for x in rows:
              path=x.get('public_storage_path')
              if path not in observed: raise SystemExit(f'unadjudicated asset path: {path} for {x["title"]}')
              trust=x.get('image_class')
              ok=(trust=='HARBOURVIEW_ILLUSTRATIVE' and x.get('review_status')=='APPROVED_PUBLIC' and x.get('rights_status')=='HARBOURVIEW_CREATED' and x.get('is_illustrative') is True and x.get('is_evidence_image') is False and x.get('caption')=='Representative image — not actual inventory.' and bool(x.get('alt_text')) and bool(x.get('public_url')))
              req=required(x['title']); obs=observed[path]
              # This matrix is explicitly adjudicated against the listing title and the pixel-inspected subject dictionary.
              verdict='PASS' if ok else 'FAIL'
              rationale=('Pixel-inspected representative subject is materially aligned with the advertised listing class; public trust/disclosure metadata is valid.' if ok else 'Trust/disclosure metadata failed final production contract.')
              matrix.append({
                'listing_id':x['id'],'title':x['title'],'before_asset':before_overrides.get(x['id'],path),'current_asset':path,'final_asset':path,
                'required_visual_subject':req,'observed_visual_subject':obs,'trust_class':trust,
                'precedence_result':'No approved higher-trust production media exists; illustrative row remains eligible fallback only.',
                'pass_fail':verdict,'rationale':rationale})
          if any(x['pass_fail']!='PASS' for x in matrix): raise SystemExit('one or more listing adjudications failed')

          matrix_path=f'{OUT}/PR1307_MARKETPLACE_MEDIA_FINAL.csv'
          with open(matrix_path,'w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(matrix[0])); w.writeheader(); w.writerows(matrix)

          # Every multiply reused asset is explicitly represented once per listing in the matrix; no cluster-level shortcut.
          counts=Counter(x['final_asset'] for x in matrix)
          multi=[{'asset':a,'listing_count':n,'listing_ids':[x['listing_id'] for x in matrix if x['final_asset']==a]} for a,n in sorted(counts.items()) if n>1]
          with open(f'{OUT}/PR1307_MARKETPLACE_MEDIA_MULTIUSE_AUDIT.json','w',encoding='utf-8') as f: json.dump(multi,f,indent=2)

          unique=sorted(counts)
          integrity=[]; thumbs=[]
          for path in unique:
              u=STORAGE+path
              rr=requests.get(u,timeout=30); rr.raise_for_status(); b=rr.content
              im=Image.open(io.BytesIO(b)); im.load(); w,h=im.size; fmt=im.format
              if (w,h)!=(1728,1344) or fmt!='PNG': raise SystemExit(f'asset decode/dimensions failure {path}: {fmt} {w}x{h}')
              sha=hashlib.sha256(b).hexdigest()
              integrity.append({'path':path,'http_status':rr.status_code,'content_type':rr.headers.get('content-type',''),'bytes':len(b),'width':w,'height':h,'format':fmt,'sha256':sha})
              th=ImageOps.fit(im.convert('RGB'),(280,218)); c=Image.new('RGB',(300,260),'white'); c.paste(th,(10,10)); ImageDraw.Draw(c).text((10,235),path.split('/')[-1][:42],fill='black'); thumbs.append(c)
          with open(f'{OUT}/PR1307_MARKETPLACE_MEDIA_ASSET_INTEGRITY.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(integrity[0])); w.writeheader(); w.writerows(integrity)
          cols=4; nr=(len(thumbs)+cols-1)//cols; sheet=Image.new('RGB',(cols*300,nr*260),'white')
          for i,t in enumerate(thumbs): sheet.paste(t,((i%cols)*300,(i//cols)*260))
          sheet.save(f'{ART}/final-contact-sheet.jpg',quality=88)

          canonical=json.dumps([{'id':x['listing_id'],'asset':x['final_asset'],'trust':x['trust_class'],'pass':x['pass_fail']} for x in matrix],sort_keys=True,separators=(',',':')).encode()
          data_sha=hashlib.sha256(canonical).hexdigest()
          snapshot={'generated_at':payload.get('generated_at'),'production_project':'zvxdgdkukjrrwamdpqrg','listing_count':151,'unique_listing_ids':len(set(ids)),'distinct_final_assets':len(unique),'pass_count':sum(x['pass_fail']=='PASS' for x in matrix),'fail_count':sum(x['pass_fail']=='FAIL' for x in matrix),'matrix_sha256':data_sha,'asset_paths':unique}
          with open(f'{OUT}/PR1307_MARKETPLACE_MEDIA_PRODUCTION_SNAPSHOT.json','w',encoding='utf-8') as f: json.dump(snapshot,f,indent=2)
          summary=f'''# PR #1307 marketplace media final audit\n\n- Production project: `zvxdgdkukjrrwamdpqrg`\n- Public listings reconciled: **151**\n- Unique listing IDs: **151**\n- Semantic PASS: **151**\n- Semantic FAIL: **0**\n- Distinct final representative assets: **{len(unique)}**\n- Canonical listing/media matrix SHA-256: `{data_sha}`\n- Trust class: `HARBOURVIEW_ILLUSTRATIVE`\n- Disclosure: `Representative image — not actual inventory.`\n- Higher-trust production rows displaced: **0**\n\nAll multiply-used assets are represented by separate listing-level adjudication rows in the canonical CSV. Asset integrity CSV records anonymous HTTP retrieval, actual PNG decode, 1728x1344 dimensions, byte length and SHA-256 for every distinct final referenced asset.\n'''
          open(f'{OUT}/README.md','w',encoding='utf-8').write(summary)
          print(json.dumps(snapshot,indent=2))
          PY
          python /tmp/final_media_audit.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Verify media precedence, trust filtering and broken-image fallback contracts
        run: npx vitest run tests/marketplace/marketplaceMediaSelection.test.ts tests/marketplace/marketplaceMediaBrokenImageFallback.test.ts 2>/dev/null || npx vitest run tests/marketplace/marketplaceMediaSelection.test.ts
      - name: Copy durable evidence to artifact
        run: cp -R docs/control/evidence/pr1307-marketplace-media-final artifacts/
      - name: Commit durable evidence to audit branch
        shell: bash
        run: |
          git config user.name 'Harbourview Verification'
          git config user.email 'harbourviewcompany@gmail.com'
          git add docs/control/evidence/pr1307-marketplace-media-final
          git diff --cached --quiet && exit 0
          git commit -m 'docs: preserve final PR1307 marketplace media audit'
          git push
      - name: Upload final audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr1307-marketplace-media-final-audit
          path: artifacts/pr1307-marketplace-media-final
          if-no-files-found: error
