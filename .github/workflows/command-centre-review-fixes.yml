name: Command Centre Review Fixes

on:
  push:
    branches:
      - build/harbourview-production-command-platform
    paths:
      - .github/workflows/command-centre-review-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: build/harbourview-production-command-platform
          fetch-depth: 1

      - name: Apply fail-closed source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          # E2E evidence must derive section coverage from the product contract and
          # must never treat a server error as expected local degradation.
          replace_once(
              'tests/e2e/mobile-command-centre-v2.spec.ts',
              "import { COMMAND_CENTRE_PAGE_IDS } from '@/lib/platform/commandCentreRegistry'\n",
              "import { COMMAND_CENTRE_PAGE_IDS } from '@/lib/platform/commandCentreRegistry'\nimport { SECTION_NAV } from '@/components/dashboard/mobile-command/contracts'\n",
          )
          replace_once(
              'tests/e2e/mobile-command-centre-v2.spec.ts',
              """const MOBILE_SECTION_IDS = [
            'overview',
            'live-status',
            'market-intelligence',
            'marketplace',
            'supply',
            'next-actions',
            'weekly-signals',
            'personal-briefing',
            'search',
            'education',
            'jurisdiction',
            'market-status',
            'review-gates',
            'directories',
            'talent',
            'genetics',
            'clinical',
            'compliance',
            'network',
            'financing',
          ] as const
          """.replace('          ', ''),
              "const MOBILE_SECTION_IDS = SECTION_NAV.map(section => section.id)\n",
          )
          replace_once(
              'tests/e2e/mobile-command-centre-v2.spec.ts',
              """function isExpectedLocalDegradation(response: FailedResponse) {
            if (!IS_ISOLATED_LOCAL_RUN) return false
            const expectedReadOnlyPrefixes = [
              '/api/dashboard/',
              '/api/watchlist/',
              '/api/marketplace/my-',
              '/api/ai/briefing',
              '/api/country-intel',
            ]
            return expectedReadOnlyPrefixes.some(prefix => response.pathname.startsWith(prefix))
          }
          """.replace('          ', ''),
              """function isExpectedLocalDegradation(response: FailedResponse) {
            if (!IS_ISOLATED_LOCAL_RUN || response.status >= 500) return false
            return (
              (response.pathname === '/api/ai/briefing' && response.status === 503)
              || (response.pathname === '/api/country-intel' && response.status === 404)
            )
          }
          """.replace('          ', ''),
          )
          replace_once(
              'tests/e2e/mobile-command-centre-v2.spec.ts',
              '    test.setTimeout(900_000)\n',
              '    test.setTimeout(1_800_000)\n',
          )

          # Reduced-motion users receive deterministic non-animated deep-link restoration.
          replace_once(
              'components/dashboard/mobile-command/useMobileCommandModel.ts',
              "sectionNodes.current.get(resolvedUrlSection)?.scrollIntoView({ block: 'start' })",
              "sectionNodes.current.get(resolvedUrlSection)?.scrollIntoView({ behavior: preferredScrollBehavior(), block: 'start' })",
          )

          # Marketplace image preview URLs are replaced and revoked as a managed resource.
          replace_once(
              'components/marketplace/DynamicMarketplaceIntakeForm.tsx',
              "import { ChangeEvent, FormEvent, useMemo, useRef, useState } from 'react'",
              "import { ChangeEvent, FormEvent, useEffect, useMemo, useRef, useState } from 'react'",
          )
          replace_once(
              'components/marketplace/DynamicMarketplaceIntakeForm.tsx',
              """  const fileInputRef = useRef<HTMLInputElement>(null)
            const formRef = useRef<HTMLFormElement>(null)

            const typeKey: MarketplaceListingTypeKey =
          """.replace('          ', ''),
              """  const fileInputRef = useRef<HTMLInputElement>(null)
            const formRef = useRef<HTMLFormElement>(null)
            const previewUrlsRef = useRef<string[]>([])

            useEffect(() => () => {
              previewUrlsRef.current.forEach(url => URL.revokeObjectURL(url))
              previewUrlsRef.current = []
            }, [])

            const typeKey: MarketplaceListingTypeKey =
          """.replace('          ', ''),
          )
          replace_once(
              'components/marketplace/DynamicMarketplaceIntakeForm.tsx',
              """  function handleImageChange(event: ChangeEvent<HTMLInputElement>) {
            const incoming = Array.from<File>(event.target.files ?? []).filter(
              (file) => file.size <= MAX_IMAGE_BYTES,
            )
            const combined = [...imageFiles, ...incoming].slice(0, MAX_IMAGES)
            setImageFiles(combined)
            setImagePreviews(combined.map((file) => URL.createObjectURL(file)))
            if (fileInputRef.current) fileInputRef.current.value = ''
          }

          function removeImage(index: number) {
            const updated = imageFiles.filter((_, itemIndex) => itemIndex !== index)
            setImageFiles(updated)
            setImagePreviews(updated.map((file) => URL.createObjectURL(file)))
          }
          """.replace('          ', ''),
              """  function replaceImagePreviews(files: File[]) {
            const nextUrls = files.map(file => URL.createObjectURL(file))
            previewUrlsRef.current.forEach(url => URL.revokeObjectURL(url))
            previewUrlsRef.current = nextUrls
            setImagePreviews(nextUrls)
          }

          function handleImageChange(event: ChangeEvent<HTMLInputElement>) {
            const incoming = Array.from<File>(event.target.files ?? []).filter(
              (file) => file.size <= MAX_IMAGE_BYTES,
            )
            const combined = [...imageFiles, ...incoming].slice(0, MAX_IMAGES)
            setImageFiles(combined)
            replaceImagePreviews(combined)
            if (fileInputRef.current) fileInputRef.current.value = ''
          }

          function removeImage(index: number) {
            const updated = imageFiles.filter((_, itemIndex) => itemIndex !== index)
            setImageFiles(updated)
            replaceImagePreviews(updated)
          }
          """.replace('          ', ''),
          )
          replace_once(
              'components/marketplace/DynamicMarketplaceIntakeForm.tsx',
              """        setImageFiles([])
                setImagePreviews([])
          """.replace('        ', ''),
              """        setImageFiles([])
                replaceImagePreviews([])
          """.replace('        ', ''),
          )

          # Dashboard context is fail-closed and duplicate marketplace categories
          # remain visible in every applicable command view.
          replace_once('app/dashboard/page.tsx', '  let hasOrg = true\n', '  let hasOrg = false\n')
          replace_once(
              'app/dashboard/page.tsx',
              """  const sectionToView = new Map<string, MarketView>()

            for (const [view, sections] of Object.entries(VIEW_SECTIONS) as [MarketView, string[]][]) {
              for (const section of sections) sectionToView.set(section, view)
            }

            const buckets: Partial<DashboardMarketplaceRows> = {}
            for (const listing of listings) {
              const view = sectionToView.get(listing.marketplace_section) ?? 'cannabis'
              if (!buckets[view]) buckets[view] = []
              if (buckets[view]!.length < 8) buckets[view]!.push(mapListingToDashboardRow(listing))
            }
          """.replace('          ', ''),
              """  const buckets: Partial<DashboardMarketplaceRows> = {}
            for (const listing of listings) {
              const matchingViews = (Object.entries(VIEW_SECTIONS) as [MarketView, string[]][])
                .filter(([, sections]) => sections.includes(listing.marketplace_section))
                .map(([view]) => view)
              const views = matchingViews.length > 0 ? matchingViews : ['cannabis' as const]

              for (const view of views) {
                if (!buckets[view]) buckets[view] = []
                if (buckets[view]!.length < 8) buckets[view]!.push(mapListingToDashboardRow(listing))
              }
            }
          """.replace('          ', ''),
          )
          replace_once(
              'app/dashboard/page.tsx',
              """  const countryIso2 = urlCountry ?? storedCountryIso2
            const roleId = urlRole ?? storedRoleId

            const commandData = await loadCommandCentreData(
          """.replace('          ', ''),
              """  const countryIso2 = urlCountry ?? storedCountryIso2
            const roleId = urlRole ?? storedRoleId
            let cannabisOperatorsRequest: ReturnType<typeof getCannabisOperators> | null = null
            const loadCannabisOperators = () => {
              cannabisOperatorsRequest ??= getCannabisOperators(countryIso2)
              return cannabisOperatorsRequest
            }

            const commandData = await loadCommandCentreData(
          """.replace('          ', ''),
          )
          replace_once(
              'app/dashboard/page.tsx',
              """      cannabisOperators: {
                load: () => getCannabisOperators(countryIso2),
                fallback: undefined,
                sourceLabel: 'Public operator projection',
                access: 'public',
              },
          """.replace('          ', ''),
              """      cannabisOperators: {
                load: loadCannabisOperators,
                fallback: undefined,
                sourceLabel: 'Public operator projection',
                access: 'public',
              },
              operatorLicenceMatrix: {
                load: async () => getOperatorLicenceMatrix((await loadCannabisOperators()).map(operator => operator.id)),
                fallback: { entitled: false as const },
                sourceLabel: 'Authorized operator licence matrix',
                access: 'operator',
              },
          """.replace('          ', ''),
          )
          replace_once(
              'app/dashboard/page.tsx',
              """    cannabisOperators,
                cultivarPassports,
          """.replace('        ', ''),
              """    cannabisOperators,
                operatorLicenceMatrix,
                cultivarPassports,
          """.replace('        ', ''),
          )
          replace_once(
              'app/dashboard/page.tsx',
              """  const watchlistAccess = checkFeatureAccess({ app_metadata: userAppMetadata }, 'watchlist')
            const operatorLicenceMatrix = await getOperatorLicenceMatrix((cannabisOperators ?? []).map(operator => operator.id))
              .catch(error => {
                console.error('[command-centre-source]', {
                  source: 'operatorLicenceMatrix',
                  code: error instanceof Error ? error.name : 'OPERATOR_LICENCE_MATRIX_FAILED',
                  countryIso2,
                  roleId,
                  page: urlPage,
                })
                return { entitled: false as const }
              })

          """.replace('          ', ''),
              "  const watchlistAccess = checkFeatureAccess({ app_metadata: userAppMetadata }, 'watchlist')\n\n",
          )

          # Supabase environment tests are independent and explicitly model the
          # new isolated-test build marker.
          replace_once(
              'tests/supabase/env.test.ts',
              "import { afterEach, describe, expect, it, vi } from 'vitest'",
              "import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest'",
          )
          replace_once(
              'tests/supabase/env.test.ts',
              """describe('getSupabaseEnvStatus', () => {
            afterEach(() => {
          """.replace('          ', ''),
              """describe('getSupabaseEnvStatus', () => {
            beforeEach(() => {
              process.env = { ...ORIGINAL_ENV }
              delete process.env.CI
              delete process.env.HARBOURVIEW_LOCAL_TEST_BUILD
              delete process.env.NEXT_PUBLIC_HARBOURVIEW_LOCAL_TEST_BUILD
              delete process.env.HARBOURVIEW_ALLOW_LOCAL_SUPABASE
              delete process.env.NEXT_PUBLIC_HARBOURVIEW_ALLOW_LOCAL_SUPABASE
              delete process.env.VERCEL
              delete process.env.VERCEL_ENV
              vi.unstubAllGlobals()
            })

            afterEach(() => {
          """.replace('          ', ''),
          )
          replace_once(
              'tests/supabase/env.test.ts',
              """    process.env.HARBOURVIEW_ALLOW_LOCAL_SUPABASE = '1'
                delete process.env.NEXT_PUBLIC_HARBOURVIEW_ALLOW_LOCAL_SUPABASE
          """.replace('        ', ''),
              """    process.env.CI = '1'
                process.env.HARBOURVIEW_LOCAL_TEST_BUILD = '1'
                process.env.HARBOURVIEW_ALLOW_LOCAL_SUPABASE = '1'
                delete process.env.NEXT_PUBLIC_HARBOURVIEW_ALLOW_LOCAL_SUPABASE
          """.replace('        ', ''),
          )
          replace_once(
              'tests/supabase/env.test.ts',
              """    process.env.NEXT_PUBLIC_HARBOURVIEW_ALLOW_LOCAL_SUPABASE = '1'
                delete process.env.HARBOURVIEW_ALLOW_LOCAL_SUPABASE
          """.replace('        ', ''),
              """    process.env.NEXT_PUBLIC_HARBOURVIEW_LOCAL_TEST_BUILD = '1'
                process.env.NEXT_PUBLIC_HARBOURVIEW_ALLOW_LOCAL_SUPABASE = '1'
                delete process.env.HARBOURVIEW_ALLOW_LOCAL_SUPABASE
          """.replace('        ', ''),
          )
          replace_once(
              'tests/supabase/env.test.ts',
              """    process.env.HARBOURVIEW_ALLOW_LOCAL_SUPABASE = '1'
                delete process.env.VERCEL
                delete process.env.VERCEL_ENV

                expect(isExplicitLocalSupabaseUrl(process.env.NEXT_PUBLIC_SUPABASE_URL)).toBe(true)
                expect(getSupabaseUrl()).toBe('http://[::1]:54321')
          """.replace('        ', ''),
              """    process.env.CI = '1'
                process.env.HARBOURVIEW_LOCAL_TEST_BUILD = '1'
                process.env.HARBOURVIEW_ALLOW_LOCAL_SUPABASE = '1'
                delete process.env.VERCEL
                delete process.env.VERCEL_ENV

                expect(isExplicitLocalSupabaseUrl(process.env.NEXT_PUBLIC_SUPABASE_URL)).toBe(true)
                expect(getSupabaseUrl()).toBe('http://[::1]:54321')
          """.replace('        ', ''),
          )
          replace_once(
              'tests/supabase/env.test.ts',
              """    process.env.HARBOURVIEW_ALLOW_LOCAL_SUPABASE = '1'
                process.env.NEXT_PUBLIC_HARBOURVIEW_ALLOW_LOCAL_SUPABASE = '1'
                process.env.VERCEL = '1'
          """.replace('        ', ''),
              """    process.env.CI = '1'
                process.env.HARBOURVIEW_LOCAL_TEST_BUILD = '1'
                process.env.NEXT_PUBLIC_HARBOURVIEW_LOCAL_TEST_BUILD = '1'
                process.env.HARBOURVIEW_ALLOW_LOCAL_SUPABASE = '1'
                process.env.NEXT_PUBLIC_HARBOURVIEW_ALLOW_LOCAL_SUPABASE = '1'
                process.env.VERCEL = '1'
          """.replace('        ', ''),
          )
          replace_once(
              'tests/supabase/env.test.ts',
              """    process.env.HARBOURVIEW_ALLOW_LOCAL_SUPABASE = '1'
                delete process.env.VERCEL
                delete process.env.VERCEL_ENV

                expect(isExplicitLocalSupabaseUrl(process.env.NEXT_PUBLIC_SUPABASE_URL)).toBe(false)
          """.replace('        ', ''),
              """    process.env.CI = '1'
                process.env.HARBOURVIEW_LOCAL_TEST_BUILD = '1'
                process.env.HARBOURVIEW_ALLOW_LOCAL_SUPABASE = '1'
                delete process.env.VERCEL
                delete process.env.VERCEL_ENV

                expect(isExplicitLocalSupabaseUrl(process.env.NEXT_PUBLIC_SUPABASE_URL)).toBe(false)
          """.replace('        ', ''),
          )

          replace_once(
              'docs/control/CLAUDE_PRODUCTION_COMMAND_CENTRE_HANDOFF.md',
              '`components/dashboard/MobileCommandCentreV2.tsx`',
              '`components/dashboard/MobileCommandCentreRebuild.tsx`',
          )
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/command-centre-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(command-centre): close production review blockers'
          git push origin HEAD:build/harbourview-production-command-platform
