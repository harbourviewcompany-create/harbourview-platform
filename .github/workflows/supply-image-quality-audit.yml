name: Supply Image Quality Audit

on:
  pull_request:
    paths:
      - 'public/images/supply/**'
      - 'components/supply/**'
      - 'app/supply/**'
      - 'scripts/audit_supply_images.py'
      - 'scripts/generate_supply_images.py'
      - '.github/workflows/supply-image-quality-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow ImageHash
      - name: Generate factual product-format imagery
        run: python scripts/generate_supply_images.py
      - name: Commit deterministic asset corrections
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- public/images/supply; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/images/supply
            git commit -m "fix: replace placeholder supply cards with product illustrations"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: python scripts/audit_supply_images.py
      - uses: actions/upload-artifact@v7
        with:
          name: supply-image-quality-audit
          path: artifacts/supply-image-audit/
          if-no-files-found: error
          retention-days: 14
