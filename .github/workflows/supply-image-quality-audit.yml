name: Supply Image Quality Audit

on:
  pull_request:
    paths:
      - 'public/images/supply/**'
      - 'components/supply/**'
      - 'app/supply/**'
      - 'scripts/audit_supply_images.py'
      - 'scripts/generate_supply_images.py'
      - '.github/workflows/supply-image-quality-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow ImageHash
      - name: Generate factual product-format imagery
        run: python scripts/generate_supply_images.py
      - name: Audit deterministic asset corrections
        run: python scripts/audit_supply_images.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-image-quality-audit
          path: artifacts/supply-image-audit/
          if-no-files-found: error
          retention-days: 14
