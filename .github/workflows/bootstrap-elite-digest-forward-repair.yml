name: Bootstrap Elite Digest Forward Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-elite-digest-forward-repair.yml'
      - 'scripts/bootstrap-elite-digest-forward-repair.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/elite-digest-feedback-forward-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/elite-digest-feedback-forward-repair
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate repair
        run: python3 scripts/bootstrap-elite-digest-forward-repair.py
      - name: Install dependencies
        run: npm ci
      - name: Validate generated repair
        run: |
          node scripts/check-migration-filenames.mjs
          npx vitest run tests/signals/feedbackScores.test.ts tests/api/signal-feedback-route.test.ts
          npm run typecheck
          psql -v ON_ERROR_STOP=1 -f tests/sql/elite_digest_forward_repair_dry_run.sql
          git diff --check
      - name: Commit generated repair
        run: |
          git config user.name 'Harbourview Repair Operator'
          git config user.email 'repair-operator@users.noreply.github.com'
          git add -A
          git commit -m 'fix: rebuild Elite Digest feedback and migration controls'
          git push origin HEAD:fix/elite-digest-feedback-forward-repair
