name: Bootstrap Elite Digest Forward Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-elite-digest-forward-repair.yml'
      - 'scripts/bootstrap-elite-digest-forward-repair.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/elite-digest-feedback-forward-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/elite-digest-feedback-forward-repair
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate repair
        run: |
          python3 scripts/bootstrap-elite-digest-forward-repair.py
          cat > scripts/check-elite-digest-migration-versions.mjs <<'EOF'
          import fs from 'node:fs'
          import path from 'node:path'

          const expected = [
            '20260730230000_elite_digest_from_pipeline_b.sql',
            '20260730233000_intelligence_self_improve_loop.sql',
            '20260731090000_digest_rank_includes_feedback.sql',
            '20260731100000_run_daily_digest_uses_feedback_rank.sql',
            '20260731110000_feedback_service_aggregates.sql',
            '20260731130000_elite_digest_release_hardening.sql',
            '20260802073000_hv_dedup_assign_restore_hnsw_knn.sql',
            '20260802152500_signal_feedback_api_rpcs.sql',
          ]
          const migrationsDir = path.resolve('supabase/migrations')
          const files = fs.readdirSync(migrationsDir).filter((file) => file.endsWith('.sql'))
          const problems = []
          const versions = expected.map((file) => file.slice(0, 14))

          if (new Set(versions).size !== versions.length) {
            problems.push('Elite Digest migration list contains duplicate versions')
          }
          if ([...expected].sort().join('\n') !== expected.join('\n')) {
            problems.push('Elite Digest migration list is not in version order')
          }
          for (const file of expected) {
            if (!files.includes(file)) problems.push(`Missing Elite Digest migration: ${file}`)
            const version = file.slice(0, 14)
            const matches = files.filter((candidate) => candidate.startsWith(`${version}_`))
            if (matches.length !== 1 || matches[0] !== file) {
              problems.push(`Version ${version} is not unique to ${file}: ${matches.join(', ') || 'none'}`)
            }
          }
          if (files.includes('20260731090000_hv_dedup_assign_restore_hnsw_knn.sql')) {
            problems.push('Superseded duplicate-prefix HNSW migration is still present')
          }

          if (problems.length) {
            console.error('Elite Digest migration validation failed:')
            for (const problem of problems) console.error(`- ${problem}`)
            process.exit(1)
          }
          console.log(`Elite Digest migration validation passed for ${expected.length} ordered, unique files.`)
          EOF
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/elite-digest-forward-repair-verification.yml')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace(
              "      - 'app/api/signals/feedback/route.ts'\n",
              "      - 'app/api/signals/feedback/route.ts'\n      - 'scripts/check-elite-digest-migration-versions.mjs'\n",
              1,
          )
          text = text.replace(
              'run: node scripts/check-migration-filenames.mjs',
              'run: node scripts/check-elite-digest-migration-versions.mjs',
              1,
          )
          workflow.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate generated repair
        run: |
          node scripts/check-elite-digest-migration-versions.mjs
          npx vitest run tests/signals/feedbackScores.test.ts tests/api/signal-feedback-route.test.ts
          npm run typecheck
          psql -v ON_ERROR_STOP=1 -f tests/sql/elite_digest_forward_repair_dry_run.sql
          git diff --check
      - name: Commit generated repair
        run: |
          git config user.name 'Harbourview Repair Operator'
          git config user.email 'repair-operator@users.noreply.github.com'
          rm .github/workflows/elite-digest-forward-repair-verification.yml
          git restore --source=HEAD -- .github/workflows/supabase-migrate.yml
          git add -A
          git commit -m 'fix: rebuild Elite Digest feedback and migration controls'
          git push origin HEAD:fix/elite-digest-feedback-forward-repair
