name: Update Elite Digest Forward Repair Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/update-elite-digest-forward-repair-evidence.yml'
      - 'scripts/update-elite-digest-forward-repair-evidence.py'

permissions:
  contents: write

jobs:
  update-evidence:
    if: github.head_ref == 'fix/elite-digest-feedback-forward-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/elite-digest-feedback-forward-repair
          fetch-depth: 0
      - name: Record immutable run evidence
        run: python3 scripts/update-elite-digest-forward-repair-evidence.py
      - name: Commit evidence record
        run: |
          git config user.name 'Harbourview Repair Operator'
          git config user.email 'repair-operator@users.noreply.github.com'
          git add docs/control/EVIDENCE_LOG.md
          git commit -m 'docs: record Elite Digest forward repair evidence'
          git push origin HEAD:fix/elite-digest-feedback-forward-repair
