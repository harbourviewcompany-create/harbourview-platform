name: Stripe webhook contract

on:
  push:
    branches:
      - main
      - 'agent/stripe-webhook-hardening-*'
      - 'fix/monetization-lifecycle-hardening-*'
    paths:
      - 'app/api/stripe/**'
      - 'app/admin/(protected)/stripe-health/**'
      - 'components/stripe/**'
      - 'lib/billing/**'
      - 'lib/stripe/**'
      - 'lib/admin/navConfig.ts'
      - 'tests/harbourview/stripe-webhook-contract.test.ts'
      - 'tests/harbourview/monetization-lifecycle-contract.test.ts'
      - '.github/workflows/stripe-webhook-contract.yml'
  pull_request:
    paths:
      - 'app/api/stripe/**'
      - 'app/admin/(protected)/stripe-health/**'
      - 'components/stripe/**'
      - 'lib/billing/**'
      - 'lib/stripe/**'
      - 'lib/admin/navConfig.ts'
      - 'tests/harbourview/stripe-webhook-contract.test.ts'
      - 'tests/harbourview/monetization-lifecycle-contract.test.ts'
      - '.github/workflows/stripe-webhook-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Stripe monetization regressions
        run: npx vitest run tests/harbourview/stripe-webhook-contract.test.ts tests/harbourview/monetization-lifecycle-contract.test.ts
