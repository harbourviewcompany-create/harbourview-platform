name: Bootstrap Regional Routing Forward Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-routing-forward-fix.yml'
      - 'scripts/bootstrap-routing-forward-fix.sh'
      - 'scripts/continue-routing-forward-fix.py'

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'fix/routing-regional-audiences'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/routing-regional-audiences
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build, validate, and push forward fix
        run: |
          set +e
          bash scripts/bootstrap-routing-forward-fix.sh
          bootstrap_status=$?
          set -e
          if [ "$bootstrap_status" -eq 0 ]; then
            exit 0
          fi

          python3 scripts/continue-routing-forward-fix.py
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run test:visibility
          npm run test:security
          psql -v ON_ERROR_STOP=1 -f tests/sql/pr1224_pipeline_hardening_dry_run.sql
          git diff --check

          git add \
            lib/signals/feedbackScores.ts \
            lib/signals/routing.ts \
            lib/country-data/generated-iso-region-rows.ts \
            scripts/country-data/generate-iso-region-rows.py \
            tests/signals/routing.test.ts \
            docs/control/REGIONAL_ROUTING_DEFINITIONS.md \
            docs/control/EVIDENCE_LOG.md
          git commit -m 'fix: route regional signals by explicit audience definitions'
          git push origin HEAD:fix/routing-regional-audiences
