name: Temporary Replay Market Size Diagnostic

on:
  push:
    branches:
      - fix/corridor-replay-seed-fidelity-20260816
    paths:
      - .github/workflows/_tmp-replay-market-size-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/corridor-replay-seed-fidelity-20260816
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect checked-in and prepared replay inputs
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BEFORE PREPARE: matching filenames ==='
          find supabase -type f -print | grep -E '20260706134949|market_size' || true
          echo '=== BEFORE PREPARE: matching content ==='
          grep -R -n -E "market_size_local|\\$2\\.1B|BDSA/State Sales Reports" supabase scripts tests .github 2>/dev/null || true
          echo '=== PREPARE ==='
          node scripts/prepare-production-faithful-migration-replay.mjs --apply
          echo '=== AFTER PREPARE: matching filenames ==='
          find supabase -type f -print | grep -E '20260706134949|market_size' || true
          echo '=== AFTER PREPARE: matching content ==='
          grep -R -n -E "market_size_local|\\$2\\.1B|BDSA/State Sales Reports" supabase scripts tests .github 2>/dev/null || true
          echo '=== MIGRATION WINDOW ==='
          find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort | awk '$0 >= "20260705000000" && $0 <= "20260707000000" {print}'
