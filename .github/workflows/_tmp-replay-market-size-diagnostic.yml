name: Temporary Replay Market Size Diagnostic

on:
  push:
    branches:
      - fix/corridor-replay-seed-fidelity-20260816
    paths:
      - .github/workflows/_tmp-replay-market-size-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/corridor-replay-seed-fidelity-20260816
          fetch-depth: 1
          persist-credentials: false
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.109.1
      - name: Inspect replay inputs around local stack start
        shell: bash
        run: |
          set -euo pipefail
          inspect() {
            local label="$1"
            echo "=== ${label}: matching filenames ==="
            find supabase -type f -print | grep -E '20260706134949|market_size' || true
            echo "=== ${label}: matching content ==="
            grep -R -n -E 'market_size_local|market_size_usd|BDSA/State Sales Reports' supabase scripts tests .github 2>/dev/null || true
            echo "=== ${label}: migration window ==="
            find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort | awk '$0 >= "20260705000000" && $0 <= "20260707000000" {print}'
          }
          inspect BEFORE_PREPARE
          node scripts/prepare-production-faithful-migration-replay.mjs --apply
          inspect AFTER_PREPARE
          supabase start
          inspect AFTER_START
          echo '=== LOCAL MIGRATION LEDGER WINDOW ==='
          eval "$(supabase status -o env)"
          psql "$DB_URL" -Atc "select version || '|' || coalesce(name,'') from supabase_migrations.schema_migrations where version between '20260705000000' and '20260707000000' order by version" || true
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
