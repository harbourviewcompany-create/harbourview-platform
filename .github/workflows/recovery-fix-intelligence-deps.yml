name: Recovery Fix Intelligence Dependencies

on:
  push:
    branches:
      - recovery/harbourview-supabase-replay-20261008
    paths:
      - .github/workflows/recovery-fix-intelligence-deps.yml
      - tools/intelligence-engine-studio/package.json

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/harbourview-supabase-replay-20261008
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate isolated tool lockfile
        working-directory: tools/intelligence-engine-studio
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm ls source-map-js @grpc/grpc-js brace-expansion --all

      - name: Commit generated lockfile and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "Harbourview Recovery"
          git config user.email "harbourviewcompany@gmail.com"
          git rm .github/workflows/recovery-fix-intelligence-deps.yml
          git add tools/intelligence-engine-studio/package.json tools/intelligence-engine-studio/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(security): regenerate intelligence studio lockfile"
          git push origin HEAD:recovery/harbourview-supabase-replay-20261008
