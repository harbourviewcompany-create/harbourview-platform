name: Harbourview Contact Production Visual Verification

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Production base URL to verify'
        required: true
        default: 'https://harbourview.vercel.app'
  push:
    branches:
      - ci/contact-production-visual-verification

permissions:
  contents: read
  actions: read

concurrency:
  group: harbourview-contact-production-visual-${{ github.event.inputs.base_url || 'branch' }}
  cancel-in-progress: false

jobs:
  contact-production-visual-verification:
    name: Contact production visual verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Verify runtime baseline
        run: npm run verify:runtime

      - name: Install lockfile-matched Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run contact production visual verification
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://harbourview.vercel.app' }}
          ARTIFACT_DIR: verification-results/contact-production-visual
        run: node scripts/verify-contact-production-visual.mjs

      - name: Upload contact production visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harbourview-contact-production-visual-verification
          path: verification-results/contact-production-visual/
          if-no-files-found: error
          retention-days: 30

# Push trigger marker: production contact verification one-off run.
