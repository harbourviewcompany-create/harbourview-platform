name: Harbourview Contact Production Visual Verification

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Production base URL to verify'
        required: true
        default: 'https://harbourview.vercel.app'
  push:
    branches:
      - ci/contact-production-visual-verification

permissions:
  contents: read
  actions: read

concurrency:
  group: harbourview-contact-production-visual-${{ github.event.inputs.base_url || 'branch' }}
  cancel-in-progress: false

jobs:
  contact-production-visual-verification:
    name: Contact production visual verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium in temporary verifier directory
        run: |
          mkdir -p .tmp/contact-visual
          cd .tmp/contact-visual
          npm init -y
          npm install --no-audit --no-fund playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Run contact production visual verification
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://harbourview.vercel.app' }}
          ARTIFACT_DIR: verification-results/contact-production-visual
        run: node scripts/verify-contact-production-visual.mjs

      - name: Upload contact production visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbourview-contact-production-visual-verification
          path: verification-results/contact-production-visual/
          if-no-files-found: error
          retention-days: 30
