name: Repair Production Readiness V4

on:
  push:
    branches:
      - build/harbourview-production-command-platform
    paths:
      - .github/workflows/repair-production-readiness-v4.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-production-readiness-v4
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      HARBOURVIEW_LOCAL_TEST_BUILD: '1'
      NEXT_PUBLIC_HARBOURVIEW_LOCAL_TEST_BUILD: '1'
      HARBOURVIEW_ALLOW_LOCAL_SUPABASE: '1'
      NEXT_PUBLIC_HARBOURVIEW_ALLOW_LOCAL_SUPABASE: '1'
      NEXT_PUBLIC_HARBOURVIEW_CI_RUN_ID: ${{ github.run_id }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/harbourview-production-command-platform
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: latest

      - name: Assemble repair tree and make exposure hardening dependency-aware
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/repair-production-readiness-v3.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          source = textwrap.dedent(workflow[start:end])
          exec(compile(source, 'repair-production-readiness-v3.py', 'exec'), {})

          guarded = textwrap.dedent('''\
          do $marketplace_exposure$
          begin
            if to_regprocedure('public.smoke_verify_marketplace_inquiry(text,text,text)') is not null then
              execute 'revoke execute on function public.smoke_verify_marketplace_inquiry(text, text, text) from anon, authenticated';
            end if;
            if to_regprocedure('public.smoke_close_marketplace_inquiry(text,text,text)') is not null then
              execute 'revoke execute on function public.smoke_close_marketplace_inquiry(text, text, text) from anon, authenticated';
            end if;

            if to_regclass('public.listings') is not null then
              execute $view$
                create or replace view public.marketplace_listings_public_view
                with (security_invoker = true)
                as
                select
                  id,
                  marketplace_section as section,
                  title,
                  coalesce(
                    slug,
                    lower(regexp_replace(title, '[^a-zA-Z0-9]+'::text, '-'::text, 'g'::text)) || '-'::text || left(id::text, 8)
                  ) as slug,
                  description,
                  price_amount,
                  price_currency,
                  location_country,
                  is_featured,
                  condition,
                  brand,
                  model,
                  quantity,
                  unit,
                  created_at
                from public.listings
                where status = 'approved'::public.listing_status
                  and public_visibility = true
                  and archived_at is null
              $view$;
            end if;

            if to_regclass('public.disclosure_requests') is not null then
              create index if not exists idx_disclosure_requests_match_id on public.disclosure_requests(match_id);
              comment on table public.disclosure_requests is 'Server-only disclosure workflow table. RLS intentionally has no client policies; access must go through trusted server paths.';
            end if;
            if to_regclass('public.listings') is not null then
              create index if not exists idx_listings_superseded_by on public.listings(superseded_by);
            end if;
            if to_regclass('public.matches') is not null then
              create index if not exists idx_matches_inquiry_id on public.matches(inquiry_id);
              comment on table public.matches is 'Server-only matching workflow table. RLS intentionally has no client policies; access must go through trusted server paths.';
            end if;
            if to_regclass('public.user_roles') is not null then
              create index if not exists idx_user_roles_created_by on public.user_roles(created_by);
              execute 'drop policy if exists user_roles_self_read on public.user_roles';
              execute 'create policy user_roles_self_read on public.user_roles for select to authenticated using (user_id = (select auth.uid()))';
            end if;
            if to_regclass('public.audit_events') is not null then
              comment on table public.audit_events is 'Server-only audit log. RLS intentionally has no client policies; access must go through trusted server paths.';
            end if;
            if to_regclass('public.internal_admin_notes') is not null then
              comment on table public.internal_admin_notes is 'Server-only internal notes table. RLS intentionally has no client policies; access must go through trusted server paths.';
            end if;
            if to_regclass('public.status_history') is not null then
              comment on table public.status_history is 'Server-only status history table. RLS intentionally has no client policies; access must go through trusted server paths.';
            end if;
          end
          $marketplace_exposure$;
          ''')

          Path('supabase/migrations/20260304001000_harden_marketplace_supabase_exposure.sql').write_text(
              '-- Deterministic replay-safe form of the historical hardening migration.\n' + guarded
          )
          Path('supabase/migrations/20260804234000_marketplace_exposure_forward_repair.sql').write_text(
              '-- Forward, idempotent reconciliation after all marketplace relations exist.\n' + guarded
          )
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Rebuild complete local Supabase history and assert hardened state
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset --local
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atf supabase/tests/production_security_hardening.sql | tee /tmp/production-security-assertions.txt
          test ! -s /tmp/production-security-assertions.txt

      - name: Verify focused contracts
        run: >-
          npx vitest run
          tests/dashboard/aiBriefingFallback.test.ts
          tests/dashboard/commandCentreHealth.test.ts
          tests/dashboard/loadCommandCentreData.test.ts
          tests/dashboard/commandCentreSourcePlan.test.ts
          tests/platform/command-centre-route-registry.test.ts
          tests/platform/command-centre-typed-registry.test.ts
          tests/supabase/productionSecurityHardening.test.ts
          tests/supabase/env.test.ts

      - name: Verify lint typecheck and production build
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Commit verified repair tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'harbourview-release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git add \
            app/dashboard/page.tsx \
            components/dashboard/DesktopCommandWorkspace.css \
            components/dashboard/DesktopCommandWorkspace.tsx \
            components/dashboard/DashboardResponsiveShell.tsx \
            docs/control/CLAUDE_PRODUCTION_COMMAND_CENTRE_HANDOFF.md \
            docs/control/DATABASE_CONTROL.md \
            docs/control/PRODUCTION_COMMAND_CENTRE_ARCHITECTURE.md \
            docs/control/SUPABASE_PRODUCTION_SECURITY_HARDENING.md \
            lib/dashboard/buildDashboardCommandSources.ts \
            lib/supabase/env.ts \
            scripts/configure-supabase-auth-production.mjs \
            supabase/migrations/20260304000000_marketplace_conversion_v1.sql \
            supabase/migrations/20260304001000_harden_marketplace_supabase_exposure.sql \
            supabase/migrations/20260804190000_production_security_hardening.sql \
            supabase/migrations/20260804233000_marketplace_inquiries_conversion_repair.sql \
            supabase/migrations/20260804234000_marketplace_exposure_forward_repair.sql \
            supabase/tests/production_security_hardening.sql \
            tests/dashboard/commandCentreHealth.test.ts \
            tests/dashboard/loadCommandCentreData.test.ts \
            tests/e2e/mobile-command-centre-v2.spec.ts \
            tests/platform/command-centre-route-registry.test.ts \
            tests/supabase/productionSecurityHardening.test.ts
          git commit -m 'fix(release): close command centre production-readiness defects'
          git push origin HEAD:build/harbourview-production-command-platform

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
