name: Regulatory Signals Verify

on:
  pull_request:
  push:
    branches:
      - regulatory-signals-v1

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Public visibility test
        run: npm run test:visibility

      - name: Listing quality test
        run: npm run test:listing-quality

      - name: Live source intake test
        run: npm run test:live-source-intake

      - name: Regulatory Signals contract test
        run: npm run test:regulatory-signals-contract

      - name: Regulatory Signals public leakage test
        run: npm run test:regulatory-signals-public-leakage

      - name: Marketplace smoke test
        run: npm run smoke:marketplace
