name: PR 1323 Evidence Append

on:
  push:
    branches:
      - fix/globe-antimeridian-generator-hardening
    paths:
      - '.github/workflows/pr1323-evidence-append.yml'

permissions:
  contents: write

jobs:
  append-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Append exact-head verification evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/control/EVIDENCE_LOG.md')
          text = path.read_text()
          marker = 'HV-PR1323-FINAL-TOPOLOGY-20260810'
          if marker in text:
              print('Evidence marker already present; no append required.')
          else:
              entry = r'''

---

## 2026-08-10 — PR #1323 final antimeridian topology closeout

**Evidence ID:** `HV-PR1323-FINAL-TOPOLOGY-20260810`

**Exact verified head:** `b9d62ca56c9cc380a88cfd089ffca09eb9491ce9`; dedicated read-only workflow `PR 1323 Final Topology Verification`, run `31450185534`, job `93652777134`.

