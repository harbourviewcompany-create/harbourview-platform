name: Build Harbourview Recovery Replay Chunks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-chunks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Build replay chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, shutil

          root = Path("supabase/migrations")
          out = Path("recovery/replay-chunks")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True, exist_ok=True)

          files = sorted(p for p in root.glob("*.sql"))
          # The first canonical migration is already applied to the replacement project.
          files = [p for p in files if not p.name.startswith("20260301000000_")]

          target = 320_000
          chunks = []
          current = []
          current_bytes = 0

          def ledger_sql(path: Path):
              m = re.match(r"^(\d{14})_(.+)\.sql$", path.name)
              if not m:
                  raise SystemExit(f"Invalid migration filename: {path.name}")
              version, name = m.group(1), m.group(2).replace("'", "''")
              return (
                  "\ninsert into supabase_migrations.schema_migrations"
                  "(version,name,created_by) values "
                  f"('{version}','{name}','harbourview-recovery') "
                  "on conflict (version) do update set name=excluded.name;\n"
              )

          def flush():
              nonlocal current, current_bytes
              if not current:
                  return
              idx = len(chunks) + 1
              path = out / f"{idx:03d}.sql"
              text = "".join(x["sql"] for x in current)
              path.write_text(text, encoding="utf-8")
              chunks.append({
                  "file": str(path),
                  "first": current[0]["name"],
                  "last": current[-1]["name"],
                  "count": len(current),
                  "bytes": len(text.encode("utf-8")),
              })
              current = []
              current_bytes = 0

          for path in files:
              body = path.read_text(encoding="utf-8")
              if re.search(r"(?m)^\s*\\", body):
                  raise SystemExit(f"psql meta-command found in {path.name}")
              block = (
                  f"\n-- RECOVERY BEGIN {path.name}\n"
                  + body
                  + ("\n" if body.endswith("\n") else "\n")
                  + ledger_sql(path)
                  + f"-- RECOVERY END {path.name}\n"
              )
              b = len(block.encode("utf-8"))
              if current and current_bytes + b > target:
                  flush()
              current.append({"name": path.name, "sql": block})
              current_bytes += b
          flush()
          (out / "manifest.json").write_text(json.dumps(chunks, indent=2) + "\n", encoding="utf-8")
          print(f"built {len(chunks)} chunks for {sum(c['count'] for c in chunks)} migrations")
          PY

      - name: Commit chunks to recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Harbourview Recovery"
          git config user.email "harbourviewcompany@gmail.com"
          git rm .github/workflows/recovery-build-replay-chunks.yml
          git add recovery/replay-chunks
          git commit -m "chore(recovery): build Supabase replay chunks"
          git push origin "HEAD:${{ github.head_ref }}"
