name: Admin Command Center P0-P4 Verify

on:
  push:
    branches:
      - codex/admin-command-center-p0-p4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-command-center-p0-p4-${{ github.sha }}
  cancel-in-progress: false

env:
  CI: '1'
  NODE_VERSION: '22'
  FROZEN_BASE_SHA: db692bceccdcf4dc263530b947b775c93fb6b535
  HARBOURVIEW_LOCAL_TEST_BUILD: '1'
  NEXT_PUBLIC_HARBOURVIEW_LOCAL_TEST_BUILD: '1'
  HARBOURVIEW_ALLOW_LOCAL_SUPABASE: '1'
  NEXT_PUBLIC_HARBOURVIEW_ALLOW_LOCAL_SUPABASE: '1'
  NEXT_PUBLIC_HARBOURVIEW_CI_RUN_ID: ${{ github.run_id }}
  HARBOURVIEW_PUBLIC_BASE_URL: http://127.0.0.1:3000
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Type, test, build, security, visual evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize evidence directory
        run: mkdir -p artifacts/admin-command-center

      - name: Validate machine-checkable Hub parity inventory
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const parity = JSON.parse(fs.readFileSync('docs/control/ADMIN_COMMAND_CENTER_HUB_PARITY.json', 'utf8'))
          if (parity.base_sha !== process.env.FROZEN_BASE_SHA) throw new Error('Parity base SHA drifted')
          if (parity.navigation.length !== 14) throw new Error(`Expected 14 Hub navigation items, got ${parity.navigation.length}`)
          if (parity.hub_proxy.runtime_caller_count !== 1) throw new Error(`Expected one runtime hub-proxy caller, got ${parity.hub_proxy.runtime_caller_count}`)
          if (!parity.read_queries?.length || !parity.mutations?.length || !parity.rpcs?.length || !parity.bulk_actions?.length || !parity.table_dependencies?.length || !parity.metrics?.length || !parity.hidden_capabilities?.length) throw new Error('Parity inventory is incomplete')
          console.log(JSON.stringify({ navigation: parity.navigation.length, reads: parity.read_queries.length, mutations: parity.mutations.length, rpcs: parity.rpcs.length, bulk: parity.bulk_actions.length, tables: parity.table_dependencies.length, metrics: parity.metrics.length, hidden: parity.hidden_capabilities.length, hubProxyRuntimeCallers: parity.hub_proxy.runtime_caller_count }, null, 2))
          NODE

      - name: Admin Phase 0-4 unit and contract tests
        run: >-
          npx vitest run
          tests/admin/adminWorkTypes.test.ts
          tests/admin/adminSignalBatchContract.test.ts
          tests/admin/adminSignalBatchRoute.test.ts
          tests/admin/adminCommandCenterSurface.test.ts

      - name: Classify repository typecheck against frozen base
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm run typecheck > artifacts/admin-command-center/typecheck-current.log 2>&1
          current_rc=$?
          set -e
          git fetch --no-tags --depth=1 origin "$FROZEN_BASE_SHA"
          git worktree add --detach /tmp/admin-command-base "$FROZEN_BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/admin-command-base/node_modules
          set +e
          (cd /tmp/admin-command-base && npm run typecheck) > artifacts/admin-command-center/typecheck-base.log 2>&1
          base_rc=$?
          set -e
          grep -E 'error TS[0-9]+' artifacts/admin-command-center/typecheck-current.log | sed -E 's#^([^(:]+).*error (TS[0-9]+):.*#\1 \2#' | sort -u > /tmp/current-errors.txt || true
          grep -E 'error TS[0-9]+' artifacts/admin-command-center/typecheck-base.log | sed -E 's#^([^(:]+).*error (TS[0-9]+):.*#\1 \2#' | sort -u > /tmp/base-errors.txt || true
          comm -13 /tmp/base-errors.txt /tmp/current-errors.txt > artifacts/admin-command-center/typecheck-new-errors.txt || true
          node --input-type=module - "$current_rc" "$base_rc" <<'NODE'
          import fs from 'node:fs'
          const current = Number(process.argv[2]); const base = Number(process.argv[3])
          const introduced = fs.readFileSync('artifacts/admin-command-center/typecheck-new-errors.txt','utf8').trim().split('\n').filter(Boolean)
          fs.writeFileSync('artifacts/admin-command-center/typecheck.json', JSON.stringify({ current_exit_code: current, frozen_base_exit_code: base, introduced_error_signatures: introduced }, null, 2) + '\n')
          NODE
          if [ -s artifacts/admin-command-center/typecheck-new-errors.txt ]; then
            echo 'New TypeScript error signatures introduced by this branch:'
            cat artifacts/admin-command-center/typecheck-new-errors.txt
            exit 1
          fi
          if [ "$current_rc" -ne 0 ]; then
            echo "Repository typecheck remains red, but the error signatures are present on frozen base (base_rc=$base_rc current_rc=$current_rc)."
            cat artifacts/admin-command-center/typecheck-current.log
          else
            echo 'GO: current typecheck is green.'
          fi

      - name: Security and leakage regression
        run: npm run test:security

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1

      - name: Prepare isolated Admin Command Center visual schema
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations /tmp/harbourview-production-migrations
          if [ -f supabase/seed.sql ]; then mv supabase/seed.sql /tmp/harbourview-production-seed.sql; fi
          mkdir -p supabase/migrations
          cp tests/fixtures/admin-command-center-visual.sql supabase/migrations/00000000000000_admin_command_center_visual.sql
          : > supabase/seed.sql

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

      - name: Create isolated admin test account
        shell: bash
        run: |
          set -euo pipefail
          TEST_EMAIL="admin-command-${GITHUB_RUN_ID}@harbourview.local"
          TEST_PASSWORD="HvAdmin-${GITHUB_RUN_ID}-Aa9!"
          echo "::add-mask::${TEST_EMAIL}"
          echo "::add-mask::${TEST_PASSWORD}"
          {
            echo "E2E_TEST_USER_EMAIL=${TEST_EMAIL}"
            echo "E2E_TEST_USER_PASSWORD=${TEST_PASSWORD}"
          } >> "$GITHUB_ENV"
          export E2E_TEST_USER_EMAIL="$TEST_EMAIL"
          export E2E_TEST_USER_PASSWORD="$TEST_PASSWORD"
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js'
          const client = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false, autoRefreshToken: false } })
          const { data, error } = await client.auth.admin.createUser({ email: process.env.E2E_TEST_USER_EMAIL, password: process.env.E2E_TEST_USER_PASSWORD, email_confirm: true })
          if (error || !data.user) throw error || new Error('Admin visual user not created')
          const { error: roleError } = await client.from('user_roles').insert({ user_id: data.user.id, role: 'admin' })
          if (roleError) throw roleError
          console.log(`Created isolated admin fixture ${data.user.id}`)
          NODE

      - name: Classify canonical build against frozen base
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm run build > artifacts/admin-command-center/build-current.log 2>&1
          current_rc=$?
          set -e
          if [ "$current_rc" -eq 0 ]; then
            echo 'ADMIN_E2E_SERVER_MODE=start' >> "$GITHUB_ENV"
            printf '{"current_exit_code":0,"frozen_base_exit_code":null,"classification":"green"}\n' > artifacts/admin-command-center/build.json
            echo 'GO: canonical Next.js build is green.'
            exit 0
          fi
          set +e
          (cd /tmp/admin-command-base && npm run build) > artifacts/admin-command-center/build-base.log 2>&1
          base_rc=$?
          set -e
          node --input-type=module - "$current_rc" "$base_rc" <<'NODE'
          import fs from 'node:fs'
          const current = Number(process.argv[2]); const base = Number(process.argv[3])
          fs.writeFileSync('artifacts/admin-command-center/build.json', JSON.stringify({ current_exit_code: current, frozen_base_exit_code: base, classification: base === 0 ? 'branch_regression' : 'pre_existing_repository_failure' }, null, 2) + '\n')
          NODE
          if [ "$base_rc" -eq 0 ]; then
            echo 'Current build failed while frozen base build passed.'
            cat artifacts/admin-command-center/build-current.log
            exit 1
          fi
          if grep -E '(app/admin/\(protected\)|components/admin/|lib/admin/|app/api/admin/signals/bulk)' artifacts/admin-command-center/build-current.log; then
            echo 'Current build failure references changed Admin Command Center files; cannot classify as unrelated baseline debt.'
            exit 1
          fi
          echo 'ADMIN_E2E_SERVER_MODE=dev' >> "$GITHUB_ENV"
          echo "Repository build is red on both frozen base and branch (base_rc=$base_rc current_rc=$current_rc); using local Next dev only for visual proof."
          cat artifacts/admin-command-center/build-current.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated local app for visual proof
        shell: bash
        run: |
          set -euo pipefail
          if [ "${ADMIN_E2E_SERVER_MODE}" = 'start' ]; then
            npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/admin-command-center-next.log 2>&1 &
          else
            npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/admin-command-center-next.log 2>&1 &
          fi
          echo $! > /tmp/admin-command-center-next.pid
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:3000/admin/login >/dev/null; then
              echo "GO: local admin app is ready in ${ADMIN_E2E_SERVER_MODE} mode."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/admin-command-center-next.log
          exit 1

      - name: Run responsive authenticated Playwright evidence
        run: npx playwright test tests/e2e/admin-command-center.spec.ts --project=chromium-desktop

      - name: Build evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/admin-command-center
          if [ -d test-results/admin-command-center ]; then
            cp -R test-results/admin-command-center artifacts/admin-command-center/screenshots
            find artifacts/admin-command-center/screenshots -type f -name '*.png' -print0 | sort -z | xargs -0 sha256sum > artifacts/admin-command-center/screenshots.sha256
          fi
          if [ -f /tmp/admin-command-center-next.log ]; then cp /tmp/admin-command-center-next.log artifacts/admin-command-center/server.log; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const parity = JSON.parse(fs.readFileSync('docs/control/ADMIN_COMMAND_CENTER_HUB_PARITY.json','utf8'))
          const readJson = (p) => fs.existsSync(p) ? JSON.parse(fs.readFileSync(p,'utf8')) : null
          const evidence = {
            source_sha: process.env.GITHUB_SHA,
            frozen_base_sha: parity.base_sha,
            hub_proxy_runtime_callers: parity.hub_proxy.runtime_caller_count,
            typecheck: readJson('artifacts/admin-command-center/typecheck.json'),
            build: readJson('artifacts/admin-command-center/build.json'),
            visual_server_mode: process.env.ADMIN_E2E_SERVER_MODE || null,
            required_viewports: ['320x568','375x667','390x844','430x932','768x1024','1024x768','1280x800','1440x900'],
            generated_at: new Date().toISOString(),
          }
          fs.writeFileSync('artifacts/admin-command-center/evidence.json', JSON.stringify(evidence, null, 2) + '\n')
          NODE

      - name: Upload Admin Command Center evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-command-center-p0-p4-${{ github.run_id }}
          path: |
            artifacts/admin-command-center/
            playwright-report/
          if-no-files-found: warn
