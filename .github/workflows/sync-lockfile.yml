name: Sync npm lockfile
on:
  push:
    branches:
      - feat/production-market-entry-os-20260912
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/production-market-entry-os-20260912
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes needed."
          else
            git commit -m "chore: sync package-lock.json with package.json"
            git push origin HEAD:feat/production-market-entry-os-20260912
          fi
      - name: Verify npm ci
        run: npm ci
