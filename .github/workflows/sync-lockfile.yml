name: Sync npm lockfile

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to sync the lockfile on
        required: true
        default: main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate lockfile only (no install)
        run: npm install --package-lock-only

      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes needed."
          else
            git commit -m "chore: sync package-lock.json with package.json (automated, workflow_dispatch)"
            git push origin HEAD:${{ github.event.inputs.branch }}
          fi

      - name: Verify npm ci now succeeds
        run: npm ci
