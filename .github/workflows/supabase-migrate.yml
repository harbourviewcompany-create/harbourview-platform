name: supabase-migrate

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: zvxdgdkukjrrwamdpqrg
  SUPABASE_DB_URL: "postgresql://postgres.zvxdgdkukjrrwamdpqrg:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-1-us-west-2.pooler.supabase.com:5432/postgres"

jobs:
  migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref $SUPABASE_PROJECT_REF
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Repair migration drift
        run: |
          DB_URL="postgresql://postgres.zvxdgdkukjrrwamdpqrg:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-1-us-west-2.pooler.supabase.com:5432/postgres"
          # Mark any migrations applied directly to DB as applied in CLI history
          while IFS= read -r version; do
            supabase migration repair --status applied "$version" --db-url "$DB_URL" 2>/dev/null || true
          done < <(
            supabase migration list --db-url "$DB_URL" 2>/dev/null |
            grep "^\s*[0-9]\{14\}\s*│\s*✔\s*│\s*✗" |
            awk '{print $1}' || true
          )
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        run: |
          set +e
          supabase db push --include-all --db-url "postgresql://postgres.zvxdgdkukjrrwamdpqrg:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-1-us-west-2.pooler.supabase.com:5432/postgres" > /tmp/push_output.log 2>&1
          PUSH_EXIT_CODE=$?
          cat /tmp/push_output.log
          if [ $PUSH_EXIT_CODE -ne 0 ]; then
            ENCODED=$(cat /tmp/push_output.log | sed 's/%/%25/g; s/\r/%0D/g; s/$/%0A/' | tr -d '\n')
            echo "::error title=Push migrations failed::${ENCODED}"
          fi
          exit $PUSH_EXIT_CODE
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
