name: Production migration activation

on:
  workflow_dispatch:
    inputs:
      production_action:
        description: 'Explicit production migration authorization'
        required: true
        type: choice
        default: HOLD
        options:
          - HOLD
          - APPLY_PRODUCTION_MIGRATIONS
      release_control:
        description: 'Reviewed release-control manifest'
        required: true
        type: choice
        default: elite-digest-production-activation.json
        options:
          - elite-digest-production-activation.json
          - globe-client-error-observability-production-activation.json

permissions:
  contents: read

concurrency:
  group: production-migration-activation
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: zvxdgdkukjrrwamdpqrg
  PGHOST: aws-1-us-west-2.pooler.supabase.com
  PGPORT: '5432'
  PGUSER: postgres.zvxdgdkukjrrwamdpqrg
  PGDATABASE: postgres
  RELEASE_CONTROL_FILE: supabase/release-controls/${{ inputs.release_control }}
  COMMITTED_BASELINE_FILE: supabase/release-controls/committed-not-applied-baseline.json

jobs:
  preflight:
    name: Read-only manifest preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require main branch dispatch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production migration activation must be dispatched from main. Current ref: $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.109.1

      - name: Read linked migration state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p artifacts/production-migration-preflight
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list --linked \
            > artifacts/production-migration-preflight/remote-migrations.txt

      - name: Generate fail-closed release manifest
        id: manifest
        continue-on-error: true
        run: |
          node scripts/migration-ledger-manifest.mjs \
            --remote-list artifacts/production-migration-preflight/remote-migrations.txt \
            --local-dir supabase/migrations \
            --control-file "$RELEASE_CONTROL_FILE" \
            --committed-baseline "$COMMITTED_BASELINE_FILE" \
            --json-out artifacts/production-migration-preflight/manifest.json \
            --markdown-out artifacts/production-migration-preflight/manifest.md \
            --mode activation-preflight \
            --source-sha "$GITHUB_SHA"

      - name: Publish preflight summary
        if: always()
        run: |
          if [ -f artifacts/production-migration-preflight/manifest.md ]; then
            cat artifacts/production-migration-preflight/manifest.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release control: \`$RELEASE_CONTROL_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Production action requested: \`${{ inputs.production_action }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "No migration is applied by the preflight job." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-migration-preflight-${{ github.sha }}
          path: artifacts/production-migration-preflight/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce preflight gate
        if: always()
        env:
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
        run: |
          if [ "$MANIFEST_OUTCOME" != "success" ]; then
            echo "::error::Release-control manifest is HOLD."
            exit 1
          fi

  apply-approved:
    name: Apply exact approved migration sequence
    needs: preflight
    if: needs.preflight.result == 'success' && inputs.production_action == 'APPLY_PRODUCTION_MIGRATIONS'
    runs-on: ubuntu-latest
    environment: production-database
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.109.1

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Recheck approved scope immediately before apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p artifacts/production-migration-activation
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list --linked \
            > artifacts/production-migration-activation/remote-before.txt
          node scripts/migration-ledger-manifest.mjs \
            --remote-list artifacts/production-migration-activation/remote-before.txt \
            --local-dir supabase/migrations \
            --control-file "$RELEASE_CONTROL_FILE" \
            --committed-baseline "$COMMITTED_BASELINE_FILE" \
            --json-out artifacts/production-migration-activation/manifest-before.json \
            --markdown-out artifacts/production-migration-activation/manifest-before.md \
            --mode activation-preflight \
            --source-sha "$GITHUB_SHA"

      - name: Resolve optional SQL assertions
        id: control
        run: |
          node - "$RELEASE_CONTROL_FILE" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('fs')
          const [controlPath, outputPath] = process.argv.slice(2)
          const control = JSON.parse(fs.readFileSync(controlPath, 'utf8'))
          const pathPattern = /^tests\/sql\/[A-Za-z0-9._\/-]+\.sql$/
          for (const key of ['preflight_sql', 'postflight_sql']) {
            const value = control[key] ?? ''
            if (value && !pathPattern.test(value)) {
              throw new Error(`Invalid ${key} path in release control: ${value}`)
            }
            fs.appendFileSync(outputPath, `${key}=${value}\n`)
          }
          NODE

      - name: Build masked connection string
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ENCODED_PASSWORD=$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))
          PY
          )
          DB_URL="postgresql://${PGUSER}:${ENCODED_PASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          echo "::add-mask::$DB_URL"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Run optional read-only SQL preflight
        if: steps.control.outputs.preflight_sql != ''
        env:
          PREFLIGHT_SQL: ${{ steps.control.outputs.preflight_sql }}
        run: |
          set -o pipefail
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f "$PREFLIGHT_SQL" \
            | tee artifacts/production-migration-activation/sql-preflight.txt
          if [ -s artifacts/production-migration-activation/sql-preflight.txt ]; then
            echo "::error::Release-specific SQL preflight returned failure rows."
            exit 1
          fi

      - name: Materialize exact approved file list
        run: |
          node - "$RELEASE_CONTROL_FILE" <<'NODE' \
            > artifacts/production-migration-activation/approved.tsv
          const fs = require('fs')
          const control = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          for (const migration of control.approved_migrations) {
            process.stdout.write(`${migration.version}\t${migration.file}\n`)
          }
          NODE
          cat artifacts/production-migration-activation/approved.tsv

      - name: Apply only the approved files and register each ledger row atomically
        id: apply
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r VERSION FILE; do
            [ -n "$VERSION" ] || continue
            FULL_PATH="supabase/migrations/$FILE"
            BASENAME=$(basename "$FILE" .sql)
            NAME="${BASENAME#${VERSION}_}"

            if [ ! -f "$FULL_PATH" ]; then
              echo "::error::Approved migration file is missing: $FULL_PATH"
              exit 1
            fi

            COUNT=$(psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c \
              "select count(*) from supabase_migrations.schema_migrations where version = '${VERSION}';")
            if [ "$COUNT" != "0" ]; then
              echo "::error::Migration version $VERSION is already recorded. Refusing partial/repeated activation."
              exit 1
            fi

            echo "Applying $FILE"
            psql "$DB_URL" -X -v ON_ERROR_STOP=1 -1 \
              -f "$FULL_PATH" \
              -c "insert into supabase_migrations.schema_migrations (version, name) values ('${VERSION}', '${NAME}');" \
              2>&1 | tee -a artifacts/production-migration-activation/apply.log
          done < artifacts/production-migration-activation/approved.tsv

      - name: Read post-application migration state
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase migration list --linked \
            > artifacts/production-migration-activation/remote-after.txt

      - name: Verify postflight ledger
        id: post_manifest
        if: always()
        continue-on-error: true
        run: |
          node scripts/migration-ledger-manifest.mjs \
            --remote-list artifacts/production-migration-activation/remote-after.txt \
            --local-dir supabase/migrations \
            --control-file "$RELEASE_CONTROL_FILE" \
            --committed-baseline "$COMMITTED_BASELINE_FILE" \
            --json-out artifacts/production-migration-activation/manifest-after.json \
            --markdown-out artifacts/production-migration-activation/manifest-after.md \
            --mode activation-postflight \
            --source-sha "$GITHUB_SHA"

      - name: Run optional SQL postflight
        id: sql_postflight
        if: always() && steps.control.outputs.postflight_sql != ''
        continue-on-error: true
        env:
          POSTFLIGHT_SQL: ${{ steps.control.outputs.postflight_sql }}
        run: |
          set -o pipefail
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f "$POSTFLIGHT_SQL" \
            | tee artifacts/production-migration-activation/sql-postflight.txt
          if [ -s artifacts/production-migration-activation/sql-postflight.txt ]; then
            echo "::error::Release-specific SQL postflight returned failure rows."
            exit 1
          fi

      - name: Publish activation summary
        if: always()
        run: |
          if [ -f artifacts/production-migration-activation/manifest-after.md ]; then
            cat artifacts/production-migration-activation/manifest-after.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-migration-activation-${{ github.sha }}
          path: artifacts/production-migration-activation/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce postflight gates
        if: always()
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          POST_MANIFEST_OUTCOME: ${{ steps.post_manifest.outcome }}
          SQL_POSTFLIGHT_OUTCOME: ${{ steps.sql_postflight.outcome }}
          HAS_SQL_POSTFLIGHT: ${{ steps.control.outputs.postflight_sql != '' }}
        run: |
          FAILED=0
          if [ "$APPLY_OUTCOME" != "success" ]; then FAILED=1; fi
          if [ "$POST_MANIFEST_OUTCOME" != "success" ]; then FAILED=1; fi
          if [ "$HAS_SQL_POSTFLIGHT" = "true" ] && [ "$SQL_POSTFLIGHT_OUTCOME" != "success" ]; then FAILED=1; fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Production migration activation did not close all gates. Preserve ledger history and repair forward."
          fi
          exit "$FAILED"
