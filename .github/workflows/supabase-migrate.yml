name: Elite Digest production migration activation

on:
  workflow_dispatch:
    inputs:
      production_action:
        description: 'Explicit production migration authorization'
        required: true
        type: choice
        default: HOLD
        options:
          - HOLD
          - APPLY_PRODUCTION_MIGRATIONS

permissions:
  contents: read

concurrency:
  group: elite-digest-production-migration-activation
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: zvxdgdkukjrrwamdpqrg
  PGHOST: aws-1-us-west-2.pooler.supabase.com
  PGPORT: '5432'
  PGUSER: postgres.zvxdgdkukjrrwamdpqrg
  PGDATABASE: postgres
  RELEASE_CONTROL_FILE: supabase/release-controls/elite-digest-production-activation.json

jobs:
  preflight:
    name: Read-only manifest and rollback evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      feedback_fingerprint: ${{ steps.feedback.outputs.fingerprint }}
    steps:
      - name: Require main branch dispatch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production migration activation must be dispatched from main. Current ref: $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Read linked migration state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p artifacts/elite-digest-preflight
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list --linked \
            > artifacts/elite-digest-preflight/remote-migrations.txt

      - name: Generate fail-closed pending manifest
        id: manifest
        continue-on-error: true
        run: |
          node scripts/migration-ledger-manifest.mjs \
            --remote-list artifacts/elite-digest-preflight/remote-migrations.txt \
            --local-dir supabase/migrations \
            --control-file "$RELEASE_CONTROL_FILE" \
            --json-out artifacts/elite-digest-preflight/manifest.json \
            --markdown-out artifacts/elite-digest-preflight/manifest.md \
            --mode activation-preflight \
            --source-sha "$GITHUB_SHA"

      - name: Capture read-only SQL preflight and rollback evidence
        id: sql_preflight
        continue-on-error: true
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -f tests/sql/elite_digest_production_preflight_read_only.sql \
            > artifacts/elite-digest-preflight/sql-preflight-and-rollback-evidence.txt

      - name: Capture feedback data fingerprint
        id: feedback
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -o pipefail
          FINGERPRINT=$(psql -X -qAt -v ON_ERROR_STOP=1 -c "
            begin transaction read only;
            select count(*)::text || ':' || coalesce(
              md5(string_agg(
                concat_ws('|', id::text, signal_id, coalesce(user_id::text, ''), verdict, coalesce(note, ''), surface, created_at::text),
                E'\\n' order by id
              )),
              md5('')
            )
            from public.signal_relevance_feedback;
            rollback;
          " | sed -n '1p')
          if [ -z "$FINGERPRINT" ]; then
            echo "::error::Feedback fingerprint query returned no value."
            exit 1
          fi
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$FINGERPRINT" \
            > artifacts/elite-digest-preflight/feedback-fingerprint.txt

      - name: Publish preflight summary
        if: always()
        run: |
          if [ -f artifacts/elite-digest-preflight/manifest.md ]; then
            cat artifacts/elite-digest-preflight/manifest.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Production action requested: \`${{ inputs.production_action }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "No migration is applied by the preflight job." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elite-digest-preflight-${{ github.sha }}
          path: artifacts/elite-digest-preflight/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce preflight gates
        if: always()
        env:
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          SQL_PREFLIGHT_OUTCOME: ${{ steps.sql_preflight.outcome }}
        run: |
          FAILED=0
          if [ "$MANIFEST_OUTCOME" != "success" ]; then
            echo "::error::Pending migration manifest is HOLD."
            FAILED=1
          fi
          if [ "$SQL_PREFLIGHT_OUTCOME" != "success" ]; then
            echo "::error::Read-only SQL preflight failed."
            FAILED=1
          fi
          exit "$FAILED"

  apply-approved:
    name: Apply exact approved Elite Digest sequence
    needs: preflight
    if: needs.preflight.result == 'success' && inputs.production_action == 'APPLY_PRODUCTION_MIGRATIONS'
    runs-on: ubuntu-latest
    environment: production-database
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Recheck exact pending set immediately before push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p artifacts/elite-digest-activation
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list --linked \
            > artifacts/elite-digest-activation/remote-before.txt
          node scripts/migration-ledger-manifest.mjs \
            --remote-list artifacts/elite-digest-activation/remote-before.txt \
            --local-dir supabase/migrations \
            --control-file "$RELEASE_CONTROL_FILE" \
            --json-out artifacts/elite-digest-activation/manifest-before.json \
            --markdown-out artifacts/elite-digest-activation/manifest-before.md \
            --mode activation-preflight \
            --source-sha "$GITHUB_SHA"

      - name: Apply repository migrations after exact allowlist proof
        id: db_push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # --include-all is required because 20260802073000 sorts before newer
          # remote-only history. The immediately preceding manifest gate proves
          # that the complete repository-only set is exactly the three approved
          # versions and that their filenames and Git blob SHAs match the control file.
          ENCODED_PASSWORD=$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))
          PY
          )
          DB_URL="postgresql://${PGUSER}:${ENCODED_PASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          echo "::add-mask::$DB_URL"
          supabase db push --include-all --db-url "$DB_URL"

      - name: Read post-application migration state
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p artifacts/elite-digest-activation
          supabase migration list --linked \
            > artifacts/elite-digest-activation/remote-after.txt

      - name: Verify postflight ledger
        id: post_manifest
        if: always()
        continue-on-error: true
        run: |
          node scripts/migration-ledger-manifest.mjs \
            --remote-list artifacts/elite-digest-activation/remote-after.txt \
            --local-dir supabase/migrations \
            --control-file "$RELEASE_CONTROL_FILE" \
            --json-out artifacts/elite-digest-activation/manifest-after.json \
            --markdown-out artifacts/elite-digest-activation/manifest-after.md \
            --mode activation-postflight \
            --source-sha "$GITHUB_SHA"

      - name: Run read-only SQL postflight
        id: sql_postflight
        if: always()
        continue-on-error: true
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -f tests/sql/elite_digest_production_postflight_read_only.sql \
            > artifacts/elite-digest-activation/sql-postflight.txt

      - name: Prove feedback data is unchanged
        id: feedback_postflight
        if: always()
        continue-on-error: true
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BEFORE_FINGERPRINT: ${{ needs.preflight.outputs.feedback_fingerprint }}
        run: |
          set -o pipefail
          AFTER_FINGERPRINT=$(psql -X -qAt -v ON_ERROR_STOP=1 -c "
            begin transaction read only;
            select count(*)::text || ':' || coalesce(
              md5(string_agg(
                concat_ws('|', id::text, signal_id, coalesce(user_id::text, ''), verdict, coalesce(note, ''), surface, created_at::text),
                E'\\n' order by id
              )),
              md5('')
            )
            from public.signal_relevance_feedback;
            rollback;
          " | sed -n '1p')
          if [ -z "$AFTER_FINGERPRINT" ]; then
            echo "::error::Postflight feedback fingerprint query returned no value."
            exit 1
          fi
          printf 'before=%s\nafter=%s\n' "$BEFORE_FINGERPRINT" "$AFTER_FINGERPRINT" \
            > artifacts/elite-digest-activation/feedback-fingerprint-comparison.txt
          if [ "$AFTER_FINGERPRINT" != "$BEFORE_FINGERPRINT" ]; then
            echo "::error::Feedback data fingerprint changed during migration activation."
            exit 1
          fi

      - name: Publish activation summary
        if: always()
        run: |
          if [ -f artifacts/elite-digest-activation/manifest-after.md ]; then
            cat artifacts/elite-digest-activation/manifest-after.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elite-digest-activation-${{ github.sha }}
          path: artifacts/elite-digest-activation/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce postflight gates
        if: always()
        env:
          DB_PUSH_OUTCOME: ${{ steps.db_push.outcome }}
          POST_MANIFEST_OUTCOME: ${{ steps.post_manifest.outcome }}
          SQL_POSTFLIGHT_OUTCOME: ${{ steps.sql_postflight.outcome }}
          FEEDBACK_POSTFLIGHT_OUTCOME: ${{ steps.feedback_postflight.outcome }}
        run: |
          FAILED=0
          for OUTCOME in \
            "$POST_MANIFEST_OUTCOME" \
            "$SQL_POSTFLIGHT_OUTCOME" \
            "$FEEDBACK_POSTFLIGHT_OUTCOME"; do
            if [ "$OUTCOME" != "success" ]; then
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            if [ "$DB_PUSH_OUTCOME" = "success" ]; then
              echo "::error::One or more postflight gates failed after migrations were applied. Use the captured rollback-forward evidence; do not delete migration ledger history."
            else
              echo "::error::Activation stopped before a successful migration push. No rollback-forward repair is implied by this run."
            fi
          fi
          exit "$FAILED"
