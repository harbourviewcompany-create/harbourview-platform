name: Stage 0 Final Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/stage0-final-reconcile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/decision-intel-stage0-first-slice
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main with fail-closed conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'harbourview-release-operator'
          git config user.email 'actions@users.noreply.github.com'

          python - <<'PY'
          from pathlib import Path
          p = Path('docs/control/EVIDENCE_LOG.md')
          text = p.read_text()
          marker = '## 2026-08-08 — PR #1309 — Decision Intelligence Stage 0 first-slice review hardening'
          section = text[text.index(marker):] if marker in text else ''
          Path('/tmp/pr1309-evidence.md').write_text(section)
          PY

          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            while IFS= read -r path; do
              case "$path" in
                app/dashboard/page.tsx)
                  # The Stage-0 branch version was explicitly pre-merged with current
                  # main's marketplaceProjection/media contract before this reconciliation.
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                docs/control/EVIDENCE_LOG.md)
                  git checkout --theirs -- "$path"
                  if [ -s /tmp/pr1309-evidence.md ]; then
                    printf '\n\n' >> "$path"
                    cat /tmp/pr1309-evidence.md >> "$path"
                  fi
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected merge conflict: $path" >&2
                  git merge --abort || true
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
          elif [ "$merge_status" -ne 0 ]; then
            echo 'Merge failed without a resolvable conflict set' >&2
            git merge --abort || true
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          p = Path('docs/control/DATABASE_CONTROL.md')
          text = p.read_text()
          old = "Authenticated Intel/operator dossier access is exposed through tier-gated `SECURITY DEFINER` RPCs after an explicit event-level customer publication classification; verification alone never authorizes exposure. `api.resolve_intel_dashboard_routes(text[])` is service-role-only"
          new = "Authenticated Intel/operator dossier access is exposed through tier-gated `SECURITY DEFINER` RPCs after an explicit event-level customer publication classification; verification alone never authorizes exposure. The canonical customer dossier RPC is `api.get_intel_event_dossier(text)`. `api.resolve_intel_dashboard_routes(text[])` is service-role-only"
          if old not in text:
              raise SystemExit('Expected PR #1309 DATABASE_CONTROL boundary text not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git add docs/control/DATABASE_CONTROL.md

          # The temporary reconciliation workflow must not become part of the final PR.
          git rm .github/workflows/stage0-final-reconcile.yml

          if git diff --cached --quiet && git diff --quiet; then
            echo 'Nothing to reconcile'
            exit 0
          fi

          git add -A
          git commit -m 'merge(main): reconcile Decision Intel Stage 0 final candidate'
          git push origin HEAD:build/decision-intel-stage0-first-slice
