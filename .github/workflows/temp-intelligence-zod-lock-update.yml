name: Temporary Intelligence Zod Lock Update

on:
  push:
    branches:
      - feature/intelligence-v1-fixtures-pr1

permissions:
  contents: write

jobs:
  update-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-generated]') && !contains(github.event.head_commit.message, '[remove-temp-lock-workflow]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/intelligence-v1-fixtures-pr1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "harbourviewcompany-create"
          git config user.email "harbourviewcompany@gmail.com"
          git add package-lock.json
          git commit -m "Update package lock for zod dependency [lockfile-generated]"
          git push
