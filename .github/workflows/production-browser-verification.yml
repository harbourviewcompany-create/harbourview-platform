name: Exact Deployment Browser Verification

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready
      - vercel.deployment.success
      - vercel.deployment.promoted
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Immutable Vercel deployment ID (dpl_...)'
        required: true
        type: string
      deployment_url:
        description: 'Immutable Vercel deployment URL'
        required: true
        type: string
      git_sha:
        description: 'Full 40-character Git SHA deployed by Vercel'
        required: true
        type: string
      environment:
        description: 'Vercel environment represented by the deployment'
        required: true
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: exact-deployment-browser-${{ github.event.client_payload.id || inputs.deployment_id || github.run_id }}
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_ID: prj_Zp8HBDstqAAOCN6W7LAElahsq3qS
  EXPECTED_DEPLOYMENT_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.id || inputs.deployment_id }}
  HARBOURVIEW_DEPLOYMENT_URL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.url || inputs.deployment_url }}
  EXPECTED_GIT_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.git.sha || inputs.git_sha }}
  EXPECTED_ENVIRONMENT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment || inputs.environment }}

jobs:
  verify-exact-deployment:
    name: Verify immutable Vercel deployment in Chromium
    if: ${{ github.event_name != 'repository_dispatch' || github.event.client_payload.project.id == 'prj_Zp8HBDstqAAOCN6W7LAElahsq3qS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate immutable deployment identity payload
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]
          [[ "$EXPECTED_GIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$EXPECTED_ENVIRONMENT" == "preview" || "$EXPECTED_ENVIRONMENT" == "production" ]]
          node -e "const u=new URL(process.env.HARBOURVIEW_DEPLOYMENT_URL); if (u.protocol !== 'https:' || !/^harbourview-[a-z0-9]+-harbourview\\.vercel\\.app$/i.test(u.hostname)) process.exit(1)"
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            [[ "${{ github.event.client_payload.project.id }}" == "$EXPECTED_PROJECT_ID" ]]
          fi

      - name: Checkout deployed Git SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_GIT_SHA }}
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install reviewed dependency graph
        run: npm ci

      - name: Verify runtime baseline
        run: npm run verify:runtime

      - name: Obtain short-lived GitHub OIDC identity token
        id: oidc
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken()
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Install lockfile-matched Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify exact deployment identity and browser surface
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: node scripts/verify-exact-deployment.mjs

      - name: Upload immutable release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-deployment-browser-${{ env.EXPECTED_DEPLOYMENT_ID }}
          path: production-browser-verification-artifacts/
          if-no-files-found: warn
          retention-days: 30
