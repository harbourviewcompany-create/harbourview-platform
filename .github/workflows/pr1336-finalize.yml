name: PR 1336 Finalize

on:
  push:
    branches:
      - fix/pr1323-postmerge-small-country-retention
    paths:
      - '.github/workflows/pr1336-finalize.yml'

permissions:
  contents: write

concurrency:
  group: pr1336-finalize
  cancel-in-progress: false

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply provenance version bump
        run: |
          python - <<'PY'
          from pathlib import Path
          old = '1.4.0-natural-earth-50m-antimeridian-seam-closure'
          new = '1.5.0-natural-earth-50m-antimeridian-source-retention-alpha2'
          targets = [
              Path('scripts/generate-natural-earth-countries.mjs'),
              Path('tests/harbourview/natural-earth-antimeridian-topology.test.ts'),
          ]
          for path in targets:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one transform-version target, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Regenerate twice and verify invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          text = Path('data/globe/natural-earth-countries.ts').read_text()
          def block(text, iso2):
              m = re.search(rf"    \{{\n      iso2: '{iso2}',.*?(?=\n    \{{\n      iso2: '|\n  \],\n\}})", text, re.S)
              if not m: raise SystemExit(f'{iso2} payload block not found')
              return m.group(0)
          Path('/tmp/ru-before.sha').write_text(hashlib.sha256(block(text, 'RU').encode()).hexdigest())
          PY
          node scripts/generate-natural-earth-countries.mjs
          cp data/globe/natural-earth-countries.ts /tmp/run1.ts
          node scripts/generate-natural-earth-countries.mjs
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          new_version = '1.5.0-natural-earth-50m-antimeridian-source-retention-alpha2'
          def norm(s):
              return re.sub(r"generatedAt: ['\"][^'\"]+['\"]", "generatedAt: '<normalized>'", s)
          def block(text, iso2):
              m = re.search(rf"    \{{\n      iso2: '{iso2}',.*?(?=\n    \{{\n      iso2: '|\n  \],\n\}})", text, re.S)
              if not m: raise SystemExit(f'{iso2} payload block not found')
              return m.group(0)
          first_text = Path('/tmp/run1.ts').read_text()
          second_text = Path('data/globe/natural-earth-countries.ts').read_text()
          if norm(first_text) != norm(second_text): raise SystemExit('normalized regenerations differ')
          if f"harbourviewTransformVersion: '{new_version}'" not in second_text:
              raise SystemExit('generated payload missing bumped transform version')
          if "iso2: 'VI'" not in second_text: raise SystemExit('VI missing after regeneration')
          if "iso3: 'IOA'" in second_text: raise SystemExit('IOA composite survived alpha-2 identity gate')
          ru_before = Path('/tmp/ru-before.sha').read_text().strip()
          ru_after = hashlib.sha256(block(second_text, 'RU').encode()).hexdigest()
          if ru_after != ru_before: raise SystemExit(f'Russia payload drifted: before={ru_before} after={ru_after}')
          sha = hashlib.sha256(norm(second_text).encode()).hexdigest()
          Path('/tmp/normalized.sha').write_text(sha)
          print('normalized_sha256=' + sha)
          print('ru_payload_sha256=' + ru_after)
          PY

      - name: Antimeridian topology
        run: npx vitest run tests/harbourview/natural-earth-antimeridian-topology.test.ts
      - name: Russia spherical regression
        run: npx vitest run tests/harbourview/russia-spherical-triangulation.test.ts
      - name: Globe rendering regression
        run: npx vitest run tests/globe-polygon-rendering.test.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm run test
      - name: Security and leakage
        run: npm run test:security
      - name: Production build
        run: npm run build

      - name: Add canonical Build Evidence row
        run: |
          python - <<'PY'
          from pathlib import Path
          sha = Path('/tmp/normalized.sha').read_text().strip()
          path = Path('docs/control/EVIDENCE_LOG.md')
          text = path.read_text()
          if '| 2026-08-11 | PR #1336 post-merge small-country retention remediation' in text:
              raise SystemExit('PR #1336 Build Evidence row already exists')
          anchor = "|---|---|---|---|---|---|\n"
          idx = text.find(anchor, text.find('## Build Evidence'))
          if idx < 0:
              raise SystemExit('Build Evidence table header delimiter not found')
          idx += len(anchor)
          row = (
              "| 2026-08-11 | PR #1336 post-merge small-country retention remediation | "
              "`node scripts/generate-natural-earth-countries.mjs` x2; targeted topology/Russia/rendering Vitest; `npm run lint`; `npm run typecheck`; `npm run test`; `npm run test:security`; `npm run build` | "
              f"PASS — transform `1.5.0-natural-earth-50m-antimeridian-source-retention-alpha2`; VI retained; IOA excluded; Russia geometry unchanged; normalized SHA-256 `{sha}` | "
              "PR #1336; final verification workflow on remediation branch | **Current — GO on verified head** |\n"
          )
          path.write_text(text[:idx] + row + text[idx:])
          PY

      - name: Remove temporary verifier and prove final scope
        run: |
          rm -f .github/workflows/pr1336-finalize.yml
          git fetch origin main
          EXPECTED=$(printf '%s\n' \
            '.github/workflows/pr1323-small-country-retention-probe.yml' \
            'data/globe/natural-earth-countries.ts' \
            'docs/control/EVIDENCE_LOG.md' \
            'scripts/generate-natural-earth-countries.mjs' \
            'tests/harbourview/natural-earth-antimeridian-topology.test.ts')
          ACTUAL=$(git diff --name-only origin/main | sort)
          printf 'Final diff vs origin/main:\n%s\n' "$ACTUAL"
          if [ "$ACTUAL" != "$(printf '%s\n' "$EXPECTED" | sort)" ]; then
            echo 'Final scope differs from expected five files'
            exit 1
          fi

      - name: Commit verified focused patch
        run: |
          git config user.name 'Harbourview Verification'
          git config user.email 'harbourviewcompany@gmail.com'
          git add -A
          git commit -m 'fix(globe): version retained-country transform evidence'
          git push origin HEAD:fix/pr1323-postmerge-small-country-retention
