name: Apply focused mobile playbook repair
on:
  push:
    branches: [repair/mobile-playbook-steps-production]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/mobile-playbook-steps-production
          fetch-depth: 0
      - name: Patch exact stale steps renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/dashboard/MobileCommandCentre.tsx')
          text = path.read_text()
          old = '''          {jurisdictionPlaybook.steps.slice(0, 5).map(s => (\n            <div key={s.step} style={{ marginTop: s.step === 1 ? 4 : 10, paddingTop: s.step === 1 ? 0 : 10, borderTop: s.step === 1 ? 'none' : '1px solid rgba(245,240,232,.08)' }}>\n              <div style={{ fontSize: 11, fontWeight: 700, color: '#d4a84b' }}>Step {s.step}: {s.title}</div>\n              <div style={{ fontSize: 12, color: 'rgba(245,240,232,.6)', marginTop: 3, lineHeight: 1.5 }}>{s.description}</div>\n            </div>\n          ))}'''
          new = '''          {jurisdictionPlaybook.steps.slice(0, 5).map((step, index) => (\n            <div key={`${index}-${step}`} style={{ marginTop: index === 0 ? 4 : 10, paddingTop: index === 0 ? 0 : 10, borderTop: index === 0 ? 'none' : '1px solid rgba(245,240,232,.08)' }}>\n              <div style={{ fontSize: 11, fontWeight: 700, color: '#d4a84b' }}>Step {index + 1}</div>\n              <div style={{ fontSize: 12, color: 'rgba(245,240,232,.6)', marginTop: 3, lineHeight: 1.5 }}>{step}</div>\n            </div>\n          ))}'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one exact stale renderer, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Remove one-use workflow and commit
        run: |
          git rm .github/workflows/repair-mobile-playbook-steps-once.yml
          git config user.name "Harbourview Release Bot"
          git config user.email "harbourviewcompany@gmail.com"
          git add components/dashboard/MobileCommandCentre.tsx
          git commit -m "fix(dashboard): render jurisdiction steps from string data"
          git push origin HEAD:repair/mobile-playbook-steps-production
