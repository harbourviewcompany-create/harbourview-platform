name: PR 1249 Mobile Preview Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/verify-pr1249-mobile-preview.mjs
      - .github/workflows/pr1249-mobile-preview-verification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Verify Cloudflare branch preview at 390x844
        env:
          PREVIEW_BASE_URL: https://fix-mobile-dashboard-navigat.harbourview-platform.pages.dev
        run: node scripts/verify-pr1249-mobile-preview.mjs

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1249-mobile-preview-verification
          path: artifacts/pr1249-mobile-preview
          if-no-files-found: error
          retention-days: 14
