name: Promote Production

# Manual, gated production deploy via the Vercel CLI.
# This project does not auto-deploy main pushes to production; production is
# shipped via an explicit promote/redeploy. This workflow runs the same gate
# suite as the controlled preview, then deploys the built output to production.

on:
  workflow_dispatch:
    inputs:
      ref_name:
        description: Branch, tag, or SHA to deploy to production. Defaults to main.
        required: false
        default: main
        type: string

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  promote-production:
    name: Verify and deploy to Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_name || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Public visibility and leakage checks
        run: npm run test:visibility

      - name: Regulatory signals public leakage
        run: npm run test:regulatory-signals-public-leakage

      - name: Regulatory signals contract
        run: npm run test:regulatory-signals-contract

      - name: Public image asset verification
        run: npm run test:public-images

      - name: Trigger Vercel production deployment (git source)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM_ID: team_0rK4jTvMLlSufR0ZzX4LCKYi
          PROJECT_ID: prj_Zp8HBDstqAAOCN6W7LAElahsq3qS
        run: |
          set -euo pipefail
          REF="${{ inputs.ref_name || 'main' }}"
          echo "Triggering production deployment of '$REF' (repoId 1214598473)…"
          resp=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://api.vercel.com/v13/deployments?teamId=${TEAM_ID}&forceNew=1" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"harbourview\",
              \"project\": \"${PROJECT_ID}\",
              \"target\": \"production\",
              \"gitSource\": { \"type\": \"github\", \"repoId\": 1214598473, \"ref\": \"${REF}\" }
            }")
          status=$(echo "$resp" | sed -n 's/^HTTP_STATUS://p')
          body=$(echo "$resp" | sed '/^HTTP_STATUS:/d')
          echo "HTTP $status"
          echo "$body" | head -c 1200; echo
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "::error::Vercel deploy HTTP $status :: $(echo "$body" | tr '\n' ' ' | head -c 900)"
            exit 1
          fi
          url=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('url',''))" 2>/dev/null || true)
          id=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment created: id=$id url=$url"

      - name: Deployment summary
        run: |
          echo "## Vercel production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Ref: ${{ inputs.ref_name || 'main' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment id: ${{ steps.deploy.outputs.deployment_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment url: ${{ steps.deploy.outputs.deployment_url }}" >> "$GITHUB_STEP_SUMMARY"
