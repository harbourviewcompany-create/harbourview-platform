name: Elite Digest Production Release

on:
  push:
    branches:
      - ops/elite-digest-prod-release

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: 4227d70df46c20e556fb537d3bacd38823d54033

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Public visibility and leakage checks
        run: npm run test:visibility

      - name: Regulatory signals public leakage
        run: npm run test:regulatory-signals-public-leakage

      - name: Regulatory signals contract
        run: npm run test:regulatory-signals-contract

      - name: Public image asset verification
        run: npm run test:public-images

      - name: Trigger Vercel production deployment of merged main
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM_ID: team_0rK4jTvMLlSufR0ZzX4LCKYi
          PROJECT_ID: prj_Zp8HBDstqAAOCN6W7LAElahsq3qS
        run: |
          set -euo pipefail
          resp=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://api.vercel.com/v13/deployments?teamId=${TEAM_ID}&forceNew=1" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "harbourview",
              "project": "prj_Zp8HBDstqAAOCN6W7LAElahsq3qS",
              "target": "production",
              "gitSource": {
                "type": "github",
                "repoId": 1214598473,
                "ref": "4227d70df46c20e556fb537d3bacd38823d54033"
              }
            }')
          status=$(echo "$resp" | sed -n 's/^HTTP_STATUS://p')
          body=$(echo "$resp" | sed '/^HTTP_STATUS:/d')
          echo "HTTP $status"
          echo "$body" | head -c 1200; echo
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            exit 1
          fi
